# Approver allowlist, mirrored from config/approvers.json in the platform repo.
#
# SPEC §4: this MUST mirror CODEOWNERS in this repo —
#   /apps/*/config/  @kofiray   -> T2
#   /platform/       @kofiray   -> T3
#   apps/*/runtime/  unowned    -> T1 auto-merge, no approver is ever asked
#
# hitl fails closed: an id absent here is REJECTED and logged as a security
# event with the clicking user, the tier and the correlation id. Verified live
# 2026-09-27: two clicks with an empty allowlist were refused and logged, which
# is how this id was obtained in the first place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-hitl-approvers
  namespace: sre-system
data:
  approvers.json: |
    {
      "_comment": [
        "The approver allowlist (SPEC \u00a75, credential-inventory \u00a74). NOT a secret \u2014 these",
        "are Slack user IDs, and the file is versioned so a change to who can approve is",
        "a reviewable commit rather than a console click.",
        "",
        "This MUST mirror CODEOWNERS in the manifests repo: CODEOWNERS decides who can",
        "approve the PR, this decides who can approve the action in Slack, and if they",
        "disagree the weaker one is the real policy.",
        "",
        "channel: #ai-sre-incidents (private). The bot is a member and can post.",
        "",
        "PENDING: the operator's Slack user ID. It could NOT be derived \u2014 the channel is",
        "private, so conversations.members needs `groups:read`, and the granted scopes are",
        "the minimal chat:write/commands/channels:read. Until an id is added the allowlist",
        "is empty, which fails CLOSED: every clicker is rejected and logged."
      ],
      "channel": "C0BTJDD0LLR",
      "tiers": {
        "T1": [],
        "T2": [
          "U03LZB2LPRU"
        ],
        "T3": [
          "U03LZB2LPRU"
        ]
      }
    }
