# sre-hitl — human-in-the-loop approvals over Slack Socket Mode.
#
# Source of truth is apps/hitl/hitl.py in the platform repo; this copy is a BUILD
# PRODUCT, rendered by scripts/bridge/render-configmap.py --app hitl. Two hand-
# maintained copies of one program is a drift hazard, and the copy that RUNS is
# this one (L-P8-012 family). gates/p3-bridge.sh fails on drift for the bridge;
# the same check should cover hitl.
#
# `platform/` is the T3 path (SPEC §4): human review, agent draft-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-hitl-app
  namespace: sre-system
data:
  hitl.py: |
    #!/usr/bin/env python3
    """sre-hitl — the human-in-the-loop surface: Slack threads, approvals, commands.

    SPEC §7 P5. The gate for this phase is four claims:
      signature verification enforced; unauthorized clicker rejected + logged;
      timeout escalates; thread<->SNOW cross-links present.

    Three design decisions worth stating, because each one is a place this could have
    been built to look right and be wrong.

    1. **The signature is checked against the RAW body, before anything parses it.**
       Slack signs the exact bytes it sent. Verifying a re-serialised form verifies a
       document Slack never signed, and any handler that parses first has already
       acted on unauthenticated input by the time it checks. The body is read once,
       verified, and only then parsed.

    2. **Authorization fails CLOSED and is decided per TIER.** An empty allowlist
       rejects everyone; it does not mean "no restriction". The tier matters because
       the autonomy model is per-path (SPEC §4): whoever may approve a probe-timing
       change is not automatically whoever may approve a cluster-infrastructure one.

    3. **A rejected click is LOGGED as a security event, not silently dropped.** The
       product claim is "an unauthorized clicker is rejected"; without a record that
       is unfalsifiable, and the audit trail is the entire point of putting a human
       in the loop.

    Stdlib only, so it can ship the same way everything else on this estate does — a
    ConfigMap on the stock python image.
    """
    import base64
    import hashlib
    import hmac
    import json
    import os
    import subprocess
    import sys
    import socket
    import ssl
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    PORT = int(os.environ.get("HITL_PORT", "8090"))
    SIGNING_SECRET = os.environ.get("SLACK_SIGNING_SECRET", "")
    BOT_TOKEN = os.environ.get("SLACK_BOT_TOKEN", "")
    # The app-level (xapp-) token. Socket Mode only — it opens the connection and is
    # never used for Web API calls, which stay on the bot token.
    APP_TOKEN = os.environ.get("SLACK_APP_TOKEN", "")
    SNOW_INSTANCE = os.environ.get("SNOW_INSTANCE", "").rstrip("/")
    # ServiceNow is reached with an OAuth bearer token, never Basic (hardening item 3).
    # The client id/secret are Secret Manager's sre-agent-snow-oauth-client-id/-secret.
    # SNOW_OAUTH_GRANT picks the grant: "password" (the one proven on this instance at
    # setup, 2026-11-12) posts the integration user's name and password to the TOKEN
    # endpoint only; "client_credentials" needs no user at all. Either way the Table
    # API only ever sees "Authorization: Bearer ...".
    SNOW_OAUTH_CLIENT_ID = os.environ.get("SNOW_OAUTH_CLIENT_ID", "")
    SNOW_OAUTH_CLIENT_SECRET = os.environ.get("SNOW_OAUTH_CLIENT_SECRET", "")
    SNOW_OAUTH_GRANT = os.environ.get("SNOW_OAUTH_GRANT", "password")
    SNOW_USER = os.environ.get("SNOW_USER", "")
    SNOW_PASS = os.environ.get("SNOW_PASS", "")
    APPROVERS_FILE = os.environ.get("APPROVERS_FILE", os.path.join(ROOT, "config/approvers.json"))
    STATE_URI = os.environ.get("HITL_STATE", os.path.join(ROOT, ".work/hitl"))
    # Slack rejects anything older than five minutes; so do we.
    MAX_SKEW = int(os.environ.get("SLACK_MAX_SKEW", "300"))
    APPROVAL_TIMEOUT = int(os.environ.get("APPROVAL_TIMEOUT", "900"))
    # The in-cluster agent's route into the thread (POST /internal/thread, see
    # InternalHandler). Its own port, so the network policy can admit the agent pod to
    # it and nothing else. Off unless HITL_INTERNAL_ROUTE=on (only the Deployment sets it).
    INTERNAL_ROUTE = os.environ.get("HITL_INTERNAL_ROUTE", "off").strip().lower() == "on"
    INTERNAL_PORT = int(os.environ.get("HITL_INTERNAL_PORT", "8091"))
    INTERNAL_MAX_BODY = int(os.environ.get("HITL_INTERNAL_MAX_BODY", str(256 * 1024)))
    # The caller proves who it is with its own Kubernetes ServiceAccount token, minted by
    # the kubelet for THIS audience only (a projected volume in the agent's pod), and hitl
    # asks the API server (TokenReview) whose it is. No shared secret exists to leak.
    INTERNAL_AUDIENCE = os.environ.get("HITL_INTERNAL_AUDIENCE", "sre-hitl-internal")
    INTERNAL_ALLOWED = os.environ.get("HITL_INTERNAL_ALLOWED",
                                      "system:serviceaccount:sre-system:sre-agent")
    _SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    KUBE_API = os.environ.get("HITL_KUBE_API") or (
        f"https://{os.environ['KUBERNETES_SERVICE_HOST']}:{os.environ.get('KUBERNETES_SERVICE_PORT', '443')}"
        if os.environ.get("KUBERNETES_SERVICE_HOST") else "")
    KUBE_TOKEN_FILE = os.environ.get("HITL_KUBE_TOKEN_FILE", f"{_SA}/token")
    KUBE_CA_FILE = os.environ.get("HITL_KUBE_CA_FILE", f"{_SA}/ca.crt")
    REVIEW_CACHE_SECONDS = int(os.environ.get("HITL_REVIEW_CACHE", "60"))

    STATS = {"interactions": 0, "bad_signature": 0, "stale_timestamp": 0,
             "unauthorized": 0, "approved": 0, "rejected": 0, "escalated": 0,
             "slack_errors": 0}
    _lock = threading.Lock()
    AUDIT = []          # in-memory mirror of the audit log, for /stats and the gate


    def bump(k, n=1):
        with _lock:
            STATS[k] = STATS.get(k, 0) + n


    def log(msg, security=False, **kw):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "msg": msg}
        if security:
            rec["security"] = True
        rec.update(kw)
        line = json.dumps(rec)
        print(line, flush=True)
        with _lock:
            AUDIT.append(rec)
            del AUDIT[:-500]
        return rec


    # ------------------------------------------------------------ the allowlist ---
    def approvers():
        """Re-read on every decision. The allowlist is the security control; caching
        it means a revoked approver keeps their access until someone restarts a pod."""
        try:
            cfg = json.load(open(APPROVERS_FILE))
        except Exception as e:
            log("approver allowlist unreadable — failing closed", security=True,
                error=f"{type(e).__name__}: {e}")
            return {}, None
        return cfg.get("tiers") or {}, cfg.get("channel")


    def is_approver(user_id, tier):
        tiers, _ = approvers()
        allowed = tiers.get(tier) or []
        return user_id in allowed, allowed


    # ------------------------------------------------- Slack request signature ---
    def verify_slack_signature(headers, raw_body):
        """Returns (ok, reason). Never raises: a malformed header is a rejection, not
        a 500 — an exception here would be a denial-of-service handed to anyone who
        can reach the endpoint."""
        if not SIGNING_SECRET:
            return False, "no signing secret configured (failing closed)"
        ts = headers.get("X-Slack-Request-Timestamp")
        sig = headers.get("X-Slack-Signature")
        if not ts or not sig:
            return False, "missing signature headers"
        try:
            ts_i = int(ts)
        except ValueError:
            return False, "non-numeric timestamp"
        # Replay protection. Without this a captured request stays valid forever,
        # and the signature proves only that Slack sent it ONCE, not that it is live.
        if abs(time.time() - ts_i) > MAX_SKEW:
            return False, f"timestamp outside +/-{MAX_SKEW}s (replay?)"
        basestring = b"v0:" + ts.encode() + b":" + raw_body
        expected = "v0=" + hmac.new(SIGNING_SECRET.encode(), basestring,
                                    hashlib.sha256).hexdigest()
        # Constant time: a naive == leaks the signature one byte at a time.
        if not hmac.compare_digest(expected, sig):
            return False, "signature mismatch"
        return True, "ok"


    # -------------------------------------------------------------------- Slack ---
    SLACK_DEFAULT_API = "https://slack.com/api"


    def _slack_api_base():
        """slack.com, or a loopback fake for the offline tests. Nothing else: a bot
        token must never be sent to a host an environment variable happens to name."""
        base = os.environ.get("SLACK_API_BASE", "").rstrip("/")
        if not base or base == SLACK_DEFAULT_API:
            return SLACK_DEFAULT_API
        if base.startswith(("http://127.0.0.1:", "http://localhost:")):
            return base
        print(f"sre-hitl: SLACK_API_BASE={base!r} is not slack.com or loopback; ignoring it",
              file=sys.stderr)
        return SLACK_DEFAULT_API


    SLACK_API = _slack_api_base()


    def slack(method, payload, token=None):
        tok = token or BOT_TOKEN
        if not tok:
            return {"ok": False, "error": "no_bot_token"}
        req = urllib.request.Request(f"{SLACK_API}/{method}",
                                     data=json.dumps(payload).encode(), method="POST")
        req.add_header("Authorization", f"Bearer {tok}")
        req.add_header("Content-Type", "application/json; charset=utf-8")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                out = json.loads(r.read().decode())
        except Exception as e:
            bump("slack_errors")
            return {"ok": False, "error": f"{type(e).__name__}: {e}"}
        if not out.get("ok"):
            bump("slack_errors")
        return out


    def slack_get(method, params, token=None):
        """Slack's read methods (conversations.replies, chat.getPermalink) take query
        parameters, not a JSON body."""
        tok = token or BOT_TOKEN
        if not tok:
            return {"ok": False, "error": "no_bot_token"}
        req = urllib.request.Request(f"{SLACK_API}/{method}?{urllib.parse.urlencode(params)}")
        req.add_header("Authorization", f"Bearer {tok}")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.loads(r.read().decode())
        except Exception as e:
            bump("slack_errors")
            return {"ok": False, "error": f"{type(e).__name__}: {e}"}


    def permalink(channel, ts):
        out = slack_get("chat.getPermalink", {"channel": channel, "message_ts": ts})
        return out.get("permalink") if out.get("ok") else None


    # --------------------------------------------------------------- ServiceNow ---
    class SnowAuthError(RuntimeError):
        """ServiceNow OAuth is missing, misconfigured, or refused. Never carries a secret."""


    def snow_oauth_problem():
        """Why OAuth to ServiceNow is NOT usable, or '' when it is.

        There is no Basic fallback on purpose. A client that quietly drops back to
        Basic when the OAuth settings go missing is a client that still uses Basic,
        just less often and with nobody noticing (item 3: "Basic is refused by the
        client code")."""
        if not SNOW_INSTANCE:
            return ""
        if not (SNOW_OAUTH_CLIENT_ID and SNOW_OAUTH_CLIENT_SECRET):
            return ("SNOW_INSTANCE is set but SNOW_OAUTH_CLIENT_ID/SNOW_OAUTH_CLIENT_SECRET "
                    "are not; ServiceNow is OAuth-only and there is no Basic fallback")
        if SNOW_OAUTH_GRANT not in ("password", "client_credentials"):
            return f"SNOW_OAUTH_GRANT={SNOW_OAUTH_GRANT!r} is not 'password' or 'client_credentials'"
        if SNOW_OAUTH_GRANT == "password" and not (SNOW_USER and SNOW_PASS):
            return "the password grant needs SNOW_USER and SNOW_PASS (sent to the token endpoint only)"
        return ""


    _TOKEN = {"access_token": "", "expires_at": 0.0}
    _token_lock = threading.Lock()
    # Refresh this long before ServiceNow's stated expiry, so a token never expires
    # between being picked and being used.
    TOKEN_SKEW = int(os.environ.get("SNOW_TOKEN_SKEW", "60"))


    def snow_token(force=False):
        """A cached bearer token. A new one is fetched when there is none, when it is
        within TOKEN_SKEW of expiry, or when `force` (a 401 on a Table API call)."""
        why = snow_oauth_problem()
        if why:
            raise SnowAuthError(why)
        with _token_lock:
            if not force and _TOKEN["access_token"] and time.time() < _TOKEN["expires_at"] - TOKEN_SKEW:
                return _TOKEN["access_token"]
            form = {"grant_type": SNOW_OAUTH_GRANT, "client_id": SNOW_OAUTH_CLIENT_ID,
                    "client_secret": SNOW_OAUTH_CLIENT_SECRET}
            if SNOW_OAUTH_GRANT == "password":
                form.update(username=SNOW_USER, password=SNOW_PASS)
            req = urllib.request.Request(SNOW_INSTANCE + "/oauth_token.do",
                                         data=urllib.parse.urlencode(form).encode(), method="POST")
            req.add_header("Content-Type", "application/x-www-form-urlencoded")
            req.add_header("Accept", "application/json")
            try:
                with urllib.request.urlopen(req, timeout=45) as r:
                    out = json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
                # The status only: the body of a refused grant is not worth the risk
                # of echoing something we posted.
                raise SnowAuthError(f"token endpoint refused the {SNOW_OAUTH_GRANT} grant: HTTP {e.code}")
            except Exception as e:
                raise SnowAuthError(f"token endpoint unreachable: {type(e).__name__}")
            tok = out.get("access_token") or ""
            if not tok or str(out.get("token_type") or "Bearer").lower() != "bearer":
                raise SnowAuthError("token endpoint answered without a bearer access_token")
            try:
                ttl = float(out.get("expires_in") or 0)
            except (TypeError, ValueError):
                ttl = 0
            # No stated lifetime: assume a short one rather than forever.
            _TOKEN.update(access_token=tok, expires_at=time.time() + (ttl if ttl > 0 else 300))
            bump("snow_token_fetches")
            return tok


    def _snow_call(method, path, body, tok):
        req = urllib.request.Request(SNOW_INSTANCE + path,
                                     data=json.dumps(body).encode() if body else None,
                                     method=method)
        req.add_header("Authorization", "Bearer " + tok)
        req.add_header("Accept", "application/json")
        if body:
            req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, timeout=45) as r:
            raw = r.read().decode()
            return json.loads(raw) if raw else {}


    def snow(method, path, body=None):
        if not SNOW_INSTANCE:
            return {}
        try:
            return _snow_call(method, path, body, snow_token())
        except urllib.error.HTTPError as e:
            if e.code != 401:
                raise
        # 401 on a token we thought was live: revoked, or the instance restarted.
        # One fresh token and one retry; a second 401 is a real refusal.
        bump("snow_token_refreshes")
        return _snow_call(method, path, body, snow_token(force=True))


    # Every note hitl writes goes to `work_notes`, the internal journal, not
    # `comments`, which the incident's caller can read (item 3). L-P2-012 is why it
    # used to be `comments`: the old role could not write work_notes and ServiceNow
    # dropped them with a 200. So a note is READ BACK, and one that did not land
    # fails loudly instead of vanishing again.
    NOTE_FIELD = "work_notes"
    # Recovery and look-ups read BOTH journals: lines written before the switch are in
    # `comments` and must still be found (the approval-state contract survives it).
    JOURNALS = ("work_notes", "comments")
    READBACK_TRIES = int(os.environ.get("SNOW_READBACK_TRIES", "3"))
    READBACK_PAUSE = float(os.environ.get("SNOW_READBACK_PAUSE", "2"))


    def snow_journals(sys_id):
        """{work_notes: text, comments: text} for one incident (display values)."""
        r = snow("GET", f"/api/now/table/incident/{sys_id}?sysparm_display_value=true"
                        f"&sysparm_fields={','.join(JOURNALS)}")
        res = (r or {}).get("result") or {}
        return {f: str(res.get(f) or "") for f in JOURNALS}


    def snow_note(sys_id, text):
        """Write `text` to the incident's work_notes and read it back. True only when
        the note is there; False (logged as a security event) when it is not."""
        if not SNOW_INSTANCE:
            return False
        try:
            snow("PATCH", f"/api/now/table/incident/{sys_id}", {NOTE_FIELD: text})
            want = text.strip()
            j = {}
            for i in range(max(1, READBACK_TRIES)):
                j = snow_journals(sys_id)
                if want in j[NOTE_FIELD]:
                    return True
                if i + 1 < READBACK_TRIES:
                    time.sleep(READBACK_PAUSE)
            bump("notes_dropped")
            log("ServiceNow accepted the note but it is NOT in work_notes on read-back",
                security=True, sys_id=sys_id, in_comments=want in j.get("comments", ""))
            return False
        except Exception as e:
            bump("notes_dropped")
            log("could not annotate the incident", error=f"{type(e).__name__}: {e}")
            return False


    def snow_incident_url(sys_id):
        """A link to the incident record that actually opens the incident record.

        This was `nav_to.do?uri=incident.do?sys_id=...` — with a SECOND, UNENCODED
        `?` inside a query-string value. The browser hands ServiceNow a `uri`
        parameter it cannot parse as a target, so `nav_to.do` falls back to the
        navigation homepage: the link resolves, renders a page, and takes you
        somewhere that is not the incident. Reported from the live channel as
        "clicking the incident does nothing" — which is exactly right, and is the
        most easily-missed kind of broken link, because it never errors.

        The target is percent-encoded and addressed through the Next Experience
        classic shim, which is how a current instance deep-links a record.
        """
        return (f"{SNOW_INSTANCE}/now/nav/ui/classic/params/target/"
                + urllib.parse.quote(f"incident.do?sys_id={sys_id}", safe=""))


    # ------------------------------------------------- the approval-line contract ----
    # THE INCIDENT IS THE DURABLE RECORD (decision 0003(c)). hitl's /state is an
    # emptyDir and the gs:// Store cannot authenticate in-pod (no gcloud, no
    # credential), so a pending approval used to die with the pod: the Slack message
    # stayed up with live buttons, a click answered "no longer active", and the
    # timeout sweeper — which had no record either — never escalated it. Silent.
    #
    # Instead of a second durable store (a new credential, a new GCP grant, an
    # amendment to the P1 invariant), every approval request and every decision is
    # written to the incident as ONE machine-parseable line, and on boot the pending
    # set is REBUILT from ServiceNow. No new credential, nothing new to protect.
    #
    # FORMAT, versioned so it can evolve:
    #     sre-agent-approval/v1 {"kind":"request","cid":...,"tier":...,...}
    # One line. The prefix is what the recovery query greps for (`work_notesLIKE`, and
    # `commentsLIKE` for lines written before item 3 moved notes to work_notes), the
    # payload is compact JSON so that free text (an action description with spaces,
    # quotes, newlines) is escaped by a codec rather than by a convention. Prose
    # lines around it stay for humans; the parser reads ONLY this line.
    #
    # This block is the single definition. The writer (request_approval/decide), the
    # reader (recover_from_snow) and the P5 gate all call these functions — two
    # copies of a contract are two chances for them to disagree silently.
    LINE_PREFIX = "sre-agent-approval/v1"
    REQUEST_KEYS = ("cid", "tier", "incident", "channel", "thread_ts", "requested_at", "action")
    DECISION_KEYS = ("cid", "decision", "user", "decided_at")


    class ContractError(ValueError):
        """A line that carries the prefix but not a valid v1 payload."""


    def _iso(ts):
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(ts))


    def _from_iso(s):
        import calendar
        return calendar.timegm(time.strptime(s, "%Y-%m-%dT%H:%M:%SZ"))


    def format_line(kind, **fields):
        """One line: prefix + compact JSON. `kind` is 'request' or 'decision'."""
        required = REQUEST_KEYS if kind == "request" else DECISION_KEYS
        missing = [k for k in required if fields.get(k) in (None, "")]
        if missing:
            raise ContractError(f"{kind} line is missing {missing}")
        payload = {"kind": kind, **{k: fields[k] for k in required}}
        body = json.dumps(payload, separators=(",", ":"), ensure_ascii=True)
        if "\n" in body or "\r" in body:
            raise ContractError("payload must be one line")
        return f"{LINE_PREFIX} {body}"


    def parse_line(line):
        """The inverse of format_line. Raises ContractError on anything that carries
        the prefix but is not a valid v1 payload — the caller decides what to do with
        that (recovery quarantines it; it never guesses)."""
        line = line.strip()
        if not line.startswith(LINE_PREFIX + " "):
            raise ContractError("not an approval line")
        try:
            d = json.loads(line[len(LINE_PREFIX) + 1:])
        except Exception as e:
            raise ContractError(f"payload is not JSON: {e}")
        if not isinstance(d, dict) or d.get("kind") not in ("request", "decision"):
            raise ContractError("payload has no valid kind")
        required = REQUEST_KEYS if d["kind"] == "request" else DECISION_KEYS
        missing = [k for k in required if d.get(k) in (None, "")]
        if missing:
            raise ContractError(f"{d['kind']} line is missing {missing}")
        if d["kind"] == "decision" and d["decision"] not in ("approved", "rejected", "escalated"):
            raise ContractError(f"unknown decision {d['decision']!r}")
        try:
            _from_iso(d["requested_at" if d["kind"] == "request" else "decided_at"])
        except Exception:
            raise ContractError("timestamp is not ISO-8601 Z")
        return d


    def extract_lines(text):
        """Every prefixed line in a block of journal text, as (parsed, error, raw)."""
        out = []
        for raw in (text or "").splitlines():
            if LINE_PREFIX not in raw:
                continue
            raw = raw[raw.index(LINE_PREFIX):]
            try:
                out.append((parse_line(raw), None, raw))
            except ContractError as e:
                out.append((None, str(e), raw))
        return out


    # -------------------------------------------------------------- the store ----
    # One store, two backends. GCS is the deployed one (it survives the pod); a local
    # directory is used when the service runs outside the cluster. Deliberately NOT a
    # second code path through the app — the app only ever calls get/put.
    class Store:
        def __init__(self, uri):
            self.uri = uri
            self.gcs = uri.startswith("gs://")
            if not self.gcs:
                os.makedirs(uri, exist_ok=True)

        def _gcs(self, key, data=None):
            bucket, _, prefix = self.uri[5:].partition("/")
            name = urllib.parse.quote(f"{prefix.rstrip('/')}/{key}.json".lstrip("/"), safe="")
            tok = subprocess.run(["gcloud", "auth", "print-access-token"],
                                 capture_output=True, text=True).stdout.strip()
            if data is None:
                url = f"https://storage.googleapis.com/storage/v1/b/{bucket}/o/{name}?alt=media"
                req = urllib.request.Request(url)
            else:
                url = (f"https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o"
                       f"?uploadType=media&name={name}")
                req = urllib.request.Request(url, data=json.dumps(data).encode(), method="POST")
                req.add_header("Content-Type", "application/json")
            req.add_header("Authorization", f"Bearer {tok}")
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    body = r.read().decode()
                return json.loads(body) if data is None and body else True
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    return None
                raise

        def get(self, key):
            if self.gcs:
                return self._gcs(key)
            p = os.path.join(self.uri, f"{key}.json")
            return json.load(open(p)) if os.path.exists(p) else None

        def put(self, key, data):
            if self.gcs:
                return self._gcs(key, data)
            json.dump(data, open(os.path.join(self.uri, f"{key}.json"), "w"), indent=2)
            return True

        def keys(self):
            if self.gcs:
                bucket, _, prefix = self.uri[5:].partition("/")
                tok = subprocess.run(["gcloud", "auth", "print-access-token"],
                                     capture_output=True, text=True).stdout.strip()
                url = (f"https://storage.googleapis.com/storage/v1/b/{bucket}/o"
                       f"?prefix={urllib.parse.quote(prefix)}")
                req = urllib.request.Request(url)
                req.add_header("Authorization", f"Bearer {tok}")
                try:
                    with urllib.request.urlopen(req, timeout=30) as r:
                        items = json.loads(r.read().decode()).get("items", [])
                    return [os.path.basename(i["name"])[:-5] for i in items
                            if i["name"].endswith(".json")]
                except Exception:
                    return []
            return [f[:-5] for f in os.listdir(self.uri) if f.endswith(".json")]


    STORE = Store(STATE_URI)


    # ------------------------------------------------------ approval lifecycle ---
    def request_approval(incident, sys_id, correlation_id, tier, summary, action,
                         mode="approval", note=""):
        """Open a thread, ask for a decision where one is owed, and cross-link both ways.

        `mode` is "approval" or "record", and the distinction is not cosmetic.

        "approval" posts Approve/Reject buttons and is what the P5 gate exercises
        against a running `hitl serve`. It should only be used where those buttons
        can actually be delivered somewhere.

        "record" posts no buttons. Use it when the decision is taken elsewhere — a
        T1 that auto-merges under policy asks nobody for anything, and the E2E's
        T2 approval is taken on the pull request. Posting ":rotating_light: approval
        required" with live-looking buttons in either case would claim an approval
        moment that is not happening here, in the permanent record the scorecard
        reads. `note` carries the caller's one line saying where the decision really
        is made. Every scenario still gets a thread, because the correlation spine
        (SPEC §2) is incident <-> thread <-> pull request for ALL of them.
        """
        tiers, channel = approvers()
        key = f"approval-{correlation_id}"
        # A "record" thread asks nobody for anything, so it is not "pending": in a running
        # `serve` (where the agent's internal route opens record threads) the sweeper would
        # otherwise announce a timed-out decision that was never requested.
        rec = {"key": key, "incident": incident, "sys_id": sys_id,
               "correlation_id": correlation_id, "tier": tier, "summary": summary,
               "action": action, "state": "pending" if mode == "approval" else "recorded",
               "created_at": time.time(),
               "deadline": time.time() + APPROVAL_TIMEOUT,
               "channel": channel, "thread_ts": None, "permalink": None}

        inc_url = snow_incident_url(sys_id)
        if mode == "record":
            # NO BUTTONS. Slack's Approve/Reject buttons only do anything when
            # `hitl serve` is running behind a public URL registered as the app's
            # interactivity endpoint. This estate deploys no such workload and has no
            # ingress, so a button posted here is a control that silently does
            # nothing when a human clicks it — a dead affordance in the permanent
            # record, which is worse than no affordance. The E2E's approval is taken
            # on the pull request (SPEC §9), so this thread SAYS where the decision
            # is actually made rather than pretending to be the place.
            text = (f":memo: *{incident}* — {tier}\n"
                    f"{summary}\n\n*Action:* {action}\n"
                    f"*ServiceNow:* <{inc_url}|{incident}>\n"
                    f"_correlation id: {correlation_id}_"
                    + (f"\n{note}" if note else ""))
            blocks = [{"type": "section", "text": {"type": "mrkdwn", "text": text}}]
        else:
            text = (f":rotating_light: *{incident}* — approval required ({tier})\n"
                    f"{summary}\n\n*Proposed action:* {action}\n"
                    f"*ServiceNow:* <{inc_url}|{incident}>\n"
                    f"_correlation id: {correlation_id}_")
            blocks = [
                {"type": "section", "text": {"type": "mrkdwn", "text": text}},
                {"type": "actions", "block_id": f"approval:{correlation_id}", "elements": [
                    {"type": "button", "action_id": "approve", "style": "primary",
                     "text": {"type": "plain_text", "text": "Approve"},
                     "value": json.dumps({"cid": correlation_id, "tier": tier,
                                          "decision": "approve"})},
                    {"type": "button", "action_id": "reject", "style": "danger",
                     "text": {"type": "plain_text", "text": "Reject"},
                     "value": json.dumps({"cid": correlation_id, "tier": tier,
                                          "decision": "reject"})},
                ]},
            ]
        rec["mode"] = mode
        rec["text"] = text
        if channel:
            r = slack("chat.postMessage", {"channel": channel, "text": text, "blocks": blocks})
            if r.get("ok"):
                rec["thread_ts"] = r.get("ts")
                rec["permalink"] = permalink(channel, r.get("ts"))
            else:
                log("could not open the Slack thread", error=r.get("error"),
                    incident=incident)
        else:
            log("no Slack channel configured — approval recorded but not delivered",
                incident=incident)

        # CROSS-LINK, both directions. The SNOW incident must point at the thread and
        # the thread at the incident, or the correlation spine has a one-way link and
        # whoever starts from ServiceNow cannot find the conversation.
        if rec["permalink"]:
            what = ("approval requested in Slack" if mode == "approval"
                    else "recorded in Slack (the decision for this tier is taken elsewhere)")
            note = (f"sre-agent: {what} ({tier})\n"
                    f"thread: {rec['permalink']}\n"
                    f"correlation id: {correlation_id}\n"
                    # Where the thread is, for whichever process posts into it next
                    # (item 18): `hitl.py thread` finds it here when it has no local
                    # record, e.g. after a restart or from another machine.
                    + format_thread_line(correlation_id, channel, rec["thread_ts"], incident))
            if mode == "approval":
                # The structured line is what makes this request survive a restart
                # (recover_from_snow). Only an approval is a pending decision; a
                # "record" thread has nothing to recover.
                note += "\n" + format_line("request", cid=correlation_id, tier=tier,
                                           incident=incident, channel=channel,
                                           thread_ts=rec["thread_ts"],
                                           requested_at=_iso(rec["created_at"]),
                                           action=action)
            rec["snow_noted"] = snow_note(sys_id, note)
        STORE.put(key, rec)
        log("approval requested", incident=incident, tier=tier,
            correlation_id=correlation_id, thread=rec["permalink"])
        return rec


    def decide(rec, user_id, decision, from_timeout=False):
        rec["state"] = decision
        rec["decided_by"] = user_id
        rec["decided_at"] = time.time()
        STORE.put(rec["key"], rec)
        verb = {"approved": "APPROVED", "rejected": "REJECTED", "escalated": "ESCALATED"}[decision]
        note = (f"sre-agent: {verb} by {user_id}\n"
                f"action: {rec['action']}\n"
                f"tier: {rec['tier']}\n"
                f"correlation id: {rec['correlation_id']}")
        if rec.get("permalink"):
            note += f"\nthread: {rec['permalink']}"
        if rec.get("mode", "approval") == "approval":
            note += "\n" + format_line("decision", cid=rec["correlation_id"], decision=decision,
                                       user=user_id, decided_at=_iso(rec["decided_at"]))
        snow_note(rec["sys_id"], note)
        if rec.get("channel") and rec.get("thread_ts"):
            slack("chat.postMessage", {
                "channel": rec["channel"], "thread_ts": rec["thread_ts"],
                "text": f"*{verb}* by <@{user_id}>" if not from_timeout
                        else f"*{verb}* — no decision within {APPROVAL_TIMEOUT}s"})
        bump({"approved": "approved", "rejected": "rejected", "escalated": "escalated"}[decision])
        return rec


    def sweep_timeouts():
        """Escalate anything that went unanswered. A request nobody answers is the
        normal case at 3am, and silence must turn into a louder signal rather than
        into an approval or into nothing at all."""
        now = time.time()
        out = []
        for key in STORE.keys():
            if not key.startswith("approval-"):
                continue
            rec = STORE.get(key)
            if not rec or rec.get("state") != "pending" or now < rec.get("deadline", 0):
                continue
            tiers, channel = approvers()
            who = " ".join(f"<@{u}>" for u in (tiers.get(rec["tier"]) or [])) or "(allowlist empty)"
            log("approval timed out — escalating", security=True,
                incident=rec["incident"], tier=rec["tier"],
                correlation_id=rec["correlation_id"], waited=int(now - rec["created_at"]))
            if rec.get("channel") and rec.get("thread_ts"):
                slack("chat.postMessage", {
                    "channel": rec["channel"], "thread_ts": rec["thread_ts"],
                    "text": f":alarm_clock: No decision on *{rec['incident']}* after "
                            f"{APPROVAL_TIMEOUT}s — escalating to {who}"})
            decide(rec, "timeout", "escalated", from_timeout=True)
            out.append(rec)
        return out


    def recover_from_snow():
        """Rebuild the approval set from ServiceNow. Called once at boot.

        Query: active incidents whose journal carries the v1 prefix. For each cid:
        a request line with no decision line is PENDING and is rebuilt with its
        ORIGINAL requested_at — the deadline is requested_at + APPROVAL_TIMEOUT, not
        boot + timeout, or every restart would quietly extend every deadline. A
        request whose deadline has already passed is handed straight to the sweeper,
        which escalates it exactly once (the decision line it writes stops a second
        recovery from doing it again). A cid that already has a decision line is
        rebuilt as DECIDED so a late click gets "Already approved" rather than "no
        longer active".

        A line that carries the prefix but does not parse is QUARANTINED: logged as a
        security event, escalated on the incident with a decision line of its own
        (user="quarantine"), and never guessed at. A corrupt record that was silently
        dropped would reproduce exactly the failure this function exists to remove.
        """
        summary = {"incidents": 0, "pending": 0, "decided": 0, "expired": 0,
                   "quarantined": 0, "errors": 0}
        if not SNOW_INSTANCE:
            log("recovery skipped — no ServiceNow configured")
            return summary
        # Both journals. `^OR` binds to the condition just before it, so this reads
        # active AND (work_notes LIKE p OR comments LIKE p).
        q = urllib.parse.quote(f"active=true^work_notesLIKE{LINE_PREFIX}"
                               f"^ORcommentsLIKE{LINE_PREFIX}", safe="^=")
        try:
            r = snow("GET", f"/api/now/table/incident?sysparm_query={q}"
                            "&sysparm_display_value=true"
                            f"&sysparm_fields=sys_id,number,{','.join(JOURNALS)}"
                            "&sysparm_limit=200")
        except Exception as e:
            log("recovery query failed — starting with an EMPTY pending set", security=True,
                error=f"{type(e).__name__}: {e}")
            summary["errors"] += 1
            return summary
        now = time.time()
        _, channel = approvers()
        for inc in r.get("result") or []:
            summary["incidents"] += 1
            lines = extract_lines("\n".join(str(inc.get(f) or "") for f in JOURNALS))
            requests_, decisions, bad = {}, {}, []
            for parsed, err, raw in lines:
                if err:
                    bad.append((err, raw))
                elif parsed["kind"] == "request":
                    requests_[parsed["cid"]] = parsed
                else:
                    decisions.setdefault(parsed["cid"], parsed)
            quarantined_already = any(d.get("user") == "quarantine" for d in decisions.values())
            if bad and not quarantined_already:
                summary["quarantined"] += 1
                err, raw = bad[0]
                log("approval line QUARANTINED — unparseable, escalating", security=True,
                    incident=inc.get("number"), reason=err, line=raw[:160], bad_lines=len(bad))
                qcid = f"quarantine-{inc.get('sys_id')}"
                snow_note(inc["sys_id"],
                          f"sre-agent: QUARANTINED an unparseable approval line and ESCALATED\n"
                          f"reason: {err}\n"
                          + format_line("decision", cid=qcid, decision="escalated",
                                        user="quarantine", decided_at=_iso(now)))
                if channel:
                    slack("chat.postMessage", {"channel": channel,
                          "text": f":warning: *{inc.get('number')}* — an approval record on this "
                                  f"incident could not be parsed on restart and was escalated. "
                                  f"A human must look at it. ({err})"})
            for cid, req in requests_.items():
                key = f"approval-{cid}"
                existing = STORE.get(key)
                if existing and existing.get("state") != "pending":
                    continue
                created = _from_iso(req["requested_at"])
                rec = {"key": key, "incident": req["incident"], "sys_id": inc["sys_id"],
                       "correlation_id": cid, "tier": req["tier"], "summary": "",
                       "action": req["action"], "created_at": created,
                       "deadline": created + APPROVAL_TIMEOUT, "channel": req["channel"],
                       "thread_ts": req["thread_ts"], "mode": "approval", "recovered": True,
                       "permalink": permalink(req["channel"], req["thread_ts"]) if req["channel"] and BOT_TOKEN else None}
                dec = decisions.get(cid)
                if dec:
                    rec.update(state=dec["decision"], decided_by=dec["user"],
                               decided_at=_from_iso(dec["decided_at"]))
                    summary["decided"] += 1
                else:
                    rec["state"] = "pending"
                    summary["pending"] += 1
                    if rec["deadline"] <= now:
                        summary["expired"] += 1
                STORE.put(key, rec)
        log("recovered approval set from ServiceNow", **summary)
        if summary["expired"]:
            # escalate the already-overdue ones NOW, once — not on the next sweep tick
            sweep_timeouts()
        return summary


    # ------------------------------------------------- the incident thread (18) ---
    # Hardening item 18: the incident's Slack thread carries the whole story, not
    # just the opening message. The full cited diagnosis, then each update (PR
    # opened / approved / merged, escalation, recovery checks), then a resolved
    # marker on close: a final message, a reaction on the top message, and the top
    # message's status edited, so the channel view shows it is done without opening
    # the thread.
    #
    # Every post is READ BACK from the thread (conversations.replies) and a post
    # that is not there, or landed somewhere else, fails loudly (L-P9-019: every
    # call reported success while the operator saw nothing). Long posts are split on
    # line boundaries with code fences closed and reopened at each cut, because
    # Slack cuts near 4,000 characters and a cut fence breaks the rest of the post.
    #
    # Entry point: `hitl.py thread --correlation-id FP --event EVENT ...` (main()).

    THREAD_PREFIX = "sre-agent-thread/v1"
    THREAD_EVENTS = ("diagnosis", "pr-opened", "pr-approved", "pr-merged", "escalated",
                     "recovery", "resolved")
    # One-shot events are posted once per incident (per PR for PR events): a re-run
    # after a crash finds its own earlier post and does not post it again.
    ONE_SHOT = ("diagnosis", "pr-opened", "pr-approved", "pr-merged", "resolved")
    CHUNK_LIMIT = 3500
    RESOLVED_REACTION = "white_check_mark"
    VERIFY_WAIT = float(os.environ.get("SLACK_VERIFY_WAIT", "15"))
    VERIFY_PAUSE = float(os.environ.get("SLACK_VERIFY_PAUSE", "2"))


    class ThreadError(RuntimeError):
        """A thread post that failed, or did not land where it was meant to."""


    def format_thread_line(cid, channel, thread_ts, incident):
        body = json.dumps({"cid": cid, "channel": channel, "thread_ts": thread_ts,
                           "incident": incident}, separators=(",", ":"), ensure_ascii=True)
        return f"{THREAD_PREFIX} {body}"


    def thread_from_journal(text, cid):
        """The newest thread for `cid` in a block of journal text: the v1 line, or
        (for notes written before it existed) the `thread:` permalink."""
        import re
        for raw in (text or "").splitlines():
            if THREAD_PREFIX + " " in raw:
                try:
                    d = json.loads(raw[raw.index(THREAD_PREFIX) + len(THREAD_PREFIX) + 1:])
                except Exception:
                    continue
                if d.get("cid") == cid and d.get("channel") and d.get("thread_ts"):
                    return d
        # Legacy: "thread: https://<ws>.slack.com/archives/C123/p1731000000000100".
        # Only trusted when the same note names this correlation id.
        for block in (text or "").split("\n\n"):
            m = re.search(r"/archives/([A-Z0-9]+)/p(\d{10})(\d{6})", block)
            if m and f"correlation id: {cid}" in block:
                return {"cid": cid, "channel": m.group(1),
                        "thread_ts": f"{m.group(2)}.{m.group(3)}", "incident": None}
        return None


    def find_thread(cid, channel=None, thread_ts=None, sys_id=None):
        """Where the incident's thread is: explicit args, else the local record, else
        the incident in ServiceNow. Returns {channel, thread_ts, incident, sys_id} or
        None."""
        if thread_ts:
            return {"channel": channel or approvers()[1], "thread_ts": thread_ts,
                    "incident": None, "sys_id": sys_id}
        rec = STORE.get(f"approval-{cid}")
        if rec and rec.get("thread_ts") and rec.get("channel"):
            return {"channel": rec["channel"], "thread_ts": rec["thread_ts"],
                    "incident": rec.get("incident"), "sys_id": sys_id or rec.get("sys_id")}
        if not SNOW_INSTANCE:
            return None
        try:
            if sys_id:
                j = snow_journals(sys_id)
                text, number = j["work_notes"] + "\n\n" + j["comments"], None
            else:
                q = urllib.parse.quote(f"correlation_id={cid}^ORDERBYDESCsys_created_on", safe="^=")
                r = snow("GET", f"/api/now/table/incident?sysparm_query={q}&sysparm_display_value=true"
                                f"&sysparm_fields=sys_id,number,{','.join(JOURNALS)}&sysparm_limit=1")
                rows = (r or {}).get("result") or []
                if not rows:
                    return None
                sys_id, number = rows[0].get("sys_id"), rows[0].get("number")
                text = "\n\n".join(str(rows[0].get(f) or "") for f in JOURNALS)
        except Exception as e:
            log("thread lookup in ServiceNow failed", error=f"{type(e).__name__}: {e}", cid=cid)
            return None
        t = thread_from_journal(text, cid)
        if not t:
            return None
        return {"channel": t["channel"], "thread_ts": t["thread_ts"],
                "incident": t.get("incident") or number, "sys_id": sys_id}


    def esc(s):
        """Slack mrkdwn escaping. Model and evidence text is data: it must not turn
        into a link, a user mention or an @channel."""
        return str(s if s is not None else "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


    def _unesc(s):
        import html
        return html.unescape(str(s or ""))


    def chunks(text, limit=CHUNK_LIMIT):
        """Split on line boundaries; a ``` block cut at a chunk end is closed there and
        reopened in the next, so every chunk renders on its own (same rule as
        scripts/ops/slack-note.py). A single line longer than a chunk is cut hard."""
        if len(text) <= limit:
            return [text]
        room = limit - 8                      # space for a closing/opening fence
        lines = []
        for line in text.split("\n"):
            while len(line) > room:
                lines.append(line[:room])
                line = line[room:]
            lines.append(line)
        out, cur, in_code = [], "", False
        for line in lines:
            add = line + "\n"
            if len(cur) + len(add) > room and cur.strip():
                out.append(cur.rstrip("\n") + ("\n```" if in_code else ""))
                cur = "```\n" if in_code else ""
            cur += add
            if line.strip().startswith("```"):
                in_code = not in_code
        if cur.strip() and cur.strip() != "```":
            out.append(cur.rstrip("\n") + ("\n```" if in_code else ""))
        return out


    def thread_messages(channel, thread_ts):
        """Every message in the thread, parent first, all pages."""
        out, cursor = [], None
        for _ in range(50):
            p = {"channel": channel, "ts": thread_ts, "limit": 200, "inclusive": "true"}
            if cursor:
                p["cursor"] = cursor
            r = slack_get("conversations.replies", p)
            if not r.get("ok"):
                raise ThreadError(f"cannot read thread {thread_ts}: {r.get('error')}"
                                  + (f" (needed: {r['needed']})" if r.get("needed") else ""))
            out += r.get("messages") or []
            cursor = (r.get("response_metadata") or {}).get("next_cursor")
            if not cursor:
                break
        seen, uniq = set(), []
        for m in out:
            if m.get("ts") not in seen:
                seen.add(m.get("ts"))
                uniq.append(m)
        return uniq


    def _plain(s):
        """Text as a reader sees it, for comparing what was sent with what Slack
        stored: link markup reduced to its label (Slack also auto-links bare URLs,
        which adds markup we never sent), entities decoded, spaces collapsed."""
        import re
        s = re.sub(r"<([^<>|]+)\|([^<>]+)>", r"\2", str(s or ""))
        s = re.sub(r"<([^<>|]+)>", r"\1", s)
        return " ".join(_unesc(s).split())


    def _first_line(s):
        return next((_plain(ln) for ln in str(s or "").split("\n") if _plain(ln)), "")


    def _last_line(s):
        return next((_plain(ln) for ln in reversed(str(s or "").split("\n")) if _plain(ln)), "")


    def _same_post(stored, sent):
        """First and last lines match: the post is there, and was not cut short."""
        return _first_line(stored) == _first_line(sent) and _last_line(stored) == _last_line(sent)


    def verify_reply(channel, thread_ts, ts, sent):
        """'' when message `ts` is in thread `thread_ts` and starts as sent, else why not."""
        deadline = time.time() + VERIFY_WAIT
        while True:
            try:
                msgs = thread_messages(channel, thread_ts)
            except ThreadError as e:
                return str(e)
            got = [m for m in msgs if m.get("ts") == ts]
            if got and got[0].get("thread_ts") == thread_ts and _same_post(got[0].get("text"), sent):
                return ""
            if time.time() >= deadline:
                if got and got[0].get("thread_ts") != thread_ts:
                    return f"message {ts} is not in thread {thread_ts}"
                if got:
                    return (f"message {ts} is in the thread but its text is not what was sent "
                            f"(cut short or changed)")
                return f"message {ts} NOT FOUND in thread {thread_ts} after {VERIFY_WAIT:.0f}s"
            time.sleep(VERIFY_PAUSE)


    def thread_post(channel, thread_ts, text):
        """Post into the thread in chunks, each read back. Returns the chunk ts list;
        raises ThreadError on the first chunk that failed or did not land."""
        posted = []
        parts = chunks(text)
        for i, part in enumerate(parts):
            r = slack("chat.postMessage", {"channel": channel, "thread_ts": thread_ts,
                                           "text": part, "unfurl_links": False,
                                           "unfurl_media": False})
            if not r.get("ok") or not r.get("ts"):
                raise ThreadError(f"chat.postMessage failed on part {i + 1}/{len(parts)}: {r.get('error')}")
            why = verify_reply(channel, thread_ts, r["ts"], part)
            if why:
                bump("thread_posts_missing")
                log("thread post did NOT land (read back)", security=True,
                    channel=channel, thread_ts=thread_ts, part=f"{i + 1}/{len(parts)}", why=why)
                raise ThreadError(f"part {i + 1}/{len(parts)}: {why}")
            posted.append(r["ts"])
        return posted


    def _footer(event, cid, ref=""):
        return f"_sre-agent/{event} · {cid}" + (f" · {ref}" if ref else "") + "_"


    def _pr_label(url):
        import re
        m = re.search(r"github\.com/([^/]+/[^/]+)/pull/(\d+)", url or "")
        return f"{m.group(1)}#{m.group(2)}" if m else (url or "")


    def _pr_link(url):
        return f"<{url}|{esc(_pr_label(url))}>" if url and url.startswith("https://") else esc(url or "(no link)")


    def render_diagnosis(d, bundle, incident):
        """The full cited diagnosis, as Slack mrkdwn. Every field from the model or
        the evidence is escaped."""
        meta = d.get("_meta") or {}
        titles = {e.get("id"): e.get("title") or "" for e in (bundle or {}).get("evidence") or []}
        ruled = d.get("ruled_out") or []
        cited = list(dict.fromkeys(list(d.get("citations") or [])
                                   + [c for r in ruled for c in (r.get("citations") or [])]))
        disp = d.get("disposition") or "(none)"
        if disp == "revert":
            imp = d.get("implicated") or {}
            disp_txt = (f"revert commit `{esc(imp.get('commit') or '(none named)')}`"
                        f" ({esc(', '.join(imp.get('paths') or []) or 'no paths')})")
        elif disp == "escalate":
            disp_txt = (f"escalate to {esc(d.get('escalate_to') or '(not named)')}. "
                        f"A human must: {esc(d.get('imperative_action') or '(not stated)')}")
        else:
            disp_txt = esc(disp)
        out = [f":mag: *Diagnosis: {esc(incident or 'this incident')}* "
               f"(confidence {esc(d.get('confidence') or '?')}, class `{esc(d.get('failure_class') or '?')}`)",
               f"*Root cause:* {esc(d.get('root_cause'))}",
               f"*Blast radius:* {esc(d.get('blast_radius') or '?')} · *A restart would fix it:* "
               f"{'yes' if d.get('restart_would_fix') else 'no'}",
               f"*Disposition:* {disp_txt}",
               f"*Action ({esc(d.get('tier') or '?')}, path `{esc(d.get('path') or '-')}`):* "
               f"{esc(d.get('recommended_action'))}",
               "",
               "*Reasoning:*",
               esc(d.get("reasoning")),
               "",
               "*Ruled out:*"]
        out += [f"• not {esc(r.get('alternative'))}: {esc(r.get('why_not'))} "
                f"[{esc(', '.join(r.get('citations') or [])) or 'no citation'}]" for r in ruled] \
            or ["• (none stated)"]
        out += ["", "*Evidence cited:*"]
        out += [f"• `{esc(c)}` {esc(titles[c]) if titles.get(c) else '(no title in the bundle)'}"
                if c in titles else f"• `{esc(c)}` (NOT in the evidence bundle)" for c in cited] \
            or ["• (no citations)"]
        if meta.get("model"):
            out += ["", f"_model {esc(meta['model'])}_"]
        return "\n".join(out)


    def render_update(event, a, verdict=None):
        if event == "pr-opened":
            txt = f":arrow_up: *PR opened:* {_pr_link(a.pr_url)}"
            if a.tier:
                txt += f" ({esc(a.tier)})"
        elif event == "pr-approved":
            txt = f":thumbsup: *PR approved* by {esc(a.by or '(unknown)')}: {_pr_link(a.pr_url)}"
        elif event == "pr-merged":
            txt = (f":twisted_rightwards_arrows: *PR merged* by {esc(a.by or '(unknown)')}: "
                   f"{_pr_link(a.pr_url)}" + (f" at `{esc(a.sha[:12])}`" if a.sha else ""))
        elif event == "escalated":
            txt = (f":rotating_light: *Escalated* to {esc(a.to or '(not named)')}")
        elif event == "recovery":
            checks = (verdict or {}).get("checks") or []
            bad = [c for c in checks if not c.get("ok")]
            ok = bool((verdict or {}).get("recovered")) and not bad
            txt = (f":stethoscope: *Recovery checks: {'PASSED' if ok else 'NOT recovered'}* "
                   f"({len(checks) - len(bad)}/{len(checks)} ok)")
            txt += "".join(f"\n{'✓' if c.get('ok') else '✗'} {esc(c.get('check'))}: {esc(c.get('detail'))}"
                           for c in checks)
        else:
            raise ValueError(event)
        if a.detail:
            txt += f"\n{esc(a.detail)}"
        return txt


    STATUS_RESOLVED = "*Status:* :white_check_mark: RESOLVED"


    def _status_text(parent_text, status):
        """The top message with its status line replaced. Slack returns the text in
        its own stored form (entities and link markup intact), which is exactly the
        form to send back, so it is not unescaped or re-escaped here."""
        kept = [ln for ln in str(parent_text or "").split("\n") if not ln.startswith("*Status:*")]
        return f"*Status:* {status}\n" + "\n".join(kept).strip()


    # What each event needs, for the CLI and the internal endpoint alike.
    THREAD_NEEDS = {"diagnosis": ("diagnosis", "bundle"), "pr-opened": ("pr_url",),
                    "pr-approved": ("pr_url", "by"), "pr-merged": ("pr_url", "by"),
                    "escalated": ("to",), "recovery": ("recovery",)}


    def _doc(v):
        """A JSON document given as a path (the CLI) or already parsed (the internal
        endpoint). One code path after this."""
        if v is None or isinstance(v, (dict, list)):
            return v
        with open(v) as fh:
            return json.load(fh)


    def _open_record_thread(a):
        """Open a record-only thread (no buttons) for an incident that has none yet.
        Only on request (`open_thread`): the in-cluster agent has no other way to get a
        thread, while the workstation drivers open theirs with `hitl.py request`."""
        if not (a.incident and a.sys_id):
            return None
        d = _doc(a.diagnosis) if a.event == "diagnosis" else {}
        d = d if isinstance(d, dict) else {}
        # model text is data: escaped like every other post (no @channel, no links)
        rec = request_approval(
            a.incident, a.sys_id, a.correlation_id, esc(a.tier or d.get("tier") or "T?"),
            esc(str(d.get("root_cause") or f"sre-agent is working on {a.incident}")[:600]),
            esc(str(d.get("recommended_action") or "(the agent posts each step below)")[:300]),
            mode="record",
            note="_Opened by the in-cluster agent. Decisions are taken on the pull request, "
                 "not in this thread._")
        if not rec.get("thread_ts"):
            return None
        if SNOW_INSTANCE and not rec.get("snow_noted"):
            log("opened a thread but the incident's cross-link note did not store",
                security=True, cid=a.correlation_id, incident=a.incident)
        return {"channel": rec["channel"], "thread_ts": rec["thread_ts"],
                "incident": a.incident, "sys_id": a.sys_id}


    def thread_event(a):
        """Post one event into the incident's thread. Returns the result dict; the
        caller turns `ok` into the exit code. Raises nothing for Slack problems: they
        are the result.

        `a` is the CLI's argparse namespace, or the same fields built by the internal
        endpoint (documents already parsed). `a.occurrence` > 1 marks a recurrence: its
        one-shot posts (diagnosis, resolved) are that occurrence's, not deduplicated
        against the first occurrence's."""
        res = {"ok": False, "event": a.event, "correlation_id": a.correlation_id,
               "channel": None, "thread_ts": None, "posted": [], "deduped": False, "error": ""}
        occ = int(getattr(a, "occurrence", 1) or 1)
        d = bundle = None
        if a.event == "diagnosis":
            # checked before anything is looked up or opened: a diagnosis for another
            # incident must not even open a thread
            d, bundle = _doc(a.diagnosis), _doc(a.bundle)
            fp = (d.get("_meta") or {}).get("fingerprint") or bundle.get("fingerprint")
            if fp and fp != a.correlation_id:
                res["error"] = f"the diagnosis is for fingerprint {fp}, not {a.correlation_id}; not posting it"
                res["code"] = 2
                return res
        t = find_thread(a.correlation_id, a.channel, a.thread_ts, a.sys_id)
        if (not t or not t.get("thread_ts")) and getattr(a, "open_thread", False):
            t = _open_record_thread(a)
            res["opened_thread"] = bool(t)
        if not t or not t.get("channel") or not t.get("thread_ts"):
            res["error"] = (f"no Slack thread found for correlation id {a.correlation_id} "
                            f"(no --thread-ts, no local record, nothing on the incident)")
            res["code"] = 2
            return res
        ch, ts = t["channel"], t["thread_ts"]
        res.update(channel=ch, thread_ts=ts)
        incident = a.incident or t.get("incident")

        verdict = None
        if a.recovery:
            verdict = _doc(a.recovery)
        if a.event == "diagnosis":
            text = render_diagnosis(d, bundle, (f"{incident} (occurrence {occ})" if occ > 1 and incident
                                                else incident))
        elif a.event == "resolved":
            if verdict is not None and not verdict.get("recovered"):
                res["error"] = "recovery is not verified; not marking the thread resolved"
                res["code"] = 1
                return res
            text = (f":white_check_mark: *Resolved:* {esc(incident or 'the incident')} is closed."
                    + (f" Recovery verified ({sum(1 for c in verdict.get('checks') or [] if c.get('ok'))}"
                       f"/{len(verdict.get('checks') or [])} checks)." if verdict else ""))
            if a.detail:
                text += f"\n{esc(a.detail)}"
        else:
            text = render_update(a.event, a, verdict)

        # The PR's short label, not its URL: Slack rewrites bare URLs into link
        # markup, and the footer has to read back exactly.
        ref = _pr_label(a.pr_url) if a.event.startswith("pr-") else ""
        if occ > 1:
            ref = " · ".join(x for x in (ref, f"occurrence {occ}") if x)
        footer = _footer(a.event, a.correlation_id, ref)
        text = f"{text}\n{footer}"
        try:
            msgs = thread_messages(ch, ts)
            parent = next((m for m in msgs if m.get("ts") == ts), None)
            if parent is None:
                raise ThreadError(f"the thread's top message {ts} is not readable in {ch}")
            already = [m for m in msgs if m.get("ts") != ts
                       and _plain(footer) in [_plain(ln) for ln in str(m.get("text") or "").split("\n")]]
            if a.event in ONE_SHOT and already:
                res["deduped"] = True
                res["posted"] = [m["ts"] for m in already]
            else:
                res["posted"] = thread_post(ch, ts, text)
            if a.event == "resolved":
                # The marker on the TOP message: a reaction and a status line, so the
                # channel view says "done" without opening the thread.
                r = slack("reactions.add", {"channel": ch, "timestamp": ts, "name": RESOLVED_REACTION})
                if not r.get("ok") and r.get("error") != "already_reacted":
                    raise ThreadError(f"reactions.add failed: {r.get('error')}"
                                      + (f" (needed: {r['needed']})" if r.get("needed") else ""))
                status = f":white_check_mark: RESOLVED {_iso(time.time())}"
                new = _status_text(parent.get("text"), status)
                # Blocks replaced too: the top message of an approval thread carries
                # buttons, and a resolved incident should not keep live-looking ones.
                r = slack("chat.update", {"channel": ch, "ts": ts, "text": new[:3900],
                                          "blocks": [{"type": "section", "text": {
                                              "type": "mrkdwn", "text": new[:2900]}}]})
                if not r.get("ok"):
                    raise ThreadError(f"chat.update of the top message failed: {r.get('error')}")
                # Read the marker back like any post.
                why, deadline = "", time.time() + VERIFY_WAIT
                while True:
                    parent = next((m for m in thread_messages(ch, ts) if m.get("ts") == ts), {})
                    has_status = str(parent.get("text") or "").startswith(STATUS_RESOLVED)
                    has_reaction = any(x.get("name") == RESOLVED_REACTION for x in parent.get("reactions") or [])
                    if has_status and has_reaction:
                        why = ""
                        break
                    why = (f"top message {ts}: status line {'present' if has_status else 'MISSING'}, "
                           f"{RESOLVED_REACTION} reaction {'present' if has_reaction else 'MISSING'}")
                    if time.time() >= deadline:
                        break
                    time.sleep(VERIFY_PAUSE)
                if why:
                    raise ThreadError(why)
                res["marker"] = {"reaction": RESOLVED_REACTION, "status": status}
            res["ok"] = True
        except (ThreadError, OSError, ValueError) as e:
            res["error"] = str(e)
            res["code"] = 1
        log("thread event", event=a.event, cid=a.correlation_id, ok=res["ok"],
            posted=len(res["posted"]), deduped=res["deduped"], error=res["error"] or None)
        return res


    # ------------------------------------------------------------------ HTTP -----
    # ---------------------------------------------------------- Socket Mode ----
    # WHY THIS EXISTS. The Approve/Reject buttons in Slack never worked. Slack
    # delivers a button click by POSTing to the app's configured Request URL, and
    # this estate has no inbound path at all — no ingress, no LoadBalancer, and the
    # metadata-server gate (SPEC §5) rules out the usual shortcuts. So the click went
    # nowhere, silently, and the request escalated on timeout as though nobody had
    # answered. Reported from the live channel: "the approve button didn't work".
    #
    # Socket Mode inverts the direction: the app opens an OUTBOUND WebSocket to
    # Slack and interactions arrive over it. No public URL, no ingress, nothing
    # inbound — which is the only shape this estate's security model permits.
    #
    # STDLIB ONLY. hitl ships as a ConfigMap on the stock python:3.12-alpine image
    # (no private registry, SPEC §5), so `websocket-client` is not available and
    # pip-installing at start would make the pod depend on PyPI being reachable at
    # boot. The RFC 6455 client below is therefore hand-rolled: handshake, frame
    # parse, masked writes, ping/pong, close. It is deliberately minimal — it speaks
    # only the subset Slack uses.

    WS_GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"


    def _ws_handshake(host, port, path, timeout=40):
        key = base64.b64encode(os.urandom(16)).decode()
        raw = socket.create_connection((host, port), timeout=timeout)
        sock = ssl.create_default_context().wrap_socket(raw, server_hostname=host)
        req = (f"GET {path} HTTP/1.1\r\nHost: {host}\r\nUpgrade: websocket\r\n"
               f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\n"
               f"Sec-WebSocket-Version: 13\r\n\r\n")
        sock.sendall(req.encode())
        buf = b""
        while b"\r\n\r\n" not in buf:
            chunk = sock.recv(4096)
            if not chunk:
                raise RuntimeError("Slack closed the connection during the WebSocket handshake")
            buf += chunk
        head, _, rest = buf.partition(b"\r\n\r\n")
        if b" 101 " not in head.split(b"\r\n")[0]:
            raise RuntimeError(f"WebSocket upgrade refused: {head.split(chr(13).encode())[0][:120]}")
        # The server proves it saw our key; a proxy that answered 101 without this
        # is not a WebSocket peer and must not be trusted to frame anything.
        want = base64.b64encode(hashlib.sha1((key + WS_GUID).encode()).digest()).decode()
        if want.lower().encode() not in head.lower():
            raise RuntimeError("WebSocket accept key did not match — not a real WebSocket peer")
        return sock, rest


    def _ws_frames(sock, carry=b""):
        """Yield (opcode, payload) for each frame. Reassembles continuations."""
        buf, frag, frag_op = carry, b"", None

        def need(n):
            nonlocal buf
            while len(buf) < n:
                chunk = sock.recv(65536)
                if not chunk:
                    raise ConnectionError("Slack closed the WebSocket")
                buf += chunk
            out, buf = buf[:n], buf[n:]
            return out

        while True:
            b0, b1 = need(2)
            fin, opcode, masked, ln = b0 & 0x80, b0 & 0x0F, b1 & 0x80, b1 & 0x7F
            if ln == 126:
                ln = int.from_bytes(need(2), "big")
            elif ln == 127:
                ln = int.from_bytes(need(8), "big")
            mask = need(4) if masked else b""
            data = need(ln) if ln else b""
            if masked:
                data = bytes(c ^ mask[i % 4] for i, c in enumerate(data))
            if opcode == 0x0:                       # continuation
                frag += data
                if fin:
                    yield frag_op, frag
                    frag, frag_op = b"", None
            elif opcode in (0x1, 0x2):              # text / binary
                if fin:
                    yield opcode, data
                else:
                    frag, frag_op = data, opcode
            else:                                   # control frame
                yield opcode, data


    def _ws_send(sock, data, opcode=0x1):
        """Client frames MUST be masked (RFC 6455 §5.3)."""
        payload = data.encode() if isinstance(data, str) else data
        n, head = len(payload), bytes([0x80 | opcode])
        if n < 126:
            head += bytes([0x80 | n])
        elif n < (1 << 16):
            head += bytes([0x80 | 126]) + n.to_bytes(2, "big")
        else:
            head += bytes([0x80 | 127]) + n.to_bytes(8, "big")
        mask = os.urandom(4)
        sock.sendall(head + mask + bytes(c ^ mask[i % 4] for i, c in enumerate(payload)))


    def socket_mode_loop():
        """Open an outbound WebSocket to Slack and serve interactions over it.

        Reconnects on its own: Slack refreshes these connections routinely and sends
        a `disconnect` before doing so, which is normal operation and not an error.
        A connection that drops mid-approval loses nothing — the approval record
        lives in the Store, and Slack redelivers an envelope that was never acked.
        """
        if not APP_TOKEN:
            log("SLACK_APP_TOKEN is not set — Socket Mode cannot start, so the "
                "Approve/Reject buttons will not work", security=True)
            return
        backoff = 1
        while True:
            try:
                r = slack("apps.connections.open", {}, token=APP_TOKEN)
                if not r.get("ok"):
                    raise RuntimeError(f"apps.connections.open failed: {r.get('error')}")
                u = urllib.parse.urlparse(r["url"])
                sock, carry = _ws_handshake(u.hostname, u.port or 443,
                                            (u.path or "/") + (f"?{u.query}" if u.query else ""))
                log("Socket Mode connected", host=u.hostname)
                bump("socket_connects")
                with _lock:
                    STATS["socket_connected"] = 1
                backoff = 1
                for opcode, data in _ws_frames(sock, carry):
                    if opcode == 0x9:                       # ping -> pong
                        _ws_send(sock, data, opcode=0xA)
                        continue
                    if opcode == 0x8:                       # close
                        raise ConnectionError("Slack sent a close frame")
                    if opcode != 0x1:
                        continue
                    try:
                        env = json.loads(data.decode())
                    except Exception:
                        continue
                    if env.get("type") == "hello":
                        continue
                    if env.get("type") == "disconnect":
                        log("Slack asked us to reconnect", reason=env.get("reason"))
                        break
                    eid, payload = env.get("envelope_id"), env.get("payload") or {}
                    if not eid:
                        continue
                    status, body = 200, None
                    try:
                        status, body = handle_interaction(payload)
                    except Exception as e:
                        log("interaction handler raised", error=f"{type(e).__name__}: {e}")
                    # Ack. The optional `payload` is what Slack shows the clicker,
                    # and it is the SAME body the HTTP path returns — one code path
                    # for the decision, two transports.
                    ack = {"envelope_id": eid}
                    if body is not None:
                        ack["payload"] = body
                    _ws_send(sock, json.dumps(ack))
                try:
                    sock.close()
                except Exception:
                    pass
            except Exception as e:
                with _lock:
                    STATS["socket_connected"] = 0
                bump("socket_errors")
                log("Socket Mode connection failed — retrying", error=f"{type(e).__name__}: {e}",
                    retry_in=backoff)
                time.sleep(backoff)
                backoff = min(backoff * 2, 60)


    def handle_interaction(payload):
        """Decide one Slack interaction. Returns (http_status, response_body).

        Transport-independent ON PURPOSE. An HTTP Request-URL POST and a Socket Mode
        envelope carry the SAME interaction payload and take the SAME response body
        (Socket Mode returns it in the ack), so the authorisation decision must not
        live inside either transport's handler. It used to live inside `do_POST`,
        which is why adding Socket Mode was the moment to lift it out: two copies of
        an approver check is two chances to get one of them wrong.

        Signature verification is NOT done here. It is an HTTP-transport concern —
        Socket Mode is authenticated by the app-level token and the WebSocket itself,
        and there is no signature to verify. The HTTP path verifies before it ever
        calls this function.
        """
        user_id = (payload.get("user") or {}).get("id", "")
        actions = payload.get("actions") or [{}]
        try:
            value = json.loads(actions[0].get("value") or "{}")
        except Exception:
            value = {}
        cid, tier = value.get("cid"), value.get("tier", "T2")
        decision = value.get("decision")

        allowed, allowlist = is_approver(user_id, tier)
        if not allowed:
            bump("unauthorized")
            # SECURITY EVENT. Recorded with who, what and when — an unauthorized
            # click that is merely ignored cannot be shown to have been rejected.
            log("UNAUTHORIZED approval attempt rejected", security=True,
                user=user_id, tier=tier, correlation_id=cid, decision=decision,
                allowlist_size=len(allowlist))
            rec = STORE.get(f"approval-{cid}") if cid else None
            if rec and rec.get("sys_id"):
                snow_note(rec["sys_id"],
                          f"sre-agent: REJECTED an unauthorized approval attempt by "
                          f"Slack user {user_id} on tier {tier}. Not an approver.")
            return 200, {"response_type": "ephemeral",
                         "text": f":no_entry: You are not on the {tier} approver "
                                 f"allowlist. This attempt has been logged."}

        rec = STORE.get(f"approval-{cid}") if cid else None
        if not rec:
            return 200, {"response_type": "ephemeral",
                         "text": "That approval request is no longer active."}
        if rec.get("state") != "pending":
            return 200, {"response_type": "ephemeral", "text": f"Already {rec['state']}."}

        decide(rec, user_id, "approved" if decision == "approve" else "rejected")
        log("approval decision recorded", user=user_id, decision=decision,
            incident=rec["incident"], correlation_id=cid)
        return 200, {"response_type": "in_channel",
                     "text": f"{'Approved' if decision == 'approve' else 'Rejected'} "
                             f"by <@{user_id}>"}


    # ------------------------------------------------- the agent's internal route ---
    # WHY. The in-cluster agent (platform/agent) holds no Slack token and no copy of this
    # file, on purpose (hardening item 1 keeps its secrets to the six it needs), so its
    # thread posts had nowhere to go. This pod already holds the Slack token and runs
    # `serve`, so the agent hands it the event instead:
    #
    #   POST /internal/thread   on HITL_INTERNAL_PORT (8091), its own listener
    #   Authorization: Bearer <the agent's ServiceAccount token, audience sre-hitl-internal>
    #   Content-Type: application/json, at most HITL_INTERNAL_MAX_BODY bytes
    #   {"correlation_id", "event", "incident", "sys_id", "occurrence", "open_thread",
    #    "diagnosis": {...}, "bundle": {...}, "recovery": {...},
    #    "pr_url", "tier", "by", "sha", "to", "detail"}      (the `hitl.py thread` fields)
    #
    # It runs thread_event(), the same function as the CLI: the same escaping, chunking
    # and read-back. What the caller cannot do: choose the channel or thread (the thread
    # is the incident's own, found by correlation id), or send a field this does not know.
    #
    # Who can reach it: only the agent pod, by CiliumNetworkPolicy sre-hitl-ingress
    # (platform/hitl/networkpolicy.yaml), through the pinned ClusterIP of Service
    # sre-hitl-internal (the agent's pod uses public resolvers, so it has no cluster DNS).
    #
    # Who is let in: a bearer token that the API server says (TokenReview) is the
    # ServiceAccount sre-system/sre-agent's, minted for audience sre-hitl-internal. Why
    # not a shared token in a Secret: item 1's rule is that no Kubernetes Secret reaches
    # the agent's pod (h1_offline_test checks it), and a token the kubelet mints, rotates
    # and binds to the pod has nothing to leak. hitl's own ServiceAccount may create
    # TokenReviews and nothing else (platform/hitl/rbac.yaml). A review that succeeded is
    # cached for HITL_REVIEW_CACHE seconds by the token's SHA-256, never by the token.
    #
    # 200 posted (or already there) and read back · 400 malformed · 401 not the agent ·
    # 411 no Content-Length · 413 too large · 415 not JSON · 422 no thread / wrong
    # incident · 502 Slack did not take it (the body says why) · 503 the API server could
    # not be asked. Nothing is posted on any non-200 except 502.
    _review_cache = {}          # sha256(token) -> expires_at (successful reviews only)
    _cid_locks = {}
    INTERNAL_STR_FIELDS = ("incident", "sys_id", "pr_url", "tier", "by", "sha", "to", "detail")
    INTERNAL_DOC_FIELDS = ("diagnosis", "bundle", "recovery")
    INTERNAL_FIELDS = (("correlation_id", "event", "occurrence", "open_thread")
                       + INTERNAL_STR_FIELDS + INTERNAL_DOC_FIELDS)


    class ReviewUnavailable(RuntimeError):
        """The API server could not be asked whose a token is (-> 503, never a pass)."""


    def token_review(token):
        """Ask the API server whose `token` is, for INTERNAL_AUDIENCE. Returns the
        TokenReview status dict. Uses hitl's own ServiceAccount token; neither token is
        ever logged."""
        if not KUBE_API:
            raise ReviewUnavailable("no Kubernetes API address (not in a pod?)")
        try:
            with open(KUBE_TOKEN_FILE) as fh:
                own = fh.read().strip()
        except OSError as e:
            raise ReviewUnavailable(f"hitl's own ServiceAccount token is unreadable ({type(e).__name__})")
        body = json.dumps({"apiVersion": "authentication.k8s.io/v1", "kind": "TokenReview",
                           "spec": {"token": token, "audiences": [INTERNAL_AUDIENCE]}}).encode()
        req = urllib.request.Request(f"{KUBE_API}/apis/authentication.k8s.io/v1/tokenreviews",
                                     data=body, method="POST")
        req.add_header("Authorization", f"Bearer {own}")
        req.add_header("Content-Type", "application/json")
        handlers = [urllib.request.ProxyHandler({})]
        if KUBE_API.startswith("https://"):
            handlers.append(urllib.request.HTTPSHandler(
                context=ssl.create_default_context(cafile=KUBE_CA_FILE)))
        try:
            with urllib.request.build_opener(*handlers).open(req, timeout=10) as r:
                return (json.loads(r.read().decode() or "{}").get("status")) or {}
        except Exception as e:
            raise ReviewUnavailable(f"TokenReview failed: {type(e).__name__}"
                                    + (f" {e.code}" if isinstance(e, urllib.error.HTTPError) else ""))


    def internal_auth(header):
        """None if the caller is the agent's ServiceAccount (token minted for this
        audience), else a short reason. Raises ReviewUnavailable if that cannot be known."""
        scheme, _, given = (header or "").strip().partition(" ")
        given = given.strip()
        if scheme.lower() != "bearer" or not given:
            return "missing"
        if len(given) > 8192:
            return "malformed"
        digest = hashlib.sha256(given.encode()).hexdigest()
        now = time.time()
        with _lock:
            if _review_cache.get(digest, 0) > now:
                return None
        st = token_review(given)
        user = str((st.get("user") or {}).get("username") or "")
        if not st.get("authenticated"):
            return "not-authenticated"
        if not hmac.compare_digest(user.encode(), INTERNAL_ALLOWED.encode()):
            return "wrong-identity"
        # The API server only echoes audiences the token was minted for; an empty list
        # means it ignored ours (an old API server) and the token is not ours to trust.
        if INTERNAL_AUDIENCE not in (st.get("audiences") or []):
            return "wrong-audience"
        with _lock:
            for k in [k for k, v in _review_cache.items() if v <= now]:
                del _review_cache[k]
            _review_cache[digest] = now + REVIEW_CACHE_SECONDS
        return None


    def internal_args(body):
        """The request body as thread_event's arguments, or raises ValueError (-> 400)."""
        import re
        import types
        if not isinstance(body, dict):
            raise ValueError("the body must be a JSON object")
        extra = sorted(set(body) - set(INTERNAL_FIELDS))
        if extra:
            raise ValueError(f"unknown fields {extra}")
        cid = body.get("correlation_id")
        if not isinstance(cid, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}", cid):
            raise ValueError("correlation_id is missing or malformed")
        if body.get("event") not in THREAD_EVENTS:
            raise ValueError(f"event must be one of {list(THREAD_EVENTS)}")
        a = types.SimpleNamespace(correlation_id=cid, event=body["event"], channel=None,
                                  thread_ts=None)
        for k in INTERNAL_STR_FIELDS:
            v = body.get(k, "")
            if not isinstance(v, str) or len(v) > 2000:
                raise ValueError(f"{k} must be a string of at most 2000 characters")
            setattr(a, k, v)
        if a.sys_id and not re.fullmatch(r"[0-9a-f]{32}", a.sys_id):
            raise ValueError("sys_id must be 32 hex characters")
        if a.incident and not re.fullmatch(r"[A-Za-z0-9_-]{1,40}", a.incident):
            raise ValueError("incident must be an incident number")
        for k in INTERNAL_DOC_FIELDS:
            v = body.get(k)
            if v is not None and not isinstance(v, dict):
                raise ValueError(f"{k} must be a JSON object")
            setattr(a, k, v)
        occ = body.get("occurrence", 1)
        if not isinstance(occ, int) or isinstance(occ, bool) or not 1 <= occ <= 1000:
            raise ValueError("occurrence must be a whole number from 1")
        a.occurrence = occ
        if not isinstance(body.get("open_thread", False), bool):
            raise ValueError("open_thread must be true or false")
        a.open_thread = body.get("open_thread", False)
        missing = [n for n in THREAD_NEEDS.get(a.event, ()) if not getattr(a, n)]
        if missing:
            raise ValueError(f"event {a.event} needs {missing}")
        return a


    class InternalHandler(BaseHTTPRequestHandler):
        """POST /internal/thread only. Auth before a byte of the body is read."""
        protocol_version = "HTTP/1.1"

        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            if code != 200:
                self.send_header("Connection", "close")
                self.close_connection = True
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            self._send(404, {"error": "not found"})

        def do_POST(self):
            peer = self.client_address[0] if self.client_address else "?"
            if self.path.split("?", 1)[0] != "/internal/thread":
                return self._send(404, {"error": "not found"})
            try:
                why = internal_auth(self.headers.get("Authorization"))
            except ReviewUnavailable as e:
                bump("internal_review_unavailable")
                log("internal thread request refused: cannot verify the caller", security=True,
                    reason=str(e)[:200], peer=peer)
                return self._send(503, {"ok": False, "error": "cannot verify the caller right now"})
            if why:
                bump("internal_unauthorized")
                log("internal thread request refused: not authorised", security=True,
                    reason=why, peer=peer)
                return self._send(401, {"ok": False, "error": "unauthorized"})
            if (self.headers.get("Content-Type") or "").split(";")[0].strip() != "application/json":
                return self._send(415, {"ok": False, "error": "Content-Type must be application/json"})
            try:
                n = int(self.headers.get("Content-Length"))
            except (TypeError, ValueError):
                return self._send(411, {"ok": False, "error": "Content-Length required"})
            if n < 0 or n > INTERNAL_MAX_BODY:
                bump("internal_too_large")
                log("internal thread request refused: too large", length=n, limit=INTERNAL_MAX_BODY,
                    peer=peer)
                return self._send(413, {"ok": False, "error": f"body over {INTERNAL_MAX_BODY} bytes"})
            try:
                a = internal_args(json.loads(self.rfile.read(n) or b"null"))
            except ValueError as e:     # json.JSONDecodeError is a ValueError
                bump("internal_bad_request")
                return self._send(400, {"ok": False, "error": f"bad request: {str(e)[:200]}"})
            # One request per incident at a time: two at once could both open a thread,
            # or both miss the other's one-shot post.
            with _lock:
                lk = _cid_locks.setdefault(a.correlation_id, threading.Lock())
            with lk:
                try:
                    res = thread_event(a)
                except Exception as e:
                    res = {"ok": False, "error": f"{type(e).__name__}: {e}"[:300], "code": 1}
            code = 200 if res.get("ok") else (422 if res.get("code") == 2 else 502)
            res.pop("code", None)
            bump("internal_posted" if res.get("ok") else "internal_failed")
            log("internal thread request", event=a.event, cid=a.correlation_id, status=code,
                occurrence=a.occurrence, peer=peer)
            self._send(code, res)

        def log_message(self, *a):
            pass


    def serve_internal():
        """Start the internal listener when HITL_INTERNAL_ROUTE=on and this pod can ask
        the API server about tokens. Returns the server or None. Off is not fatal:
        approvals do not depend on it."""
        if not INTERNAL_ROUTE:
            return None
        if not KUBE_API or not os.path.exists(KUBE_TOKEN_FILE):
            log("internal thread route OFF: no Kubernetes API address or no ServiceAccount "
                "token to verify callers with", security=True, api=bool(KUBE_API),
                token_file=os.path.exists(KUBE_TOKEN_FILE))
            return None
        srv = ThreadingHTTPServer(("0.0.0.0", INTERNAL_PORT), InternalHandler)
        threading.Thread(target=srv.serve_forever, daemon=True).start()
        STATS["internal_thread"] = True
        log("internal thread route on", port=INTERNAL_PORT, max_body=INTERNAL_MAX_BODY,
            audience=INTERNAL_AUDIENCE, allowed=INTERNAL_ALLOWED)
        return srv


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send(self, code, payload, content_type="application/json"):
            body = (json.dumps(payload) if content_type == "application/json"
                    else str(payload)).encode()
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                # Liveness must mean "an approval can REACH this process", not "the
                # process is running". Socket Mode is the only transport that works on
                # this estate — there is no ingress for a Request URL — so a dead
                # WebSocket gives a human clicking Approve exactly the silence they got
                # when nothing was deployed at all (L-P8-010). A configured-but-
                # disconnected Socket Mode is therefore UNHEALTHY and says so, and the
                # kubelet restarts the pod instead of leaving it looking fine.
                connected = bool(STATS.get("socket_connected"))
                healthy = connected if APP_TOKEN else True
                self._send(200 if healthy else 503,
                           {"ok": healthy, "socket_mode": bool(APP_TOKEN),
                            "socket_connected": connected,
                            "signing_secret": bool(SIGNING_SECRET),
                            "internal_thread": bool(STATS.get("internal_thread"))})
            elif self.path.startswith("/stats"):
                with _lock:
                    self._send(200, dict(STATS))
            elif self.path.startswith("/audit"):
                with _lock:
                    self._send(200, AUDIT[-50:])
            else:
                self._send(404, {"error": "not found"})

        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(n)          # RAW bytes: verified before parsed.

            if not (self.path.startswith("/slack/")):
                self._send(404, {"error": "not found"})
                return

            ok, reason = verify_slack_signature(self.headers, raw)
            if not ok:
                bump("stale_timestamp" if "timestamp" in reason else "bad_signature")
                log("rejected an unsigned or invalid Slack request", security=True,
                    reason=reason, path=self.path,
                    peer=self.client_address[0] if self.client_address else "?")
                # 401, and nothing else: no hint about which part failed.
                self._send(401, {"error": "signature verification failed"})
                return

            if self.path.startswith("/slack/commands"):
                self._send(200, {"response_type": "ephemeral",
                                 "text": "sre-agent is up. Use the incident thread to approve."})
                return

            bump("interactions")
            try:
                form = urllib.parse.parse_qs(raw.decode())
                payload = json.loads(form.get("payload", ["{}"])[0])
            except Exception as e:
                self._send(400, {"error": f"bad payload: {e}"})
                return
            status, body = handle_interaction(payload)
            self._send(status, body)

        def log_message(self, *a):
            pass


    def sweeper():
        while True:
            time.sleep(int(os.environ.get("SWEEP_EVERY", "15")))
            try:
                sweep_timeouts()
            except Exception as e:
                log("sweep failed", error=f"{type(e).__name__}: {e}")


    def serve():
        """Serve approvals over whichever transports are configured.

        Socket Mode is the one that works on this estate. The HTTP listener needs a
        public Request URL for Slack to POST to, and this estate has no inbound path
        at all — no ingress, no LoadBalancer, and the metadata gate (SPEC §5) rules
        out the shortcuts. So for its whole life the Approve button pointed at
        nothing: the click vanished and the request escalated on timeout as though
        nobody had answered (L-P8-010). Socket Mode dials OUT, so it needs none of
        that.

        Both are started when configured. Neither is required — but starting with
        NEITHER is refused, because a process that accepts approvals through no
        transport at all is precisely the silent failure this is fixing.
        """
        if not (APP_TOKEN or SIGNING_SECRET):
            print("sre-hitl: neither SLACK_APP_TOKEN (Socket Mode) nor "
                  "SLACK_SIGNING_SECRET (HTTP) is set. There would be no way for an "
                  "approval to reach this process. Refusing to start rather than "
                  "looking alive and authorising nothing.", file=sys.stderr)
            return 2
        why = snow_oauth_problem()
        if why:
            print(f"sre-hitl: {why}. Refusing to start: approvals are recorded on the "
                  f"incident, and that write must not go out over Basic.", file=sys.stderr)
            return 2
        log("sre-hitl starting", port=PORT, state=STATE_URI,
            approval_timeout=APPROVAL_TIMEOUT,
            socket_mode=bool(APP_TOKEN), http_endpoint=bool(SIGNING_SECRET))
        STATS["recovery"] = recover_from_snow()
        threading.Thread(target=sweeper, daemon=True).start()
        serve_internal()
        if APP_TOKEN:
            threading.Thread(target=socket_mode_loop, daemon=True).start()
        if not SIGNING_SECRET:
            # Socket Mode only: no listener, so just park the main thread.
            log("no SLACK_SIGNING_SECRET — running Socket Mode only, no HTTP listener")
            while True:
                time.sleep(3600)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
        return 0


    def main():
        """Two entry points, one process image.

        `serve`   the Slack-facing endpoint (interactions, commands).
        `request` open an approval: post the thread, cross-link the incident, and
                  record it. This is what the remediation path calls when it has a
                  change that needs a human — P6 uses it, and the P5 gate uses it to
                  prove the cross-links are real rather than intended.
        `thread`  post one event into the incident's thread and read it back
                  (item 18): diagnosis, pr-opened, pr-approved, pr-merged,
                  escalated, recovery, resolved. Exit 0 = posted and verified (or
                  already there), 1 = a post failed or did not land, 2 = bad input
                  or no thread to post into.
        """
        import argparse
        ap = argparse.ArgumentParser()
        sub = ap.add_subparsers(dest="cmd")
        sub.add_parser("serve")
        sub.add_parser("recover", help="rebuild the approval set from ServiceNow and print a summary")
        r = sub.add_parser("request")
        r.add_argument("--incident", required=True)
        r.add_argument("--sys-id", required=True)
        r.add_argument("--correlation-id", required=True)
        r.add_argument("--tier", default="T2")
        r.add_argument("--summary", required=True)
        r.add_argument("--action", required=True)
        r.add_argument("--timeout", type=int)
        r.add_argument("--mode", choices=("approval", "record"), default="approval",
                       help="record: no buttons, for when the decision is taken elsewhere")
        r.add_argument("--note", default="",
                       help="one line saying where the decision is actually made")
        t = sub.add_parser("thread", help="post one event into the incident's Slack thread (item 18)")
        t.add_argument("--correlation-id", required=True)
        t.add_argument("--event", required=True, choices=THREAD_EVENTS)
        t.add_argument("--incident", help="INC number for the message text (else from the record)")
        t.add_argument("--sys-id", help="incident sys_id, to find the thread on the incident")
        t.add_argument("--channel")
        t.add_argument("--thread-ts", help="the thread's top message ts, if the caller has it")
        t.add_argument("--diagnosis", help="diagnosis JSON (event diagnosis)")
        t.add_argument("--bundle", help="the evidence bundle the diagnosis cites (event diagnosis)")
        t.add_argument("--pr-url", default="", help="pull request URL (pr-* events)")
        t.add_argument("--tier", default="")
        t.add_argument("--by", default="", help="who approved / merged (pr-approved, pr-merged)")
        t.add_argument("--sha", default="", help="merge commit (pr-merged)")
        t.add_argument("--to", default="", help="who it was escalated to (escalated)")
        t.add_argument("--recovery", help="verify_recovery verdict JSON (recovery, resolved)")
        t.add_argument("--detail", default="", help="one more line of plain text")
        t.add_argument("--occurrence", type=int, default=1,
                       help="which occurrence of the incident (1 + ServiceNow reopen_count)")
        t.add_argument("--open-thread", action="store_true",
                       help="open a record-only thread if the incident has none (needs "
                            "--incident and --sys-id)")
        a = ap.parse_args()

        if a.cmd == "thread":
            need = THREAD_NEEDS.get(a.event, ())
            missing = [f"--{n.replace('_', '-')}" for n in need if not getattr(a, n)]
            if missing:
                ap.error(f"--event {a.event} needs {' '.join(missing)}")

        why = snow_oauth_problem()
        if why and a.cmd in ("request", "recover", "thread"):
            # Before anything is posted: a thread whose incident note could only have
            # gone out over Basic is a half-written record.
            print(f"hitl {a.cmd}: {why}. Refusing to run.", file=sys.stderr)
            return 2

        if a.cmd == "request":
            global APPROVAL_TIMEOUT
            if a.timeout:
                APPROVAL_TIMEOUT = a.timeout
            rec = request_approval(a.incident, a.sys_id, a.correlation_id,
                                   a.tier, a.summary, a.action, a.mode, a.note)
            # `text` is what was ACTUALLY posted, not a caller's description of it.
            # The scorecard reads it to check the thread names its incident, and a
            # caller asserting that would be grading its own homework.
            print(json.dumps({k: rec.get(k) for k in
                              ("incident", "correlation_id", "tier", "state", "mode",
                               "channel", "thread_ts", "permalink", "text", "snow_noted")},
                             indent=2))
            # A cross-link note that did not land (read back) is a failure, not a
            # warning: the incident would have no way to the thread.
            if SNOW_INSTANCE and rec.get("permalink") and not rec.get("snow_noted"):
                return 1
            return 0 if rec.get("thread_ts") else 1
        if a.cmd == "thread":
            if not BOT_TOKEN:
                print("hitl thread: SLACK_BOT_TOKEN is not set. Refusing to run.", file=sys.stderr)
                return 2
            res = thread_event(a)
            code = 0 if res["ok"] else res.pop("code", 1)
            res.pop("code", None)
            print(json.dumps(res, indent=2))
            if not res["ok"]:
                print(f"hitl thread: {a.event} FAILED: {res['error']}", file=sys.stderr)
            return code
        if a.cmd == "recover":
            out = recover_from_snow()
            out["records"] = sorted(k for k in STORE.keys() if k.startswith("approval-"))
            print(json.dumps(out, indent=2))
            return 0 if not out.get("errors") else 1
        return serve()


    if __name__ == "__main__":
        raise SystemExit(main())
