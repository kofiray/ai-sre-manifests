# The sample app (the patient's workload). Two Applications, one per autonomy
# tier path, so an agent PR touching only `runtime/` cannot drag `config/` with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/kofiray/ai-sre-manifests.git
    targetRevision: main
    path: apps/checkout/config
  destination: { server: https://kubernetes.default.svc, namespace: checkout }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/kofiray/ai-sre-manifests.git
    targetRevision: main
    path: apps/checkout/runtime
  destination: { server: https://kubernetes.default.svc, namespace: checkout }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
