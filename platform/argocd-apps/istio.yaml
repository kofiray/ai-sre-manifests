apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.24.2
    helm:
      releaseName: istio-base
      values: |
        defaultRevision: default
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.24.2
    helm:
      releaseName: istiod
      values: |
        pilot:
          # No metrics-server on this estate, so an HPA would sit permanently in
          # "failed to get cpu utilization". One fixed replica is honest.
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
        global:
          proxy:
            resources:
              requests: { cpu: 10m, memory: 40Mi }
              limits:   { cpu: 200m, memory: 256Mi }
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
