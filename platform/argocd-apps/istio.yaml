apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.24.2
    helm:
      releaseName: istio-base
      values: |
        defaultRevision: default
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  # istiod writes its own caBundle into these webhook configurations at runtime,
  # so the live object can never equal the rendered chart. Ignoring exactly that
  # field keeps "OutOfSync" meaningful for everything else (L-P1-016).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.24.2
    helm:
      releaseName: istiod
      values: |
        pilot:
          # istiod must be TOLD the CNI is installed, or its injection template
          # keeps adding the `istio-init` container that PodSecurity `baseline`
          # rejects — installing istio-cni alone changes nothing (L-P1-013).
          # The key is `pilot.cni.enabled` in the istiod chart; a top-level
          # `istio_cni:` block is silently ignored (L-P1-015).
          cni:
            enabled: true
            provider: default
          # No metrics-server on this estate, so an HPA would sit permanently in
          # "failed to get cpu utilization". One fixed replica is honest.
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
        global:
          proxy:
            resources:
              requests: { cpu: 10m, memory: 40Mi }
              limits:   { cpu: 200m, memory: 256Mi }
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  # istiod writes its own caBundle into these webhook configurations at runtime,
  # so the live object can never equal the rendered chart. Ignoring exactly that
  # field keeps "OutOfSync" meaningful for everything else (L-P1-016).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Istio CNI (SPEC §3 component 4). Without it, sidecar injection adds an
# `istio-init` container that needs NET_ADMIN+NET_RAW — which Talos's default
# PodSecurity `baseline` correctly refuses, so no injected pod can ever start
# (L-P1-013). istio-cni does the same iptables work from a privileged DaemonSet
# in istio-system, so TENANT namespaces stay at `baseline`. It chains onto
# Cilium's CNI conflist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.24.2
    helm:
      releaseName: istio-cni
      values: |
        cni:
          cniBinDir: /opt/cni/bin
          cniConfDir: /etc/cni/net.d
          chained: true
          resources:
            requests: { cpu: 10m, memory: 64Mi }
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  # istiod writes its own caBundle into these webhook configurations at runtime,
  # so the live object can never equal the rendered chart. Ignoring exactly that
  # field keeps "OutOfSync" meaningful for everything else (L-P1-016).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
