# Wave 0: the monitoring CRDs, ALONE, so that they are established before the
# operator that reads them ever starts.
#
# The prometheus-operator probes API discovery for `prometheuses.monitoring.coreos.com`
# exactly ONCE, at startup. Delivered inside the kube-prometheus-stack chart the
# CRDs were created 4 seconds before the operator pod and were not yet established
# when it looked; the operator started every other controller, silently skipped the
# Prometheus one, and never re-checked — leaving a Synced, Running, Prometheus-less
# monitoring stack (L-P2-009). An ArgoCD sync wave does not begin until the previous
# wave is Healthy, so putting the CRDs one wave earlier removes the race instead of
# narrowing it.
#
# VERSION PAIRING: this chart must track the prometheus-operator version that
# kube-prometheus-stack below bundles.
#   kube-prometheus-stack 65.5.0 -> prometheus-operator v0.77.2
#   prometheus-operator-crds 15.0.0 -> v0.77.1   (same minor; CRDs are compatible)
# Bump BOTH together. The P2 gate asserts a running Prometheus pod, which is what
# fails loudly if this pairing ever drifts far enough to matter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 15.0.0
    helm:
      releaseName: kps-crds
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # CRDs exceed the annotation size limit for client-side apply; server-side
    # apply is the only way these land at all.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Wave 1: the estate's eyes. SPEC §3 component 3. On `ml-platform` (P9) the
# reference estate brings its own stack and this one is dropped.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      releaseName: kps
      values: |
        # ESTATE=minimal is 2 nodes; keep the stack small but REAL.
        fullnameOverride: kps
        # Delivered one wave earlier by `kube-prometheus-stack-crds` so the
        # operator cannot start before they are established (L-P2-009).
        crds:
          enabled: false
        prometheusOperator:
          # The admission webhook (and its two hook Jobs) validates PrometheusRule
          # objects. On this estate it is a bootstrap liability, not a safety net:
          # the create/patch Jobs must reach the API server before the CNI policy
          # settles, and while they back off the operator itself blocks forever on
          # a missing `kps-admission` secret — so NOTHING in the monitoring stack
          # starts (L-P1-012). Rules are validated by the operator at load time and
          # by the P1 gate, which asserts the rules are actually loaded and firing.
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
          tls:
            enabled: false
        defaultRules:
          create: true
          rules:
            etcd: false
            kubeProxy: false
        alertmanager:
          alertmanagerSpec:
            replicas: 1
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits:   { cpu: 200m, memory: 256Mi }
            # No PVC: the estate is ephemeral by design (SPEC §1.7).
            storage: {}
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 6h
            scrapeInterval: 15s
            evaluationInterval: 15s
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits:   { cpu: 1, memory: 2Gi }
            # Watch rules/monitors in EVERY namespace, not just the release's —
            # the failure library's PrometheusRules live with their tenants.
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
        grafana:
          enabled: false          # not needed for the gate; the agent reads Prometheus directly
        kubeEtcd:      { enabled: false }
        kubeProxy:     { enabled: false }   # replaced by Cilium
        kubeScheduler: { enabled: true }
        kubeControllerManager: { enabled: true }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Talos enforces PodSecurity `baseline` on every namespace by default, which
    # forbids hostNetwork/hostPID/hostPath/hostPort — exactly what node-exporter
    # needs. Label the namespace ArgoCD creates (L-P1-011).
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
