# Wave 0: the monitoring CRDs, ALONE, so that they are established before the
# operator that reads them ever starts.
#
# The prometheus-operator probes API discovery for `prometheuses.monitoring.coreos.com`
# exactly ONCE, at startup. Delivered inside the kube-prometheus-stack chart the
# CRDs were created 4 seconds before the operator pod and were not yet established
# when it looked; the operator started every other controller, silently skipped the
# Prometheus one, and never re-checked — leaving a Synced, Running, Prometheus-less
# monitoring stack (L-P2-009). An ArgoCD sync wave does not begin until the previous
# wave is Healthy, so putting the CRDs one wave earlier removes the race instead of
# narrowing it.
#
# VERSION PAIRING: this chart must track the prometheus-operator version that
# kube-prometheus-stack below bundles.
#   kube-prometheus-stack 65.5.0 -> prometheus-operator v0.77.2
#   prometheus-operator-crds 15.0.0 -> v0.77.1   (same minor; CRDs are compatible)
# Bump BOTH together. The P2 gate asserts a running Prometheus pod, which is what
# fails loudly if this pairing ever drifts far enough to matter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 15.0.0
    helm:
      releaseName: kps-crds
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # CRDs exceed the annotation size limit for client-side apply; server-side
    # apply is the only way these land at all.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Wave 1: the estate's eyes. SPEC §3 component 3. On `ml-platform` (P9) the
# reference estate brings its own stack and this one is dropped.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      releaseName: kps
      values: |
        # ESTATE=minimal is 2 nodes; keep the stack small but REAL.
        fullnameOverride: kps
        # Delivered one wave earlier by `kube-prometheus-stack-crds` so the
        # operator cannot start before they are established (L-P2-009).
        crds:
          enabled: false
        prometheusOperator:
          # The admission webhook (and its two hook Jobs) validates PrometheusRule
          # objects. On this estate it is a bootstrap liability, not a safety net:
          # the create/patch Jobs must reach the API server before the CNI policy
          # settles, and while they back off the operator itself blocks forever on
          # a missing `kps-admission` secret — so NOTHING in the monitoring stack
          # starts (L-P1-012). Rules are validated by the operator at load time and
          # by the P1 gate, which asserts the rules are actually loaded and firing.
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
          tls:
            enabled: false
        defaultRules:
          create: true
          rules:
            etcd: false
            kubeProxy: false
        alertmanager:
          alertmanagerSpec:
            replicas: 1
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits:   { cpu: 200m, memory: 256Mi }
            # No PVC: the estate is ephemeral by design (SPEC §1.7).
            storage: {}
            # The bridge's inbound bearer token (PLAN-hardening item 2), from the
            # `sre-bridge-webhook` Secret that scripts/bridge/install-secret.sh
            # writes. OPTIONAL on purpose: install-secret runs after cluster-apps,
            # and a required volume would hold Alertmanager in ContainerCreating
            # until then. Without the file, deliveries fail and Alertmanager
            # retries; nothing is ever sent to the bridge unauthenticated.
            volumes:
              - name: sre-bridge-webhook
                secret: { secretName: sre-bridge-webhook, optional: true }
            volumeMounts:
              - { name: sre-bridge-webhook, mountPath: /etc/alertmanager/sre-bridge, readOnly: true }
          config:
            # ROUTING (PLAN-hardening item 20). It used to forward ONLY
            # `scenario`-labelled alerts: right for a test bench, wrong for
            # production, where a real fault has no scenario label. First match
            # wins (continue: false), in this order:
            #   1. failure-library scenarios -> bridge, exactly as before;
            #   2. the DENYLIST -> null: alerts that fire by design. Watchdog and
            #      InfoInhibitor (the chart's own), EstatePipelineHeartbeat (the
            #      alert path's liveness signal). Bridged, each would open one
            #      incident and append a note to it every 4 h forever;
            #   3. the ALLOWLIST -> bridge: severity critical or warning from the
            #      estate's own namespaces;
            #   4. everything else -> null (the default receiver): info/none
            #      severity, and kube-system/monitoring, where Talos runs the
            #      control plane outside the chart's assumptions and the default
            #      rules fire on scrape gaps that are not faults of this estate.
            # gates/h20-routing.sh tests this tree with `amtool config routes test`.
            route:
              receiver: 'null'
              group_by: ['alertname', 'namespace']
              # group_wait is short because the P3 gate measures the time from
              # alert to incident; the default 30s just makes every run slower.
              group_wait: 10s
              group_interval: 1m
              # A firing alert is re-notified every 4h. The bridge deduplicates
              # on its correlation ID, so a repeat becomes a work note on the
              # incident that already exists, never a second incident.
              repeat_interval: 4h
              routes:
                - receiver: 'sre-bridge'
                  matchers: ['scenario=~".+"']
                  continue: false
                - receiver: 'null'
                  matchers: ['alertname=~"Watchdog|InfoInhibitor|EstatePipelineHeartbeat"']
                  continue: false
                - receiver: 'sre-bridge'
                  matchers:
                    - 'severity=~"critical|warning"'
                    - 'namespace=~"checkout|sre-system|argocd"'
                  continue: false
            # Setting inhibit_rules replaces the chart's list, so its four
            # defaults are restated first. The last rule is item 20's: while a
            # failure-library scenario alert fires in a namespace, the chart's
            # generic alerts there (KubePodCrashLooping and the like, no
            # `scenario` label) are muted, so one injected fault still opens one
            # incident and not one per symptom.
            inhibit_rules:
              - source_matchers: ['severity="critical"']
                target_matchers: ['severity=~"warning|info"']
                equal: ['namespace', 'alertname']
              - source_matchers: ['severity="warning"']
                target_matchers: ['severity="info"']
                equal: ['namespace', 'alertname']
              - source_matchers: ['alertname="InfoInhibitor"']
                target_matchers: ['severity="info"']
                equal: ['namespace']
              - target_matchers: ['alertname="InfoInhibitor"']
              - source_matchers: ['scenario=~".+"']
                target_matchers: ['scenario=""']
                equal: ['namespace']
            receivers:
              - name: 'null'
              - name: 'sre-bridge'
                webhook_configs:
                  # The bridge holds the ServiceNow credential and nothing else
                  # does. What travels here is the bridge's own inbound bearer
                  # token, read from a file (never inline in this config).
                  # Addressed by the Service's PINNED ClusterIP, not by name:
                  # an alert saying "cluster DNS is down" must not need cluster
                  # DNS to be delivered. See platform/bridge/deployment.yaml.
                  - url: 'http://10.96.0.60:8080/alertmanager'
                    # Alertmanager must retry: the bridge returns non-2xx when
                    # ServiceNow is unreachable, and the dedup lookup makes a
                    # retry safe by construction.
                    send_resolved: true
                    max_alerts: 0
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/sre-bridge/token
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 6h
            scrapeInterval: 15s
            evaluationInterval: 15s
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits:   { cpu: 1, memory: 2Gi }
            # Watch rules/monitors in EVERY namespace, not just the release's —
            # the failure library's PrometheusRules live with their tenants.
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
        grafana:
          enabled: false          # not needed for the gate; the agent reads Prometheus directly
        kubeEtcd:      { enabled: false }
        kubeProxy:     { enabled: false }   # replaced by Cilium
        kubeScheduler: { enabled: true }
        kubeControllerManager: { enabled: true }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Talos enforces PodSecurity `baseline` on every namespace by default, which
    # forbids hostNetwork/hostPID/hostPath/hostPort — exactly what node-exporter
    # needs. Label the namespace ArgoCD creates (L-P1-011).
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
