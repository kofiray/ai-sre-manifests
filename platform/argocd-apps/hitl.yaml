apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hitl
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kofiray/ai-sre-manifests.git
    targetRevision: main
    path: platform/hitl
  destination: { server: https://kubernetes.default.svc, namespace: sre-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
