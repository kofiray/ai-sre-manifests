# The agent workload's Kubernetes identity: system:serviceaccount:sre-system:sre-agent.
#
# It holds NOTHING of its own. Its only grants are the existing read-only ones in
# platform/agent-rbac (ClusterRole sre-agent-readonly, Role sre-agent-metrics-read in
# monitoring), whose bindings now name this subject as well as sre-agent/sre-agent.
# The roles themselves are unchanged. Keeping every binding in agent-rbac keeps "the
# whole of the agent's cluster authority" in one file, as that file promises.
#
# The same subject is the Google identity's WIF principal
# (principal://.../subject/system:serviceaccount:sre-system:sre-agent), the only
# member allowed to impersonate GSA sre-agent-runtime.
#
# `platform/` is the T3 path (SPEC §4): human review, agent draft-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-system
  labels: { app.kubernetes.io/part-of: ai-sre-platform, app: sre-agent }
