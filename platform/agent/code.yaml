    #!/usr/bin/env python3
    """Google Cloud credentials for the agent: one place, two modes (hardening item 1).

    wif          The agent workload (sre-system/sre-agent). GOOGLE_APPLICATION_CREDENTIALS
                 names an `external_account` credential config: google-auth reads the
                 pod's projected ServiceAccount token, exchanges it at STS, and
                 impersonates the agent's own GSA (sre-agent-runtime). It all happens in
                 this process. No gcloud, no key file, no metadata server (the estate
                 blocks 169.254.169.254 for workloads, on purpose).

    workstation  The P8/P9c drivers on the operator's machine, unchanged: the operator's
                 gcloud. That code lives in `gcp_auth_workstation.py`, which is NOT
                 shipped into the agent's ConfigMap, so the workload cannot fall back
                 to it even by accident: the import itself fails there.

    Mode: AGENT_CREDENTIALS=wif|workstation. Unset means `wif` when
    GOOGLE_APPLICATION_CREDENTIALS is an external_account file, else `workstation`.
    AGENT_CREDENTIALS=wif without a valid external-account config is an error, never
    a fallback to anything else.

    Values are never logged. Errors name the secret, never its value.
    """
    import base64
    import json
    import os
    import threading
    import urllib.error
    import urllib.parse
    import urllib.request

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    # userinfo.email only lets the token state whose it is (tokeninfo then returns the GSA's
    # email), which the in-pod selfcheck uses to prove the identity is the agent GSA (h1 live,
    # 15 Nov: with cloud-platform alone, tokeninfo returned no email). gcloud asks for it too.
    SCOPES = ["https://www.googleapis.com/auth/cloud-platform",
              "https://www.googleapis.com/auth/userinfo.email"]
    SM_API = os.environ.get("SECRET_MANAGER_API", "https://secretmanager.googleapis.com/v1")

    _lock = threading.Lock()
    _creds = None


    class CredentialError(RuntimeError):
        pass


    def project():
        p = os.environ.get("GOOGLE_CLOUD_PROJECT", "")
        if not p and os.path.exists(os.path.join(ROOT, ".project")):
            p = open(os.path.join(ROOT, ".project")).read().strip()
        return p


    def _external_account_path():
        """The credential config path when it is an external_account file, else None."""
        p = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", "")
        if not p or not os.path.isfile(p):
            return None
        try:
            return p if json.load(open(p)).get("type") == "external_account" else None
        except (OSError, ValueError):
            return None


    def mode():
        m = os.environ.get("AGENT_CREDENTIALS", "").strip().lower()
        if m in ("wif", "workstation"):
            return m
        if m:
            raise CredentialError(f"AGENT_CREDENTIALS={m!r}: expected 'wif' or 'workstation'")
        return "wif" if _external_account_path() else "workstation"


    def load_external_account(path):
        """google-auth credentials from an external_account config. Refuses any other
        type: a service-account key or a user's ADC file is exactly what this mode
        exists to keep out of the agent."""
        try:
            from google.auth import identity_pool
        except ImportError as e:
            raise CredentialError("google-auth is not importable; the agent image installs it "
                                  "from scripts/agent/requirements.txt") from e
        try:
            doc = json.load(open(path))
        except (OSError, ValueError) as e:
            raise CredentialError(f"cannot read the credential config at {path}: "
                                  f"{type(e).__name__}") from e
        if doc.get("type") != "external_account":
            raise CredentialError(f"{path} is a {doc.get('type')!r} credential, not external_account; "
                                  f"refusing it")
        if "credential_source" not in doc or not doc.get("service_account_impersonation_url"):
            raise CredentialError(f"{path}: an external_account config without a credential_source "
                                  f"and a service-account impersonation URL is not the agent's")
        # from_info, not google.auth.load_credentials_from_file: the latter also looks up
        # the project, i.e. it exchanges a token and calls Resource Manager at LOAD time
        # (found by the h1 offline test). Loading must do no I/O beyond reading the file.
        return identity_pool.Credentials.from_info(doc, scopes=SCOPES)


    def _transport():
        """google-auth's HTTP transport, on the standard library. google-auth's own
        urllib3/requests transports pull in more packages; the token exchange is two
        POSTs (STS, then IAM Credentials), so urllib is enough."""
        import google.auth.exceptions
        import google.auth.transport

        class _Response(google.auth.transport.Response):
            def __init__(self, status, headers, data):
                self._status, self._headers, self._data = status, headers, data

            @property
            def status(self):
                return self._status

            @property
            def headers(self):
                return self._headers

            @property
            def data(self):
                return self._data

        class _Request(google.auth.transport.Request):
            def __call__(self, url, method="GET", body=None, headers=None, timeout=None, **kwargs):
                if isinstance(body, str):
                    body = body.encode("utf-8")
                req = urllib.request.Request(url, data=body, method=method, headers=dict(headers or {}))
                try:
                    with urllib.request.urlopen(req, timeout=timeout or 30) as r:
                        return _Response(r.status, dict(r.headers), r.read())
                except urllib.error.HTTPError as e:
                    return _Response(e.code, dict(e.headers or {}), e.read())
                except (urllib.error.URLError, OSError) as e:
                    raise google.auth.exceptions.TransportError(f"{type(e).__name__}: {e}") from e

        return _Request()


    def _wif_creds(request=None):
        global _creds
        with _lock:
            if _creds is None:
                path = _external_account_path()
                if not path:
                    raise CredentialError(
                        "AGENT_CREDENTIALS=wif but GOOGLE_APPLICATION_CREDENTIALS is not an "
                        "external_account config; there is no other credential to use")
                _creds = load_external_account(path)
            if not _creds.valid:
                _creds.refresh(request or _transport())
            return _creds


    def access_token(request=None):
        """An OAuth access token for cloud-platform scope, as the configured identity."""
        if mode() == "wif":
            return _wif_creds(request).token
        import gcp_auth_workstation  # not shipped into the agent image
        return gcp_auth_workstation.access_token()


    def service_account_email():
        """The GSA the wif credentials impersonate (None in workstation mode)."""
        if mode() != "wif":
            return None
        path = _external_account_path()
        url = json.load(open(path)).get("service_account_impersonation_url", "") if path else ""
        tail = url.rsplit("/serviceAccounts/", 1)[-1]
        return tail.split(":", 1)[0] or None


    def secret(name, project_id=None):
        """The latest version of a Secret Manager secret, as text; None if it cannot be
        read (denied, missing, no credential). Never logs the value."""
        if mode() != "wif":
            import gcp_auth_workstation  # not shipped into the agent image
            return gcp_auth_workstation.secret(name, project_id or project())
        p = project_id or project()
        url = (f"{SM_API}/projects/{urllib.parse.quote(p)}/secrets/"
               f"{urllib.parse.quote(name)}/versions/latest:access")
        try:
            req = urllib.request.Request(url)
            req.add_header("Authorization", f"Bearer {access_token()}")
            with urllib.request.urlopen(req, timeout=30) as r:
                data = json.loads(r.read().decode())
            return base64.b64decode((data.get("payload") or {}).get("data") or "").decode()
        except (urllib.error.URLError, ValueError, CredentialError, OSError):
            return None


    def secret_status(name, project_id=None):
        """(http_status, readable) for a secret, without returning its value. Used by the
        gate's in-pod probe to show a read outside the agent's own secrets is DENIED."""
        p = project_id or project()
        url = (f"{SM_API}/projects/{urllib.parse.quote(p)}/secrets/"
               f"{urllib.parse.quote(name)}/versions/latest:access")
        req = urllib.request.Request(url)
        req.add_header("Authorization", f"Bearer {access_token()}")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                body = r.read()
                ok = bool(json.loads(body.decode()).get("payload", {}).get("data"))
                del body
                return r.status, ok
        except urllib.error.HTTPError as e:
            return e.code, False
