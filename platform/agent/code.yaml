        # scrubbed copy; `bundle` itself is not changed (its shas and ids are the same).
        clean, redactions = scrub_bundle(bundle, scrub_settings(estate))
        prompt = build_prompt(clean)
        injection = injection_scan(clean)    # after the prompt is built, so it cannot change it
        d = call(prompt)
        errs = contract_errors(d)
        if errs:
            # One retry with the broken rule spelled out; then record, never guess.
            d2 = call(prompt + "\n\nYOUR PREVIOUS ANSWER BROKE THESE RULES: " + "; ".join(errs)
                      + ". Answer again, following rule 5.")
            if not contract_errors(d2):
                d, errs = d2, []
            else:
                errs = contract_errors(d2)
                d = d2
        valid = {e["id"] for e in bundle["evidence"]}
        cited = set(d.get("citations", []))
        for r in d.get("ruled_out", []):
            cited |= set(r.get("citations", []))
        imp = d.get("implicated") or {}
        d["_meta"] = {
            # `region` is item 4's record; `location` is kept for older readers.
            "model": model, "region": region, "location": region,
            "endpoint_host": f"{region}-aiplatform.googleapis.com",
            "fingerprint": bundle.get("fingerprint"), "incident": bundle.get("incident"),
            "evidence_items": len(valid),
            "citations_valid": sorted(cited & valid),
            "citations_invalid": sorted(cited - valid),
            "implicated_commit_in_bundle": commit_in_bundle(imp.get("commit"), bundle_shas(bundle)),
            "contract_errors": errs,
            # Recorded, never acted on (injection_scan). The scorer and the note may show it.
            "injection": injection,
            # What scrub_bundle() replaced before the model saw it: counts, kinds, ids only.
            "redactions": redactions,
            "prompt_chars": len(prompt),
            "diagnosed_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        }
        return d


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--bundle", required=True)
        ap.add_argument("--out")
        a = ap.parse_args()
        bundle = json.load(open(a.bundle))

        bad = leaks(bundle)          # refuse before anything else, even without a project
        if bad:
            raise SystemExit("diagnose: REFUSING — the bundle leaks ground truth or the "
                             f"author's explanation ({'; '.join(bad[:5])}). A diagnosis made "
                             "from it would prove nothing.")
        objs = secret_objects(bundle)
        if objs:
            raise SystemExit("diagnose: REFUSING — the bundle holds Kubernetes Secret object(s) at "
                             f"{', '.join(objs[:5])} (hardening item 24).")
