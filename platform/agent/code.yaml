    #!/usr/bin/env python3
    """Trigger: poll ServiceNow, claim an incident, investigate it, commit (SPEC §7 P4).

    The gate requirement is "trigger kill mid-cycle loses nothing", and the whole
    design follows from taking that literally.

    CLAIM / COMMIT, and why they are two separate writes:
      claim   an object written to GCS under a generation precondition. Creating it
              uses `ifGenerationMatch=0` (create-if-absent); taking over an EXPIRED
              claim uses `ifGenerationMatch=<the generation we read>`. Either way
              exactly one worker can win it, so two triggers running at once cannot
              both investigate the same incident (hardening item 7).
      commit  the SAME object overwritten with state=committed once the work is
              finished and its result is durable, again matched on the generation
              this worker last wrote. A worker that was taken over cannot commit.

    Work is therefore only ever recorded as done AFTER it is done. A trigger killed
    between the two writes leaves a claim with no commit, and the next cycle treats
    that as UNFINISHED and redoes it. The failure mode is repeating work, never
    dropping it — which is the correct way round, because the repeat is made
    harmless separately: before posting, the incident is checked for a COMPLETE
    diagnosis already carrying this fingerprint, so a redo converges instead of
    duplicating.

    A claim also carries a LEASE. Without one, a worker that dies holding a claim
    would block that incident forever, and "exactly once" would quietly become
    "at most once" — the failure this design exists to prevent. Every renewal is
    generation-matched too: a 412 means another worker took the incident over, and
    this one stops (it kills its investigation, posts nothing, commits nothing).

    ONE CLAIM PER OCCURRENCE. The claim object is keyed by (sys_id, reopen_count):
    `trigger/<sys_id>.json` for the first occurrence (the name it always had) and
    `trigger/<sys_id>-r<n>.json` once the bridge has reopened a resolved incident n
    times. A recurrence is therefore claimed and investigated afresh, and its note says
    which occurrence it is and links the previous one's diagnosis.

    READ-BACK (hardening item 8). ServiceNow answers 200 to writes it did not store
    (L-P2-012: a field the role may not write is dropped silently). So every write
    the trigger makes is read back, and one that is missing or cut short raises
    `WriteNotStored`, is logged as a security/integrity event, and the incident is
    left uncommitted so the next cycle retries it.
    """
    import argparse
    import html
    import json
    import os
    import socket
    import subprocess
    import sys
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    sys.path.insert(0, os.path.join(ROOT, "scripts", "agent"))
    import gcp_auth  # noqa: E402  (WIF in the agent's pod; the operator's gcloud on the workstation)
    import cid as _cid  # noqa: E402  (the bridge's cid1 rules, imported)
    import snow_client  # noqa: E402  (ServiceNow over OAuth bearer tokens only, item 3)

    PROJECT = os.environ.get("GOOGLE_CLOUD_PROJECT") or (
        open(os.path.join(ROOT, ".project")).read().strip()
        if os.path.exists(os.path.join(ROOT, ".project")) else "")
    BUCKET = os.environ.get("TRIGGER_BUCKET", f"ai-sre-live-agent-state-{PROJECT}")
    PREFIX = os.environ.get("TRIGGER_PREFIX", "trigger")
    # The lease is SHORT and RENEWED, not long and hoped-over. A claim's only job is
    # to stop two live workers investigating the same incident; it must not outlive
    # the worker holding it. With a single long lease, a trigger killed mid-cycle
    # left its incident locked for the whole lease — nothing was lost, but recovery
    # waited fifteen minutes for a worker that was never coming back, which turns
    # "exactly once" into "eventually, much later". A live worker renews while it
    # works, so a dead one's claim expires in seconds and the next cycle takes it
    # over (L-P4-002).
    LEASE_SECONDS = int(os.environ.get("TRIGGER_LEASE", "90"))
    RENEW_EVERY = max(5, LEASE_SECONDS // 3)
    WORKER = f"{socket.gethostname()}/{os.getpid()}"
    MARKER = "sre-agent diagnosis"
    # The JSON API base. Overridable only so the offline gate can point the real code
    # at a local fake with the same generation semantics (gates/h7-lease.sh).
    GCS_API = os.environ.get("TRIGGER_GCS_API", "https://storage.googleapis.com").rstrip("/")
    READBACK_TRIES = int(os.environ.get("TRIGGER_READBACK_TRIES", "3"))
    READBACK_PAUSE = float(os.environ.get("TRIGGER_READBACK_PAUSE", "2"))


    def marker(fp, reopen_count=0):
        """The note's first line. Occurrence 1 (reopen_count 0) keeps the line every
        diagnosis has always had, so notes written before recurrences were told apart
        still match; a later occurrence names itself, so its note is never mistaken for
        the first one's, or the other way round."""
        n = reopen_count_of({"reopen_count": reopen_count})
        return (f"{MARKER} (fingerprint {fp})" if n == 0
                else f"{MARKER} (fingerprint {fp}, occurrence {n + 1})")


    def end_marker(fp, reopen_count=0):
        """The note's last line. A note that has the first line but not this one was cut
        short somewhere, and does not count as a diagnosis on a redo."""
        return f"end of {marker(fp, reopen_count)}"


    def log(msg, security=False, **kw):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "msg": msg, "worker": WORKER}
        if security:
            rec["security"] = True
        rec.update(kw)
        print(json.dumps(rec), flush=True)


    # ------------------------------------------------------------- recurrence ---
    # A RECURRENCE IS A NEW OCCURRENCE (h1 live, 15 Nov). When a resolved incident's fault
    # fires again, the bridge reopens the same record and ServiceNow increments its
    # `reopen_count` (INC0010122 had reopen_count 3). The checkpoints used to be keyed by
    # sys_id alone, so the first occurrence's `committed` checkpoint made every later one
    # "already-committed": the agent reused the old diagnosis instead of investigating.
    # Both checkpoints (trigger/ here, runner/ in scripts/agent/runner.py) are now keyed
    # by (sys_id, reopen_count). Occurrence 1 keeps the old object name, so an incident in
    # flight when this shipped is neither redone nor lost; occurrence n+1 is
    # `<sys_id>-r<n>`.
    def reopen_count_of(inc):
        """`reopen_count` as an int. Missing or empty is 0 (never reopened, or a row from
        a query that did not ask for the field). Anything else that is not a whole number
        is logged and read as 0."""
        v = (inc or {}).get("reopen_count")
        if v is None or str(v).strip() == "":
            return 0
        try:
            n = int(str(v).strip().replace(",", ""))
        except ValueError:
            log("reopen_count is not a whole number; reading it as 0", value=str(v)[:40],
                incident=(inc or {}).get("number"))
            return 0
        return max(0, n)


    def state_key(sys_id, reopen_count=0):
        """The checkpoint object's name (no prefix, no .json) for one occurrence."""
        n = reopen_count_of({"reopen_count": reopen_count})
        return sys_id if n == 0 else f"{sys_id}-r{n}"


    def sm(name):
        """A secret value, in-process. "" if unreadable. Never logged."""
        try:
            return (gcp_auth.secret(name, PROJECT) or "").strip()
        except Exception:
            return ""


    def gtoken():
        try:
            return gcp_auth.access_token()
        except Exception as e:
            raise SystemExit(f"trigger: no GCP access token ({type(e).__name__})")


    # --------------------------------------------------------------------- GCS ---
    def _obj_name(sys_id, prefix=None):
        return f"{prefix or PREFIX}/{sys_id}.json"


    def _obj_url(sys_id, prefix=None, media=False, generation=None):
        name = urllib.parse.quote(_obj_name(sys_id, prefix), safe="")
        url = f"{GCS_API}/storage/v1/b/{BUCKET}/o/{name}"
        q = (["alt=media"] if media else ["fields=generation"]) + (
            [f"generation={generation}"] if generation is not None else [])
        return url + "?" + "&".join(q)


    def _gcs_get(url):
        req = urllib.request.Request(url)
        req.add_header("Authorization", f"Bearer {gtoken()}")
        with urllib.request.urlopen(req, timeout=30) as r:
            return r.read().decode(), r.headers.get("x-goog-generation")


    def gcs_get(sys_id, prefix=None):
        """(payload, generation) for the object, or (None, None) when it does not exist.

        The generation is what makes a takeover safe: it is passed back as
        `ifGenerationMatch`, so the write only lands if nobody wrote in between.
        The media download carries it in `x-goog-generation`; if it ever does not,
        the generation is read from metadata first and the content fetched AT that
        generation, so the pair is still consistent."""
        try:
            raw, gen = _gcs_get(_obj_url(sys_id, prefix, media=True))
            if not gen:
                meta, _ = _gcs_get(_obj_url(sys_id, prefix))
                gen = json.loads(meta)["generation"]
                raw, _ = _gcs_get(_obj_url(sys_id, prefix, media=True, generation=gen))
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return None, None
            raise
        return json.loads(raw), int(gen)


    def gcs_read(sys_id, prefix=None):
        return gcs_get(sys_id, prefix)[0]


    def gcs_put(sys_id, payload, if_generation_match=None, prefix=None):
        """Write the object. Returns its new generation, or None when the precondition
        rejected the write (412: someone else wrote first)."""
        name = urllib.parse.quote(_obj_name(sys_id, prefix), safe="")
        url = (f"{GCS_API}/upload/storage/v1/b/{BUCKET}/o"
               f"?uploadType=media&name={name}")
        if if_generation_match is not None:
            url += f"&ifGenerationMatch={int(if_generation_match)}"
        req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST")
        req.add_header("Authorization", f"Bearer {gtoken()}")
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                meta = json.loads(r.read().decode() or "{}")
        except urllib.error.HTTPError as e:
            if e.code == 412:      # precondition failed: someone else got there first
                return None
            raise
        return int(meta["generation"])


    def gcs_write(sys_id, payload, if_generation_match=None, prefix=None):
        """Returns True on success, False when a precondition rejected the write."""
        return gcs_put(sys_id, payload, if_generation_match, prefix) is not None


    class LeaseLost(RuntimeError):
        """Another worker took this incident over; this one must stop touching it."""


    class Lease:
        """This worker's hold on one incident's claim object.

        Every write it makes (renewal, commit) is matched on the generation it last
        wrote. Nothing else can make those writes safe: a re-read followed by a plain
        write leaves a window in which another worker takes over and is then
        overwritten. A 412 sets `lost`, and from then on this worker does nothing
        more for the incident."""

        def __init__(self, sys_id, claim, generation, prefix=None):
            self.sys_id, self.claim, self.gen, self.prefix = sys_id, dict(claim), generation, prefix
            self.lost = threading.Event()
            self._lock = threading.Lock()

        def _put(self, body, what):
            with self._lock:
                if self.lost.is_set():
                    return False
                g = gcs_put(self.sys_id, body, if_generation_match=self.gen, prefix=self.prefix)
                if g is None:
                    self.lost.set()
                    log(f"lease lost: the {what} was refused (412) — another worker took this "
                        "incident over; stopping work on it", incident=self.claim.get("incident"),
                        generation=self.gen)
                    return False
                self.gen, self.claim = g, dict(body)
                return True

        def renew(self):
            now = time.time()
            return self._put(dict(self.claim, expires_at=now + LEASE_SECONDS, renewed_at=now),
                             "renewal")

        def commit(self, body):
            return self._put(body, "commit")

        def keep_alive(self, stop, every=None):
            """Renew until `stop` is set or the lease is lost. A daemon thread running
            this dies with the process, so a killed worker's claim lapses on its own.
            A renewal that ERRORS (network, 5xx) is retried on the next tick; only a
            412 means the claim is gone."""
            while not stop.wait(every or RENEW_EVERY):
                try:
                    if not self.renew():
                        return
                except Exception as e:
                    log("lease renewal failed; retrying", incident=self.claim.get("incident"),
                        error=f"{type(e).__name__}: {e}"[:200])


    # -------------------------------------------------------------- ServiceNow ---
    class Snow:
        """The trigger's ServiceNow calls. Auth is snow_client's: an OAuth bearer token,
        cached, refreshed once on a 401; no Basic code path (hardening item 3). Missing
        OAuth settings stop the trigger with a clear error instead of starting."""

        def __init__(self):
            try:
                self.client = snow_client.from_secrets(sm)
            except snow_client.SnowConfigError as e:
                raise SystemExit(f"trigger: ServiceNow refused: {e}")
            self.base = self.client.base

        def call(self, method, path, body=None):
            return self.client.call(method, path, body)

        def open_incidents(self, page=100, max_pages=20):
            """Every open incident carrying a correlation id — paged, not truncated.

            "Open" excludes Resolved (6), Closed (7) and Canceled (8). ServiceNow keeps a
            RESOLVED incident `active=true` until it is closed, so `active=true` alone made
            the in-cluster agent re-investigate every resolved incident (h1 live, 15 Nov).
            A recurrence is still seen: the bridge reopens a resolved incident to In Progress.

            Only incidents the bridge raised from an alert (`cid1-` correlation ids) are work:
            an incident made by hand or by a gate probe has no alert behind it, and on 15 Nov a
            leftover h3 probe incident was picked up and "fixed" the live F01 fault through the
            wrong incident, which then misled the real incident's evidence.

            This was one request with `sysparm_limit=25`. ServiceNow returns the
            first 25 rows and no indication that it dropped any, so on an instance
            holding more open incidents than that the trigger simply could not see
            the rest — and the E2E driver filters this list DOWN to one incident
            number AFTER the truncation has already happened, so an incident the
            bridge deduplicated onto an older record would vanish here and the
            scenario would fail at `investigate` with nothing to explain it.

            The cap on how much WORK one cycle does is a separate, deliberate thing
            and still applies (`--max-per-cycle`): skipped incidents keep no
            checkpoint and the next cycle picks them up. Seeing less than exists is
            not that; it is a blind spot, so the query pages until it reaches a short
            page and says so if it ever hits the cap.
            """
            out = []
            for p in range(max_pages):
                batch = (self.call("GET", "/api/now/table/incident?sysparm_query="
                                   "correlation_idSTARTSWITHcid1-^active=true^stateNOT%20IN6,7,8^ORDERBYDESCsys_created_on"
                                   "&sysparm_fields=number,sys_id,short_description,"
                                   "correlation_id,sys_created_on,close_code,reopen_count"
                                   f"&sysparm_limit={page}&sysparm_offset={p * page}")
                         .get("result") or [])
                out.extend(batch)
                if len(batch) < page:
                    return self._canonical(out)
            log("servicenow incident poll hit the page cap — this list may be incomplete",
                pages=max_pages, rows=len(out))
            return self._canonical(out)

        @staticmethod
        def _canonical(rows):
            """Hardening item 5: skip incidents the bridge closed as a Duplicate, and any
            incident with an OLDER active one carrying the same correlation ID (a
            duplicate whose close has not finished). One fault, one investigation."""
            keep = _cid.canonical(rows)
            skipped = [r.get("number") for r in rows if r not in keep]
            if skipped:
                log("skipping duplicate incidents (same correlation id as an older active one, "
                    "or closed as Duplicate)", skipped=skipped[:20])
            return keep

        # Notes go to `work_notes`, the internal journal, not `comments`, which the
        # incident's caller can read (hardening item 3). L-P2-012 is why it used to be
        # `comments`: the old role could not write work_notes and ServiceNow dropped
        # them with a 200. That is exactly the failure the read-back below catches.
        NOTE_FIELD = "work_notes"
        # Look-ups read BOTH journals: diagnoses posted before the switch are in
        # `comments` and must still be found, or a redo would post a second one.
        JOURNALS = ("work_notes", "comments")

        def journals(self, sys_id):
            """{work_notes, comments} as display values. Read through the incident
            itself: the least-privilege role can read its journals this way, but not
            through sys_journal_field."""
            r = self.call("GET", f"/api/now/table/incident/{sys_id}?sysparm_display_value=true"
                                 f"&sysparm_fields={','.join(self.JOURNALS)}")
            res = r.get("result") or {}
            return {f: str(res.get(f) or "") for f in self.JOURNALS}

        def comments(self, sys_id):
            """Both journals as one text."""
            j = self.journals(sys_id)
            return j["comments"] + "\n" + j["work_notes"]

        def prior_diagnosis(self, sys_id, fp, reopen_count=0):
            """Where a COMPLETE diagnosis for this fingerprint AND occurrence already is,
            or None.

            In work_notes a note only counts with its end line: one that was cut short
            is not an answer, and a redo must post the whole thing. In comments (only
            ever written before item 3) the first line is accepted, as before.

            Markers are matched as whole lines, not substrings: a later occurrence's note
            quotes the previous occurrence's marker to link to it, and that quote must
            not count as the previous diagnosis."""
            j = self.journals(sys_id)
            start, end = marker(fp, reopen_count), end_marker(fp, reopen_count)
            wn = _lines(j["work_notes"])
            if start in wn and end in wn:
                return "work_notes"
            if start in _lines(j["comments"]):
                return "comments"
            if start in wn:
                log("a diagnosis for this fingerprint is on the incident but INCOMPLETE (no end "
                    "line); it does not count, posting a complete one", security=True,
                    integrity="servicenow-note-truncated", sys_id=sys_id, fingerprint=fp,
                    occurrence=reopen_count_of({"reopen_count": reopen_count}) + 1)
            return None

        def _not_stored(self, sys_id, fields):
            """The fields of `fields` that are NOT stored as written: {field: why}."""
            missing = {}
            jf = [k for k in fields if k in self.JOURNALS]
            pf = [k for k in fields if k not in self.JOURNALS]
            if jf:
                got = self.journals(sys_id)
                for k in jf:
                    want, have = _norm(fields[k]), _norm(got.get(k, ""))
                    if want and want not in have:
                        lines = str(fields[k]).strip().splitlines()
                        head = _norm(lines[0]) if lines else ""
                        missing[k] = "truncated" if head and head in have else "absent"
            if pf:
                r = self.call("GET", f"/api/now/table/incident/{sys_id}?sysparm_fields={','.join(pf)}")
                res = r.get("result") or {}
                for k in pf:
                    if str(res.get(k, "")) != str(fields[k]):
                        missing[k] = "not set"
            return missing

        def write(self, sys_id, fields, what="write"):
            """PATCH the incident, then read every field back. Returns only when all of
            them are stored; otherwise raises WriteNotStored, logged as a security /
            integrity event. ServiceNow's 200 is not evidence that anything was kept.
            Journal fields must contain the whole text; other fields (state, ...) must
            equal the value written, read as stored (not as display values)."""
            self.call("PATCH", f"/api/now/table/incident/{sys_id}", fields)
            missing = {}
            for i in range(max(1, READBACK_TRIES)):
                missing = self._not_stored(sys_id, fields)
                if not missing:
                    return
                if i + 1 < READBACK_TRIES:
                    time.sleep(READBACK_PAUSE)
            log(f"ServiceNow accepted the {what} but it is NOT stored on read-back", security=True,
                integrity="servicenow-write-not-stored", sys_id=sys_id, what=what, fields=missing)
            raise WriteNotStored(f"{what}: ServiceNow answered 2xx but read-back shows "
                                 + ", ".join(f"{k} {v}" for k, v in sorted(missing.items())))

        def note(self, sys_id, text, what="note"):
            """A note in work_notes, read back in full."""
            self.write(sys_id, {self.NOTE_FIELD: text}, what)

        def comment(self, sys_id, text):
            """The runner's notes (scripts/agent/runner.py). Same path: work_notes, read back."""
            self.note(sys_id, text, "runner note")


    class WriteNotStored(RuntimeError):
        """ServiceNow answered 2xx to a write, and reading it back shows it was not
        stored (absent, or cut short). Treated as a failure, never as done."""


    def _norm(s):
        """Compare journal text on content, not layout: the display value adds a header
        to each entry and may escape or re-wrap whitespace."""
        return " ".join(html.unescape(str(s)).split())


    def _lines(text):
        """A journal's lines, unescaped and stripped, as a set (for marker look-ups)."""
        return {ln.strip() for ln in html.unescape(str(text or "")).splitlines()}


    # ---------------------------------------------------------------- the work ---
    def investigation_steps(fp, bundle, diag):
        """The two read-only steps, as (name, python script, args). Only Python scripts:
        the spawn below builds `[sys.executable, script] + args` itself. A module
        attribute so the offline gate can swap in a slow stand-in and watch a lost
        lease kill it."""
        return [("evidence collection", os.path.join(ROOT, "scripts/agent/evidence.py"),
                 ["--correlation-id", fp, "--out", bundle]),
                ("diagnosis", os.path.join(ROOT, "scripts/agent/diagnose.py"),
                 ["--bundle", bundle, "--out", diag])]


    def _run_step(name, script, args, env, lost=None):
        """Run one step; kill it at once if the lease is lost while it runs."""
        p = subprocess.Popen([sys.executable, script] + list(args), stdout=subprocess.PIPE,
                             stderr=subprocess.PIPE, text=True, env=env)
        while True:
            try:
                _, err = p.communicate(timeout=0.5)
                break
            except subprocess.TimeoutExpired:
                if lost is not None and lost.is_set():
                    p.kill()
                    p.communicate()
                    raise LeaseLost(f"{name} stopped: another worker took this incident over")
        if p.returncode != 0:
            raise RuntimeError(f"{name} failed: {(err or '').strip()[:300]}")


    def investigate(inc, snow, workdir, lost=None):
        """Read-only investigation. Returns (diagnosis dict, bundle path, diagnosis path).
        `lost` is the lease's lost event: when it is set the running step is killed and
        LeaseLost raised, so a worker that was taken over stops working."""
        fp = inc["correlation_id"]
        os.makedirs(workdir, exist_ok=True)
        bundle = os.path.join(workdir, f"evidence-{fp}.json")
        diag = os.path.join(workdir, f"diagnosis-{fp}.json")
        env = dict(os.environ, GOOGLE_CLOUD_PROJECT=PROJECT)
        for name, script, args in investigation_steps(fp, bundle, diag):
            _run_step(name, script, args, env, lost)
        return json.load(open(diag)), bundle, diag


    def _recurrence_lines(fp, reopen_count, prev):
        """For occurrence n+1 (n >= 1): say so, and link the previous occurrence's
        diagnosis by its marker line (quoted, so a reader can search for it). `prev` is
        the previous occurrence's trigger checkpoint, or None if it is not there."""
        n = reopen_count_of({"reopen_count": reopen_count})
        if n == 0:
            return ""
        p = prev or {}
        if p.get("state") == "committed":
            when = (time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(p["committed_at"]))
                    if isinstance(p.get("committed_at"), (int, float)) else "time unknown")
            about = f"class {p.get('failure_class') or '?'}, committed {when}"
        elif p:
            about = f"its checkpoint is {p.get('state') or 'unknown'}, not committed"
        else:
            about = "no checkpoint found for it"
        return (f"OCCURRENCE {n + 1}: this incident was resolved and the same fault came back "
                f"(ServiceNow reopen_count {n}). This is a NEW investigation of the recurrence; "
                f"it does not reuse the earlier diagnosis.\n"
                f"PREVIOUS DIAGNOSIS: occurrence {n}, the note headed "
                f"\"{marker(fp, n - 1)}\" ({about}).\n\n")


    def _injection_line(d):
        """Item 11: say so in the note when the evidence held instruction-like text (flag only;
        the plan is code-built and unchanged). Empty when nothing was found."""
        inj = (d.get("_meta") or {}).get("injection") or {}
        if not inj.get("count"):
            return ""
        ids = ", ".join(inj.get("evidence_ids") or []) or "?"
        kinds = ", ".join(inj.get("kinds") or []) or "?"
        return (f"INSTRUCTION-LIKE TEXT IN EVIDENCE ({ids}: {kinds}): treated as data, not "
                f"followed\n")


    def _redaction_line(d):
        """Say how many values were redacted before the model saw the evidence (counts and kinds
        only, never a value). Empty when nothing was redacted."""
        red = (d.get("_meta") or {}).get("redactions") or {}
        if not red.get("count"):
            return ""
        return f"redacted before the model saw it: {red['count']} ({', '.join(red.get('kinds') or [])})\n"


    def render(d, fp, reopen_count=0, prev=None):
        ruled = "\n".join(
            f"  - not {r['alternative']}: {r['why_not']} [{', '.join(r['citations'])}]"
            for r in d.get("ruled_out", []))
        # P9c: what happens next, on its own line so a human (and the scorer) can find it.
        disp = d.get("disposition")
        if disp == "revert":
            imp = d.get("implicated") or {}
            nxt = (f"DISPOSITION: revert\nimplicated commit: {imp.get('commit') or '(none named)'}"
                   f" ({', '.join(imp.get('paths') or []) or 'no paths'})\n\n")
        elif disp == "escalate":
            nxt = (f"DISPOSITION: escalate\nescalate to: {d.get('escalate_to') or '(not named)'}\n"
                   f"a human must: {d.get('imperative_action') or '(not stated)'}\n\n")
        elif disp:
            nxt = f"DISPOSITION: {disp}\n\n"
        else:
            nxt = ""
        return (
            f"{marker(fp, reopen_count)}\n\n"
            f"{_recurrence_lines(fp, reopen_count, prev)}"
            f"{nxt}"
            f"ROOT CAUSE: {d['root_cause']}\n"
            f"class={d['failure_class']}  blast_radius={d['blast_radius']}  "
            f"confidence={d['confidence']}\n"
            f"a restart would fix this: {'yes' if d['restart_would_fix'] else 'no'}\n\n"
            f"REASONING: {d['reasoning']}\n\n"
            f"RULED OUT:\n{ruled or '  (none stated)'}\n\n"
            f"RECOMMENDED ACTION ({d['tier']}, path {d['path']}): {d['recommended_action']}\n\n"
            f"{_injection_line(d)}"
            f"{_redaction_line(d)}"
            f"evidence cited: {', '.join(d['_meta']['citations_valid'])}\n"
            f"model: {d['_meta']['model']}\n"
            f"{end_marker(fp, reopen_count)}"
        )


    def process(inc, snow, workdir, dry_run=False):
        """One incident: claim -> investigate -> post (read back) -> commit.

        Returns committed | already-committed | held | raced | lost-lease. Raises when
        a step fails, incl. a ServiceNow write that did not store (WriteNotStored);
        the claim is then left uncommitted and the next cycle retries it.

        The claim object is per OCCURRENCE: `state_key(sys_id, reopen_count)`. A
        reopened incident is a new key, so it is claimed and investigated afresh, with
        exactly the same generation rules as the first occurrence."""
        sys_id, num, fp = inc["sys_id"], inc["number"], inc["correlation_id"]
        n = reopen_count_of(inc)
        key = state_key(sys_id, n)
        now = time.time()
        state, gen = gcs_get(key)

        if state and state.get("state") == "committed":
            return "already-committed"
        if state and state.get("state") == "claimed":
            # `expires_at` is the authority. A claim from an older build without one
            # falls back to claimed_at + lease so this stays backward compatible.
            expires = state.get("expires_at", state.get("claimed_at", 0) + LEASE_SECONDS)
            if now < expires and state.get("worker") != WORKER:
                log("claim held by a live worker, skipping", incident=num,
                    holder=state.get("worker"), expires_in=int(expires - now))
                return "held"
            log("taking over a lapsed claim — its holder stopped renewing and never "
                "committed, so its work did not happen", incident=num,
                previous_holder=state.get("worker"), attempt=state.get("attempt", 0))

        # The previous occurrence's checkpoint, read BEFORE the claim (a plain read, no
        # write): the new note links to that diagnosis. Read-only, so it cannot affect
        # who wins the claim below.
        prev = gcs_read(state_key(sys_id, n - 1)) if n > 0 else None

        claim = {"state": "claimed", "incident": num, "sys_id": sys_id,
                 "correlation_id": fp, "reopen_count": n, "worker": WORKER, "claimed_at": now,
                 "expires_at": now + LEASE_SECONDS,
                 "attempt": (state or {}).get("attempt", 0) + 1}
        # Always a precondition: 0 creates only if absent; the generation we READ
        # takes over only if nobody wrote since. Two workers that both saw the same
        # expired claim cannot both win, because the first write changes it.
        g = gcs_put(key, claim, if_generation_match=(0 if state is None else gen))
        if g is None:
            log("lost the race to claim", incident=num, occurrence=n + 1)
            return "raced"
        lease = Lease(key, claim, g)
        log("claimed", incident=num, fingerprint=fp, occurrence=n + 1, attempt=claim["attempt"],
            generation=g)

        # Hold the claim alive for exactly as long as this process is alive to do the
        # work. A daemon thread dies with the process, so a kill stops renewal at
        # once and the claim lapses on its own.
        stop_renew = threading.Event()
        renewer = threading.Thread(target=lease.keep_alive, args=(stop_renew,), daemon=True)
        renewer.start()
        try:
            d, bundle, diag = investigate(inc, snow, workdir, lease.lost)
        except LeaseLost as e:
            log("stopped work on the incident: the lease was taken over", incident=num, why=str(e))
            return "lost-lease"
        finally:
            stop_renew.set()
            renewer.join(timeout=60)

        # Proof that this worker STILL holds the claim before anything is posted: a
        # generation-matched write. A worker that was taken over while it worked
        # posts nothing (its successor will).
        if not lease.renew():
            log("not posting: the lease was taken over while investigating", incident=num)
            return "lost-lease"

        # A redo after a kill must converge, not duplicate: only post if this
        # fingerprint has not already been answered, completely, on this incident.
        posted = False
        where = snow.prior_diagnosis(sys_id, fp, n)
        if where:
            log("a diagnosis for this fingerprint and occurrence is already on the incident "
                "— not posting a second one", incident=num, journal=where, occurrence=n + 1)
        elif not dry_run:
            # Raises WriteNotStored when the note did not land in full: no commit.
            snow.note(sys_id, render(d, fp, n, prev), "diagnosis note")
            posted = True
            log("diagnosis posted (read back)", incident=num, failure_class=d["failure_class"],
                occurrence=n + 1)

        if not lease.commit({"state": "committed", "incident": num, "sys_id": sys_id,
                             "correlation_id": fp, "reopen_count": n, "worker": WORKER,
                             "claimed_at": claim["claimed_at"], "committed_at": time.time(),
                             "attempt": claim["attempt"], "posted": posted,
                             "failure_class": d["failure_class"],
                             "restart_would_fix": d["restart_would_fix"],
                             "citations": d["_meta"]["citations_valid"],
                             "evidence_bundle": bundle, "diagnosis": diag}):
            # Only reachable if the lease lapsed between the renewal above and here.
            # The note (if any) is complete, so the successor's redo finds it.
            log("not committed: the lease was taken over after posting", incident=num,
                posted=posted)
            return "lost-lease"
        log("committed", incident=num, failure_class=d["failure_class"], posted=posted)
        return "committed"


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--once", action="store_true", help="one poll cycle, then exit")
        ap.add_argument("--interval", type=int, default=30)
        ap.add_argument("--workdir", default=os.environ.get(
            "AGENT_WORKDIR", os.path.join(os.environ.get("AGENT_STATE_DIR", os.path.join(ROOT, ".work")),
                                          "agent")))
        ap.add_argument("--dry-run", action="store_true")
        ap.add_argument("--incident", help="process only this incident number")
        # A cost ceiling, not a correctness knob. Each investigation is a model call,
        # and a cycle that finds twenty uncommitted incidents should work through
        # them over several cycles rather than in one unbounded burst. Skipped ones
        # keep no checkpoint, so the next cycle picks them up — nothing is lost.
        ap.add_argument("--max-per-cycle", type=int, default=4)
        a = ap.parse_args()

        snow = Snow()
        log("trigger starting", bucket=BUCKET, prefix=PREFIX, lease=LEASE_SECONDS)
        while True:
            try:
                incidents = snow.open_incidents()
                if a.incident:
                    incidents = [i for i in incidents if i["number"] == a.incident]
                done = 0
                for inc in incidents:
                    if done >= a.max_per_cycle:
                        log("cycle cap reached — the rest carry no checkpoint and "
                            "will be picked up next cycle",
                            remaining=len(incidents) - incidents.index(inc))
                        break
                    try:
                        r = process(inc, snow, a.workdir, a.dry_run)
                        if r not in ("already-committed", "held"):
                            done += 1
                            log("cycle result", incident=inc["number"], result=r)
                    except Exception as e:
                        # The claim stays uncommitted, so the next cycle retries it.
                        log("processing failed — leaving the claim uncommitted so it "
                            "is retried", incident=inc["number"],
                            error=f"{type(e).__name__}: {e}")
            except Exception as e:
                log("poll failed", error=f"{type(e).__name__}: {e}")
            if a.once:
                return 0
            time.sleep(a.interval)


    if __name__ == "__main__":
        raise SystemExit(main())
