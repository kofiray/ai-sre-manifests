    sys.path.insert(0, os.path.join(ROOT, "scripts"))
    import gh_app as _gh           # noqa: E402  (the App, in-process; there is no `gh` CLI on this path)

    OWNER = os.environ.get("MANIFESTS_OWNER", "kofiray")
    REPO = os.environ.get("MANIFESTS_REPO_NAME", "ai-sre-manifests")
    # Writable state. In the agent's pod the code is a read-only ConfigMap, so
    # AGENT_STATE_DIR points these at an emptyDir; on the workstation they stay in .work.
    STATE_DIR = os.environ.get("AGENT_STATE_DIR", os.path.join(ROOT, ".work"))
    WORK = os.path.join(STATE_DIR, "remediate-manifests")
    # Where propose writes the per-path content and the PR body before handing them
    # to gh_app. A module variable so the offline test can point it at a temp dir.
    SCRATCH = STATE_DIR
    GH_APP = [sys.executable, os.path.join(ROOT, "scripts", "gh_app.py")]
    PROJECT = os.environ.get("GOOGLE_CLOUD_PROJECT") or (
        open(os.path.join(ROOT, ".project")).read().strip()
        if os.path.exists(os.path.join(ROOT, ".project")) else "")
    AGENT_LOGIN = os.environ.get("SRE_AGENT_LOGIN", path_policy.AGENT)

    # failure_class -> (file to fix, how, which ArgoCD apps deliver it, draft?)
    PLANS = {
        "wedged-process":       ("apps/checkout/runtime/deployment.yaml", "restart",
                                 ["checkout-runtime"], False),
        "memory-limit-too-low": ("apps/checkout/runtime/deployment.yaml", "revert",
                                 ["checkout-runtime"], False),
        "probe-misconfiguration": ("apps/checkout/runtime/deployment.yaml", "revert",
                                   ["checkout-runtime"], False),
        "bad-release":          ("apps/checkout/runtime/deployment.yaml", "revert",
                                 ["checkout-runtime"], False),
        "mesh-misrouting":      ("apps/checkout/config/mesh.yaml", "revert",
                                 ["checkout-config"], False),
        # T3. The agent may propose a correction and must not merge it.
        "cluster-dns-failure":  ("platform/coredns/corefile.yaml", "revert",
                                 ["coredns"], True),
    }

    # P9c answer-key redaction (docs/p9c-plan.md, non-negotiable 1). The widened
    # SCENARIO_TAG, kept IDENTICAL to the plan's list; defined here until the
    # evidence module's copy lands, and applied on top of `_evidence.redact`.
    # Order matters: "P9b scenario K03" must go before the bare `p9b` form, or the
    # ID would be left behind on its own.
    SCENARIO_TAG = re.compile(
        r"P9b scenario [A-Z]\d\d\s*|"
        r"\[[A-Z]\d\d\]\s*|\([A-Z]\d\d\)\s*|\b(?:break|heal)-[A-Z]?\d\d:?\s*|chaos/\S+\s*|"
        r"\bp9[abc]\b\s*|"
        # the existing F-forms
        r"\[F\d\d\]\s*|\(F\d\d\)\s*|\bchaos/(?:break|heal)-\d\d\b|\bChaos injection F\d\d\.?\s*",
        re.IGNORECASE)
    # A bare scenario-ID token (K03, F02, M11). Drawn from the library's own file
    # names, not from "any capital and two digits": the bundle's evidence ids are
    # E01, E02, ... and must survive in "evidence cited". Case-sensitive on purpose:
    # with IGNORECASE it would also eat "v11" in "pin Grafana to v11.4.0".
    def _scenario_letters():
        try:
            ls = {f[0] for f in os.listdir(os.path.join(ROOT, "scenarios"))
                  if re.match(r"^[A-Z]\d\d\.yaml$", f)}
        except OSError:
            ls = set()
        return "".join(sorted(((ls or set("CDIKLMNRSW")) | {"F"}) - {"E"}))


    SCENARIO_ID = re.compile(rf"\b[{_scenario_letters()}]\d\d\b")


    def scrub(text):
        """Strip every answer-key marker from a string, until nothing changes."""
        if not isinstance(text, str):
            return text
        s = _evidence.redact(text)
        for _ in range(5):
            s2 = SCENARIO_ID.sub("", SCENARIO_TAG.sub("", s))
            if s2 == s:
                break
            s = s2
        return re.sub(r"[ \t]{2,}", " ", s).strip()


    def leaks(text):
        """What the scrub would still find. Empty means clean."""
        return [m.group(0) for m in SCENARIO_TAG.finditer(text or "")] + \
               [m.group(0) for m in SCENARIO_ID.finditer(text or "")]


    def _is_agent_commit(author, subject):
        """One rule for "this commit is the agent's own", used by the legacy
        last_foreign_change and by the P9c revert plan: a fix never reverts a fix."""
        a, s = (author or "").lower(), subject or ""
        return ("sre-agent" in a or a == AGENT_LOGIN.lower()
                or s.startswith("restart the ") or s.startswith("fix: revert "))


    def log(msg, **kw):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "msg": msg}
        rec.update(kw)
        print(json.dumps(rec), flush=True)


    def sh(args, cwd=None, check=True, stdin=None):
        r = subprocess.run(args, cwd=cwd, input=stdin, capture_output=True, text=True)
        if check and r.returncode != 0:
            raise SystemExit(f"remediate: {' '.join(args[:4])}...: {r.stderr.strip()[:400]}")
        return r


    def gh_app(args, check=True):
        r = sh(GH_APP + args, check=check)
        try:
            return json.loads(r.stdout)
        except Exception:
            return {"_raw": r.stdout.strip(), "_err": r.stderr.strip()}


    def gh_api(path, method="GET", body=None):
        """A GitHub REST call AS THE APP, in-process (gh_app.api). This used to shell
        out to the `gh` CLI, i.e. it acted as the OPERATOR'S GitHub login from inside
        the agent's write path (hardening item 1). None on any non-2xx answer."""
        try:
            st, out = _gh.api(path, method, body)
        except Exception:
            return None
        return out if 200 <= st < 300 else None


    # ------------------------------------------------------------- ServiceNow ---
    def sm(name):
        """A secret value, in-process (gcp_auth). "" if unreadable. Never logged."""
        try:
            return (gcp_auth.secret(name, PROJECT) or "").strip()
        except Exception:
            return ""


    class NotStored(RuntimeError):
        """A ServiceNow write that was answered and is not in the record on re-read
        (hardening item 8). Carries the field and a reason, never a secret."""

        def __init__(self, field, why):
            super().__init__(f"{field}: {why}")
            self.field, self.why = field, why


    class Snow:
        """remediate's ServiceNow calls. Auth is snow_client's: an OAuth bearer token,
        cached, refreshed once on a 401; no Basic code path (hardening item 3). Missing
        OAuth settings are a refusal with a clear error, never a fallback."""

        def __init__(self):
            try:
                self.client = _snow_client.from_secrets(sm)
            except _snow_client.SnowConfigError as e:
                raise SystemExit(f"remediate: ServiceNow refused: {e}")
            self.base = self.client.base

        def call(self, method, path, body=None):
            return self.client.call(method, path, body)

        def find(self, number=None, correlation_id=None):
            if number:
                q, limit = f"number={number}", 1
            else:
                # Several active incidents can share a correlation ID while the bridge
                # settles a create race (item 6): the oldest non-Duplicate is the one.
                q, limit = f"correlation_id={correlation_id}^active=true^ORDERBYsys_created_on", 20
            r = self.call("GET", f"/api/now/table/incident?sysparm_query={urllib.parse.quote(q)}"
                                 "&sysparm_fields=number,sys_id,state,correlation_id,short_description,"
                                 f"close_code,sys_created_on&sysparm_limit={limit}")
            res = r.get("result") or []
            if not number:
                res = _cid.canonical(res)
            return res[0] if res else None

        def comment(self, sys_id, text):
            """A customer-visible `comments` write, NOT read back. Kept for the probe and
            demo tools that call it and check it themselves; remediate's own steps never
            use it (hardening items 3/8: agent notes go to work_notes, read back)."""
            self.call("PATCH", f"/api/now/table/incident/{sys_id}", {"comments": text})

        # Agent notes go to work_notes, the internal journal (item 3), and every one is
        # READ BACK (item 8). The read is the incident's display value, the same way the
        # bridge and hitl read it: sys_journal_field is not readable under the
        # least-privilege role.
        NOTE_FIELD = "work_notes"

        def journal(self, sys_id, field=NOTE_FIELD):
            r = self.call("GET", f"/api/now/table/incident/{sys_id}"
                                 f"?sysparm_display_value=true&sysparm_fields={field}")
            return str((r.get("result") or {}).get(field) or "")

        def note(self, sys_id, text, tries=3, pause=2):
            """Write `text` to work_notes and prove it is there. Raises NotStored if the
            instance answered and the note is not in the journal on re-read.

            Re-reads only, never re-writes: a journal write that is retried and then
            turns out to have landed the first time is posted twice."""
            self.call("PATCH", f"/api/now/table/incident/{sys_id}", {self.NOTE_FIELD: text})
            want = " ".join(str(text).split())
            for attempt in range(max(1, tries)):
                if want in " ".join(self.journal(sys_id).split()):
                    return True
                if attempt < tries - 1:
                    time.sleep(pause)
            raise NotStored(self.NOTE_FIELD, f"ServiceNow answered the PATCH but the note is not in "
                                             f"{self.NOTE_FIELD} on re-read (L-P8-005)")

        # ServiceNow's incident state model. A close is not one write and it is not
        # one hop: this instance's stock "incident / Deny Unless / write" record ACL
        # requires the `itil` role, and until it was granted every PATCH below
        # returned HTTP 200 and stored NOTHING (L-P8-005). Worse, it stored
        # SELECTIVELY — `close_notes` and `comments` landed while `state` did not, so
        # the record afterwards looked closed to a human reading its notes and was
        # still New to every query. The walk is therefore explicit, hop by hop, and
        # every hop is confirmed by RE-READING the record.
        NEW, IN_PROGRESS, RESOLVED, CLOSED = "1", "2", "6", "7"

        def get(self, sys_id, fields):
            r = self.call("GET", f"/api/now/table/incident/{sys_id}"
                                 f"?sysparm_fields={fields}")
            return r.get("result") or {}

        def patch_verified(self, sys_id, body, field, want, tries=3, pause=2):
            """PATCH, then RE-READ `field` and require it to equal `want`.

            THE RULE THIS ENCODES (L-P8-005): a ServiceNow write is verified by
            re-reading the record, never by the status code. The Table API answers
            200 for a write an ACL refused, for a field that does not exist, and for
            a value a business rule overwrote a moment later. `r.status == 200`
            therefore carries no information about whether anything was stored, and
            no caller in this file is allowed to treat it as though it does.

            Returns (ok, actual_value).
            """
            actual = None
            for attempt in range(tries):
                self.call("PATCH", f"/api/now/table/incident/{sys_id}", body)
                actual = str(self.get(sys_id, field).get(field, ""))
                if actual == str(want):
                    return True, actual
                if attempt < tries - 1:
                    time.sleep(pause)
            return False, actual

        # The close_code this instance actually STORES. Probed field by field
        # against dev273996 after the itil grant: "Solved (Permanently)" — the value
        # this code sent for its whole life — is not in this instance's choice list,
        # and ServiceNow does not reject it. It answers 200 and silently substitutes
        # the default, "Resolved by caller". So every close this product ever
        # "succeeded" at would have carried a resolution code nobody chose, and the
        # old status-code check could never have noticed. Verified to store as
        # asked: Solution provided, Resolved by caller, Resolved by change,
        # Duplicate, User error, No resolution provided. "Solution provided" is the
        # honest one for an incident closed by a fix the agent shipped.
        CLOSE_CODE = "Solution provided"

        def resolve(self, sys_id, notes, close_code=None):
            """Walk the incident to Resolved, proving each hop by re-read.

            New (1) -> In Progress (2) -> Resolved (6), because that is the
            transition the instance actually honours: verified by hand on
            INC0010022, 1->2 persists and then 2->6 with close_code and close_notes
            persists. An incident already at or past a hop skips it rather than
            writing it again.

            Returns (state, record, trail). `trail` is the per-hop evidence — what
            was asked for and what the instance was READ BACK as holding — so a
            refusal names the hop that was refused instead of the whole close
            failing anonymously.
            """
            close_code = close_code or self.CLOSE_CODE
            trail = []

            def hop(name, body, field, want):
                ok, actual = self.patch_verified(sys_id, body, field, want)
                trail.append({"hop": name, "field": field, "wanted": str(want),
                              "read_back": actual, "ok": ok})
                return ok

            cur = str(self.get(sys_id, "state").get("state", ""))
            if cur == self.NEW:
                # Not cosmetic: an instance that refuses 1 -> 6 in one step accepts
                # 1 -> 2 -> 6, and a refusal here localises the ACL problem to the
                # first write rather than to the close.
                if not hop("in-progress", {"state": self.IN_PROGRESS},
                           "state", self.IN_PROGRESS):
                    after = self.get(sys_id, "state,close_code,close_notes,active,resolved_at")
                    return str(after.get("state", "")), after, trail
                cur = self.IN_PROGRESS

            if cur in (self.RESOLVED, self.CLOSED):
                trail.append({"hop": "resolve", "field": "state", "wanted": self.RESOLVED,
                              "read_back": cur, "ok": True,
                              "note": "already resolved/closed before this call"})
            else:
                hop("resolve", {"state": self.RESOLVED, "close_code": close_code,
                                "close_notes": notes, self.NOTE_FIELD: notes},
                    "state", self.RESOLVED)
                # The journal entry rode along too; it is read back like every other
                # field (item 8), and written once more on its own only if it is missing.
                if " ".join(notes.split()) in " ".join(self.journal(sys_id).split()):
                    trail.append({"hop": self.NOTE_FIELD, "field": self.NOTE_FIELD,
                                  "wanted": notes[:80], "read_back": "present", "ok": True})
                else:
                    try:
                        self.note(sys_id, notes)
                        trail.append({"hop": self.NOTE_FIELD, "field": self.NOTE_FIELD,
                                      "wanted": notes[:80], "read_back": "present", "ok": True,
                                      "note": "written on its own after the resolve PATCH dropped it"})
                    except NotStored as e:
                        trail.append({"hop": self.NOTE_FIELD, "field": self.NOTE_FIELD,
                                      "wanted": notes[:80], "read_back": "", "ok": False,
                                      "note": e.why})

            # close_code and close_notes are separately verified. They rode along
            # with the state PATCH above, but they are governed by their own ACLs and
            # this instance has already demonstrated that it will store one field of
            # a PATCH and drop another. A close whose state moved but whose notes
            # vanished is not the record this product claims to leave behind.
            after = self.get(sys_id, "state,close_code,close_notes,active,resolved_at,closed_at")
            for field, want in (("close_code", close_code), ("close_notes", notes)):
                got = str(after.get(field, ""))
                if got != str(want):
                    ok, got = self.patch_verified(sys_id, {field: want}, field, want)
                    # A close_code the instance NORMALISED to its own choice list is
                    # not a refused write: the closing record is there, it just
                    # carries the instance's vocabulary rather than ours. That is
                    # worth recording and is not worth failing a close over. A field
                    # that came back EMPTY is a refused write and does fail.
                    normalised = (not ok) and field == "close_code" and got != ""
                    trail.append({"hop": field, "field": field, "wanted": str(want)[:80],
                                  "read_back": got[:80], "ok": ok or normalised,
                                  **({"note": "the instance normalised this to its own choice "
                                              "list; the closing record is present"}
                                     if normalised else {})})
                    after = self.get(sys_id,
                                     "state,close_code,close_notes,active,resolved_at,closed_at")
            return str(after.get("state", "")), after, trail


    # ------------------------------------------------------------- the change ---
    def clone():
        """A clean work tree at origin/main, every time.

        `propose` edits files in place to compute the change it is going to push, and
        those edits are never committed here — the content goes to GitHub through the
        App's API, not through this clone. So the tree is left dirty, and the NEXT
        proposal's checkout fails with "your local changes would be overwritten".
        That is a once-per-process bug that only appears on the second incident,
        which is exactly the kind that survives every single-scenario test and then
        fails an E2E on its second scenario.

        The reset is unconditional and discards whatever the previous proposal left:
        nothing in this tree is ever a source of truth."""
        if not os.path.isdir(os.path.join(WORK, ".git")):
            os.makedirs(os.path.dirname(WORK), exist_ok=True)
            sh(["git", "clone", "--quiet", f"https://github.com/{OWNER}/{REPO}.git", WORK])
        sh(["git", "fetch", "--quiet", "origin"], cwd=WORK)
        sh(["git", "checkout", "--quiet", "-f", "-B", "main", "origin/main"], cwd=WORK)
        sh(["git", "reset", "--quiet", "--hard", "origin/main"], cwd=WORK)
        sh(["git", "clean", "--quiet", "-fd"], cwd=WORK)
        return WORK


    def last_foreign_change(path):
        """The most recent commit touching `path` that the agent did not author.

        Skipping the agent's own commits is what stops a fix from reverting a fix:
        after a T1 restart bump lands, the newest change to the Deployment is the
        agent's, and reverting that would undo the remediation and re-open the
        incident it just closed."""
        out = sh(["git", "log", "--format=%H%x1f%an%x1f%s", "-n", "25", "--", path],
                 cwd=WORK).stdout.strip().splitlines()
        for line in out:
            sha, author, subject = line.split("\x1f", 2)
            if _is_agent_commit(author, subject):
                continue
            return sha, author, subject
        return None, None, None


    def build_restart(path, ts):
        full = os.path.join(WORK, path)
        s = open(full).read()
        if "sre-agent/restartedAt" in s:
            s2 = re.sub(r'sre-agent/restartedAt: "[^"]*"', f'sre-agent/restartedAt: "{ts}"', s, count=1)
        else:
            s2 = s.replace("      annotations:\n",
                           f'      annotations:\n        sre-agent/restartedAt: "{ts}"\n', 1)
        if s2 == s:
            raise SystemExit("remediate: could not place the restart annotation — refusing to open "
                             "a pull request that changes nothing")
        open(full, "w").write(s2)
        return "bump the restart annotation (declarative rollout restart)"


    def build_revert(path):
        sha, author, subject = last_foreign_change(path)
        if not sha:
            raise SystemExit(f"remediate: no revertable change found for {path} — refusing to "
                             f"invent a fix")
        patch = sh(["git", "diff", sha, f"{sha}^", "--", path], cwd=WORK).stdout
        if not patch.strip():
            raise SystemExit(f"remediate: commit {sha[:8]} has an empty diff for {path}")
        r = sh(["git", "apply", "--3way", "-"], cwd=WORK, check=False, stdin=patch)
        if r.returncode != 0:
            raise SystemExit(f"remediate: the reverse patch does not apply cleanly to {path} "
                             f"({r.stderr.strip()[:200]}). The file has moved on since the change "
                             f"that broke it; this needs a human, not a guess.")
        return f"revert {sha[:8]} ({subject!r} by {author})"


    def corroborate(failure_class, service="checkout"):
        """Evidence for WHY the reverted value is the right one, measured now.
        Best-effort: it strengthens the pull request body, it never gates it."""
        q = {
            "memory-limit-too-low":
                ('max(container_memory_working_set_bytes{namespace="checkout",container="checkout"})',
                 "peak working set", lambda v: f"{v/1024/1024:.0f}MiB"),
            "probe-misconfiguration":
                ('histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket'
                 '{destination_service_name="checkout"}[5m])) by (le))',
                 "p99 request latency", lambda v: f"{v:.0f}ms"),
            "mesh-misrouting":
                ('sum(rate(istio_requests_total{reporter="source",'
                 'destination_service_name="checkout",response_code="503"}[5m]))',
                 "503 rate at the mesh", lambda v: f"{v:.2f}/s"),
        }.get(failure_class)
        if not q:
            return None
        expr, label, fmt = q
        val, err = observe.prom_scalar(expr)
        return None if val is None else f"{label}: {fmt(val)}  (`{expr}`)"


    # ------------------------------------------------------- P9c: the revert ---
    # The P9c estate is not checkout. A fault there arrives as a commit somewhere
    # under apps/ml/, and the fix is the reverse of THAT commit, on the files it
    # touched, and nothing else. The model names the commit and the paths; every
    # one of the following is checked here rather than trusted:
    #   * the commit is one the agent was actually shown (a git item in its bundle);
    #   * every path is a file that commit changed AND lies inside the incident's
    #     scope (scope.git_paths), so a correct diagnosis of one app cannot become
    #     a write to another;
    #   * the commit is not the agent's own (a fix never reverts a fix);
    #   * a T1 change never sets a replica count to 0 (the one T1 shape that would
    #     auto-merge an outage);
    #   * any T3 path makes the pull request a draft.
    REPLICA_KEY = re.compile(r"(?:^|\.)(?:replicas|replicaCount)$", re.IGNORECASE)
    _HEX = re.compile(r"^[0-9a-f]{7,40}$")


    def _tier_of(path):
        return path_policy.classify("", [path], True)["tier"]


    def _git_items(bundle):
        out = []
        for it in (bundle or {}).get("evidence") or []:
            d = it.get("data") if isinstance(it, dict) else None
            if isinstance(d, dict) and d.get("kind") == "git-commit" and d.get("sha"):
                out.append((it, d))
        return out


    def _files_of(d):
        fs = []
        for f in d.get("files") or []:
            if isinstance(f, str):
                fs.append(f)
            elif isinstance(f, dict):
                p = f.get("path") or f.get("filename")
                if p:
                    fs.append(p)
        return fs


    def _in_scope(path, git_paths):
        for g in git_paths or []:
            g = g.rstrip("/")
            if g and (path == g or path.startswith(g + "/")):
                return True
        return False


    def _diff_by_file(diff):
        """Split a unified diff into {path: [lines]} using its `diff --git` headers."""
        out, cur = {}, None
        for line in (diff or "").splitlines():
            m = re.match(r"^diff --git a/(\S+) b/(\S+)", line)
            if m:
                cur = m.group(2)
                out.setdefault(cur, [])
                continue
            if cur is not None:
                out[cur].append(line)
        return out


    def _zero_replicas_from_diff(lines):
        """A cheap pre-check on the bundle's diff of the break commit: a line the
        break REMOVED comes back on revert. If it reads `replicas: 0`, the revert
        scales something to zero. The authoritative check is on the real file
        content at propose time (`zero_replica_keys`); this one lets plan() refuse
        before anything is cloned."""
        bad = []
        for l in lines:
            if l.startswith("-") and not l.startswith("---"):
                m = re.match(r"^-\s*([A-Za-z0-9_.-]*(?:replicas|replicaCount))\s*:\s*['\"]?0['\"]?\s*(?:#.*)?$",
                             l, re.IGNORECASE)
                if m:
                    bad.append(m.group(1))
        return bad


    def zero_replica_keys(before, after):
        """Replica keys (spec.replicas, *.replicaCount, *.replicas) whose value is 0
        in `after` and was not 0 in `before`."""
        b, a = diff_shape._docs(before or ""), diff_shape._docs(after or "")
        if a is None:
            return []
        bad = []
        for ident, doc in a.items():
            flat = diff_shape._flatten(doc)
            bflat = diff_shape._flatten((b or {}).get(ident, {}))
            for k, v in flat.items():
                if REPLICA_KEY.search(k) and str(v).strip() == "0" and str(bflat.get(k, "")).strip() != "0":
                    bad.append(k)
        return sorted(bad)


    def _checked_commit(diag, bundle, scope):
        """The commit the diagnosis implicates, checked rather than trusted: a sha the
        agent was SHOWN (a git item in its bundle), not its own, every path one that
        commit changed and inside the incident's scope, and no T1 revert to zero
        replicas. Shared by the P9c revert and the legacy implicated-commit fix."""
        imp = diag.get("implicated") or {}
        commit = str(imp.get("commit") or "").strip().lower()
        paths = [str(p).strip() for p in (imp.get("paths") or []) if str(p).strip()]
        if not _HEX.match(commit):
            raise SystemExit(f"remediate: implicated.commit {commit!r} is not a commit sha "
                             f"(>= 7 hex)")
        if not paths:
            raise SystemExit("remediate: a revert must name the paths it reverts (implicated.paths)")

        hits = [(it, d) for it, d in _git_items(bundle) if str(d["sha"]).lower().startswith(commit)]
        if not hits:
            raise SystemExit(f"remediate: commit {commit[:12]} is not one of the commits in the "
                             f"evidence bundle — the agent may only revert a change it was shown")
        if len({d["sha"] for _, d in hits}) > 1:
            raise SystemExit(f"remediate: commit prefix {commit} is ambiguous in the bundle")
        item, d = hits[0]
        sha = str(d["sha"]).lower()
        author, subject = d.get("author") or "", d.get("subject") or ""
        if _is_agent_commit(author, subject):
            raise SystemExit(f"remediate: commit {sha[:8]} is the agent's own change — a fix never "
                             f"reverts a fix")
        files = set(_files_of(d))
        not_in_commit = [p for p in paths if p not in files]
        if not_in_commit:
            raise SystemExit(f"remediate: {not_in_commit} not changed by commit {sha[:8]} "
                             f"(it changed {sorted(files)}); refusing to revert a file the commit "
                             f"did not touch")
        out_of_scope = [p for p in paths if not _in_scope(p, scope.get("git_paths"))]
        if out_of_scope:
            raise SystemExit(f"remediate: {out_of_scope} outside this incident's scope "
                             f"{scope.get('git_paths')}; refusing")

        tiers = {p: _tier_of(p) for p in paths}
        per_file = _diff_by_file(d.get("diff") or "")
        for p in paths:
            if tiers[p] == "T1":
                z = _zero_replicas_from_diff(per_file.get(p, []))
                if z:
                    raise SystemExit(f"remediate: reverting {sha[:8]} would set {z} to 0 on the T1 "
                                     f"path {p}; the agent never scales a workload to zero")
        return {"commit": sha, "paths": paths, "tiers": tiers, "author": author,
                "subject": scrub(subject), "evidence_id": item.get("id")}


    def _implicates_commit(diag):
        """The diagnosis names a specific commit as the cause (a revert with a sha)."""
        return (diag.get("disposition") == "revert"
                and bool(str((diag.get("implicated") or {}).get("commit") or "").strip()))


    # Which Argo CD Applications deliver a file, from the legacy table itself.
    def _apps_for(paths):
        by_path = {}
        for path, _how, apps, _draft in PLANS.values():
            by_path.setdefault(path, apps)
        if all(p in by_path for p in paths):
            return sorted({a for p in paths for a in by_path[p]})
        return None


    def default_bundle(fp):
        """The evidence bundle the trigger wrote for this incident, if it is on disk
        (`<AGENT_WORKDIR or STATE_DIR/agent>/evidence-<fp>.json`) and is about `fp`.
        P8's driver does not pass --evidence; this is how propose still sees the git
        items the diagnosis was made from."""
        if not fp:
            return None
        wd = os.environ.get("AGENT_WORKDIR", os.path.join(STATE_DIR, "agent"))
        f = os.path.join(wd, f"evidence-{fp}.json")
        try:
            b = json.load(open(f))
        except (OSError, ValueError):
            return None
        return b if isinstance(b, dict) and b.get("fingerprint") == fp else None


    def plan(diag, bundle=None, shown=None):
        """What to do about this diagnosis, or a refusal (SystemExit) naming why not.

        Three shapes (docs/p9c-plan.md "Remediation"):
          legacy   one of the six P8 classes on checkout. When the diagnosis implicates
                   a commit, the fix is the exact inverse of THAT commit (checked like
                   a P9c revert); the class -> file table (PLANS) is only the fallback
                   when no commit is implicated;
          revert   reverse a commit the agent was shown, on paths it changed;
          escalate no git fix exists -> a ServiceNow escalation, no pull request.

        `shown` is the evidence bundle when the caller did not pass it as `bundle`
        (default_bundle): it is used ONLY to check an implicated commit, never to
        pick the mode, so P8 diagnoses stay on the legacy path.

        Why the commit wins (P8, 15 Nov, both runs): F04's root cause was right ("typo
        in the CoreDNS Corefile", commit cited, disposition revert, tier T3) but its
        class was `bad-release`, and the table turned that into a revert of checkout's
        Deployment — a T1 auto-merge of the wrong file. The class is a label; the
        commit is evidence.
        """
        fc = diag.get("failure_class")
        scope = (bundle or {}).get("scope")
        disp = diag.get("disposition")

        # Legacy: P8 diagnoses on checkout (or with no bundle at all).
        if fc in PLANS and (scope is None or "checkout" in (scope.get("namespaces") or [])):
            path, how, apps, draft = PLANS[fc]
            base = {"mode": "legacy", "failure_class": fc, "path": path, "paths": [path],
                    "how": how, "apps": apps, "draft": draft}
            if not _implicates_commit(diag):
                return base
            ev = bundle if bundle is not None else shown
            named = sorted({str(p).strip() for p in (diag["implicated"].get("paths") or [])
                            if str(p).strip()})
            if not ev:
                if named == [path]:
                    # The commit can't be checked, but the table names the same file.
                    return dict(base, implicated_unchecked=diag["implicated"].get("commit"))
                raise SystemExit(
                    f"remediate: the diagnosis implicates commit "
                    f"{str(diag['implicated'].get('commit'))[:12]} on {named}, the failure class "
                    f"{fc!r} would change {path}, and there is no evidence bundle to check the "
                    f"commit against (pass --evidence). Refusing to guess which is right.")
            esc = ev.get("scope")
            if not esc:
                raise SystemExit("remediate: an implicated commit needs the evidence bundle's scope "
                                 "to check its paths against; the bundle has none")
            ck = _checked_commit(diag, ev, esc)
            tiers = ck["tiers"]
            return {"mode": "legacy", "how": "revert-commit", "failure_class": fc,
                    "path": ck["paths"][0], "paths": ck["paths"],
                    "apps": _apps_for(ck["paths"]) or list(esc.get("apps") or []) or apps,
                    "draft": any(t == "T3" for t in tiers.values()), "tiers": tiers,
                    "commit": ck["commit"], "author": ck["author"], "subject": ck["subject"],
                    "evidence_id": ck["evidence_id"], "class_path": path,
                    "class_disagrees": sorted(ck["paths"]) != [path]}

        if disp == "escalate":
            to = str(diag.get("escalate_to") or "").strip()
            act = str(diag.get("imperative_action") or "").strip()
            if not to or not act:
                raise SystemExit("remediate: an escalate diagnosis must name escalate_to and "
                                 "imperative_action — an escalation that says neither who nor what "
                                 "is not one")
            return {"mode": "escalate", "how": "escalate", "failure_class": fc,
                    "escalate_to": to, "imperative_action": act,
                    "apps": list((scope or {}).get("apps") or []), "draft": False}

        if disp != "revert":
            raise SystemExit(f"remediate: no remediation is defined for failure class {fc!r} with "
                             f"disposition {disp!r} (only the six legacy checkout classes, 'revert' "
                             f"and 'escalate' are implemented)")

        if not scope:
            raise SystemExit("remediate: a revert needs the evidence bundle's scope to check its "
                             "paths against; none was given (pass --evidence)")
        ck = _checked_commit(diag, bundle, scope)
        tiers = ck["tiers"]
        return {"mode": "revert", "how": "revert", "failure_class": fc, "commit": ck["commit"],
                "paths": ck["paths"], "path": ck["paths"][0], "tiers": tiers,
                "apps": list(scope.get("apps") or []),
                "draft": any(t == "T3" for t in tiers.values()),
                "author": ck["author"], "subject": ck["subject"], "evidence_id": ck["evidence_id"]}


    def build_revert_commit(sha, paths, repo=None):
        """Reverse commit `sha` on `paths` in the work tree at `repo` (default: the
        agent's clone, which clone() has hard-reset to origin/main).

        `git diff sha sha^ -- paths | git apply --3way`, exactly as build_revert does
        for one file, generalised to several and to files the break ADDED (the
        reverse patch deletes them) or DELETED (it re-adds them). Refuses, rather
        than guesses, when the commit is the agent's own, a path is not one the
        commit changed, or the patch does not apply.

        Returns {sha, author, subject, what, changes: [{path, change, before, after}]}
        where change is "modified" | "deleted" | "re-added" and before/after are the
        file's text (None when absent)."""
        repo = repo or WORK
        r = sh(["git", "log", "-1", "--format=%H%x1f%an%x1f%s", sha], cwd=repo, check=False)
        if r.returncode != 0 or not r.stdout.strip():
            raise SystemExit(f"remediate: commit {sha[:12]} is not in the manifests history")
        full, author, subject = r.stdout.strip().split("\x1f", 2)
        if _is_agent_commit(author, subject):
            raise SystemExit(f"remediate: commit {full[:8]} is the agent's own change — a fix never "
                             f"reverts a fix")
        if sh(["git", "merge-base", "--is-ancestor", full, "HEAD"], cwd=repo,
              check=False).returncode != 0:
            raise SystemExit(f"remediate: commit {full[:8]} is not on the branch being fixed")
        status = {}
        for line in sh(["git", "show", "--no-renames", "--name-status", "--format=", full],
                       cwd=repo).stdout.splitlines():
            if "\t" in line:
                st, p = line.split("\t", 1)
                status[p] = st[:1]
        missing = [p for p in paths if p not in status]
        if missing:
            raise SystemExit(f"remediate: commit {full[:8]} did not change {missing}")

        def read(p):
            f = os.path.join(repo, p)
            return open(f).read() if os.path.isfile(f) else None

        before = {p: read(p) for p in paths}
        patch = sh(["git", "diff", "--no-renames", "--binary", full, f"{full}^", "--"] + list(paths),
                   cwd=repo).stdout
        if not patch.strip():
            raise SystemExit(f"remediate: commit {full[:8]} has an empty diff for {paths}")
        r = sh(["git", "apply", "--3way", "-"], cwd=repo, check=False, stdin=patch)
        if r.returncode != 0:
            raise SystemExit(f"remediate: the reverse patch of {full[:8]} does not apply cleanly to "
                             f"{paths} ({r.stderr.strip()[:200]}). The files have moved on since the "
                             f"change that broke them; this needs a human, not a guess.")
        changes = []
        for p in paths:
            after = read(p)
            if after is not None and re.search(r"^(<{7}|>{7}) ", after, re.M):
                raise SystemExit(f"remediate: the reverse patch left conflict markers in {p}")
            kind = {"A": "deleted", "D": "re-added"}.get(status[p], "modified")
            if kind == "deleted" and after is not None:
                raise SystemExit(f"remediate: {p} was added by {full[:8]} but is still present after "
                                 f"the revert")
            changes.append({"path": p, "change": kind, "before": before[p], "after": after})
        what = f"revert {full[:8]} ({scrub(subject)!r}) on {', '.join(paths)}"
        return {"sha": full, "author": author, "subject": scrub(subject), "what": what,
                "changes": changes}


    # ------------------------------------------------------------------ steps ---
    def _cited(diag):
        return diag.get("_meta", {}).get("citations_valid", []) or diag.get("citations") or []


    # Item 9: one pull request per incident. Every PR body carries this exact line, and
    # the branch starts `sre-agent/fix-<cid[:12]>-`; a re-run after a crash (or a second
    # runner pass) finds the PR it opened instead of opening another.
    def cid_marker(fp):
        return f"**correlation id:** `{fp}`"


    def find_open_pr(fp, pages=5):
        """The open pull request the agent already opened for correlation id `fp`, or
        None. Refuses (SystemExit) if the open PRs can't be listed: without the list
        there is no telling whether this would be a duplicate."""
        marker, pref = cid_marker(fp), f"sre-agent/fix-{fp[:12]}-"
        hits = []
        for page in range(1, pages + 1):
            out = gh_api(f"/repos/{OWNER}/{REPO}/pulls?state=open&per_page=100&page={page}")
            if not isinstance(out, list):
                raise SystemExit("remediate: could not list the open pull requests, so one for this "
                                 "incident may already exist; not opening a possible duplicate "
                                 "(item 9)")
            for pr in out:
                if str((pr.get("user") or {}).get("login") or "") != AGENT_LOGIN:
                    continue
                body = str(pr.get("body") or "")
                ref = str((pr.get("head") or {}).get("ref") or "")
                if marker in body or (ref.startswith(pref) and fp in body):
                    hits.append(pr)
            if len(out) < 100:
                break
        if len(hits) > 1:
            log("more than one open agent PR carries this correlation id; reusing the oldest",
                correlation_id=fp, prs=sorted(int(h["number"]) for h in hits))
        return min(hits, key=lambda h: int(h["number"])) if hits else None


    def _branch_content(path, branch):
        """The file's text on `branch`, or None if it is not a file there."""
        q = urllib.parse.quote(path, safe="/")
        out = gh_api(f"/repos/{OWNER}/{REPO}/contents/{q}?ref={urllib.parse.quote(branch, safe='')}")
        if not isinstance(out, dict) or out.get("type") != "file":
            return None
        try:
            return base64.b64decode(out.get("content") or "").decode()
        except Exception:
            return None


    def _write_changes(changes, branch, title, only_if_different=False):
        """Put/rm each change on `branch` through the App. With only_if_different, a
        path whose branch content already equals the change is left alone, so a re-run
        adds no commits to a PR that already holds the fix."""
        os.makedirs(SCRATCH, exist_ok=True)
        wrote = []
        for i, c in enumerate(changes):
            if only_if_different:
                cur = _branch_content(c["path"], branch)
                if cur == c["after"]:
                    continue
            if c["after"] is None:
                gh_app(["rm", c["path"], "--branch", branch, "--message", title])
            else:
                tmp = os.path.join(SCRATCH, f"remediate-content-{i}")
                open(tmp, "w").write(c["after"])
                gh_app(["put", c["path"], "--branch", branch, "--message", title,
                        "--content-file", tmp])
            wrote.append(c["path"])
        return wrote


    def open_or_reuse(fp, title, body, draft, changes):
        """Open the pull request, or reuse the open one this incident already has.

        Returns {"number", "branch", "reused", "wrote"}. The lookup happens BEFORE
        anything is written, so a crash anywhere after the PR is opened leaves a PR the
        next run finds; a crash before it leaves at most an orphan branch, never a
        second PR."""
        if cid_marker(fp) not in body:
            raise SystemExit("remediate: the pull request body lacks the correlation-id line that "
                             "makes re-runs find it (item 9)")
        existing = find_open_pr(fp)
        if existing:
            num = int(existing["number"])
            branch = str((existing.get("head") or {}).get("ref") or "")
            if bool(existing.get("draft")) != bool(draft):
                raise SystemExit(f"remediate: the open pull request #{num} for this incident is "
                                 f"{'a draft' if existing.get('draft') else 'not a draft'} and this "
                                 f"fix needs the opposite; a human has to close it first")
            files = gh_api(f"/repos/{OWNER}/{REPO}/pulls/{num}/files?per_page=100")
            if not isinstance(files, list):
                raise SystemExit(f"remediate: could not read the files of #{num}; not reusing it blind")
            extra = sorted({f.get("filename") for f in files} - {c["path"] for c in changes})
            if extra:
                raise SystemExit(f"remediate: the open pull request #{num} for this incident also "
                                 f"changes {extra}, which this fix does not; a human has to close "
                                 f"it before the agent proposes a different change")
            wrote = _write_changes(changes, branch, title, only_if_different=True)
            if gh_api(f"/repos/{OWNER}/{REPO}/pulls/{num}", method="PATCH",
                      body={"title": title, "body": body}) is None:
                log("could not refresh the reused PR's title/body; its content is current",
                    pr=num)
            log("pull request reused (one per incident)", pr=num, correlation_id=fp, rewrote=wrote)
            return {"number": num, "branch": branch, "reused": True, "wrote": wrote}
        branch = f"sre-agent/fix-{fp[:12]}-{int(time.time())}"
        gh_app(["branch", branch, "--from", "main"])
        wrote = _write_changes(changes, branch, title)
        bf = os.path.join(SCRATCH, "remediate-body.md")
        open(bf, "w").write(body)
        args = ["pr", "--head", branch, "--base", "main", "--title", title, "--body-file", bf]
        if draft:
            args.append("--draft")
        pr = gh_app(args)
        num = pr.get("number")
        if not num:
            raise SystemExit(f"remediate: could not open the pull request: {pr}")
        return {"number": num, "branch": branch, "reused": False, "wrote": wrote}


    def propose(diag, fp, incident, thread_url="", bundle=None, shown=None):
        if bundle is None and shown is None:
            shown = default_bundle(fp)
        p = plan(diag, bundle, shown)
        if p["how"] == "escalate":
            raise SystemExit("remediate: this diagnosis is an escalation — no git fix exists, so no "
                             "pull request is opened. Use `remediate.py escalate`.")
        if p["mode"] == "revert":
            return _propose_revert(diag, fp, incident, thread_url, p)
        return _propose_legacy(diag, fp, incident, thread_url, p)


    def _propose_revert(diag, fp, incident, thread_url, p):
        clone()
        rv = build_revert_commit(p["commit"], p["paths"])
        keys, per_path = set(), []
        for c in rv["changes"]:
            k = diff_shape.changed_keys(c["before"] or "", c["after"] or "")
            keys.update(k)
            if p["tiers"].get(c["path"]) == "T1":
                z = zero_replica_keys(c["before"], c["after"])
                if z:
                    raise SystemExit(f"remediate: the revert would set {z} to 0 on the T1 path "
                                     f"{c['path']}; the agent never scales a workload to zero")
            per_path.append({"path": c["path"], "change": c["change"], "changed_keys": k})
        keys = sorted(keys)
        verdict = path_policy.classify(AGENT_LOGIN, p["paths"], p["draft"], keys)
        if verdict["status"] != "pass":
            raise SystemExit(f"remediate: the platform's policy would fail this change "
                             f"({verdict['reason']}); not opening it")

        sha8 = rv["sha"][:8]
        subj = rv["subject"]
        title = scrub(f"fix: revert {sha8} on {', '.join(p['paths'])}"
                      + (f" ({subj})" if subj else ""))[:240]

        lines = "\n".join(f"- `{c['path']}`: {c['change']}"
                          + (f" (keys: `{'`, `'.join(c['changed_keys'][:12])}`"
                             + (" …" if len(c["changed_keys"]) > 12 else "") + ")"
                             if c["changed_keys"] else "")
                          for c in per_path)
        body = f"""**Automated remediation — revert**

    {scrub(str(diag.get('root_cause') or ''))}

    **Change:** revert commit `{sha8}` ({subj or 'no subject'}) on the files it changed:
    {lines}

    **Computed diff shape:** `{'`, `'.join(keys[:40])}`{' …' if len(keys) > 40 else ''}
    **Tier (computed by the platform, not claimed):** {verdict['tier']} — {scrub(verdict['reason'])}
    **Diagnosis tier (recorded, not obeyed):** {diag.get('tier', 'n/a')}

    **Evidence cited in the diagnosis:** {', '.join(_cited(diag)) or 'n/a'}

    **Incident:** {incident or 'n/a'} · {cid_marker(fp)}
    {('**Slack thread:** ' + thread_url) if thread_url else ''}

    {"⚠️ **DRAFT — platform path (T3).** The agent may not remediate cluster infrastructure autonomously; this is a proposal for a human to decide on." if p['draft'] else ""}
    This pull request was opened by the agent. It cannot approve or merge it."""
        bad = leaks(body) + leaks(title)
        if bad:
            raise SystemExit(f"remediate: the pull request text still carries scenario markers "
                             f"{bad[:5]} after redaction; not opening it")
        o = open_or_reuse(fp, title, body, p["draft"], rv["changes"])
        num = o["number"]
        log("pull request " + ("reused" if o["reused"] else "opened"), pr=num, tier=verdict["tier"],
            draft=p["draft"], auto_merge=verdict["auto_merge"], paths=p["paths"], changed_keys=keys)
        return {"pr": num, "branch": o["branch"], "plan": p, "classifier": verdict,
                "changed_keys": keys, "change": rv["what"], "title": title,
                "paths": per_path, "reverted": rv["sha"], "reused": o["reused"]}


    def _build_legacy(p):
        """The change for a legacy plan, made in the work tree. Returns (changes, what)
        with changes = [{path, change, before, after}].

        revert-commit  the exact inverse of the implicated commit (build_revert_commit);
        restart        the declarative restart bump;
        revert         the table's fallback: the last non-agent change to the file."""
        if p["how"] == "revert-commit":
            rv = build_revert_commit(p["commit"], p["paths"])
            return rv["changes"], f"revert {rv['sha'][:8]} ({rv['subject']!r} by {rv['author']})"
        full = os.path.join(WORK, p["path"])
        before = open(full).read()
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        what = (build_restart(p["path"], ts) if p["how"] == "restart" else build_revert(p["path"]))
        after = open(full).read()
        if after == before:
            # P8 F04, 15 Nov: the table's revert of a change that had already been
            # reverted applied cleanly and changed nothing, and an EMPTY pull request
            # was opened and classified T1 auto-merge (an empty diff shape is a subset
            # of every allowlist).
            raise SystemExit(f"remediate: the {p['how']} of {p['path']} ({what}) changes nothing; "
                             f"refusing to open a pull request that changes nothing")
        return [{"path": p["path"], "change": "modified", "before": before, "after": after}], what


    def _propose_legacy(diag, fp, incident, thread_url, p):
        clone()
        changes, what = _build_legacy(p)
        keys, per_path = set(), []
        for c in changes:
            k = diff_shape.changed_keys(c["before"] or "", c["after"] or "")
            keys.update(k)
            if p["how"] == "revert-commit" and (p.get("tiers") or {}).get(c["path"]) == "T1":
                z = zero_replica_keys(c["before"], c["after"])
                if z:
                    raise SystemExit(f"remediate: the revert would set {z} to 0 on the T1 path "
                                     f"{c['path']}; the agent never scales a workload to zero")
            per_path.append({"path": c["path"], "change": c["change"], "changed_keys": k})
        keys = sorted(keys)
        if keys == [diff_shape.UNKNOWN] and p["path"].endswith(".yaml"):
            log("the change could not be shape-classified locally; the platform's check "
                "will fail it closed", path=p["path"])
        # The tier comes from the paths actually changed, never from the class or the
        # model's answer: the Corefile is T3 whatever the diagnosis called it.
        verdict = path_policy.classify(AGENT_LOGIN, p["paths"], p["draft"], keys)
        if p["how"] == "revert-commit" and verdict["status"] != "pass":
            raise SystemExit(f"remediate: the platform's policy would fail this change "
                             f"({verdict['reason']}); not opening it")

        title = {"restart": "restart the wedged checkout worker (T1)"}.get(
            p["how"], f"fix: {diag['failure_class']} — {what.split('(')[0].strip()}")

        # The revert names the commit it is undoing, and on this estate those commits
        # are written by the chaos harness, whose subjects carry its answer key
        # ("break-02: ... (F02)"). Stripping it keeps the pull request a description
        # of the CHANGE rather than a disclosure of the exercise (L-P4-001), and
        # keeps the artefact honest for a client reading it later.
        what = _evidence.redact(what)
        if p["how"] == "revert-commit":
            what += " on " + ", ".join(f"`{c['path']}`" for c in changes)
        disagreement = None
        if p.get("class_disagrees"):
            disagreement = (f"the diagnosis class `{diag['failure_class']}` maps to "
                            f"`{p['class_path']}` in the fix table, but the commit the evidence "
                            f"implicates (`{p['commit'][:8]}`, {p.get('evidence_id') or 'n/a'}) "
                            f"changed {', '.join('`' + x + '`' for x in p['paths'])}. This fix "
                            f"reverts that commit; the class table is only used when no commit is "
                            f"implicated.")
        measured = corroborate(diag["failure_class"]) if p["how"] != "revert-commit" or \
            not p.get("class_disagrees") else None
        body = f"""**Automated remediation — {diag['failure_class']}**

    {diag['root_cause']}

    **Change:** {what}
    **Computed diff shape:** `{'`, `'.join(keys)}`
    **Tier (computed by the platform, not claimed):** {verdict['tier']} — {verdict['reason']}
    **A restart would fix this:** {'yes' if diag.get('restart_would_fix') else 'no'}
    {('**Implicated commit vs failure class:** ' + disagreement) if disagreement else ''}

    **Evidence cited in the diagnosis:** {', '.join(diag.get('_meta', {}).get('citations_valid', [])) or 'n/a'}
    {('**Measured now:** ' + measured) if measured else ''}

    **Incident:** {incident or 'n/a'} · {cid_marker(fp)}
    {('**Slack thread:** ' + thread_url) if thread_url else ''}

    {"⚠️ **DRAFT — platform path (T3).** The agent may not remediate cluster infrastructure autonomously; this is a proposal for a human to decide on." if p['draft'] else ""}
    This pull request was opened by the agent. It cannot approve or merge it."""
        o = open_or_reuse(fp, title, body, p["draft"], changes)
        num = o["number"]
        log("pull request " + ("reused" if o["reused"] else "opened"), pr=num, tier=verdict["tier"],
            draft=p["draft"], auto_merge=verdict["auto_merge"], path=p["path"], changed_keys=keys)
        # No top-level "paths" here: the P8 scorer's bundle takes the PR's file list
        # from GitHub, and this dict is merged over it.
        out = {"pr": num, "branch": o["branch"], "plan": p, "classifier": verdict,
               "changed_keys": keys, "change": what, "title": title, "reused": o["reused"],
               "changed_paths": [c["path"] for c in changes]}
        if p["how"] == "revert-commit":
            out.update(reverted=p["commit"], class_disagreement=disagreement)
        return out


    def escalate(diag, bundle, incident=None, fingerprint=None, dry_run=False, tries=6, pause=2):
        """No git fix exists: hand the incident to a human, with the evidence, and
        prove the hand-off landed by re-reading it (L-P8-005). No pull request."""
        p = plan(diag, bundle)
        if p["how"] != "escalate":
            raise SystemExit(f"remediate: this diagnosis is not an escalation (plan: {p['how']}); "
                             f"use `propose`")
        fp = fingerprint or (bundle or {}).get("fingerprint") or ""
        if not fp:
            raise SystemExit("remediate: no fingerprint for the escalation marker")
        binc = (bundle or {}).get("incident") or {}
        number = incident or binc.get("number") or ""
        marker = f"sre-agent escalation (fingerprint {fp})"
        text = "\n".join([
            marker,
            f"escalate to: {scrub(p['escalate_to'])}",
            f"action needed: {scrub(p['imperative_action'])}",
            f"evidence cited: {', '.join(_cited(diag)) or 'n/a'}",
            f"assessment: {scrub(str(diag.get('root_cause') or ''))[:800]}",
            "No pull request was opened: the agent found no change in git whose reversal would fix "
            "this. The agent will verify recovery and close the incident once a human has acted.",
        ])
        bad = leaks(text)
        if bad:
            raise SystemExit(f"remediate: the escalation text still carries scenario markers "
                             f"{bad[:5]} after redaction; not writing it")
        if dry_run:
            log("dry run — not writing the escalation to ServiceNow", incident=number)
            return {"escalated": False, "dry_run": True, "incident": number, "marker": marker,
                    "comment": text, "plan": p}
        snow = Snow()
        inc = snow.find(number=number) if number else snow.find(correlation_id=fp)
        if not inc:
            raise SystemExit(f"remediate: no incident found for {number or fp}")
        # A work note, verified by reading it back from the journal, never by the 200
        # the PATCH returned (L-P8-005, item 8). Snow.note re-reads only: a re-PATCH
        # would post the escalation twice.
        try:
            seen, why = snow.note(inc["sys_id"], text, tries=tries, pause=pause), None
        except NotStored as e:
            seen, why = False, e.why
        at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        log("escalation " + ("recorded" if seen else "NOT STORED: the read-back does not show it"),
            incident=inc.get("number"), escalate_to=p["escalate_to"],
            **({} if seen else {"security": True}))
        return {"escalated": seen, "incident": inc.get("number"), "sys_id": inc["sys_id"],
                "marker": marker, "escalated_at": at if seen else None, "comment": text,
                "field": "work_notes", "plan": p, "note": why}


    def land(pr, timeout=900):
        """Wait for the platform to merge a T1 change. T2/T3 wait for a human, and
        that is a legal stopped state, not a failure."""
        deadline = time.time() + timeout
        nudged = False
        while time.time() < deadline:
            st = gh_api(f"/repos/{OWNER}/{REPO}/pulls/{pr}")
            if st is None:
                time.sleep(10)
                continue
            if st.get("merged"):
                return {"merged": True, "sha": st.get("merge_commit_sha"),
                        "merged_by": (st.get("merged_by") or {}).get("login")}
            if st.get("state") == "closed":
                return {"merged": False, "reason": "the pull request was closed without merging"}
            if not nudged and time.time() > deadline - timeout + 180:
                gh_api(f"/repos/{OWNER}/{REPO}/pulls/{pr}/update-branch", method="PUT")
                nudged = True
            time.sleep(10)
        return {"merged": False, "reason": "timed out waiting for the merge (a T2/T3 change is "
                                           "waiting for a human, which is not a failure)"}


    ARGO_NS = os.environ.get("ARGOCD_NAMESPACE", "argocd")


    def _app_status(app):
        rc, out, err = observe.kubectl(["-n", ARGO_NS, "get", "applications.argoproj.io", app,
                                        "-o", "json"])
        if rc != 0:
            return None, err
        try:
            st = json.loads(out).get("status") or {}
        except ValueError:
            return None, "unparseable Application"
        op = st.get("operationState") or {}
        return {"compared": (st.get("sync") or {}).get("revision") or "",
                "sync": (st.get("sync") or {}).get("status"),
                "applied": ((op.get("syncResult") or {}).get("revision")) or "",
                "phase": op.get("phase")}, None


    def contains(sha, rev):
        """True if revision `rev` of main includes commit `sha` (rev == sha, or main has
        moved on past it). Asked of GitHub as the App; None if it cannot say."""
        if not sha or not rev:
            return False
        if rev == sha:
            return True
        out = gh_api(f"/repos/{OWNER}/{REPO}/compare/{sha}...{rev}")
        if not isinstance(out, dict):
            return None
        return out.get("status") in ("ahead", "identical")


    def synced(apps, sha, timeout=420, require_applied=False, poll=8):
        """Wait, READ-ONLY, until Argo CD reports the merged revision (L-P1-016/022).

        This used to annotate each Application `argocd.argoproj.io/refresh=hard` with
        the ADMIN kubeconfig first. That is a cluster write, made from the agent's own
        process with the operator's credential, and it is gone (hardening item 1).
        Nudging Argo CD is the platform's job (item 10): the E2E driver (run.py) does
        it as the harness before calling `sync`; without a nudge Argo CD's own poll
        picks the merge up within its reconciliation interval (default 3 min).

        compared  status.sync.revision is the merge: what P8 always waited for;
        applied   (require_applied) status.operationState.syncResult.revision includes
                  it too and that operation Succeeded: Argo CD APPLIED the revision,
                  which is what the in-cluster runner waits for (L-P9-014: the compared
                  revision moving is not the change being applied);
                  AND THEN the platform's sync-confirm says the changed objects' live
                  spec matches git, removed fields included (item 10). Argo CD 2.14
                  reports Synced at a revision whose removed field is still live, so
                  no revision check alone can say "applied".
        Returns (ok, {app: status, "_platform": verdict})."""
        deadline = time.time() + timeout
        while True:
            cur, ok = {}, True
            for a in apps:
                st, err = _app_status(a)
                if st is None:
                    cur[a], ok = {"error": err}, False
                    continue
                cur[a] = st
                if require_applied:
                    ok &= (bool(contains(sha, st["compared"])) and bool(contains(sha, st["applied"]))
                           and st["phase"] == "Succeeded")
                else:
                    ok &= st["compared"] == sha
            if ok or time.time() >= deadline:
                break
            time.sleep(poll)
        if ok and require_applied:
            v = platform_applied(apps, sha, max(PLATFORM_MIN_WAIT, int(deadline - time.time())))
            cur["_platform"] = v
            ok = bool(v.get("applied"))
        return ok, cur


    # ------------------------------------------- item 10: the platform's word ---
    # Whether a merge is APPLIED is the platform's call, not the agent's. The agent
    # holds no Argo CD token and has no write verb; it asks the sync-confirm step
    # (scripts/sync/sync_confirm.py), which has its own read-only Argo CD view, and
    # waits for its verdict:
    #   SYNC_CONFIRM_URL       the in-cluster service: GET <url>/v1/confirm?apps=&sha=
    #   SYNC_CONFIRM_VERDICTS  a directory the harness writes `applied-<sha>.json` into
    #                          (`sync_confirm.py confirm --out`), for workstation runs
    # Neither set: there is no platform signal, and "applied" is never assumed.
    SYNC_CONFIRM_URL = os.environ.get("SYNC_CONFIRM_URL", "").rstrip("/")
    SYNC_CONFIRM_VERDICTS = os.environ.get("SYNC_CONFIRM_VERDICTS", "")
    # The platform always gets at least this long, even when the revision wait used
    # up the caller's timeout: confirming live == git renders and reads every app.
    PLATFORM_MIN_WAIT = int(os.environ.get("SYNC_CONFIRM_MIN_WAIT", "30"))


    def _verdict_ok(v, apps, sha):
        """The verdict is about THIS merge and covers every app asked about."""
        return (isinstance(v, dict) and str(v.get("sha") or "") == sha
                and set(apps) <= set((v.get("apps") or {}).keys()))


    def platform_applied(apps, sha, timeout=420, poll=8):
        """The platform's verdict on "merge `sha` is applied to `apps` and live == git".
        Never raises; {"applied": False, "state": ..., "reason": ...} when it can't say."""
        apps = list(apps)
        if SYNC_CONFIRM_URL:
            q = urllib.parse.urlencode({"apps": ",".join(apps), "sha": sha, "timeout": int(timeout)})
            try:
                req = urllib.request.Request(f"{SYNC_CONFIRM_URL}/v1/confirm?{q}", method="GET")
                req.add_header("Accept", "application/json")
                with urllib.request.urlopen(req, timeout=int(timeout) + 60) as r:
                    v = json.loads(r.read().decode() or "{}")
            except Exception as e:
                return {"applied": False, "state": "unavailable", "sha": sha,
                        "reason": f"sync-confirm unreachable: {type(e).__name__}"}
            if not _verdict_ok(v, apps, sha):
                return {"applied": False, "state": "unavailable", "sha": sha,
                        "reason": "sync-confirm answered about a different merge or other apps"}
            return v
        if SYNC_CONFIRM_VERDICTS:
            f = os.path.join(SYNC_CONFIRM_VERDICTS, f"applied-{sha}.json")
            deadline = time.time() + timeout
            while True:
                try:
                    v = json.load(open(f))
                    if _verdict_ok(v, apps, sha):
                        return v
                except (OSError, ValueError):
                    pass
                if time.time() >= deadline:
                    return {"applied": False, "state": "unavailable", "sha": sha,
                            "reason": f"no platform verdict for {sha[:8]} on {apps} after "
                                      f"{int(timeout)}s ({f})"}
                time.sleep(poll)
        return {"applied": False, "state": "unavailable", "sha": sha,
                "reason": "no platform sync-confirm signal is configured (SYNC_CONFIRM_URL or "
                          "SYNC_CONFIRM_VERDICTS); merged is never assumed to be applied"}


    def _note_or_flag(snow, sys_id, text, what):
        """A work note that must land. True if it did; False, logged loudly as a
        security event, if ServiceNow answered and stored nothing (item 8)."""
        try:
            return snow.note(sys_id, text)
        except NotStored as e:
            log(f"the {what} was NOT STORED in ServiceNow", sys_id=sys_id, security=True,
                detail=e.why)
            return False


    def escalate_unapplied(incident, fingerprint, apps, sha, cur, dry_run=False):
        """Merged is not applied: say so on the incident and leave it open (item 10).
        The agent has no write verb to fix it; a human syncs or inspects."""
        v = (cur or {}).get("_platform") or {}
        reason = v.get("reason") or "; ".join(
            f"{a}: {x.get('error') or ('compared ' + str(x.get('compared', ''))[:8] + ', applied ' + str(x.get('applied', ''))[:8] + ', ' + str(x.get('phase')))}"
            for a, x in (cur or {}).items() if a != "_platform" and isinstance(x, dict))
        problems = []
        for a, av in (v.get("apps") or {}).items():
            for o in av.get("objects") or []:
                for pb in o.get("problems") or []:
                    problems.append(f"{a} {o.get('object')}: "
                                    + (pb if isinstance(pb, str) else
                                       f"{pb.get('key')} {pb.get('kind')} (live {str(pb.get('live'))[:60]!r})"))
        text = (f"sre-agent: MERGED BUT NOT APPLIED. Merge {sha[:12]} is in git, but the platform "
                f"has not confirmed that Argo CD applied it to {', '.join(apps)} with the live "
                f"objects matching git ({v.get('state') or 'not confirmed'}). Recovery is not being "
                f"measured and this incident is NOT being closed.\n"
                f"why: {scrub(str(reason))[:400]}\n"
                + ("".join(f"  - {scrub(p)[:200]}\n" for p in problems[:10]))
                + "The agent has no write verb to sync it (L-P9-014): a human must sync the "
                  "Application or inspect the drift.\n"
                + f"correlation id: {fingerprint}")
        log("merged but not applied", incident=incident, sha=sha[:12], apps=apps,
            state=v.get("state"))
        if dry_run or not incident:
            return {"escalated": False, "dry_run": bool(dry_run), "note": text}
        snow = Snow()
        inc = snow.find(number=incident)
        if not inc:
            return {"escalated": False, "note": text, "error": f"no incident {incident}"}
        stored = _note_or_flag(snow, inc["sys_id"], text, "merged-but-not-applied escalation")
        return {"escalated": stored, "note": text, "incident": inc.get("number")}


    # Who fixed it decides what the closing record says. "agent": the agent's own
    # merged change. "human-after-escalation": the agent escalated (no git fix
    # existed), a human acted, and the agent only VERIFIED and closed.
    # "Resolved by caller" is in this instance's verified-to-store list (see
    # Snow.CLOSE_CODE), but note it is ALSO the value the instance silently
    # substitutes for a code it does not know, so a read-back of it cannot tell
    # "stored as asked" from "substituted"; it is still the honest code for "fixed
    # by someone other than the agent".
    CLOSE_CODES = {"agent": Snow.CLOSE_CODE, "human-after-escalation": "Resolved by caller"}


    def close(incident, fingerprint, alertname, pr=None, dns=False, settle=60,
              window="2m", timeout=600, workdir=None, dry_run=False, scope=None,
              fixed_by="agent", applied=None):
        """Verify recovery, then — and ONLY then — close the incident.

        `scope` is the path of the evidence bundle; when given, the verifier checks
        the incident's scope (docs/p9c-plan.md "Verifier") instead of checkout.

        `applied` ({"apps": [...], "sha": merge sha}): before recovery is measured at
        all, the PLATFORM must confirm the merge is applied and live matches git
        (item 10). If it does not within `applied["timeout"]`, the incident is
        escalated as "merged but not applied" and is not closed."""
        if fixed_by not in CLOSE_CODES:
            raise SystemExit(f"remediate: --fixed-by must be one of {sorted(CLOSE_CODES)}")
        if applied:
            ok, cur = synced(applied["apps"], applied["sha"], applied.get("timeout", 420),
                             require_applied=True)
            if not ok:
                esc = escalate_unapplied(incident, fingerprint, applied["apps"], applied["sha"],
                                         cur, dry_run=dry_run)
                return {"closed": False, "recovered": False, "applied": False,
                        "outstanding": ["merged-but-not-applied"], "verdict": None,
                        "applied_status": cur, "escalation": esc}
        workdir = workdir or os.path.join(STATE_DIR, "recovery")
        os.makedirs(workdir, exist_ok=True)
        out = os.path.join(workdir, f"recovery-{fingerprint}.json")
        # A verdict left by an earlier run must never stand in for this one.
        if os.path.exists(out):
            os.remove(out)
        args = [sys.executable, os.path.join(os.path.dirname(os.path.abspath(__file__)),
                                             "verify_recovery.py"),
                "--fingerprint", fingerprint, "--settle", str(settle), "--window", window,
                "--timeout", str(timeout), "--out", out]
        if alertname:
            args += ["--alertname", alertname]
        if dns:
            args.append("--dns")
        if scope:
            args += ["--scope", scope]
        r = subprocess.run(args, capture_output=True, text=True)
        print(r.stdout)
        verdict = json.load(open(out)) if os.path.exists(out) else {"recovered": False,
                                                                    "checks": [],
                                                                    "detail": r.stderr[:300]}
        snow = Snow()
        inc = snow.find(number=incident) if incident else None

        if not verdict.get("recovered"):
            failed = [c["check"] for c in verdict.get("checks", []) if not c["ok"]]
            note = ("sre-agent: NOT closing this incident. Recovery was measured and is not "
                    "verified.\nOutstanding: " + ", ".join(failed) + "\n"
                    + "\n".join(f"  - {c['check']}: {c['detail']}"
                                for c in verdict.get("checks", []) if not c["ok"]))
            stored = None
            if inc and not dry_run:
                stored = _note_or_flag(snow, inc["sys_id"], note, "refusal note")
            log("REFUSING to close — recovery not verified", incident=incident,
                outstanding=failed)
            return {"closed": False, "recovered": False, "outstanding": failed,
                    "verdict": verdict, "refusal_note_stored": stored}

        lines = "\n".join(f"  - {c['check']}: {c['detail']}" for c in verdict["checks"])
        if fixed_by == "human-after-escalation":
            head = ("sre-agent: recovery VERIFIED after a human acted on the agent's escalation; "
                    "closing.\nThe agent opened no change for this incident: it escalated, and "
                    "the fix was made by a person.\n")
        else:
            head = "sre-agent: recovery VERIFIED, closing.\n"
        note = (head + f"correlation id: {fingerprint}\n"
                + (f"remediation: {OWNER}/{REPO}#{pr}\n" if pr else "")
                + f"measured at {verdict['verified_at']} by the agent's read-only identity:\n{lines}")
        if dry_run or not inc:
            log("dry run or no incident — not writing to ServiceNow", incident=incident)
            return {"closed": False, "recovered": True, "dry_run": True, "verdict": verdict,
                    "fixed_by": fixed_by, "close_code_wanted": CLOSE_CODES[fixed_by], "note": note}
        # The close is asserted from the RE-READ record, never from the fact that
        # ServiceNow answered 200 (L-P8-005). `state` here is what the instance was
        # read back as holding after the walk; `trail` says which hop, if any, was
        # refused and what the field actually contained instead.
        state, after, trail = snow.resolve(inc["sys_id"], note, close_code=CLOSE_CODES[fixed_by])
        refused = [h for h in trail if not h["ok"]]
        # Every write of the close is read back (item 8): a hop the instance answered
        # and did not store fails the close, including the work note.
        ok = (str(state) in ("6", "7")
              and str(after.get("close_code", "")) != ""
              and str(after.get("close_notes", "")) != ""
              and not refused)
        log("close attempted", incident=incident, resulting_state=state, verified=ok,
            refused=[h["hop"] for h in refused] or None)
        if ok:
            why = None
        elif refused:
            h = refused[0]
            why = (f"ServiceNow answered 200 and stored nothing: the '{h['hop']}' hop asked for "
                   f"{h['field']}={h['wanted']!r} and the record reads back {h['read_back']!r}. "
                   f"The integration user lacks write on incident.{h['field']} — the stock "
                   f"'incident / Deny Unless / write' record ACL requires the itil role "
                   f"(L-P8-005).")
        else:
            why = (f"the incident reads back in state {state!r} with close_code "
                   f"{after.get('close_code','')!r} — the state moved but the closing record "
                   f"did not land")
        return {"closed": ok, "recovered": True, "state": state, "incident": incident,
                "sys_id": inc["sys_id"], "verdict": verdict, "close_trail": trail,
                "close_code": after.get("close_code"), "resolved_at": after.get("resolved_at"),
                "fixed_by": fixed_by, "note": why}


    # ------------------------------------------------------------------- main ---
    def main():
        ap = argparse.ArgumentParser()
        sub = ap.add_subparsers(dest="cmd", required=True)
        p1 = sub.add_parser("plan"); p1.add_argument("--diagnosis", required=True)
        p1.add_argument("--evidence", default="", help="the evidence bundle (P9c scope)")
        p2 = sub.add_parser("propose")
        p2.add_argument("--diagnosis", required=True)
        p2.add_argument("--fingerprint", "--correlation-id", dest="fingerprint", required=True)
        p2.add_argument("--incident", default="")
        p2.add_argument("--thread-url", default="")
        p2.add_argument("--evidence", default="",
                        help="the evidence bundle; required for a P9c revert (its scope and "
                             "git items are what the revert is checked against)")
        p2.add_argument("--out", default="")
        p6 = sub.add_parser("escalate")
        p6.add_argument("--diagnosis", required=True)
        p6.add_argument("--evidence", required=True)
        p6.add_argument("--incident", default="", help="default: the bundle's incident number")
        p6.add_argument("--fingerprint", "--correlation-id", dest="fingerprint", default="", help="default: the bundle's fingerprint")
        p6.add_argument("--dry-run", action="store_true")
        p6.add_argument("--out", default="")
        p3 = sub.add_parser("land"); p3.add_argument("--pr", type=int, required=True)
        p3.add_argument("--timeout", type=int, default=900)
        p4 = sub.add_parser("sync"); p4.add_argument("--apps", required=True)
        p4.add_argument("--sha", required=True)
        p4.add_argument("--timeout", type=int, default=420)
        p4.add_argument("--require-applied", action="store_true",
                        help="also wait for Argo CD's APPLIED revision (operationState), not only "
                             "the compared one, and for the platform's sync-confirm verdict that "
                             "live matches git (item 10)")
        p4.add_argument("--incident", default="",
                        help="with --require-applied: escalate this incident as 'merged but not "
                             "applied' if the platform does not confirm in time")
        p4.add_argument("--fingerprint", "--correlation-id", dest="fingerprint", default="")
        p5 = sub.add_parser("close")
        p5.add_argument("--incident", default="")
        p5.add_argument("--fingerprint", "--correlation-id", dest="fingerprint", required=True)
        p5.add_argument("--alertname", default="")
        p5.add_argument("--pr", default="")
        p5.add_argument("--dns", action="store_true")
        p5.add_argument("--settle", type=int, default=60)
        p5.add_argument("--window", default="2m")
        p5.add_argument("--timeout", type=int, default=600)
        p5.add_argument("--dry-run", action="store_true")
        p5.add_argument("--scope", default="",
                        help="the evidence bundle: verify the incident's scope, not checkout")
        p5.add_argument("--fixed-by", default="agent", choices=sorted(CLOSE_CODES))
        p5.add_argument("--applied-sha", default="",
                        help="the merge commit: before measuring recovery, require the platform's "
                             "confirmation that it is applied and live == git (item 10); if not, "
                             "escalate as 'merged but not applied' and do not close")
        p5.add_argument("--apps", default="", help="with --applied-sha: the Argo CD Applications")
        p5.add_argument("--applied-timeout", type=int, default=420)
        p5.add_argument("--out", default="")
        a = ap.parse_args()

        def bundle_of(path):
            return json.load(open(path)) if path else None

        if a.cmd == "plan":
            print(json.dumps(plan(json.load(open(a.diagnosis)), bundle_of(a.evidence)), indent=2))
            return 0
        if a.cmd == "propose":
            r = propose(json.load(open(a.diagnosis)), a.fingerprint, a.incident, a.thread_url,
                        bundle_of(a.evidence))
            if a.out:
                json.dump(r, open(a.out, "w"), indent=2)
            print(json.dumps(r, indent=2)); return 0
        if a.cmd == "escalate":
