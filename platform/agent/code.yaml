        if s.get("emails"):
            def em(m):
                if keep(m.group(0)):
                    return m.group(0)
                hit("email")
                return _ph("email")
            text = _EMAIL.sub(em, text)

        def alias(kind, v):
            n = aliases.setdefault((kind, v), sum(1 for k in aliases if k[0] == kind) + 1)
            hit(kind)
            return f"[REDACTED:{kind}#{n}]"
