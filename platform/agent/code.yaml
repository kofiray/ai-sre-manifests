    #!/usr/bin/env python3
    """The write path: diagnosis -> pull request -> merge -> sync -> VERIFY -> close.

    SPEC §7 P6. The agent's only write surface in the universe is a pull request on
    the manifests repo (SPEC §1.1), and an incident is closed only after measured
    recovery (SPEC §1.5). Both of those are enforced here rather than described:

      * every change is produced as a git patch and pushed with the GitHub App's
        credentials — there is no code path in this file that talks to the cluster
        with a write verb, because the identity it would need does not exist;
      * `close` calls the recovery verifier FIRST and returns a refusal if the
        estate does not measure as recovered. The refusal is the feature. A close
        that happens anyway is the failure this phase exists to prevent.

    HOW A FIX IS CONSTRUCTED. For a wedged process the fix is a restart, expressed
    declaratively as a bump of `sre-agent/restartedAt` (the T1 shape). For every
    other class the fault arrived as a manifest change, and the fix is the reverse
    of that change, produced with `git diff` and applied as a patch:

      * it preserves the file's comments and every later unrelated edit, which a
        YAML round-trip would silently destroy;
      * it fails LOUDLY (patch conflict) instead of guessing, if the file moved on;
      * it is exactly reviewable — the diff a human sees is the inverse of the diff
        that broke it;
      * commits authored by the agent itself are skipped when looking for what to
        revert, so a fix can never undo a previous fix and loop.

    P9c (docs/p9c-plan.md "Remediation"). Outside checkout, `plan(diag, bundle)`
    takes the diagnosis's `disposition`: `revert` reverses the commit it names
    (`build_revert_commit`, several files, added files deleted via `gh_app.py rm`)
    after checking that commit is in the evidence bundle, not the agent's own, and
    that every path is one it changed inside the incident's scope; `escalate`
    writes a ServiceNow escalation (`remediate.py escalate`) and opens no pull
    request. A T1 change that would set a replica count to 0 is refused.

    The tier is NEVER taken from the model's answer. `path_policy.classify` computes
    it from the paths and the diff shape, and the platform's status check computes it
    again independently on the pull request — the model's `tier` field is recorded
    and compared, not obeyed.

    Hardening (PLAN-hardening.md):
      * F04 / P8 15 Nov: when the diagnosis implicates a commit (checked against the
        evidence bundle), the legacy fix is the inverse of THAT commit; the class ->
        file table is only the fallback when no commit is implicated (plan()).
      * item 9: one pull request per incident; propose reuses the open agent PR that
        carries the correlation id (open_or_reuse).
      * item 10: merged is not applied; `sync --require-applied` and `close
        --applied-sha` wait on the platform's sync-confirm verdict (live == git,
        removed fields included) and escalate "merged but not applied" otherwise.
      * item 8: every ServiceNow write is read back; notes go to work_notes.
    """
