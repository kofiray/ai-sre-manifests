        def kv(m):
            v = m.group("eq") or m.group("dq") or m.group("sq") or m.group("bare")
            strong = bool(re.fullmatch(_STRONG_KEY, m.group("word"), re.I))
            if keep(v) or (not strong and not _secret_like(v)):
                return m.group(0)
