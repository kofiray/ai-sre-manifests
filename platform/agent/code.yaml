                    kind = {"bearer": "bearer", "basic": "basic-auth"}.get(m.group("scheme").lower(),
                                                                          "auth-header")
                hit(kind)
                if "v" in rx.groupindex:
                    a, b = m.start("v") - m.start(0), m.end("v") - m.start(0)
                    return m.group(0)[:a] + _ph(kind) + m.group(0)[b:]
                return _ph(kind)
