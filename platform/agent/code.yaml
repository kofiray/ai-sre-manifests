    #!/usr/bin/env python3
    """The agent's Kubernetes client: HTTP GET only, as the agent's own identity only.

    Hardening item 1. This replaces every `kubectl` subprocess on the agent's path.

    IDENTITY, in this order and nothing else:
      1. in a pod: the projected ServiceAccount token and CA under
         /var/run/secrets/kubernetes.io/serviceaccount (the agent workload);
      2. on the workstation: the agent's minted kubeconfig (AGENT_KUBECONFIG, default
         .work/agent-kubeconfig from scripts/agent/kubeconfig.sh), and only if its user
         authenticates with a bearer TOKEN.
    There is no third option. The operator's admin kubeconfig (written by talosctl)
    uses a client certificate, and a kubeconfig whose user carries a client
    certificate, an exec plugin, an auth provider or a password is refused, so the
    old "fall back to KUBECONFIG/admin" path cannot come back by configuration.

    GET ONLY. There is no method here that sends anything but GET. The agent's write
    surface is a pull request, never the cluster (SPEC §1.1); its RBAC already
    refuses writes, and this client cannot even ask.

    `kubectl(args)` accepts the small kubectl argument shapes the agent's modules
    were written against (get / get --raw / logs) and answers them over REST, so the
    call sites and their offline fakes stay as they were. Anything else is refused.
    """
    import base64
    import json
    import os
    import ssl
    import urllib.error
    import urllib.parse
    import urllib.request

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    SA_DIR = os.environ.get("KUBE_SA_DIR", "/var/run/secrets/kubernetes.io/serviceaccount")


    def agent_kubeconfig_path():
        return os.environ.get("AGENT_KUBECONFIG", os.path.join(ROOT, ".work", "agent-kubeconfig"))


    class NoIdentity(RuntimeError):
        pass


    def in_cluster():
        return bool(os.environ.get("KUBERNETES_SERVICE_HOST")) and os.path.isfile(
            os.path.join(SA_DIR, "token"))


    class Identity:
        def __init__(self, server, token_fn, ctx, label):
            self.server, self.token_fn, self.ctx, self.label = server.rstrip("/"), token_fn, ctx, label


    def _load_kubeconfig(path):
        text = open(path).read()
        try:
            import yaml
            doc = yaml.safe_load(text)
        except ImportError:
            doc = json.loads(text)
        ctxs = {c["name"]: c.get("context") or {} for c in doc.get("contexts") or []}
        cur = ctxs.get(doc.get("current-context")) or (next(iter(ctxs.values())) if ctxs else {})
        clusters = {c["name"]: c.get("cluster") or {} for c in doc.get("clusters") or []}
        users = {u["name"]: u.get("user") or {} for u in doc.get("users") or []}
        cl = clusters.get(cur.get("cluster")) or (next(iter(clusters.values())) if clusters else {})
        us = users.get(cur.get("user")) or (next(iter(users.values())) if users else {})
        return cl, us


    REFUSED_USER_KEYS = ("client-certificate", "client-certificate-data", "client-key",
                         "client-key-data", "exec", "auth-provider", "username", "password",
                         "tokenFile", "as", "as-groups")


    def identity(kubeconfig=None):
        """The agent's identity, or NoIdentity. Never the operator's."""
        if kubeconfig is None and in_cluster():
            host = os.environ["KUBERNETES_SERVICE_HOST"]
            port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS") or os.environ.get(
                "KUBERNETES_SERVICE_PORT", "443")
            if ":" in host and not host.startswith("["):
                host = f"[{host}]"
            ctx = ssl.create_default_context(cafile=os.path.join(SA_DIR, "ca.crt"))
            tok = os.path.join(SA_DIR, "token")
            ns = ""
            if os.path.isfile(os.path.join(SA_DIR, "namespace")):
                ns = open(os.path.join(SA_DIR, "namespace")).read().strip()
            # Read on every request: the kubelet rotates the projected token.
            return Identity(f"https://{host}:{port}", lambda: open(tok).read().strip(), ctx,
                            f"in-cluster ServiceAccount token (namespace {ns or '?'})")
        path = kubeconfig or agent_kubeconfig_path()
        if not os.path.isfile(path):
            raise NoIdentity(f"no agent identity: not running in a pod, and no agent kubeconfig at "
                             f"{path} (mint one with scripts/agent/kubeconfig.sh). The admin "
                             f"kubeconfig is never used.")
        cl, us = _load_kubeconfig(path)
        bad = [k for k in REFUSED_USER_KEYS if us.get(k)]
        if bad or not us.get("token"):
