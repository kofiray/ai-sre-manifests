    #!/usr/bin/env python3
    """The agent's write path: act on the manifests repo AS the GitHub App.

    Why this exists (and why it is not `git push` + `gh`):

      * SPEC §1.1 — the agent's only write surface in the universe is pull requests
        on the manifests repo. That write surface has to be the APP identity
        (`sre-agent[bot]`), not the operator's account, or none of §4's invariants
        ("the agent can never merge its own reviewed-path PR") mean anything.
      * Hard rule 1 — no secret value may reach a file, a log, an argv, or any
        output. An installation access token IS a secret value. So it is minted
        in-process from Secret Manager, held in a local variable, used, and dropped.
        It is never printed, never written to `.git/config` as a push URL, and never
        passed on a command line where /proc would expose it.

    Because the token must not touch git's on-disk config, commits are made through
    the GitHub Contents/Git APIs rather than by pushing a work tree. For the small,
    targeted edits this platform makes — one manifest file per change — that is both
    sufficient and more auditable.

    usage:
      gh_app.py whoami
      gh_app.py branch   NAME [--from main]
      gh_app.py put      PATH --branch B --message M --content-file F
      gh_app.py rm       PATH --branch B --message M
      gh_app.py pr       --head H [--base main] --title T --body-file F [--draft]
      gh_app.py approve  PR [--body B]
      gh_app.py merge    PR [--method squash]
      gh_app.py state    PR
    All output is metadata (numbers, names, states). Never a token.
    """
    import argparse, base64, json, os, sys, threading, time, urllib.error, urllib.parse, urllib.request

    sys.path.insert(0, os.path.join(os.path.dirname(os.path.abspath(__file__)), "agent"))
    import gcp_auth  # noqa: E402  (WIF in the agent's pod; the operator's gcloud on the workstation)

    API = "https://api.github.com"
    PROJECT = gcp_auth.project()
    OWNER = os.environ.get("MANIFESTS_OWNER", "kofiray")
    REPO = os.environ.get("MANIFESTS_REPO_NAME", "ai-sre-manifests")


    def _sm(name):
        """Read a secret value in-process. Never logged, never returned to a caller
        that prints. Raises with a NAME only — never the value, never str(e)."""
        v = gcp_auth.secret(name, PROJECT)
        if v is None:
            raise RuntimeError(f"cannot read secret {name} ({gcp_auth.mode()} credentials)")
        return v


    def _api(url, token, method="GET", body=None, accept="application/vnd.github+json"):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url if url.startswith("http") else API + url,
                                     data=data, method=method)
        req.add_header("Authorization", f"Bearer {token}")
        req.add_header("Accept", accept)
        req.add_header("X-GitHub-Api-Version", "2022-11-28")
        if data:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return r.status, json.loads(r.read() or b"{}")
        except urllib.error.HTTPError as e:
            try:
                return e.code, json.loads(e.read() or b"{}")
            except Exception:
                return e.code, {}


    def _token():
        """Mint a short-lived installation access token. In-process only."""
        import jwt
        app_id = _sm("sre-agent-github-app-id").strip()
        pem = _sm("sre-agent-github-app-private-key")
        inst = _sm("sre-agent-github-app-installation-id").strip()
        now = int(time.time())
        app_jwt = jwt.encode({"iat": now - 60, "exp": now + 540, "iss": int(app_id)},
                             pem, algorithm="RS256")
        st, tok = _api(f"/app/installations/{inst}/access_tokens", app_jwt, "POST")
        if st != 201:
            raise RuntimeError(f"installation token request failed: HTTP {st} "
                               f"({tok.get('message', 'no message')})")
        return tok["token"]


    _tok_lock = threading.Lock()
    _tok = {"value": None, "at": 0.0}
    TOKEN_REUSE_S = 45 * 60     # installation tokens live 60 min; re-mint well before


    def token():
        """The installation token, minted once and reused in this process for up to 45
        minutes. Held in memory only, like _token()'s."""
        with _tok_lock:
            if not _tok["value"] or time.time() - _tok["at"] > TOKEN_REUSE_S:
                _tok["value"], _tok["at"] = _token(), time.time()
            return _tok["value"]


    def api(path, method="GET", body=None):
        """One REST call as the App, in-process. Returns (status, json). This is what
        replaced the `gh` CLI on the agent's path: there is no `gh` in the agent image,
        and the operator's GitHub login is never what the agent acts as."""
        return _api(path, token(), method, body)


    def in_agent_workload():
        """True inside the agent's pod (WIF credentials). There the App is used only to
        open branches and pull requests: approve and merge are refused by this client."""
        try:
            return gcp_auth.mode() == "wif"
        except Exception:
            return True


    def _die(msg, code=1):
        print(f"gh_app: {msg}", file=sys.stderr)
        sys.exit(code)


    def main():
        ap = argparse.ArgumentParser(prog="gh_app.py")
        sub = ap.add_subparsers(dest="cmd", required=True)
        sub.add_parser("whoami")
        sub.add_parser("slug")
        b = sub.add_parser("branch"); b.add_argument("name"); b.add_argument("--from", dest="base", default="main")
        p = sub.add_parser("put"); p.add_argument("path"); p.add_argument("--branch", required=True)
        p.add_argument("--message", required=True); p.add_argument("--content-file", required=True)
        d = sub.add_parser("rm"); d.add_argument("path"); d.add_argument("--branch", required=True)
        d.add_argument("--message", required=True)
        r = sub.add_parser("pr"); r.add_argument("--head", required=True); r.add_argument("--base", default="main")
        r.add_argument("--title", required=True); r.add_argument("--body-file", required=True)
        r.add_argument("--draft", action="store_true")
        a = sub.add_parser("approve"); a.add_argument("pr", type=int); a.add_argument("--body", default="")
        m = sub.add_parser("merge"); m.add_argument("pr", type=int); m.add_argument("--method", default="squash")
        s = sub.add_parser("state"); s.add_argument("pr", type=int)
        args = ap.parse_args()

        if args.cmd in ("approve", "merge") and in_agent_workload():
            # Defence in depth (hardening item 1): the agent never approves or merges.
            # T1 merges are GitHub Actions' (auto-merge.yml); everything else is a human's.
            _die(f"'{args.cmd}' is refused inside the agent workload: the agent never approves or "
                 f"merges a pull request", code=5)

        if args.cmd == "slug":
            # The App's own identity, from the App JWT (an installation token cannot
            # read /app). A GitHub App authors PRs as `<slug>[bot]`; the path-policy
            # classifier MUST agree with this string or no agent rule ever fires.
            import jwt
            app_id = _sm("sre-agent-github-app-id").strip()
            pem = _sm("sre-agent-github-app-private-key")
            now = int(time.time())
            app_jwt = jwt.encode({"iat": now - 60, "exp": now + 540, "iss": int(app_id)},
                                 pem, algorithm="RS256")
            st, app = _api("/app", app_jwt)
            if st != 200:
                _die(f"GET /app failed: HTTP {st} ({app.get('message')})")
            print(json.dumps({"slug": app["slug"], "bot_login": app["slug"] + "[bot]",
                              "name": app.get("name")}))
            return 0

        t = _token()
        R = f"/repos/{OWNER}/{REPO}"

        if args.cmd == "whoami":
            st, me = _api("/app", t)  # installation token cannot read /app; use the repo instead
            st, inst = _api(f"{R}/installation", t)
            st2, perms = _api(R, t)
            print(json.dumps({"repo_readable": st2 == 200, "installation_http": st,
                              "app_slug": inst.get("app_slug"), "account": (inst.get("account") or {}).get("login"),
                              "permissions": inst.get("permissions")}, indent=1))
            return 0

        if args.cmd == "branch":
            st, ref = _api(f"{R}/git/ref/heads/{args.base}", t)
            if st != 200:
                _die(f"cannot read base ref {args.base}: HTTP {st}")
            sha = ref["object"]["sha"]
            st, out = _api(f"{R}/git/refs", t, "POST",
                           {"ref": f"refs/heads/{args.name}", "sha": sha})
            if st == 422:  # already exists — make it point at base (idempotent re-runs)
                st, out = _api(f"{R}/git/refs/heads/{args.name}", t, "PATCH",
                               {"sha": sha, "force": True})
            if st not in (200, 201):
                _die(f"cannot create branch {args.name}: HTTP {st} ({out.get('message')})")
            print(json.dumps({"branch": args.name, "from": args.base, "sha": sha[:8]}))
            return 0

        if args.cmd == "put":
            content = open(args.content_file, "rb").read()
            st, cur = _api(f"{R}/contents/{args.path}?ref={args.branch}", t)
            body = {"message": args.message, "branch": args.branch,
                    "content": base64.b64encode(content).decode()}
            if st == 200 and "sha" in cur:
                body["sha"] = cur["sha"]
            st, out = _api(f"{R}/contents/{args.path}", t, "PUT", body)
            if st not in (200, 201):
                _die(f"cannot write {args.path}: HTTP {st} ({out.get('message')})")
            print(json.dumps({"path": args.path, "branch": args.branch,
                              "commit": out["commit"]["sha"][:8]}))
            return 0

        if args.cmd == "rm":
            # A break that ADDED a file is reverted by deleting it (P9c: K03's
            # CiliumNetworkPolicy, C09's cache PVC). The Contents API DELETE needs the
            # blob sha of the file as it is on that branch; a path that is not a
            # single file there is refused rather than guessed at.
            q = urllib.parse.quote(args.path, safe="/")
            st, cur = _api(f"{R}/contents/{q}?ref={urllib.parse.quote(args.branch, safe='')}", t)
            if st != 200 or not isinstance(cur, dict) or cur.get("type") != "file" \
                    or "sha" not in cur:
                _die(f"cannot delete {args.path}: not a file on {args.branch} (HTTP {st})")
            st, out = _api(f"{R}/contents/{q}", t, "DELETE",
                           {"message": args.message, "branch": args.branch, "sha": cur["sha"]})
            if st != 200:
                _die(f"cannot delete {args.path}: HTTP {st} ({out.get('message')})")
            print(json.dumps({"path": args.path, "branch": args.branch, "deleted": True,
                              "commit": ((out.get("commit") or {}).get("sha") or "")[:8]}))
            return 0

        if args.cmd == "pr":
            st, out = _api(f"{R}/pulls", t, "POST",
                           {"head": args.head, "base": args.base, "title": args.title,
                            "body": open(args.body_file).read(), "draft": bool(args.draft)})
            if st != 201:
                _die(f"cannot open PR: HTTP {st} ({out.get('message')}) {out.get('errors','')}")
            print(json.dumps({"number": out["number"], "url": out["html_url"],
                              "author": out["user"]["login"], "draft": out["draft"]}))
            return 0

        if args.cmd == "approve":
            st, out = _api(f"{R}/pulls/{args.pr}/reviews", t, "POST",
                           {"event": "APPROVE", "body": args.body or "approved by the platform"})
            print(json.dumps({"http": st, "state": out.get("state"),
                              "reviewer": (out.get("user") or {}).get("login"),
                              "message": out.get("message")}))
            return 0 if st in (200, 201) else 1

        if args.cmd == "merge":
            st, out = _api(f"{R}/pulls/{args.pr}/merge", t, "PUT", {"merge_method": args.method})
            print(json.dumps({"http": st, "merged": out.get("merged", False),
                              "message": out.get("message"), "sha": (out.get("sha") or "")[:8]}))
            return 0 if st == 200 else 1

        if args.cmd == "state":
            st, out = _api(f"{R}/pulls/{args.pr}", t)
            st2, rv = _api(f"{R}/pulls/{args.pr}/reviews", t)
            print(json.dumps({"number": out.get("number"), "state": out.get("state"),
                              "draft": out.get("draft"), "mergeable": out.get("mergeable"),
                              "mergeable_state": out.get("mergeable_state"),
                              "author": (out.get("user") or {}).get("login"),
                              "reviews": [{"user": x["user"]["login"], "state": x["state"]} for x in (rv or [])]},
                             indent=1))
            return 0
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
