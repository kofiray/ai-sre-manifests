            sli_rec["baseline_window"] = baseline_doc["window"]
        verdict.update(baseline=info.get("baseline"), observed=info.get("observed"),
                       tolerance=info.get("tolerance"), blocked=bool(info.get("blocked")))
        if scope is not None:
            verdict.update(mode="scope", scope={k: scope.get(k) for k in ("namespaces", "apps")},
                           sli=dict(sli or {}, **sli_rec))
        else:
            verdict.update(sli=sli_rec)
        for c in v.checks:
            print(f"  [{'ok ' if c['ok'] else 'NOT'}] {c['check']}: {c['detail']}")
        print(f"recovery: {'VERIFIED' if v.recovered else 'NOT VERIFIED'}")
        if a.out:
            os.makedirs(os.path.dirname(os.path.abspath(a.out)), exist_ok=True)
            json.dump(verdict, open(a.out, "w"), indent=2)
        else:
            print(json.dumps(verdict, indent=2))
        return 0 if v.recovered else 1


    if __name__ == "__main__":
        raise SystemExit(main())
