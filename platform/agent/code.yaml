    #!/usr/bin/env python3
    """The agent's read path to the metrics stack, as the AGENT'S identity.

    Every query here goes through the API server's service proxy with a GET. The
    obvious alternative — `kubectl exec` into the Prometheus pod and curl localhost,
    which is what the read path did before the agent had an identity of its own — is
    a `create` on pods/exec: a cluster write, and one that grants arbitrary command
    execution inside somebody else's container. A read path that needs a write verb
    is not a read path.

    Nothing here ever converts "I could not find out" into "it is fine". Each helper
    returns either a value or None, and None is never a healthy answer; the callers
    treat it as UNKNOWN and refuse to certify recovery on it.
    """
    import json
    import os
    import sys
    import urllib.parse

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    sys.path.insert(0, os.path.join(ROOT, "scripts", "agent"))
    import kube  # noqa: E402  (GET-only, the agent's own identity only)

    AGENT_KC = kube.agent_kubeconfig_path()
    MON_NS = os.environ.get("MONITORING_NAMESPACE", "monitoring")
    # Candidate Services, in preference order. The headless `*-operated` Services the
    # prometheus-operator creates are the stable names; the chart's own Services are
    # tried as a fallback so a chart rename does not silently disable verification.
    PROM_SVCS = os.environ.get("PROM_SERVICES", "kps-prometheus:9090,prometheus-operated:9090").split(",")
    AM_SVCS = os.environ.get("AM_SERVICES", "kps-alertmanager:9093,alertmanager-operated:9093").split(",")


    def kubeconfig():
        """The agent's own credential: None inside its pod (the ServiceAccount token),
        else the agent's minted kubeconfig path.

        There used to be a fallback to the operator's admin kubeconfig "so this module
        is usable before ArgoCD has delivered the agent identity". It is gone
        (hardening item 1): verification is part of the agent's job, and a verdict
        measured with the operator's credential is not the agent's verdict. With no
        agent identity, every read here fails, and the verifier refuses to certify.
        """
        return None if kube.in_cluster() else AGENT_KC


    def identity_label():
        """Which identity measured, for the verdict (never 'admin')."""
        return kube.label(kubeconfig())


    def kubectl(args, kc=None, timeout=60):
        """A kubectl-shaped READ, answered over REST by kube.py. Returns (rc, out, err).
        `kc` may only name another token kubeconfig; kube.py refuses an admin one."""
        rc, out, err = kube.kubectl(list(args), kubeconfig=kc or kubeconfig(), timeout=min(timeout, 30))
        return rc, out.strip(), err.strip()


    def _proxy(svcs, path):
        last = ""
        for svc in svcs:
            name, _, port = svc.strip().partition(":")
            raw = f"/api/v1/namespaces/{MON_NS}/services/http:{name}:{port or '80'}/proxy{path}"
            rc, out, err = kubectl(["get", "--raw", raw])
            if rc == 0 and out:
                return out, None
            last = f"{name}: {(err or 'empty response')[:120]}"
        return None, last


    def prom_query(expr):
        """Instant query. Returns the result list, or None if Prometheus did not answer."""
        out, err = _proxy(PROM_SVCS, "/api/v1/query?query=" + urllib.parse.quote(expr, safe=""))
        if out is None:
            return None, err
        try:
            j = json.loads(out)
        except Exception as e:
            return None, f"unparseable Prometheus response: {e}"
        if j.get("status") != "success":
            return None, f"Prometheus returned status={j.get('status')}: {str(j.get('error'))[:120]}"
        return j["data"]["result"], None


    def prom_scalar(expr):
        """A single number, or (None, why). An EMPTY result is None — 'no series' is
        not zero, it is 'I cannot see it', and the difference is the whole point."""
        res, err = prom_query(expr)
        if res is None:
            return None, err
        if not res:
            return None, "the query returned no series (absence of data is not a value)"
        try:
            return float(res[0]["value"][1]), None
        except Exception as e:
            return None, f"could not read the sample: {e}"


    def alerts():
        """Alertmanager's active alerts, or None if Alertmanager did not answer."""
        out, err = _proxy(AM_SVCS, "/api/v2/alerts?active=true&silenced=false&inhibited=false")
        if out is None:
            return None, err
        try:
            j = json.loads(out)
        except Exception as e:
            return None, f"unparseable Alertmanager response: {e}"
        if not isinstance(j, list):
            return None, "Alertmanager did not return a list of alerts"
        return j, None
