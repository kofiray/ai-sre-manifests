    1. **The agent sees the symptom, never the author's explanation** (L-P4-001,
       L-P9-018). Scenario alerts carry a `scenario` label, and on the ML estate their
       summary and description annotations name the cause outright. The P8 diagnosis
       was overstated because those annotations reached the model. So:
         - the alert keeps its labels minus `scenario`, with `alertname` replaced by
           `alert-<fp8>`; NO annotations; `startsAt`; and the rule's expression
           (from `generatorURL`'s `g0.expr`) as the definition of the symptom;
         - the ServiceNow item keeps number, state, opened_at and correlation_id only
           (short_description and description carry `[ID]` and the summary); a REOPENED
           incident's item says which occurrence this is and when it started instead of
           `opened_at` alone (see "a recurrence" below); the journals are never read;
