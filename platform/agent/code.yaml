            text = _PRIVATE_IP.sub(lambda m: m.group(0) if keep(m.group(0)) or
                                   any(int(o) > 255 for o in m.group(0).split("."))
                                   else alias("private-ip", m.group(0)), text)
        if s.get("node_hostnames") and nodes_rx is not None:
            text = nodes_rx.sub(lambda m: m.group(0) if keep(m.group(0))
                                else alias("node", m.group(0)), text)
        return text


    def _protected(bundle):
        """Values in this bundle that are evidence of their own and must survive any
        pattern: commit shas, revisions, image digests, correlation ids, the fingerprint."""
        out = set(bundle_shas(bundle))
        for k in ("fingerprint", "correlation_id", "incident"):
            if isinstance(bundle.get(k), str) and bundle[k]:
                out.add(bundle[k])

        def walk(o):
            if isinstance(o, dict):
                for k, v in o.items():
                    if isinstance(v, str) and k in ("sha", "revision", "correlation_id", "fingerprint",
                                                     "imageID", "digest", "commit"):
                        out.add(v)
                    walk(v)
            elif isinstance(o, list):
                for v in o:
                    walk(v)
            elif isinstance(o, str):
                out.update(_DIGEST.findall(o))
                out.update(_CID.findall(o))
        walk({"e": bundle.get("evidence"), "s": bundle.get("scope")})
        return frozenset(v for v in out if v)


    def _node_names(bundle, settings):
        names = set()

        def walk(o):
            if isinstance(o, dict):
                for k, v in o.items():
                    if k in ("node", "nodeName", "hostname") and isinstance(v, str) and v:
                        names.add(v)
                    walk(v)
            elif isinstance(o, list):
                for v in o:
                    walk(v)
        walk(bundle.get("evidence"))
        alts = [re.escape(n) for n in sorted(names, key=len, reverse=True)]
        alts += [f"(?:{p})" for p in settings.get("node_name_patterns") or []] + [_INTERNAL_HOST]
        return re.compile(r"(?<![A-Za-z0-9])(?:" + "|".join(alts) + r")(?![A-Za-z0-9])")


    def scrub_bundle(bundle, settings=None):
        """(scrubbed copy of the bundle, `_meta.redactions`). Every string in every
        evidence item and in the scope, dict keys included; an item's `id` is never
        touched. The input is not modified."""
        s = scrub_settings({}) if settings is None else settings
        protected, aliases = _protected(bundle), {}
        nodes_rx = _node_names(bundle, s) if s.get("node_hostnames") else None
        by_kind, ids = {}, set()

        def run(o, eid, top=False):
            def hit(kind):
                by_kind[kind] = by_kind.get(kind, 0) + 1
                ids.add(eid)

            def t(x):
                return scrub_text(x, s, hit, protected, aliases, nodes_rx)
            if isinstance(o, dict):
                out = {}
                for k, v in o.items():
                    if top and k == "id":
                        out[k] = v
                        continue
                    kk = t(k) if isinstance(k, str) else k
                    nk = _norm_key_kind(k)
                    if nk and isinstance(v, str) and v and not re.search(r"\s", v) \
                            and not (v in protected or _PLACEHOLDER.match(v)) and (nk[1] or _secret_like(v)):
                        hit(nk[0])
                        out[kk] = _ph(nk[0])
                    else:
                        out[kk] = run(v, eid)
                return out
            if isinstance(o, list):
                return [run(v, eid) for v in o]
            if isinstance(o, str):
                return t(o)
            return o

        clean = dict(bundle)
        clean["evidence"] = [run(e, str(e.get("id") or f"#{i}"), top=True) if isinstance(e, dict)
                             else run(e, f"#{i}") for i, e in enumerate(bundle.get("evidence") or [])]
        if bundle.get("scope") is not None:
            clean["scope"] = run(bundle["scope"], "scope")
        return clean, {"count": sum(by_kind.values()), "kinds": sorted(by_kind),
                       "by_kind": dict(sorted(by_kind.items())), "evidence_ids": sorted(ids),
                       "settings": {k: s[k] for k in SCRUB_DEFAULTS}}


    def secret_objects(bundle):
        """Where a Kubernetes Secret OBJECT (one with data/stringData) sits in the
        evidence or scope. Empty = none. A reference such as an Argo CD resource entry
        {"kind": "Secret", "name": ..., "status": ...} is not an object and is fine."""
        found = []
        js = re.compile(r"\"kind\"\s*:\s*\"Secret\"")
        jd = re.compile(r"\"(?:data|stringData)\"\s*:\s*\{")

        def walk(o, path):
            if isinstance(o, dict):
                if o.get("kind") == "Secret" and ("data" in o or "stringData" in o):
                    found.append(path or "/")
                for k, v in o.items():
                    walk(v, f"{path}/{k}")
            elif isinstance(o, list):
                for i, v in enumerate(o):
                    walk(v, f"{path}[{i}]")
            elif isinstance(o, str) and js.search(o) and jd.search(o):
                found.append(f"{path} (as JSON text)")
        walk({"evidence": bundle.get("evidence"), "scope": bundle.get("scope")}, "")
        return found


    _REC_ISO = re.compile(r"^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$")


    def recurrence_text(rec):
        """The trusted note for a recurrence (evidence.py `recurrence_record`), or "".

        It is built from the bundle's top-level `recurrence` record, which evidence.py fills
        from the agent's own runner checkpoints, ServiceNow's reopen time and git shas, never
        from evidence text; and every value is checked against its shape here (an int, a sha,
        a UTC timestamp), so nothing free-form reaches the instructions part of the prompt. A
        bundle without the record (every first occurrence) gets "" and an unchanged prompt."""
        if not isinstance(rec, dict):
            return ""
        n = rec.get("occurrence")

        def t(x):
            return x if isinstance(x, str) and _REC_ISO.match(x) else None
        if not (isinstance(n, int) and n > 1 and t(rec.get("started_at"))):
            return ""
        prev = t(rec.get("previous_resolved_at")) or "an unknown time"
        lines = [f"RECURRENCE (from the agent's own records, outside the evidence): this incident is "
                 f"OCCURRENCE {n}. It was resolved and the same fault came back; this occurrence "
                 f"started at {rec['started_at']}, and the previous occurrence was resolved at {prev}.",
                 "Judge every timing question (what changed before the fault, what came after it) "
                 "against THIS occurrence's start. The ServiceNow item's first_opened_at is when the "
                 "FIRST occurrence was opened; it is not this occurrence's start."]
        rems = []
        for r in rec.get("agent_remediations") or []:
            if not isinstance(r, dict):
                continue
            k, pr, c = r.get("occurrence"), r.get("pr"), str(r.get("commit") or "")
            if not (isinstance(k, int) and isinstance(pr, int) and re.fullmatch(r"[0-9a-f]{7,40}", c)):
                continue
            extra = []
            if t(r.get("merged_at")):
                extra.append(f"merged {r['merged_at']}")
            if t(r.get("restart_annotation")):
                extra.append(f"restart annotation {r['restart_annotation']}")
            rems.append(f"  - occurrence {k}: PR #{pr}, commit {c}"
                        + (f" ({', '.join(extra)})" if extra else ""))
        if rems:
            lines += ["The agent itself remediated earlier occurrences of this incident:"] + rems + [
                "Evidence items marked \"the agent's earlier remediation for occurrence k (PR #n)\" "
                "are those changes and the rollouts they caused (new pods starting, their probe "
                "events while they started). They are the fix for an earlier occurrence, not a "
                "new change by someone else. Treat one as a cause of this occurrence only if the "
                "evidence shows this occurrence's fault began with it."]
        return "\n".join(lines) + "\n\n"


    _ACT_INC = re.compile(r"^INC\d{4,10}$")
    _ACT_STAGES = {"diagnosed", "proposed", "waiting-human", "merged", "applied", "escalated",
                   "closed", "abandoned", "needs-human", "gave-up", "unknown"}


    def agent_actions_text(rec):
        """The trusted note for the agent's own remediations of OTHER incidents on this
        workload (evidence.py `agent_actions_record`), or "".

        Found live on 16 Nov: one fault fired two alerts (INC0010140, INC0010141); the agent
        fixed the first (PR #692, closed after verified recovery) and then read that fix's
        rollout in the second's evidence as a probe misconfiguration. Like the recurrence
        note, every value is checked against its shape (an incident number, an int, a sha, a
        UTC time, a known runner stage) and anything else is dropped; a bundle without the
        record gets "" and an unchanged prompt."""
        if not isinstance(rec, dict):
            return ""

        def t(x):
            return x if isinstance(x, str) and _REC_ISO.match(x) else None
        rows, closed = [], []
        for r in rec.get("remediations") or []:
            if not isinstance(r, dict):
                continue
            inc, pr, c, s = r.get("incident"), r.get("pr"), r.get("commit"), r.get("stage")
            if not (isinstance(inc, str) and _ACT_INC.match(inc) and isinstance(pr, int)
                    and not isinstance(pr, bool) and pr > 0 and isinstance(c, str)
                    and re.fullmatch(r"[0-9a-f]{7,40}", c) and t(r.get("merged_at"))
                    and s in _ACT_STAGES):
                continue
            rows.append(f"  - {inc}: PR #{pr}, commit {c}, merged {r['merged_at']}, stage {s}")
            if s == "closed" and r.get("recovery_verified") is True and t(r.get("closed_at")):
                closed.append(f"{inc} (same workload) was CLOSED at {r['closed_at']} after the agent "
                              f"verified recovery from its fix, PR #{pr}.")
        if not rows:
            return ""
        since = t(rec.get("window_start"))
        lines = ["AGENT ACTIONS ON THIS WORKLOAD (from the agent's own records, outside the evidence): "
                 "the agent itself remediated OTHER incidents on this incident's workloads"
                 + (f" since {since}" if since else " recently") + ":"] + rows + [
            "Evidence items marked \"the agent's remediation for INC... (PR #n, ...)\" are those "
            "changes and the rollouts they caused (new pods starting, their readiness-probe "
            "events while they started). They are the agent's own fix for another alert on the "
            "same workload, not a new change by someone else. Treat one as a cause of this "
            "incident only if the evidence shows this incident's fault began with it."]
        if closed:
            lines += closed + [
                "That is strong evidence the fault behind this alert was the same one and is "
                "already fixed. Check whether this alert's condition still holds in the current "
                "evidence before diagnosing a new fault."]
        return "\n".join(lines) + "\n\n"


    def build_prompt(bundle):
        sc = bundle.get("scope") or {"namespaces": [bundle.get("namespace")], "apps": [],
                                     "git_paths": []}
        p = PROMPT % (json.dumps(sc, indent=2), json.dumps(bundle["evidence"], indent=2))
        rt = recurrence_text(bundle.get("recurrence")) + agent_actions_text(bundle.get("agent_actions"))
        if rt:
            anchor = "INCIDENT SCOPE (resolved from the symptom):"
            p = p.replace(anchor, rt + anchor, 1)
        return p


    def bundle_shas(bundle):
        """Every commit sha shown in a git item: P9c's per-commit items, and the P8
        list form."""
        out = set()
        for e in bundle.get("evidence") or []:
            if e.get("source") != "git":
                continue
            d = e.get("data")
            for c in (d if isinstance(d, list) else [d]):
                if isinstance(c, dict) and re.fullmatch(r"[0-9a-f]{7,40}", str(c.get("sha", ""))):
                    out.add(c["sha"])
        return out


    def commit_in_bundle(commit, shas):
        c = (commit or "").strip().lower()
        if not re.fullmatch(r"[0-9a-f]{7,40}", c):
            return False
        return any(s.startswith(c) or c.startswith(s) for s in shas)


    def contract_errors(d):
        """The disposition rules the response schema cannot express."""
        errs = []
        disp = d.get("disposition")
        imp = d.get("implicated") or {}
        if disp == "revert":
            if not re.fullmatch(r"[0-9a-f]{7,40}", str(imp.get("commit", "")).strip().lower()):
                errs.append("revert needs implicated.commit (a sha of at least 7 hex digits)")
            if not imp.get("paths"):
                errs.append("revert needs implicated.paths")
            if d.get("tier") == "Esc":
                errs.append("tier Esc is for escalate, not revert")
        elif disp == "escalate":
            if not str(d.get("escalate_to", "")).strip():
                errs.append("escalate needs escalate_to")
            if not str(d.get("imperative_action", "")).strip():
                errs.append("escalate needs imperative_action")
            if d.get("tier") != "Esc":
                errs.append("escalate needs tier Esc")
        elif disp == "restart" and not d.get("restart_would_fix"):
            errs.append("restart needs restart_would_fix true")
        return errs


    def token():
        """In-process (gcp_auth): the agent GSA over WIF in its pod; the operator's gcloud
        only on the workstation drivers. No gcloud call lives in this file."""
        try:
            return gcp_auth.access_token()
        except Exception as e:
            raise SystemExit(f"diagnose: cannot get an access token: {type(e).__name__}: {e}")


    def generate(prompt, tries=4, url=None):
        """Call the model, and treat a truncated answer as the retryable condition it
        is. Gemini 2.5 spends output budget on reasoning BEFORE emitting the JSON, so
        a budget that looks generous against the schema can still stop the model
        mid-string: the first live run failed four times on
        `JSONDecodeError: Unterminated string` because `finishReason: MAX_TOKENS` was
        being retried identically instead of being given more room. Raise the ceiling
        on each attempt rather than repeating the request that just did not fit."""
        url = url or endpoint("generateContent")
        budget = int(os.environ.get("AGENT_MAX_TOKENS", "24576"))
        last = ""
        for i in range(tries):
            body = {
                "contents": [{"role": "user", "parts": [{"text": prompt}]}],
                "generationConfig": {
                    "temperature": 0,        # a diagnosis should not vary run to run
                    "maxOutputTokens": budget,
                    "responseMimeType": "application/json",
                    "responseSchema": SCHEMA,
                },
            }
            req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST")
            req.add_header("Authorization", f"Bearer {token()}")
            req.add_header("Content-Type", "application/json")
            try:
                with urllib.request.urlopen(req, timeout=300) as r:
                    out = json.loads(r.read().decode())
                cand = (out.get("candidates") or [{}])[0]
                reason = cand.get("finishReason")
                parts = (cand.get("content") or {}).get("parts") or []
                text = "".join(p.get("text", "") for p in parts)
                if reason == "MAX_TOKENS" or not text:
                    last = f"finishReason={reason}, {len(text)} chars of JSON"
                    budget = min(budget * 2, 65535)
                    time.sleep(2)
                    continue
                try:
                    return json.loads(text)
                except json.JSONDecodeError as e:
                    # Truncated despite a non-MAX_TOKENS reason: same remedy.
                    last = f"unparseable JSON ({e}); finishReason={reason}"
                    budget = min(budget * 2, 65535)
                    time.sleep(2)
                    continue
            except urllib.error.HTTPError as e:
                last = f"HTTP {e.code}: {e.read().decode()[:200]}"
            except Exception as e:
                last = f"{type(e).__name__}: {e}"
            time.sleep(3 * (i + 1))
        raise SystemExit(f"diagnose: model call failed after {tries} tries — {last}")


    def diagnose(bundle, call=None, estate=None):
        """Bundle -> diagnosis dict with `_meta`. `call` replaces the model (tests);
        `estate` replaces the parsed config/agent-estate.json (tests). The region is
        resolved, and `global` or a missing region refused, before anything else,
        fake model or not."""
        model, region = model_settings(estate)
        if call is None:
            if not PROJECT:
                raise SystemExit("diagnose: GOOGLE_CLOUD_PROJECT is not set")
            url = endpoint("generateContent", project=PROJECT, estate=estate)

