        "sre-agent-snow-oauth-client-secret", "sre-agent-snow-integration-username",
        "sre-agent-snow-integration-password", "sre-agent-github-app-id",
        "sre-agent-github-app-private-key", "sre-agent-github-app-installation-id"]
    # Exists in the project, is NOT the agent's: the read must be denied.
    FOREIGN_SECRET = os.environ.get("PROBE_FOREIGN_SECRET", "sre-agent-slack-signing-secret")
    WANT_K8S = os.environ.get("WANT_K8S_SUBJECT", "system:serviceaccount:sre-system:sre-agent")
    SKIP_DIRS = {"/proc", "/sys", "/dev", "/run/containerd"}

    checks = []


    def add(name, ok, detail):
        checks.append({"check": name, "ok": bool(ok), "detail": str(detail)[:300]})


    def http(url, method="GET", body=None, token=None, headers=None):
        req = urllib.request.Request(url, data=body, method=method)
        if token:
            req.add_header("Authorization", f"Bearer {token}")
        for k, v in (headers or {}).items():
            req.add_header(k, v)
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return r.status, r.read()
        except urllib.error.HTTPError as e:
            return e.code, e.read()
        except Exception as e:
            return 0, str(e).encode()


    def filesystem():
        for b in ("gcloud", "gh", "kubectl", "talosctl", "gsutil"):
            add(f"no-binary:{b}", shutil.which(b) is None, shutil.which(b) or "not on PATH")
        found_kc, found_cred, found_bin = [], [], []
        for top, dirs, files in os.walk("/", topdown=True):
            if any(top == s or top.startswith(s + "/") for s in SKIP_DIRS):
                dirs[:] = []
                continue
            if top.endswith("/google-cloud-sdk") or top.endswith("/.config/gcloud"):
                found_cred.append(top)
            for f in files:
                full = os.path.join(top, f)
                if f in ("kubeconfig", "admin.conf", "agent-kubeconfig", "talosconfig") \
                        or f.endswith(".kubeconfig") or (top.endswith("/.kube") and f == "config"):
                    found_kc.append(full)
                if f in ("application_default_credentials.json", "credentials.db",
                         "access_tokens.db", "hosts.yml"):
                    found_cred.append(full)
                if f in ("gcloud", "gh", "kubectl") and os.access(full, os.X_OK):
                    found_bin.append(full)
        add("no-kubeconfig-file", not found_kc, found_kc[:5] or "none on the filesystem")
        add("no-operator-credential-file", not found_cred, found_cred[:5] or "none")
        add("no-cli-anywhere", not found_bin, found_bin[:5] or "none")
        add("no-KUBECONFIG-env", not os.environ.get("KUBECONFIG"), "unset" if not os.environ.get(
            "KUBECONFIG") else "set")
        leaked = [k for k in ("GOOGLE_OAUTH_ACCESS_TOKEN", "CLOUDSDK_AUTH_ACCESS_TOKEN_FILE",
                              "CLOUDSDK_CONFIG", "GH_TOKEN", "GITHUB_TOKEN", "GH_ENTERPRISE_TOKEN")
                  if os.environ.get(k)]
        add("no-token-env", not leaked, leaked or "none")


    def metadata():
        s = socket.socket()
        s.settimeout(3)
        try:
            s.connect(("169.254.169.254", 80))
            reachable = True
        except OSError:
            reachable = False
        finally:
            s.close()
        add("metadata-server-unreachable", not reachable,
            "blocked" if not reachable else "169.254.169.254:80 ACCEPTED a connection")


    def kubernetes():
        import kube
        if not kube.in_cluster():
            return add("k8s-identity", False, "not in a pod")
        sa = kube.SA_DIR
        tok = open(os.path.join(sa, "token")).read().strip()
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
        ctx = ssl.create_default_context(cafile=os.path.join(sa, "ca.crt"))
        body = json.dumps({"apiVersion": "authentication.k8s.io/v1", "kind": "SelfSubjectReview"}).encode()
        req = urllib.request.Request(f"https://{host}:{port}/apis/authentication.k8s.io/v1/selfsubjectreviews",
                                     data=body, method="POST")
        req.add_header("Authorization", f"Bearer {tok}")
        req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                user = json.loads(r.read())["status"]["userInfo"]
        except Exception as e:
            return add("k8s-identity", False, f"SelfSubjectReview failed: {type(e).__name__}")
        groups = user.get("groups") or []
        add("k8s-identity", user.get("username") == WANT_K8S,
            f"{user.get('username')} (expected {WANT_K8S})")
        add("k8s-not-admin", not ({"system:masters", "system:cluster-admins"} & set(groups)), groups)


    def google():
        import gcp_auth
        try:
            add("credential-mode-wif", gcp_auth.mode() == "wif", gcp_auth.mode())
        except Exception as e:
            return add("credential-mode-wif", False, type(e).__name__)
        gac = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", "")
        try:
            typ = json.load(open(gac)).get("type")
        except Exception:
            typ = None
        add("credential-config-external-account", typ == "external_account", typ)
        try:
            import gcp_auth_workstation  # noqa: F401
            add("no-workstation-credential-module", False, "gcp_auth_workstation is importable")
        except ImportError:
            add("no-workstation-credential-module", True, "not shipped")
        try:
            tok = gcp_auth.access_token()
        except Exception as e:
            return add("wif-token", False, f"{type(e).__name__}: {str(e)[:160]}")
        st, body = http("https://oauth2.googleapis.com/tokeninfo", "POST",
                        urllib.parse.urlencode({"access_token": tok}).encode(),
                        headers={"Content-Type": "application/x-www-form-urlencoded"})
        email = (json.loads(body or b"{}").get("email") if st == 200 else None)
        want = gcp_auth.service_account_email()
        add("wif-token", st == 200, f"tokeninfo HTTP {st}")
        add("cloud-identity-is-agent-gsa", email and email == want and
            email.endswith(".iam.gserviceaccount.com"), f"{email} (expected {want})")
        project = gcp_auth.project()

        for name in AGENT_SECRETS:
            code, readable = gcp_auth.secret_status(name, project)
            add(f"secret-readable:{name}", code == 200 and readable, f"HTTP {code}")
        code, readable = gcp_auth.secret_status(FOREIGN_SECRET, project)
        add(f"secret-denied:{FOREIGN_SECRET}", code == 403 and not readable,
            f"HTTP {code} (403 expected; any value read is discarded, never shown)")

        import diagnose  # the same regional endpoint the agent calls (hardening item 4)
        st, _ = http(diagnose.endpoint("countTokens", project=project), "POST",
                     json.dumps({"contents": [{"role": "user", "parts": [{"text": "ping"}]}]}).encode(),
                     token=tok, headers={"Content-Type": "application/json"})
        add("vertex-allowed", st == 200, f"countTokens HTTP {st}")

        bucket = os.environ.get("TRIGGER_BUCKET", f"ai-sre-live-agent-state-{project}")
        other_bucket = os.environ.get("PROBE_FOREIGN_BUCKET", f"ai-sre-live-tfstate-{project}")
        denied = [
            ("compute", f"https://compute.googleapis.com/compute/v1/projects/{project}/zones/"
                        f"us-central1-a/instances?maxResults=1", "GET", None),
            ("resourcemanager-iam", f"https://cloudresourcemanager.googleapis.com/v1/projects/"
                                    f"{project}:getIamPolicy", "POST", b"{}"),
            ("secret-list", f"https://secretmanager.googleapis.com/v1/projects/{project}/secrets",
             "GET", None),
            ("foreign-bucket", f"https://storage.googleapis.com/storage/v1/b/{other_bucket}/o?maxResults=1",
             "GET", None),
            ("own-bucket-outside-prefix",
             f"https://storage.googleapis.com/storage/v1/b/{bucket}/o/"
             f"{urllib.parse.quote('probe/not-the-agents.json', safe='')}", "GET", None),
        ]
        for name, url, method, body in denied:
            st, _ = http(url, method, body, token=tok, headers={"Content-Type": "application/json"})
            add(f"api-denied:{name}", st == 403, f"HTTP {st} (403 expected)")
        st, _ = http(f"https://storage.googleapis.com/storage/v1/b/{bucket}/o/"
                     f"{urllib.parse.quote('trigger/h1-selfcheck-absent.json', safe='')}", token=tok)
        add("own-bucket-trigger-prefix-allowed", st == 404, f"HTTP {st} (404 = allowed, object absent)")


    def main():
        try:
            filesystem()
            metadata()
            kubernetes()
            google()
        except Exception as e:
            print(json.dumps({"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}",
                              "checks": checks}))
            return 2
        ok = all(c["ok"] for c in checks)
        print(json.dumps({"ok": ok, "checks": checks}, indent=1))
        return 0 if ok else 1


    if __name__ == "__main__":
        raise SystemExit(main())
