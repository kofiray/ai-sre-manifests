# sre-agent-app: the agent workload's code. GENERATED by
# scripts/agent/render-configmap.py from the product repo; never edit by hand.
# `platform/` is the T3 path (SPEC §4): human review, agent draft-only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-app
  namespace: sre-system
  labels: { app: sre-agent }
  annotations: { sre-agent/code-sha256: "513e8b670d53cba6e7d6a1386ae2e3dcae4f4e2fbce0854f28ae534e43b56a69" }
data:
  scripts__agent__runner.py: |
    #!/usr/bin/env python3
    """The agent workload's loop: one incident at a time, end to end, in-cluster.

    Hardening item 1. Before this, only the test drivers (scripts/e2e/run.py,
    scripts/p9c/pilot.py) chained the write path, from the operator's workstation.
    This runs the same functions, as the agent's own identity, in its pod:

        investigate   trigger.process: claim -> evidence -> diagnosis -> ServiceNow -> commit
        plan          remediate.plan: propose a pull request, or escalate (no PR)
        propose       remediate.propose: a PR as the GitHub App
        land-wait     remediate.land: T1 is merged by GitHub Actions (auto-merge.yml);
                      anything else waits for a human, up to a timeout
        applied       remediate.synced(require_applied): Argo CD's APPLIED revision
                      includes the merge, read from Application status (read-only)
        close         remediate.close: measure recovery first; close only if verified

    WHAT IT NEVER DOES. It never approves or merges a pull request (there is no such
    call in this file, and gh_app refuses both inside the workload), never syncs or
    refreshes Argo CD, and never writes to the cluster: its Kubernetes client is
    GET-only and its RBAC is the read-only `sre-agent` ClusterRole. Waiting for a
    human is a legal stopped state: after the timeout it records "waiting for a
    human" on the incident and moves on, and picks the incident up again once the
    change is merged.

    STATE. One object per incident OCCURRENCE, `runner/<key>.json` in the agent-state
    bucket next to the trigger's `trigger/<key>.json` checkpoint, where key is the
    sys_id for the first occurrence and `<sys_id>-r<n>` once the bridge has reopened a
    resolved incident n times (trigger.state_key). A recurrence therefore starts a new
    state machine instead of finding the first occurrence's `closed` and stopping. It is
    written after every stage, so a restarted pod resumes where it stopped rather than
    proposing twice. (Writes are not generation-matched yet: one replica, Recreate.
    That is hardening item 7; idempotent PR creation is item 9.)

    An incident whose diagnosis this runner did not make (the workstation trigger,
    P8's driver, won the claim) is left alone: that driver owns its write path.

    THE SLACK THREAD (item 18). Each stage is also posted into the incident's thread
    through a `thread` poster (diagnosis, pr-opened, pr-merged, escalated, recovery,
    resolved). A post that fails is logged and counted in the state object
    (`thread_updates`) and never stops the incident. The agent's own pod holds no Slack
    credential and no hitl.py (item 1 keeps its secrets to the six it needs), so in the
    pod the poster is HttpThreadPoster: it hands the event to the hitl pod's internal
    endpoint (`POST /internal/thread` on the pinned sre-hitl-internal ClusterIP, only
    the agent pod may reach it, bearer token from the `sre-hitl-internal` Secret), and
    hitl posts it and reads it back with the same code as `hitl.py thread`. It is used
    when HITL_URL and the token file are both set; otherwise the CLI poster runs as
    before (the workstation drivers, which hold the operator's Slack token).
    """
    import argparse
    import json
    import os
    import socket
    import sys
    import time

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    for _d in ("scripts/agent", "scripts/trigger", "scripts/remediate", "scripts/checks", "scripts"):
        sys.path.insert(0, os.path.join(ROOT, _d))

    DIAGNOSED, PROPOSED, WAITING, MERGED = "diagnosed", "proposed", "waiting-human", "merged"
    APPLIED, ESCALATED, CLOSED = "applied", "escalated", "closed"
    ABANDONED, NEEDS_HUMAN, GAVE_UP = "abandoned", "needs-human", "gave-up"
    # Not diagnosed yet: the investigation raised a stored-nothing ServiceNow write
    # (trigger.WriteNotStored) on an earlier cycle. Kept only to count those attempts.
    INVESTIGATING = "investigating"
    TERMINAL = {CLOSED, ABANDONED, NEEDS_HUMAN, GAVE_UP}
    PARKED = {WAITING, ESCALATED}       # re-checked on a later cycle, never waited on here


    def _env_int(name, default):
        try:
            return int(os.environ.get(name, default))
        except ValueError:
            return default


    CFG = {
        "land_t1": _env_int("RUNNER_LAND_TIMEOUT", 900),      # GitHub Actions' auto-merge
        "human_wait": _env_int("RUNNER_HUMAN_WAIT", 300),     # first wait for a human, then park
        "sync_timeout": _env_int("RUNNER_SYNC_TIMEOUT", 600),  # Argo CD's poll is ~3 min
        "close_timeout": _env_int("RUNNER_CLOSE_TIMEOUT", 600),
        "settle": _env_int("RUNNER_SETTLE", 60),
        "max_apply": _env_int("RUNNER_MAX_APPLY_TRIES", 3),
        "max_close": _env_int("RUNNER_MAX_CLOSE_TRIES", 3),
        "max_propose": _env_int("RUNNER_MAX_PROPOSE_TRIES", 3),
        # A ServiceNow note that answers 2xx and stores nothing: this many cycles, then a
        # human (each investigate retry is a model call; each stage retry repeats its work).
        "max_not_stored": _env_int("RUNNER_MAX_NOT_STORED", 3),
        "recheck_waiting": _env_int("RUNNER_RECHECK_WAITING", 0),
        "recheck_escalated": _env_int("RUNNER_RECHECK_ESCALATED", 300),
    }


    def log(msg, **kw):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "msg": msg,
               "component": "runner"}
        rec.update(kw)
        print(json.dumps(rec, default=str), flush=True)


    def iso(t=None):
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t if t is not None else time.time()))


    def state_key(inc):
        """The runner/trigger checkpoint key for this occurrence of the incident."""
        import trigger
        return trigger.state_key(inc["sys_id"], trigger.reopen_count_of(inc))


    def reopen_count(inc):
        import trigger
        return trigger.reopen_count_of(inc)


    class NoteNotStored(RuntimeError):
        """The runner's incident note did not store (trigger.WriteNotStored, or the write
        failed outright). The stage it would have reported is not recorded."""


    class Runner:
        """The per-incident state machine. Every outside call goes through `deps`, so
        the offline test drives it with fakes (gates/fixtures/hardening/h1_offline_test.py)."""

        def __init__(self, deps, cfg=None, thread=None):
            self.d = deps
            self.cfg = dict(CFG, **(cfg or {}))
            # thread(event, st, **fields) -> {"ok": bool, "error": str}; None posts nothing
            self.thread = thread

        # ------------------------------------------------------------ plumbing ---
        def _to(self, st, stage, **kw):
            st["history"].append(dict({"stage": stage, "at": iso(self.d.now())}, **kw))
            st["stage"] = stage
            st["updated_at"] = iso(self.d.now())
            log("stage", incident=st["incident"], stage=stage, **kw)

        def _note(self, st, text):
            """Write the incident note (work_notes, read back by the trigger's client). It is
            written BEFORE the stage it reports is recorded: a note that did not store raises
            NoteNotStored, step() keeps the stage where it was and the next cycle retries, up
            to max_not_stored cycles. A stored-nothing write is never treated as done."""
            try:
                self.d.comment(st["sys_id"], text)
            except Exception as e:
                log("the incident note was NOT stored; the stage does not advance",
                    incident=st["incident"], error=f"{type(e).__name__}: {e}"[:200])
                raise NoteNotStored(f"{type(e).__name__}: {e}"[:300]) from e

        def _park(self, st, key):
            st["next_check_at"] = self.d.now() + self.cfg[key]

        def _due(self, st):
            return self.d.now() >= float(st.get("next_check_at") or 0)

        def _try(self, st, key):
            st.setdefault("tries", {})
            st["tries"][key] = st["tries"].get(key, 0) + 1
            return st["tries"][key]

        def _needs_human(self, st, why):
            self._note(st, f"sre-agent: this incident needs a human. {why[:800]}\n"
                           f"correlation id: {st['correlation_id']}")
            self._to(st, NEEDS_HUMAN, why=why[:400])

        def _not_stored(self, st, key, why):
            """A cycle whose ServiceNow write stored nothing. Counted; at the cap the incident
            goes to a human ONCE (one best-effort note, one thread post) and is never retried."""
            n = self._try(st, key)
            log("ServiceNow write not stored this cycle", incident=st["incident"], stage=st.get("stage"),
                attempt=n, of=self.cfg["max_not_stored"], why=str(why)[:200])
            if n < self.cfg["max_not_stored"]:
                return
            text = (f"sre-agent: this incident needs a human. ServiceNow accepted the agent's writes "
                    f"{n} times and stored nothing, so the agent has stopped retrying.\n"
                    f"correlation id: {st['correlation_id']}")
            try:
                self.d.comment(st["sys_id"], text)
            except Exception as e:
                log("the hand-off note was not stored either (logged here instead)", security=True,
                    integrity="servicenow-write-not-stored", incident=st["incident"],
                    error=f"{type(e).__name__}: {e}"[:200])
            self._to(st, NEEDS_HUMAN, why=f"ServiceNow writes not stored ({n} cycles): {why}"[:400],
                     notes_not_stored=True)
            self._post(st, "escalated", to="a human (the agent's ServiceNow notes are not being stored)")

        def _pr_ref(self, st):
            return f"{self.d.repo}#{st.get('pr')}"

        def _pr_url(self, st):
            return f"https://github.com/{self.d.repo}/pull/{st.get('pr')}"

        def _post(self, st, event, **fields):
            """One thread update. Failure is counted, never raised (item 18)."""
            if self.thread is None:
                return None
            try:
                r = self.thread(event, st, **fields) or {}
            except Exception as e:
                r = {"ok": False, "error": f"{type(e).__name__}: {e}"}
            ok = bool(r.get("ok"))
            tu = st.setdefault("thread_updates", {"posted": 0, "failed": 0, "log": []})
            tu["posted" if ok else "failed"] += 1
            tu["log"] = (tu["log"] + [{"event": event, "ok": ok, "at": iso(self.d.now()),
                                        **({} if ok else {"error": str(r.get("error") or "")[:200]})}])[-20:]
            if not ok:
                log("thread update failed (the incident carries on)", incident=st["incident"], event=event,
                    error=str(r.get("error") or "")[:200])
            return ok

        # --------------------------------------------------------------- entry ---
        def step(self, inc):
            # per occurrence: a reopened incident is a new key, so a new state machine
            sid = state_key(inc)
            st = self.d.load(sid)
            if st and st.get("stage") in TERMINAL:
                return st["stage"]
            if st is None or st.get("stage") == INVESTIGATING:
                try:
                    r, diag, bundle = self.d.investigate(inc)
                except Exception as e:
                    if type(e).__name__ != "WriteNotStored":
                        raise           # anything else: retried next cycle, as before
                    # The trigger posted its diagnosis note and ServiceNow stored nothing: it
                    # did not commit. Count it here, since each retry is a model call.
                    st = st or self._new(inc, None, None)
                    st["stage"] = INVESTIGATING
                    self._not_stored(st, "investigate_not_stored", e)
                    self.d.save(sid, st)
                    return st["stage"]
                if r == "orphaned":
                    st = self._new(inc, None, None)
                    try:
                        self._needs_human(st, "the agent diagnosed this incident, but its pod stopped "
                                              "before the write path started; nothing was proposed")
                    except NoteNotStored as e:
                        st["stage"] = INVESTIGATING
                        self._not_stored(st, "note_not_stored", e)
                    self.d.save(sid, st)
                    return st["stage"]
                if r != "committed" or diag is None:
                    return r        # held / raced / another worker's diagnosis: not ours to act on
                st = dict(self._new(inc, diag, bundle), tries=(st or {}).get("tries") or {})
                self._to(st, DIAGNOSED, failure_class=diag.get("failure_class"),
                         disposition=diag.get("disposition"))
                self._post(st, "diagnosis", diagnosis=diag, bundle=bundle)
                self.d.save(sid, st)
            for _ in range(10):
                before = st["stage"]
                if before in TERMINAL or (before in PARKED and not self._due(st)):
                    break
                try:
                    getattr(self, "_" + before.replace("-", "_"))(st)
                except NoteNotStored as e:
                    # The note is written before the stage it reports: the stage is unchanged.
                    self._not_stored(st, "note_not_stored", e)
                    if st["stage"] not in TERMINAL:
                        self._park(st, "recheck_waiting")
                    self.d.save(sid, st)
                    break
                self.d.save(sid, st)
                if st["stage"] == before or st["stage"] in PARKED:
                    break
            return st["stage"]

        def _new(self, inc, diag, bundle):
            n = reopen_count(inc)
            return {"incident": inc["number"], "sys_id": inc["sys_id"],
                    "correlation_id": inc["correlation_id"], "stage": None,
                    "reopen_count": n, "occurrence": n + 1,
                    "alertname": self.d.alertname(inc["correlation_id"]) if diag else "",
                    "diagnosis": diag, "bundle": bundle, "history": [], "tries": {},
                    "created_at": iso(self.d.now()), "worker": self.d.worker}

        # ------------------------------------------------------------ handlers ---
        def _diagnosed(self, st):
            diag, bundle = st["diagnosis"], st["bundle"]
            try:
                p = self.d.plan(diag, bundle)
            except SystemExit as e:
                return self._needs_human(st, f"no automated remediation applies: {e}")
            st["plan"] = {k: p.get(k) for k in ("mode", "how", "paths", "apps", "draft",
                                                 "failure_class", "escalate_to")}
            if p.get("how") == "escalate":
                try:
                    r = self.d.escalate(diag, bundle, st["incident"], st["correlation_id"])
                except SystemExit as e:
                    return self._needs_human(st, f"the escalation was refused: {e}")
                if not r.get("escalated"):
                    return self._needs_human(st, "the escalation note was not confirmed by read-back")
                self._to(st, ESCALATED, escalate_to=p.get("escalate_to"))
                self._post(st, "escalated", to=p.get("escalate_to") or "(not named)")
                return self._park(st, "recheck_escalated")
            try:
                r = self.d.propose(diag, st["correlation_id"], st["incident"], bundle)
            except SystemExit as e:
                return self._needs_human(st, f"no pull request was opened: {e}")
            except Exception as e:  # GitHub/ServiceNow hiccup: try again next cycle, a few times
                n = self._try(st, "propose")
                log("propose failed", incident=st["incident"], attempt=n,
                    error=f"{type(e).__name__}: {e}"[:200])
                if n >= self.cfg["max_propose"]:
                    self._needs_human(st, f"opening the pull request failed {n} times "
                                          f"({type(e).__name__})")
                return
            cl = r.get("classifier") or {}
            st.update(pr=r["pr"], tier=cl.get("tier"), auto_merge=bool(cl.get("auto_merge")),
                      draft=bool((r.get("plan") or {}).get("draft")),
                      paths=(r.get("plan") or {}).get("paths") or [],
                      apps=(r.get("plan") or {}).get("apps") or [])
            self._to(st, PROPOSED, pr=r["pr"], tier=st["tier"], auto_merge=st["auto_merge"],
                     draft=st["draft"])
            self._post(st, "pr-opened", pr_url=self._pr_url(st), tier=st.get("tier") or "")

        def _merged_now(self, st, r):
            st.update(sha=r.get("sha"), merged_by=r.get("merged_by"))
            self._to(st, MERGED, sha=(r.get("sha") or "")[:12], merged_by=r.get("merged_by"))
            self._post(st, "pr-merged", pr_url=self._pr_url(st), by=r.get("merged_by") or "(unknown)",
                       sha=r.get("sha") or "")

        def _proposed(self, st):
            wait = self.cfg["land_t1"] if st.get("auto_merge") else self.cfg["human_wait"]
            r = self.d.land(st["pr"], wait)
            if r.get("merged"):
                return self._merged_now(st, r)
            if "closed" in str(r.get("reason") or ""):
                return self._abandon(st)
            who = ("the platform has not auto-merged it (check the path-policy and auto-merge runs)"
                   if st.get("auto_merge") else
                   "it needs a human: the agent cannot approve or merge it"
                   + (" (a draft on a platform path)" if st.get("draft") else ""))
            self._note(st, f"sre-agent: waiting for a human. {self._pr_ref(st)} ({st.get('tier')}) "
                           f"is not merged after {wait}s; {who}. The agent will verify recovery and "
                           f"close this incident once the change is merged.\n"
                           f"correlation id: {st['correlation_id']}")
            self._to(st, WAITING, waited_s=wait)
            self._park(st, "recheck_waiting")

        def _abandon(self, st):
            self._note(st, f"sre-agent: {self._pr_ref(st)} was closed without merging. The agent "
                           f"leaves this incident to a human.\ncorrelation id: {st['correlation_id']}")
            self._to(st, ABANDONED, pr=st.get("pr"))

        def _waiting_human(self, st):
            r = self.d.pr_state(st["pr"])
            self._park(st, "recheck_waiting")
            if not r:
                return
            if r.get("merged"):
                return self._merged_now(st, r)
            if r.get("state") == "closed":
                return self._abandon(st)

        def _merged(self, st):
            apps = self.d.owners(st.get("paths") or [], st.get("apps") or [])
            ok, cur = self.d.applied(apps, st["sha"], self.cfg["sync_timeout"])
            if ok:
                st["applied_status"] = cur
                return self._to(st, APPLIED, apps=apps)
            n = self._try(st, "applied")
            log("merged but not applied yet", incident=st["incident"], apps=apps, attempt=n)
            if n >= self.cfg["max_apply"]:
                self._needs_human(st, f"{self._pr_ref(st)} merged as {str(st['sha'])[:8]}, but Argo CD "
                                      f"has not applied that revision to {apps} after {n} waits. "
                                      f"Merged is not applied (L-P9-014); the agent has no write verb "
                                      f"to sync it.")
                self._post(st, "escalated", to="a human (merged but not applied)")

        def _closed_posts(self, st, r):
            """recovery (the verdict), then resolved only for a verified close; hitl itself also
            refuses `resolved` when the verdict says not recovered."""
            if r.get("verdict"):
                self._post(st, "recovery", recovery=r["verdict"])
            if r.get("closed") and r.get("recovered"):
                self._post(st, "resolved", recovery=r.get("verdict"))

        def _applied(self, st):
            r = self.d.close(st, fixed_by="agent", dry_run=False)
            if r.get("closed"):
                self._to(st, CLOSED, state=r.get("state"))
                return self._closed_posts(st, r)
            n = self._try(st, "close")
            log("not closed", incident=st["incident"], attempt=n, recovered=r.get("recovered"),
                outstanding=r.get("outstanding"))
            if n >= self.cfg["max_close"]:
                self._note(st, f"sre-agent: recovery was measured {n} times after {self._pr_ref(st)} "
                               f"was applied and the incident is still not closed "
                               f"({'the close did not store' if r.get('recovered') else 'not recovered'}"
                               f"). A human must look.\ncorrelation id: {st['correlation_id']}")
                self._to(st, GAVE_UP, recovered=bool(r.get("recovered")))
                # the refusal's verdict into the thread once (not on every retry)
                if r.get("verdict"):
                    self._post(st, "recovery", recovery=r["verdict"])

        def _escalated(self, st):
            # Measure quietly first: a NOT-closing note every few minutes while a person
            # is still working would bury the incident. Close for real only once recovered.
            self._park(st, "recheck_escalated")
            probe = self.d.close(st, fixed_by="human-after-escalation", dry_run=True)
            if not probe.get("recovered"):
                return
            r = self.d.close(st, fixed_by="human-after-escalation", dry_run=False)
            if r.get("closed"):
                self._to(st, CLOSED, state=r.get("state"), fixed_by="human-after-escalation")
                self._closed_posts(st, r)


    # ---------------------------------------------------------------- real deps ---
    class RealDeps:
        """The real calls: the trigger, remediate and the read-only clients."""

        def __init__(self, workdir):
            import observe
            import remediate
            import trigger
            self.T, self.R, self.O = trigger, remediate, observe
            self.workdir = workdir
            os.makedirs(workdir, exist_ok=True)
            self.snow = trigger.Snow()
            self.repo = f"{remediate.OWNER}/{remediate.REPO}"
            self.worker = trigger.WORKER
            self.pod_prefix = os.environ.get("AGENT_WORKER_PREFIX", "sre-agent-")

        def now(self):
            return time.time()

        def load(self, sys_id):
            return self.T.gcs_read(sys_id, prefix="runner")

        def save(self, sys_id, st):
            if not self.T.gcs_write(sys_id, st, prefix="runner"):
                raise RuntimeError("runner state write was refused")

        def investigate(self, inc):
            r = self.T.process(inc, self.snow, self.workdir)
            fp = inc["correlation_id"]
            if r == "already-committed":
                cp = self.T.gcs_read(state_key(inc)) or {}
                if str(cp.get("worker", "")).startswith(self.pod_prefix):
                    return "orphaned", None, None
                return r, None, None
            if r != "committed":
                return r, None, None
            try:
                diag = json.load(open(os.path.join(self.workdir, f"diagnosis-{fp}.json")))
                bundle = json.load(open(os.path.join(self.workdir, f"evidence-{fp}.json")))
            except (OSError, ValueError):
                return "orphaned", None, None
            return r, diag, bundle

        def alertname(self, cid):
            """The real alertname of the incident's alert (the verifier's Prometheus check
            needs it; the model never sees it). Matched by correlation ID (cid1)."""
            import cid as _cid
            active, _ = self.O.alerts()
            a = _cid.newest(active or [], cid)
            return ((a or {}).get("labels") or {}).get("alertname") or ""

        def plan(self, diag, bundle):
            return self.R.plan(diag, bundle)

        def propose(self, diag, fp, incident, bundle):
            return self.R.propose(diag, fp, incident, "", bundle)

        def escalate(self, diag, bundle, incident, fp):
            return self.R.escalate(diag, bundle, incident, fp)

        def land(self, pr, timeout):
            return self.R.land(pr, timeout)

        def pr_state(self, pr):
            st = self.R.gh_api(f"/repos/{self.R.OWNER}/{self.R.REPO}/pulls/{pr}")
            if not isinstance(st, dict):
                return None
            return {"merged": bool(st.get("merged")), "state": st.get("state"),
                    "sha": st.get("merge_commit_sha"),
                    "merged_by": (st.get("merged_by") or {}).get("login")}

        def owners(self, paths, fallback):
            """Argo CD apps whose source path holds any changed file (read-only)."""
            rc, out, _ = self.O.kubectl(["-n", self.R.ARGO_NS, "get", "applications.argoproj.io",
                                         "-o", "json"])
            found = set()
            items = []
            if rc == 0:
                try:
                    items = json.loads(out).get("items") or []
                except ValueError:
                    items = []
            for a in items:
                spec = a.get("spec") or {}
                for s in ([spec["source"]] if spec.get("source") else []) + list(spec.get("sources") or []):
                    p = (s.get("path") or "").rstrip("/")
                    if p and any(f == p or f.startswith(p + "/") for f in paths):
                        found.add(a["metadata"]["name"])
            return sorted(found) or list(fallback)

        def applied(self, apps, sha, timeout):
            return self.R.synced(apps, sha, timeout, require_applied=True)

        def close(self, st, fixed_by, dry_run):
            plan = st.get("plan") or {}
            scope = None
            if plan.get("mode") != "legacy" and (st.get("bundle") or {}).get("scope"):
                scope = os.path.join(self.workdir, f"scope-{st['correlation_id']}.json")
                json.dump(st["bundle"], open(scope, "w"))
            return self.R.close(st["incident"], st["correlation_id"], st.get("alertname") or "",
                                pr=st.get("pr"), dns=plan.get("failure_class") == "cluster-dns-failure",
                                settle=CFG["settle"],
                                # a quiet probe measures once; a real close re-measures until
                                # recovered or the timeout
                                timeout=0 if dry_run else CFG["close_timeout"],
                                dry_run=dry_run, scope=scope, fixed_by=fixed_by)

        def comment(self, sys_id, text):
            self.snow.comment(sys_id, text)


    def _last_json(text):
        """The last complete JSON object in a child's stdout (it logs JSON lines first)."""
        dec, out, i = json.JSONDecoder(), {}, 0
        while True:
            i = text.find("{", i)
            if i < 0:
                return out if isinstance(out, dict) else {}
            try:
                out, i = dec.raw_decode(text, i)
            except ValueError:
                i += 1


    class ThreadPoster:
        """`thread` for the Runner: `apps/hitl/hitl.py thread` as a child process (which reads
        every post back). It needs hitl.py and SLACK_BOT_TOKEN in this process's environment
        (and hitl's SNOW_OAUTH_* settings if SNOW_INSTANCE is set). Neither is in the agent's
        pod, so there each call answers {"ok": False} with the reason, logged once."""

        def __init__(self, workdir, hitl=None):
            self.workdir = workdir
            self.hitl = hitl or os.environ.get("HITL_PY", os.path.join(ROOT, "apps", "hitl", "hitl.py"))
            self._said = False

        def _unavailable(self):
            if not os.path.exists(self.hitl):
                return f"hitl.py is not in this workload ({self.hitl})"
            if not os.environ.get("SLACK_BOT_TOKEN"):
                return "no Slack credential in this workload (SLACK_BOT_TOKEN)"
            return ""

        def _file(self, st, name, doc):
            f = os.path.join(self.workdir, f"thread-{name}-{st['correlation_id']}.json")
            with open(f, "w") as fh:
                json.dump(doc, fh)
            return f

        def __call__(self, event, st, diagnosis=None, bundle=None, recovery=None, pr_url="", tier="",
                     by="", sha="", to=""):
            why = self._unavailable()
            if why:
                if not self._said:
                    log("thread updates unavailable here; counted as failed", why=why)
                    self._said = True
                return {"ok": False, "error": why}
            args = [sys.executable, self.hitl, "thread", "--correlation-id", st["correlation_id"],
                    "--event", event, "--incident", st["incident"], "--sys-id", st["sys_id"]]
            if diagnosis is not None:
                args += ["--diagnosis", self._file(st, "diagnosis", diagnosis),
                         "--bundle", self._file(st, "bundle", bundle or {})]
            if recovery:
                args += ["--recovery", self._file(st, "recovery", recovery)]
            for flag, v in (("--pr-url", pr_url), ("--tier", tier), ("--by", by), ("--sha", sha), ("--to", to)):
                if v:
                    args += [flag, str(v)]
            if int(st.get("occurrence") or 1) > 1:
                args += ["--occurrence", str(int(st["occurrence"]))]
            import subprocess
            try:
                r = subprocess.run(args, capture_output=True, text=True, timeout=300)
            except subprocess.TimeoutExpired:
                return {"ok": False, "error": "hitl thread timed out"}
            res = _last_json(r.stdout or "")
            ok = r.returncode == 0 and bool(res.get("ok"))
            return {"ok": ok, "error": "" if ok else (res.get("error") or (r.stderr or "").strip()[-200:])}


    def slim_bundle(bundle):
        """What the thread's diagnosis post uses from the evidence bundle: its fingerprint
        and each item's id and title. The bundle itself is ~50 KB of evidence the post never
        shows, so it does not travel to hitl."""
        b = bundle or {}
        return {"fingerprint": b.get("fingerprint"),
                "evidence": [{"id": e.get("id"), "title": e.get("title") or ""}
                             for e in (b.get("evidence") or []) if isinstance(e, dict)]}


    class HttpThreadPoster:
        """`thread` for the Runner in the agent's pod: one POST to hitl's internal endpoint
        (`/internal/thread`), which posts the event and reads it back with the same code as
        `hitl.py thread`. The bearer token is read from a mounted Secret file on each call
        (so a rotation needs no restart) and is never logged. The request never goes through
        a proxy. Any failure is the result ({"ok": False, "error": ...}), never raised."""

        def __init__(self, url, token_file, timeout=None):
            self.url = url.rstrip("/") + "/internal/thread"
            self.token_file = token_file
            self.timeout = timeout or _env_int("HITL_TIMEOUT", 300)

        def _token(self):
            try:
                with open(self.token_file) as fh:
                    return fh.read().strip()
            except OSError:
                return ""

        def __call__(self, event, st, diagnosis=None, bundle=None, recovery=None, pr_url="", tier="",
                     by="", sha="", to=""):
            import urllib.error
            import urllib.request
            tok = self._token()
            if not tok:
                return {"ok": False, "error": f"no token in {self.token_file}"}
            body = {"correlation_id": st["correlation_id"], "event": event,
                    "incident": st["incident"], "sys_id": st["sys_id"],
                    "occurrence": int(st.get("occurrence") or 1),
                    # the agent's pod never opens threads otherwise: hitl opens a record-only
                    # thread (no buttons) if the incident has none yet
                    "open_thread": True}
            if diagnosis is not None:
                body.update(diagnosis=diagnosis, bundle=slim_bundle(bundle))
            if recovery:
                body["recovery"] = recovery
            for k, v in (("pr_url", pr_url), ("tier", tier), ("by", by), ("sha", sha), ("to", to)):
                if v:
                    body[k] = str(v)
            req = urllib.request.Request(self.url, data=json.dumps(body, default=str).encode(),
                                         method="POST")
            req.add_header("Content-Type", "application/json")
            req.add_header("Authorization", f"Bearer {tok}")
            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
            try:
                with opener.open(req, timeout=self.timeout) as r:
                    res = json.loads(r.read().decode() or "{}")
                    code = r.status
            except urllib.error.HTTPError as e:
                try:
                    res = json.loads(e.read().decode() or "{}")
                except ValueError:
                    res = {}
                code = e.code
            except Exception as e:
                return {"ok": False, "error": f"hitl internal endpoint unreachable: {type(e).__name__}: {e}"[:300]}
            ok = code == 200 and bool(res.get("ok"))
            return {"ok": ok, "error": "" if ok else f"hitl answered {code}: {res.get('error') or '(no reason)'}"}


    def thread_poster(workdir):
        """In the agent's pod (HITL_URL and the token file both set): HttpThreadPoster.
        Anywhere else: the `hitl.py thread` CLI, exactly as before. Which one, and why, is
        logged once; the token is not."""
        url = os.environ.get("HITL_URL", "").strip()
        tf = os.environ.get("HITL_TOKEN_FILE", "").strip()
        if url and tf and os.path.isfile(tf):
            log("thread updates go to hitl's internal endpoint", url=url)
            return HttpThreadPoster(url, tf)
        if url or tf:
            log("HITL_URL / HITL_TOKEN_FILE set but incomplete; using the hitl.py CLI poster",
                url=bool(url), token_file=tf or None,
                token_file_present=bool(tf and os.path.isfile(tf)))
        return ThreadPoster(workdir)


    # --------------------------------------------------------------------- loop ---
    READY = os.environ.get("AGENT_READY_FILE", "/tmp/sre-agent-ready")


    def mode():
        """active | standby, read from the mounted ConfigMap on every cycle (a change in
        git reaches the pod without a restart)."""
        f = os.environ.get("AGENT_MODE_FILE", "/etc/sre-agent/mode")
        try:
            m = open(f).read().strip().lower()
        except OSError:
            m = os.environ.get("AGENT_MODE", "active").strip().lower()
        return m if m in ("active", "standby") else "standby"


    def startup_check():
        """Ready only when the agent can authenticate as itself everywhere it must."""
        import gcp_auth
        import kube
        problems = []
        try:
            kube.identity()
        except kube.NoIdentity as e:
            problems.append(f"kubernetes: {e}")
        try:
            gcp_auth.access_token()
        except Exception as e:
            problems.append(f"google: {type(e).__name__}: {str(e)[:160]}")
        if not problems and not gcp_auth.secret("sre-agent-snow-instance-url"):
            problems.append("secret manager: the ServiceNow instance URL is unreadable")
        return problems


    def cycle(runner, snow, max_per_cycle, only=None):
        incidents = snow.open_incidents()
        if only:
            incidents = [i for i in incidents if i["number"] == only]
        worked = 0
        for inc in incidents:
            if worked >= max_per_cycle:
                log("cycle cap reached; the rest wait for the next cycle")
                break
            try:
                r = runner.step(inc)
            except Exception as e:
                log("incident step failed; it is retried next cycle", incident=inc.get("number"),
                    error=f"{type(e).__name__}: {e}"[:300])
                continue
            if r not in ("held", "already-committed", "raced") and r not in TERMINAL:
                worked += 1
            log("cycle result", incident=inc["number"], result=r)
        return worked


    def main(argv=None):
        ap = argparse.ArgumentParser()
        sub = ap.add_subparsers(dest="cmd", required=True)
        lp = sub.add_parser("loop")
        lp.add_argument("--interval", type=int, default=_env_int("RUNNER_INTERVAL", 30))
        lp.add_argument("--max-per-cycle", type=int, default=4)
        op = sub.add_parser("once")
        op.add_argument("--incident", default="")
        op.add_argument("--max-per-cycle", type=int, default=4)
        sp = sub.add_parser("status")
        sp.add_argument("--sys-id", required=True)
        sp.add_argument("--reopen-count", type=int, default=0,
                        help="which occurrence (ServiceNow reopen_count); 0 = the first")
        a = ap.parse_args(argv)
        workdir = os.environ.get("AGENT_WORKDIR", os.path.join(
            os.environ.get("AGENT_STATE_DIR", os.path.join(ROOT, ".work")), "agent"))

        if a.cmd == "status":
            import trigger
            st = trigger.gcs_read(trigger.state_key(a.sys_id, a.reopen_count), prefix="runner") or {}
            st.pop("bundle", None)
            print(json.dumps(st, indent=2))
            return 0

        while True:
            problems = startup_check()
            if not problems:
                break
            log("not ready: the agent cannot authenticate as itself yet", problems=problems)
            if a.cmd == "once":
                return 2
            time.sleep(30)
        try:
            open(READY, "w").write(iso())
        except OSError:
            pass
        deps = RealDeps(workdir)
        runner = Runner(deps, thread=thread_poster(workdir))
        log("runner starting", worker=deps.worker, host=socket.gethostname(), cfg=CFG)
        if a.cmd == "once":
            cycle(runner, deps.snow, a.max_per_cycle, a.incident or None)
            return 0
        while True:
            m = mode()
            if m == "active":
                try:
                    cycle(runner, deps.snow, a.max_per_cycle)
                except Exception as e:
                    log("poll failed", error=f"{type(e).__name__}: {e}"[:300])
            else:
                log("standby: not acting on incidents (sre-agent-config mode)")
            time.sleep(a.interval)


    if __name__ == "__main__":
        raise SystemExit(main())
