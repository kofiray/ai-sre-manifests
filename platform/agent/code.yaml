        except SnowConfigError as e:
            print(f"snow_client: refused: {e}", file=sys.stderr)
            return 2
        except urllib.error.HTTPError as e:
            print(f"snow_client: HTTP {e.code}", file=sys.stderr)
            return 1
        except Exception as e:
            print(f"snow_client: {type(e).__name__}: {str(e)[:200]}", file=sys.stderr)
            return 1


    if __name__ == "__main__":
        raise SystemExit(main())
