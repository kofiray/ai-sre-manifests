    #!/usr/bin/env python3
    """ServiceNow Table API client: OAuth bearer tokens only (hardening item 3).

    One client for every ServiceNow caller outside the bridge and hitl: the trigger, the
    evidence collector, remediate, the scorecard bundle and the p4 gate's reads. It does
    what the bridge and hitl already do:

      * a bearer token from the instance's /oauth_token.do. The grant is "password" (the
        one proven on this instance, 2026-11-12: the integration user's name and password
        go to the TOKEN ENDPOINT only, never to the Table API) or "client_credentials",
        picked by SNOW_OAUTH_GRANT;
      * the token is cached and fetched again shortly before its stated expiry (skew
        SNOW_TOKEN_SKEW, default 60 s; no stated lifetime means 300 s, not forever);
      * a 401 from the Table API gets ONE fresh token and ONE retry; a second 401 is a
        real refusal and is raised;
      * there is no Basic code path at all. Missing OAuth settings are a refusal
        (SnowConfigError), never a quiet fall back to Basic: a client that drops back to
        Basic when a setting goes missing still uses Basic, just less often and with
        nobody noticing.

    Credentials come from a secret reader the caller passes in (`from_secrets(sm)`), so
    the agent's pod reads them with its own identity and the workstation with the
    operator's. Errors name what is missing, never a value. Nothing here is logged.

    CLI (workstation gates only; GET only):
        python3 scripts/agent/snow_client.py get '/api/now/table/incident?...'
    prints the JSON answer. Exit 0 ok, 1 the call failed, 2 OAuth not configured.
    """
    import json
    import os
    import sys
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    GRANTS = ("password", "client_credentials")
    TOKEN_PATH = "/oauth_token.do"


    class SnowConfigError(RuntimeError):
        """OAuth to ServiceNow is not configured. Never carries a secret."""


    class SnowAuthError(RuntimeError):
        """The token endpoint refused the grant or could not be reached. Never carries a secret."""


    def _local(host):
        return host in ("127.0.0.1", "localhost", "::1")


    class SnowClient:
        def __init__(self, instance, client_id, client_secret, username="", password="",
                     grant=None, skew=None, timeout=60):
            self.base = (instance or "").strip().rstrip("/")
            self.grant = (grant or os.environ.get("SNOW_OAUTH_GRANT") or "password").strip()
            self._id, self._secret = (client_id or "").strip(), (client_secret or "").strip()
            self._user, self._pw = (username or "").strip(), (password or "").strip()
            self.skew = float(skew if skew is not None else os.environ.get("SNOW_TOKEN_SKEW", "60"))
            self.timeout = timeout
            why = self.problem()
            if why:
                raise SnowConfigError(why)
            self._tok, self._exp = "", 0.0
            self._lock = threading.Lock()
            self.fetches = 0      # tokens fetched (tests and logs count these)
            self.refreshes = 0    # 401-driven refreshes

        def problem(self):
            """Why OAuth is NOT usable, or '' when it is."""
            if not self.base:
                return "no ServiceNow instance url (sre-agent-snow-instance-url)"
            u = urllib.parse.urlsplit(self.base)
            if u.scheme != "https" and not (u.scheme == "http" and _local(u.hostname or "")):
                return "the ServiceNow instance url must be https (a token is never sent in clear)"
            if not (self._id and self._secret):
                return ("no OAuth client (sre-agent-snow-oauth-client-id/-secret); ServiceNow is "
                        "OAuth-only and there is no Basic fallback")
            if self.grant not in GRANTS:
                return f"SNOW_OAUTH_GRANT={self.grant!r} is not one of {', '.join(GRANTS)}"
            if self.grant == "password" and not (self._user and self._pw):
                return ("the password grant needs the integration user's name and password "
                        "(sent to the token endpoint only)")
            return ""

        def token(self, force=False):
            """A cached bearer token; a new one when there is none, when it is within
            `skew` of expiry, or when `force` (a 401 on a Table API call)."""
            with self._lock:
                if not force and self._tok and time.time() < self._exp - self.skew:
                    return self._tok
                form = {"grant_type": self.grant, "client_id": self._id,
                        "client_secret": self._secret}
                if self.grant == "password":
                    form.update(username=self._user, password=self._pw)
                req = urllib.request.Request(self.base + TOKEN_PATH,
                                             data=urllib.parse.urlencode(form).encode(),
                                             method="POST")
                req.add_header("Content-Type", "application/x-www-form-urlencoded")
                req.add_header("Accept", "application/json")
                try:
                    with urllib.request.urlopen(req, timeout=self.timeout) as r:
                        out = json.loads(r.read().decode() or "{}")
                except urllib.error.HTTPError as e:
                    # The status only: the body of a refused grant could echo what we posted.
                    raise SnowAuthError(f"token endpoint refused the {self.grant} grant: HTTP {e.code}")
                except Exception as e:
                    raise SnowAuthError(f"token endpoint unreachable or not JSON: {type(e).__name__}")
                tok = out.get("access_token") or ""
                if not tok or str(out.get("token_type") or "Bearer").lower() != "bearer":
                    raise SnowAuthError("token endpoint answered without a bearer access_token")
                try:
                    ttl = float(out.get("expires_in") or 0)
                except (TypeError, ValueError):
                    ttl = 0
                self._tok, self._exp = tok, time.time() + (ttl if ttl > 0 else 300)
                self.fetches += 1
                return tok

        def _send(self, method, path, body, tok, timeout):
            req = urllib.request.Request(self.base + path,
                                         data=json.dumps(body).encode() if body else None,
                                         method=method)
            req.add_header("Authorization", "Bearer " + tok)
            req.add_header("Accept", "application/json")
            if body:
                req.add_header("Content-Type", "application/json")
            with urllib.request.urlopen(req, timeout=timeout or self.timeout) as r:
                raw = r.read().decode()
                return json.loads(raw) if raw else {}

        def call(self, method, path, body=None, timeout=None):
            """One Table API call; the parsed JSON answer. HTTP errors other than one
            401 are raised as urllib.error.HTTPError, as before."""
            try:
                return self._send(method, path, body, self.token(), timeout)
            except urllib.error.HTTPError as e:
                if e.code != 401:
                    raise
            # 401 on a token we thought was live: revoked, or the instance restarted.
            self.refreshes += 1
            return self._send(method, path, body, self.token(force=True), timeout)


    def from_secrets(sm, grant=None, timeout=60):
        """A client from Secret Manager, read with the caller's `sm(name)` (which returns
        "" when a secret cannot be read). Raises SnowConfigError when OAuth is not set up."""
        g = (grant or os.environ.get("SNOW_OAUTH_GRANT") or "password").strip()
        user = pw = ""
        if g == "password":
            user = sm("sre-agent-snow-integration-username")
            pw = sm("sre-agent-snow-integration-password")
        return SnowClient(instance=sm("sre-agent-snow-instance-url"),
                          client_id=sm("sre-agent-snow-oauth-client-id"),
                          client_secret=sm("sre-agent-snow-oauth-client-secret"),
                          username=user, password=pw, grant=g, timeout=timeout)


    def main(argv=None):
        argv = list(sys.argv[1:] if argv is None else argv)
        if len(argv) != 2 or argv[0] != "get" or not argv[1].startswith("/"):
            print("usage: snow_client.py get /api/now/table/...", file=sys.stderr)
            return 64
        sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
        import gcp_auth

        def sm(name):
            try:
                return (gcp_auth.secret(name, gcp_auth.project()) or "").strip()
            except Exception:
                return ""
        try:
            c = from_secrets(sm, timeout=30)
            print(json.dumps(c.call("GET", argv[1])))
