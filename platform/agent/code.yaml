      * `injection_scan()` deterministically flags instruction-like text in the
        evidence and records it in `_meta.injection` (count, kinds, evidence ids).
        It never blocks and never changes the prompt or the diagnosis: a flag is a
        signal for the human and the scorer, not a second decision-maker;
