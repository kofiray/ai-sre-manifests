    #!/usr/bin/env python3
    """The incident correlation ID on the agent's side (hardening item 5, consumed here).

    The bridge computes it (`apps/bridge/bridge.py correlation_id(labels)`: "cid1-" + 16
    hex of a hash of alertname, scope, namespace and workload) and stores it as the
    incident's `correlation_id`. Alertmanager's fingerprint changes when a pod or a
    scrape target does; the cid does not. This module IMPORTS the bridge's formula, it
    never copies it, so the two cannot drift.

    An older incident may still carry a raw Alertmanager fingerprint; `matches` accepts
    that too, so nothing opened before the switch is stranded.
    """
    import os
    import sys

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    sys.path.insert(0, os.path.join(ROOT, "apps", "bridge"))
    from bridge import CID_VERSION, DUP_CODE, _order, correlation_id  # noqa: E402,F401


    def is_cid(key):
        return str(key or "").startswith(CID_VERSION + "-")


    def matches(alert, key):
        """True if this Alertmanager alert belongs to the incident keyed `key`."""
        if not key or not isinstance(alert, dict):
            return False
        if is_cid(key):
            return correlation_id(alert.get("labels") or {}) == key
        return alert.get("fingerprint") == key


    def newest(alerts, key):
        """The newest active alert for `key` (several pods can fire under one cid)."""
        hits = [a for a in alerts or [] if matches(a, key)]
        active = [a for a in hits if ((a.get("status") or {}).get("state") or "active") == "active"]
        pool = active or hits
        return max(pool, key=lambda a: str(a.get("startsAt") or "")) if pool else None


    def canonical(incidents):
        """Only the incidents the agent should work: never one the bridge closed as a
        Duplicate, and, per correlation ID, only the OLDEST active one (bridge order).
        A younger active incident with the same cid is a duplicate the bridge has not
        finished closing; working it would diagnose and fix the same fault twice."""
        by_cid = {}
        for inc in incidents or []:
            if str(inc.get("close_code") or "") == DUP_CODE:
                continue
            c = inc.get("correlation_id")
            if c:
                by_cid.setdefault(c, []).append(inc)
        keep = {min(rows, key=_order)["sys_id"] for rows in by_cid.values()}
        return [i for i in incidents if i.get("sys_id") in keep]
