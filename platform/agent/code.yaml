    #!/usr/bin/env python3
    """Recovery verification — the gate between "a fix merged" and "the incident is
    closed" (SPEC §1.5, §7 P6; failure-library-v2 "Recovery check" per scenario).

        "Every fix is closed only after measured recovery."

    A merged pull request is not a recovery, and neither is a green ArgoCD sync: one
    is an intention and the other is a delivery. This module measures the estate and
    returns a verdict that `remediate.py close` refuses to proceed without.

    THE RULE THAT SHAPES EVERY CHECK: absence of evidence is never recovery.
    Six of the eight defects found in P2 were checks that reported success having
    verified nothing (L-P2-006..010, L-P5-002), and a recovery check is the easiest
    place in the system to make that mistake — after a fix, most things stop
    emitting. So:

      * a query that returns no series is UNKNOWN, never zero;
      * "no errors" is only accepted alongside proof that TRAFFIC IS STILL FLOWING,
        because a service with no requests has no errors either;
      * an unreachable Prometheus or Alertmanager fails the verification instead of
        passing it by default;
      * restart counts are sampled TWICE across a settle window, because "not
        crashing right now" and "not crashing" are different claims.

    TWO MODES. Without --scope this is the P8 checkout verifier, defaults unchanged.
    With `--scope <evidence bundle>` (P9c, docs/p9c-plan.md "Verifier") it checks
    the incident's scope instead:
      * alert-resolved          unchanged;
      * workload-at-baseline    every Deployment and StatefulSet in the scope
                                namespaces (a spec of 0 is allowed: some estate
                                workloads are parked at zero by design);
      * restarts-stable         every pod in the scope namespaces;
      * traffic-healthy         the estate SLI from config/agent-estate.json —
                                request rate > 0 FIRST, then error ratio <= ceiling —
                                with `evidence.rate` kept for score.check_recovery;
      * endpoints-full          only if --service is named.
    If config/agent-estate.json is absent (or has no SLI), the SLI falls back to
    DEFAULT_SLI below — `sum(rate(mlfx_requests_total[2m]))`, errors
    `outcome!="ok"`, ceiling 0.05 — and the verdict says which source it used. A
    file that exists but cannot be parsed fails the check (fail closed).

    THE AFFECTED SERVICE (hardening item 17). The checks above are estate-wide or
    workload-shaped: a W10-style fault (the Airflow scheduler scaled to zero) leaves
    every workload "at spec" and estate traffic green while nothing gets scheduled.
    So, on top of them (none is dropped), recovery also measures the SLI of the
    service the alert is about:
      * config/agent-estate.json `app_sli.apps` holds per-app indicators (PromQL,
        which direction is better, a tolerance, optional absolute min/max), keyed by
        the alert's `app` label (the bundle's `app`), else by a scope namespace that
        exactly one entry claims;
      * evidence.py captures a PRE-BREAK BASELINE of those indicators at incident
        open (median over a window that ends `gap_minutes` before the alert's
        startsAt) and stores it in the bundle as `sli_baseline`;
      * `affected-sli` passes only if every indicator is within tolerance of its
        baseline AND inside its absolute bounds, on two samples taken across the
        same settle window the restart check holds for;
      * no baseline (or one taken with a different query) is an explicit BLOCKED
        check, never a pass; an app with no configured SLI falls back to the checks
        above and the verdict says `sli.kind = "fallback"`.
    The verdict keeps its keys and adds `sli`, `baseline`, `observed`, `tolerance`
    (and `blocked` when the baseline is missing).

    There is no admin kubeconfig fallback (hardening item 1): it reads as the agent
    (its pod's ServiceAccount token, or the agent's minted kubeconfig on the
    workstation) or not at all, and with no agent identity the verdict is "not
    recovered". AGENT_REQUIRE_KC=1 is therefore the only behaviour, not an option.
    """
    import argparse
    import json
    import math
    import os
    import re
    import statistics
    import sys
    import time

    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import observe  # noqa: E402
    sys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.abspath(__file__))), "agent"))
    import cid as _cid  # noqa: E402  (the bridge's cid1 formula, imported)

    ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    ESTATE = os.environ.get("AGENT_ESTATE", os.path.join(ROOT, "config", "agent-estate.json"))
    DEFAULT_SLI = {"rate": "sum(rate(mlfx_requests_total[2m]))",
                   "errors": 'sum(rate(mlfx_requests_total{outcome!="ok"}[2m]))',
                   "error_ratio_ceiling": 0.05}

    # kube-prometheus-stack ships alerts that are SUPPOSED to be firing forever:
    # Watchdog is a dead-man's switch, InfoInhibitor is plumbing. Naming them here
    # keeps "no alert is firing" honest without quietly widening it.
    ALWAYS_FIRING = {"Watchdog", "InfoInhibitor"}


    class Verdict:
        def __init__(self):
            self.checks = []
            # The affected-service SLI (item 17): kind, baseline, observed, tolerance.
            self.sli_info = {"kind": "fallback", "app": None,
                             "reason": "no per-app SLI was selected for this verification"}

        def add(self, name, ok, detail, evidence=None):
            self.checks.append({"check": name, "ok": bool(ok), "detail": detail,
                                "evidence": evidence})
            return bool(ok)

        @property
        def recovered(self):
            return all(c["ok"] for c in self.checks) and bool(self.checks)


    # ---------------------------------------------------------------- checks ----
    def check_alert_resolved(v, fingerprint, alertname):
        """The alert that opened this incident is no longer firing — established
        from BOTH sides (Alertmanager's active set and Prometheus's ALERTS series),
        because a fix that only silences one of them has not fixed anything."""
        active, err = observe.alerts()
        if active is None:
            return v.add("alert-resolved", False,
                         f"Alertmanager could not be read, so the alert state is UNKNOWN "
                         f"and recovery cannot be certified: {err}")
        still = [a for a in active
                 if _cid.matches(a, fingerprint) or a.get("fingerprint") == fingerprint
                 or (alertname and (a.get("labels") or {}).get("alertname") == alertname)]
        if still:
            return v.add("alert-resolved", False,
                         f"the alert is still active in Alertmanager: "
                         f"{[ (a.get('labels') or {}).get('alertname') for a in still ][:4]}",
                         {"fingerprint": fingerprint, "active": len(still)})
        firing = [(a.get("labels") or {}).get("alertname") for a in active
                  if (a.get("labels") or {}).get("alertname") not in ALWAYS_FIRING]
        ok = v.add("alert-resolved", True,
                   f"no alert with correlation id {fingerprint}"
                   + (f" and no alert named {alertname}" if alertname else "")
                   + " is active in Alertmanager",
                   {"other_firing": sorted(set(x for x in firing if x))})
        # Prometheus's own view, independently.
        if alertname:
            res, perr = observe.prom_query(f'ALERTS{{alertname="{alertname}",alertstate="firing"}}')
            if res is None:
                ok &= v.add("alert-resolved-prometheus", False,
                            f"Prometheus could not be read, so its view of the alert is UNKNOWN: {perr}")
            else:
                ok &= v.add("alert-resolved-prometheus", not res,
                            f"Prometheus reports {alertname} not firing" if not res
                            else f"Prometheus still reports {alertname} FIRING",
                            {"series": len(res)})
        return ok


    def check_workload(v, namespace, deployment):
        """Every replica the spec asks for is updated, available and Ready, and the
        controller has caught up with the spec it was given."""
        rc, out, err = observe.kubectl(["get", "deploy", deployment, "-n", namespace, "-o", "json"])
        if rc != 0:
            return v.add("workload-at-baseline", False,
                         f"the Deployment could not be read — a workload that is not there is not "
                         f"recovered: {err[:160]}")
        d = json.loads(out)
        spec = d["spec"].get("replicas", 0)
        st = d.get("status") or {}
        ready, avail, updated = (st.get("readyReplicas", 0), st.get("availableReplicas", 0),
                                 st.get("updatedReplicas", 0))
        gen, obs = d["metadata"].get("generation"), st.get("observedGeneration")
        ok = (spec > 0 and ready == avail == updated == spec and gen == obs)
        return v.add("workload-at-baseline", ok,
                     f"{deployment}: spec={spec} ready={ready} available={avail} updated={updated}, "
                     f"generation {gen} observed {obs}"
                     + ("" if ok else " — not at baseline"),
                     {"spec": spec, "ready": ready, "available": avail, "updated": updated,
                      "generation": gen, "observedGeneration": obs})


    def _restarts(namespace, selector, prefix=""):
        args = ["get", "pods", "-n", namespace, "-o", "json"]
        if selector:
            args[4:4] = ["-l", selector]
        rc, out, err = observe.kubectl(args)
        if rc != 0:
            return None, err[:160]
        counts, waiting = {}, []
        for p in json.loads(out).get("items", []):
            n = prefix + p["metadata"]["name"]
            for cs in (p.get("status") or {}).get("containerStatuses") or []:
                counts[f"{n}/{cs['name']}"] = cs.get("restartCount", 0)
                w = (cs.get("state") or {}).get("waiting") or {}
                if w.get("reason") in ("CrashLoopBackOff", "ImagePullBackOff", "ErrImagePull"):
                    waiting.append(f"{n}/{cs['name']}={w['reason']}")
                lt = ((cs.get("lastState") or {}).get("terminated") or {})
                if lt.get("reason") == "OOMKilled":
                    waiting.append(f"{n}/{cs['name']}=last-terminated-OOMKilled")
        if not counts:
            return None, "no pods matched — an empty fleet is not a healthy one"
        return {"counts": counts, "bad": waiting}, None


    def _restarts_scope(namespaces):
        """Every pod in every scope namespace, keyed `<ns>/<pod>/<container>`. A
        namespace with no pods is skipped; ALL of them empty is not a healthy fleet."""
        counts, bad = {}, []
        for ns in namespaces:
            r, err = _restarts(ns, None, prefix=f"{ns}/")
            if r is None:
                if (err or "").startswith("no pods matched"):
                    continue
                return None, f"{ns}: {err}"
            counts.update(r["counts"])
            bad += r["bad"]
        if not counts:
            return None, (f"no pods in any scope namespace {list(namespaces)} — an empty fleet is "
                          f"not a healthy one")
        return {"counts": counts, "bad": bad}, None


    def check_restarts_stable(v, namespace, selector, settle, sampler=None):
        """Sampled twice across the settle window: 'not crashing right now' is a
        different claim from 'not crashing', and F02/F06 are exactly the difference."""
        sampler = sampler or (lambda: _restarts(namespace, selector))
        first, err = sampler()
        if first is None:
            return v.add("restarts-stable", False, f"could not sample restart counts: {err}")
        time.sleep(settle)
        second, err = sampler()
        if second is None:
            return v.add("restarts-stable", False, f"could not re-sample restart counts: {err}")
        moved = {k: (first["counts"].get(k), c) for k, c in second["counts"].items()
                 if first["counts"].get(k) is not None and c != first["counts"][k]}
        new_pods = set(second["counts"]) - set(first["counts"])
        ok = not moved and not second["bad"]
        detail = (f"restart counts unchanged across {settle}s over {len(second['counts'])} containers, "
                  f"nothing in a crash/OOM state")
        if moved:
            detail = f"containers restarted during the settle window: {moved}"
        elif second["bad"]:
            detail = f"containers in a bad state: {second['bad']}"
        return v.add("restarts-stable", ok, detail,
                     {"settle_seconds": settle, "containers": len(second["counts"]),
                      "moved": moved, "new_pods": sorted(new_pods), "bad": second["bad"]})


    def check_endpoints(v, namespace, service, expect):
        """Ready endpoints behind the Service. Pods can be Ready while the Service
        is empty; F05 is the scenario built on precisely that gap."""
        rc, out, err = observe.kubectl(["get", "endpointslices", "-n", namespace,
                                        "-l", f"kubernetes.io/service-name={service}", "-o", "json"])
        if rc != 0:
            return v.add("endpoints-full", False, f"could not read EndpointSlices: {err[:160]}")
        ready = 0
        for s in json.loads(out).get("items", []):
            for ep in s.get("endpoints") or []:
                if ((ep.get("conditions") or {}).get("ready")) is True:
                    ready += len(ep.get("addresses") or [])
        return v.add("endpoints-full", ready == expect and expect > 0,
                     f"{ready} ready endpoint(s) behind Service/{service}, expected {expect}",
                     {"ready": ready, "expected": expect})


    def check_traffic(v, service, window, max_error_ratio):
        """Serving, and serving correctly.

        The order matters: traffic is asserted to EXIST before errors are asserted to
        be absent. A dead service has a perfect error rate."""
        total_q = (f'sum(rate(istio_requests_total{{reporter="source",'
                   f'destination_service_name="{service}"}}[{window}]))')
        err_q = (f'sum(rate(istio_requests_total{{reporter="source",'
                 f'destination_service_name="{service}",response_code=~"5.."}}[{window}]))')
        total, terr = observe.prom_scalar(total_q)
        if total is None:
            return v.add("traffic-healthy", False,
                         f"request rate for {service} is UNKNOWN, so 'no errors' would be vacuous: {terr}",
                         {"query": total_q})
        if total <= 0:
            return v.add("traffic-healthy", False,
                         f"no traffic to {service} over the last {window} — a service nobody is "
                         f"calling cannot be shown to have recovered",
                         {"query": total_q, "rate": total})
        errs, eerr = observe.prom_scalar(err_q)
        if errs is None:
            # No 5xx series at all, with traffic proven present, IS zero errors: the
            # series only exists once a 5xx happens. This is the one place where an
            # empty result is a value, and it is sound only because the denominator
            # above was proven non-empty first.
            errs = 0.0
        ratio = errs / total if total else 1.0
        ok = ratio <= max_error_ratio
        return v.add("traffic-healthy", ok,
                     f"{total:.2f} req/s to {service} over {window}, 5xx rate {errs:.4f}/s "
                     f"({ratio:.2%} of traffic; ceiling {max_error_ratio:.2%})",
                     {"query_total": total_q, "query_errors": err_q,
                      "rate": total, "errors": errs, "ratio": ratio})


    def check_dns(v, window):
        """F04's recovery observable: cluster DNS is answering, and not with failures."""
        rc, out, err = observe.kubectl(["get", "deploy", "coredns", "-n", "kube-system", "-o", "json"])
        if rc != 0:
            return v.add("dns-healthy", False, f"could not read the CoreDNS Deployment: {err[:160]}")
        d = json.loads(out)
        spec, ready = d["spec"].get("replicas", 0), (d.get("status") or {}).get("readyReplicas", 0)
        ok = spec > 0 and ready == spec
        ok = v.add("dns-replicas", ok, f"CoreDNS ready {ready}/{spec}", {"ready": ready, "spec": spec})
        req, rerr = observe.prom_scalar(f'sum(rate(coredns_dns_requests_total[{window}]))')
        if req is None or req <= 0:
            return v.add("dns-healthy", False,
                         f"CoreDNS query rate is {'UNKNOWN' if req is None else 'zero'} — a resolver "
                         f"nobody is asking cannot be shown to be answering: {rerr or ''}") and ok
        bad, _ = observe.prom_scalar(
            f'sum(rate(coredns_dns_responses_total{{rcode=~"SERVFAIL|REFUSED"}}[{window}]))')
        bad = 0.0 if bad is None else bad
        return v.add("dns-healthy", bad == 0,
                     f"{req:.1f} DNS queries/s over {window} with {bad:.3f}/s SERVFAIL/REFUSED",
                     {"requests": req, "failures": bad}) and ok


    # ------------------------------------------------------- P9c: --scope ----
    def load_scope(path):
        """The `scope` of an evidence bundle (or a bare scope document)."""
        doc = json.load(open(path))
        scope = doc.get("scope") if isinstance(doc.get("scope"), dict) else doc
        if not isinstance(scope, dict) or not scope.get("namespaces"):
            raise SystemExit(f"verify_recovery: {path} has no scope.namespaces")
        return scope


    def load_sli(path=None):
        """The estate SLI. Returns (sli, None) or (None, why).

        config/agent-estate.json is written by another part of P9c; its exact
        shape was not fixed when this was written, so a few spellings are read:
        an `sli` (or `traffic`) object with `rate`|`rate_expr`|`total`|`expr`,
        `errors`|`error_expr`|`errors_expr`, `error_ratio_ceiling`|`max_error_ratio`.
        Absent file, or no SLI in it -> DEFAULT_SLI, with `source` saying so."""
        path = path or ESTATE
        if not os.path.exists(path):
            return dict(DEFAULT_SLI, source=f"defaults ({os.path.basename(path)} absent)"), None
        try:
            doc = json.load(open(path))
        except Exception as e:
            return None, f"{path} could not be parsed ({e}); refusing to guess the SLI"
        sli = doc.get("sli") or doc.get("traffic") if isinstance(doc, dict) else None
        if not isinstance(sli, dict):
            return dict(DEFAULT_SLI, source=f"defaults (no sli in {os.path.basename(path)})"), None

        def pick(*ks):
            for k in ks:
                if sli.get(k) not in (None, ""):
                    return sli[k]
            return None
        rate = pick("rate_query", "rate", "rate_expr", "total", "expr") or DEFAULT_SLI["rate"]
        # "sum(...) > 0" reads as a condition; the check wants the number itself.
        rate = re.sub(r"\s*>\s*0(?:\.0*)?\s*$", "", str(rate))
        errors = pick("errors", "error_expr", "errors_expr") or DEFAULT_SLI["errors"]
        ceiling = pick("error_ratio_ceiling", "max_error_ratio", "ceiling")
        try:
            ceiling = float(DEFAULT_SLI["error_ratio_ceiling"] if ceiling is None else ceiling)
        except (TypeError, ValueError):
            return None, f"{path}: error ratio ceiling {ceiling!r} is not a number"
        # config/agent-estate.json (as written) gives the error RATIO directly.
        ratio_q = pick("error_ratio_query", "ratio_query")
        return {"rate": rate, "errors": str(errors), "ratio": ratio_q, "error_ratio_ceiling": ceiling,
                "source": os.path.basename(path)}, None


    # ------------------------------------- item 17: the affected service's SLI ----
    BASELINE_DEFAULTS = {"window_minutes": 10, "gap_minutes": 10, "step_seconds": 30,
                         "min_samples": 5}
    BETTER = ("higher", "lower")


    def app_sli_config(doc):
        """`app_sli` of an estate document -> (cfg, None) or (None, why).

        cfg = {"baseline": {...}, "apps": {key: entry}}. No `app_sli` at all is an
        empty config (every app falls back, and says so); a malformed one is an
        error, so a typo can never quietly turn per-app recovery off."""
        if not isinstance(doc, dict):
            return None, "the estate document is not a JSON object"
        raw = doc.get("app_sli")
        if raw is None:
            return {"baseline": dict(BASELINE_DEFAULTS), "apps": {}}, None
        if not isinstance(raw, dict) or not isinstance(raw.get("apps", {}), dict):
            return None, "app_sli must be an object with an `apps` object"
        base = dict(BASELINE_DEFAULTS)
        for k, val in (raw.get("baseline") or {}).items():
            if k in BASELINE_DEFAULTS:
                if not isinstance(val, (int, float)) or isinstance(val, bool) or val < 0:
                    return None, f"app_sli.baseline.{k} must be a non-negative number"
                base[k] = val
        apps = {}
        for key, e in (raw.get("apps") or {}).items():
            if key.startswith("_"):
                continue
            if not isinstance(e, dict) or not isinstance(e.get("indicators"), list) \
                    or not e["indicators"]:
                return None, f"app_sli.apps.{key} needs a non-empty `indicators` list"
            names = set()
            for i in e["indicators"]:
                if not isinstance(i, dict) or not i.get("name") or not i.get("query"):
                    return None, f"app_sli.apps.{key}: every indicator needs a name and a query"
                if i["name"] in names:
                    return None, f"app_sli.apps.{key}: indicator {i['name']} is named twice"
                names.add(i["name"])
                if i.get("better") not in BETTER:
                    return None, f"app_sli.apps.{key}.{i['name']}: better must be higher|lower"
                tol = i.get("tolerance") or {}
                for k in ("relative", "absolute"):
                    if not isinstance(tol.get(k, 0), (int, float)) or tol.get(k, 0) < 0:
                        return None, (f"app_sli.apps.{key}.{i['name']}: tolerance.{k} must be a "
                                      f"non-negative number")
                for k in ("min", "max"):
                    if k in i and not isinstance(i[k], (int, float)):
                        return None, f"app_sli.apps.{key}.{i['name']}: {k} must be a number"
            apps[key] = e
        return {"baseline": base, "apps": apps}, None


    def load_app_slis(path=None):
        """The per-app SLIs from config/agent-estate.json. An absent file is an empty
        config; an unparseable one is an error (fail closed, as load_sli does)."""
        path = path or ESTATE
        if not os.path.exists(path):
            return {"baseline": dict(BASELINE_DEFAULTS), "apps": {}}, None
        try:
            doc = json.load(open(path))
        except Exception as e:
            return None, f"{path} could not be parsed ({e}); refusing to guess the per-app SLI"
        return app_sli_config(doc)


    def select_app_sli(cfg, app, namespaces):
        """Which configured SLI measures the affected service.

        1. the alert's `app` label (the bundle's `app`): an entry of that key, or one
           that lists it under `apps`;
        2. else a scope namespace that EXACTLY ONE entry claims under `namespaces`.
        Returns {"kind": "per-app", "app", "entry", "matched_by"} or
        {"kind": "fallback", "app": None, "reason"}. Two entries claiming the scope is
        a fallback too: guessing which tenant was hurt is not measuring it."""
        apps = (cfg or {}).get("apps") or {}
        if app:
            for key, e in apps.items():
                if key == app or app in (e.get("apps") or []):
                    return {"kind": "per-app", "app": key, "entry": e,
                            "matched_by": f"alert app label {app!r}"}
        claims = sorted({k for k, e in apps.items()
                         if set(e.get("namespaces") or []) & set(namespaces or [])})
        if len(claims) == 1:
            return {"kind": "per-app", "app": claims[0], "entry": apps[claims[0]],
                    "matched_by": f"scope namespace {sorted(set(apps[claims[0]]['namespaces']) & set(namespaces))}"}
        why = (f"no per-app SLI is configured for app {app!r} or namespaces {list(namespaces or [])}"
               if not claims else
               f"the scope namespaces {list(namespaces or [])} are claimed by several apps "
               f"{claims} and the alert names none of them")
        return {"kind": "fallback", "app": None, "reason": why}


    def _finite(x):
        try:
            f = float(x)
        except (TypeError, ValueError):
            return None
        return f if math.isfinite(f) else None


    def baseline_window(starts_at, base_cfg):
        """[start, end] in unix seconds: a window that closes `gap_minutes` before the
        alert started firing. The break lands before the alert (the rule's `for:`,
        the time the fault takes to show), so the minutes just before startsAt are
        already broken and are not a baseline."""
        end = starts_at - float(base_cfg["gap_minutes"]) * 60
        return end - float(base_cfg["window_minutes"]) * 60, end


    def baseline_from_range(result, min_samples):
        """One indicator's baseline from a query_range answer. Exactly one series,
        at least `min_samples` finite samples; the median, so one scrape blip does
        not set the bar. Anything else is `unavailable`, with the reason."""
        if result is None:
            return {"status": "unavailable", "reason": "Prometheus could not be read"}
        if not result:
            return {"status": "unavailable",
                    "reason": "the query returned no series over the baseline window"}
        if len(result) != 1:
            return {"status": "unavailable",
                    "reason": f"the query returned {len(result)} series; an SLI must aggregate to one"}
        vals = [f for f in (_finite(v) for _, v in result[0].get("values") or []) if f is not None]
        if len(vals) < int(min_samples):
            return {"status": "unavailable",
                    "reason": f"{len(vals)} finite sample(s) in the baseline window, "
                              f"{int(min_samples)} needed"}
        return {"status": "ok", "value": statistics.median(vals), "samples": len(vals),
                "min": min(vals), "max": max(vals)}


    def capture_baseline(cfg, app, namespaces, starts_at, range_fn):
        """What evidence.py stores in the bundle as `sli_baseline` at incident open.
        `range_fn(query, start, end, step)` is evidence.prom_range (None if
        Prometheus is unreadable, [] for no series). Never raises for a bad answer:
        a missing baseline is recorded, and the verifier turns it into BLOCKED."""
        iso_ = lambda t: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t))  # noqa: E731
        sel = select_app_sli(cfg, app, namespaces)
        out = {"version": 1, "kind": sel["kind"], "app": sel.get("app"),
               "matched_by": sel.get("matched_by"), "reason": sel.get("reason")}
        if sel["kind"] != "per-app":
            return out
        base = cfg["baseline"]
        if starts_at is None:
            out["indicators"] = {i["name"]: {"query": i["query"], "status": "unavailable",
                                             "reason": "the alert's startsAt is unknown, so no "
                                                       "pre-break window can be chosen"}
                                 for i in sel["entry"]["indicators"]}
            return out
        start, end = baseline_window(starts_at, base)
        out["window"] = {"start": iso_(start), "end": iso_(end), "alert_starts_at": iso_(starts_at),
                         "step_seconds": int(base["step_seconds"]),
                         "gap_minutes": base["gap_minutes"], "window_minutes": base["window_minutes"]}
        out["indicators"] = {}
        for i in sel["entry"]["indicators"]:
            try:
                res = range_fn(i["query"], start, end, int(base["step_seconds"]))
            except (Exception, SystemExit) as e:  # noqa: BLE001  (a read error is "no baseline")
                res, why = None, f"{type(e).__name__}: {str(e)[:120]}"
            else:
                why = None
            b = baseline_from_range(res, base["min_samples"])
            if why:
                b["reason"] = f"Prometheus read failed: {why}"
            out["indicators"][i["name"]] = dict(b, query=i["query"])
        return out


    def sample_app_sli(entry):
        """One instant sample of every indicator: {name: (value | None, why)}."""
        out = {}
        for i in entry["indicators"]:
            val, err = observe.prom_scalar(i["query"])
            if val is None:
                out[i["name"]] = (None, err or "no value")
            elif _finite(val) is None:
                out[i["name"]] = (None, "the sample is not a finite number (NaN/Inf)")
            else:
                out[i["name"]] = (float(val), None)
        return out


    def judge_indicator(ind, base, obs):
        """(ok, allowed, why) for one observed value against its baseline and bounds.
        Allowed degradation = max(relative x |baseline|, absolute), in the bad direction."""
        tol = ind.get("tolerance") or {}
        allowed = max(float(tol.get("relative", 0)) * abs(base), float(tol.get("absolute", 0)))
        worse = (base - obs) if ind["better"] == "higher" else (obs - base)
        why = []
        if worse > allowed + 1e-12:
            why.append(f"{obs:.4g} is {worse:.4g} {'below' if ind['better'] == 'higher' else 'above'} "
                       f"the baseline {base:.4g} (allowed {allowed:.4g})")
        if "min" in ind and obs < ind["min"]:
            why.append(f"{obs:.4g} < absolute min {ind['min']}")
        if "max" in ind and obs > ind["max"]:
            why.append(f"{obs:.4g} > absolute max {ind['max']}")
        return not why, allowed, "; ".join(why)


    def check_affected_sli(v, sel, baseline_doc, samples):
        """The affected service is back within tolerance of its pre-break baseline,
        and inside its absolute bounds, on every sample (two, across the settle
        window). A required indicator with no usable baseline is BLOCKED: the check
        fails and says so, it never passes for want of a comparison."""
        entry, key = sel["entry"], sel["app"]
        info = {"kind": "per-app", "app": key, "matched_by": sel.get("matched_by"),
                "baseline": {}, "observed": {}, "tolerance": {}, "blocked": False}
        v.sli_info = info
        bdoc = baseline_doc if isinstance(baseline_doc, dict) else None
        if bdoc is None:
            blocked_all = "the evidence bundle carries no sli_baseline (captured at incident open)"
        elif bdoc.get("app") != key:
            blocked_all = (f"the bundle's baseline was taken for {bdoc.get('app')!r} "
                           f"({bdoc.get('kind')}: {bdoc.get('reason') or bdoc.get('matched_by')}), "
                           f"not for {key!r}")
        else:
            blocked_all = None
        blocked, failed, passed, skipped = [], [], [], []
        for ind in entry["indicators"]:
            name, required = ind["name"], ind.get("required", True)
            info["tolerance"][name] = {"better": ind["better"], **(ind.get("tolerance") or {}),
                                       **{k: ind[k] for k in ("min", "max") if k in ind}}
            info["observed"][name] = [s.get(name, (None, "not sampled"))[0] for s in samples]
            b = None if blocked_all else (bdoc.get("indicators") or {}).get(name)
            why = blocked_all
            if why is None:
                if not b:
                    why = "no baseline was captured for this indicator"
                elif b.get("query") != ind["query"]:
                    why = "the baseline was taken with a different query (config changed since)"
                elif b.get("status") != "ok" or _finite(b.get("value")) is None:
                    why = f"baseline unavailable: {b.get('reason') or b.get('status')}"
            if why:
                info["baseline"][name] = None
                (blocked if required else skipped).append(f"{name}: {why}")
                continue
            base = float(b["value"])
            info["baseline"][name] = base
            bad = []
            for n, s in enumerate(samples, 1):
                val, err = s.get(name, (None, "not sampled"))
                if val is None:
                    bad.append(f"sample {n} UNKNOWN ({err})")
                    continue
                ok, allowed, w = judge_indicator(ind, base, val)
                info["tolerance"][name]["allowed"] = allowed
                if not ok:
                    bad.append(f"sample {n}: {w}")
            (failed if bad else passed).append(f"{name}: " + ("; ".join(bad) if bad else
                                                              f"{info['observed'][name]} vs baseline {base:.4g}"))
        if not passed and not failed and not blocked:
            blocked.append("no indicator had a usable baseline")
        ev = {"app": key, "matched_by": sel.get("matched_by"), "baseline": info["baseline"],
              "observed": info["observed"], "tolerance": info["tolerance"], "samples": len(samples),
              "passed": passed, "failed": failed, "blocked": blocked, "skipped": skipped}
        if blocked:
            info["blocked"] = True
            return v.add("affected-sli", False,
                         f"BLOCKED: the {key} SLI cannot be compared with a pre-break baseline, so "
                         f"its recovery is not shown: " + " | ".join(blocked[:4]),
                         dict(ev, blocked_reason=blocked))
        if failed:
            return v.add("affected-sli", False,
                         f"the {key} SLI is not back at its pre-break baseline: " + " | ".join(failed[:4]),
                         ev)
        return v.add("affected-sli", True,
                     f"the {key} SLI is within tolerance of its pre-break baseline on "
                     f"{len(samples)} sample(s): " + " | ".join(passed[:4])
                     + (f" (skipped, optional: {skipped})" if skipped else ""), ev)


    def _workload_row(kind, d):
        spec = (d.get("spec") or {}).get("replicas", 0) or 0
        st = d.get("status") or {}
        ready = st.get("readyReplicas", 0) or 0
        # StatefulSets report availableReplicas only on newer API servers.
        avail = st.get("availableReplicas", ready if kind == "StatefulSet" else 0) or 0
        updated = st.get("updatedReplicas", 0) or 0
        gen, obs = (d.get("metadata") or {}).get("generation"), st.get("observedGeneration")
        ok = ready == avail == updated == spec and gen == obs
        return ok, {"kind": kind, "name": (d.get("metadata") or {}).get("name"), "spec": spec,
                    "ready": ready, "available": avail, "updated": updated,
                    "generation": gen, "observedGeneration": obs}


    def check_workloads_scope(v, namespaces):
        """Every Deployment and StatefulSet in scope is where its spec says, and the
        controller has caught up with it. A spec of 0 is allowed (parked by design);
        no workloads at all is not."""
        rows, bad, unread = [], [], []
        for ns in namespaces:
            rc, out, err = observe.kubectl(["get", "deployments,statefulsets", "-n", ns, "-o", "json"])
            if rc != 0:
                unread.append(f"{ns}: {err[:120]}")
                continue
            for d in json.loads(out).get("items", []):
                ok, row = _workload_row(d.get("kind"), d)
                row["namespace"] = ns
                rows.append(row)
                if not ok:
                    bad.append(row)
        if unread:
            return v.add("workload-at-baseline", False,
                         f"workloads could not be read, so they are not shown recovered: {unread}",
                         {"unreadable": unread})
        if not rows:
            return v.add("workload-at-baseline", False,
                         f"no Deployment or StatefulSet in {list(namespaces)} — a workload that is "
                         f"not there is not recovered", {"workloads": 0})
        detail = (f"{len(rows)} workload(s) in {list(namespaces)} at their spec, every generation "
                  f"observed" if not bad else
                  "not at baseline: " + "; ".join(
                      f"{r['namespace']}/{r['kind']}/{r['name']} spec={r['spec']} ready={r['ready']} "
                      f"available={r['available']} updated={r['updated']} "
                      f"gen {r['generation']}/{r['observedGeneration']}" for r in bad[:6]))
        return v.add("workload-at-baseline", not bad, detail,
                     {"workloads": len(rows), "not_at_baseline": bad, "rows": rows})


    def check_endpoints_scope(v, namespace, service):
        """Only when a Service is named: every endpoint behind it is ready, and
        there is at least one."""
        rc, out, err = observe.kubectl(["get", "endpointslices", "-n", namespace,
                                        "-l", f"kubernetes.io/service-name={service}", "-o", "json"])
        if rc != 0:
            return v.add("endpoints-full", False, f"could not read EndpointSlices: {err[:160]}")
        ready = total = 0
        for s in json.loads(out).get("items", []):
            for ep in s.get("endpoints") or []:
                n = len(ep.get("addresses") or [])
                total += n
                if ((ep.get("conditions") or {}).get("ready")) is True:
                    ready += n
        return v.add("endpoints-full", ready == total and total > 0,
                     f"{ready}/{total} endpoint(s) ready behind {namespace}/Service/{service}",
                     {"ready": ready, "total": total})


    def check_traffic_sli(v, sli):
        """The estate SLI: traffic is proven to EXIST before errors are proven absent,
        exactly as check_traffic does for checkout. `evidence.rate` is what
        score.check_recovery reads."""
        total, terr = observe.prom_scalar(sli["rate"])
        ev = {"query_total": sli["rate"], "query_errors": sli["errors"],
              "ceiling": sli["error_ratio_ceiling"], "sli_source": sli.get("source")}
        if total is None:
            return v.add("traffic-healthy", False,
                         f"the estate request rate is UNKNOWN, so 'no errors' would be vacuous: {terr}",
                         ev)
        if total <= 0:
            return v.add("traffic-healthy", False,
                         "no estate traffic — a service nobody is calling cannot be shown to have "
                         "recovered", dict(ev, rate=total))
        if sli.get("ratio"):
            ratio, rerr = observe.prom_scalar(sli["ratio"])
            if ratio is None:
                return v.add("traffic-healthy", False,
                             f"the estate error ratio is UNKNOWN: {rerr}", dict(ev, rate=total))
            errs = ratio * total
        else:
            errs, _ = observe.prom_scalar(sli["errors"])
            # As in check_traffic: with traffic proven present, no error series is zero.
            errs = 0.0 if errs is None else errs
            ratio = errs / total
        ok = ratio <= sli["error_ratio_ceiling"]
        return v.add("traffic-healthy", ok,
                     f"{total:.2f} req/s across the estate, errors {errs:.4f}/s ({ratio:.2%}; "
                     f"ceiling {sli['error_ratio_ceiling']:.2%}; SLI from {sli.get('source')})",
                     dict(ev, rate=total, errors=errs, ratio=ratio))


    def _affected_start(sel):
        """First sample of the affected SLI, taken BEFORE the settle window (the
        second is taken after it, so the SLI has to hold across the same window the
        restart counts do). None when there is nothing per-app to sample."""
        if sel and sel.get("kind") == "per-app":
            return sample_app_sli(sel["entry"])
        return None


    def _affected_finish(v, sel, baseline, first):
        """Add `affected-sli` (per-app), or a failing check (the per-app config is
        broken), or nothing but the record (fallback: the estate-wide checks stand
        alone and the verdict says so)."""
        sel = sel or {"kind": "fallback", "app": None,
                      "reason": "no per-app SLI selection was supplied to the verifier"}
        if sel.get("kind") == "per-app":
            return check_affected_sli(v, sel, baseline, [first, sample_app_sli(sel["entry"])])
        if sel.get("kind") == "error":
            v.sli_info = {"kind": "error", "app": None, "reason": sel.get("reason")}
            return v.add("affected-sli", False,
                         f"the per-app SLI config is unusable, so the affected service cannot be "
                         f"measured: {sel.get('reason')}")
        v.sli_info = {"kind": "fallback", "app": None, "reason": sel.get("reason")}
        return True


    def verify_scope(fingerprint, alertname, scope, settle, sli, sli_err, service=None,
                     service_namespace=None, want_dns=False, window="2m", app_sli=None,
                     baseline=None):
        """`app_sli` is select_app_sli()'s answer (or {"kind": "error"}); `baseline`
        the bundle's `sli_baseline`. Without them this is the estate-wide check of
        before item 17, recorded as a fallback."""
        v = Verdict()
        nss = list(scope.get("namespaces") or [])
        check_alert_resolved(v, fingerprint, alertname)
        check_workloads_scope(v, nss)
        first = _affected_start(app_sli)
        check_restarts_stable(v, None, None, settle, sampler=lambda: _restarts_scope(nss))
        if service:
            check_endpoints_scope(v, service_namespace or nss[0], service)
        if sli is None:
            v.add("traffic-healthy", False, f"the estate SLI is unavailable: {sli_err}")
        else:
            check_traffic_sli(v, sli)
        _affected_finish(v, app_sli, baseline, first)
        if want_dns:
            check_dns(v, window)
        return v


    # ------------------------------------------------------------------ main ----
    def verify(fingerprint, alertname, namespace, deployment, service, selector,
               settle, window, max_error_ratio, want_dns, expect_replicas=None,
               app_sli=None, baseline=None):
        v = Verdict()
        check_alert_resolved(v, fingerprint, alertname)
        check_workload(v, namespace, deployment)
        first = _affected_start(app_sli)
        check_restarts_stable(v, namespace, selector, settle)
        if expect_replicas is None:
            rc, out, _ = observe.kubectl(["get", "deploy", deployment, "-n", namespace, "-o", "json"])
            try:
                expect_replicas = int(json.loads(out)["spec"].get("replicas", 0)) if rc == 0 else 0
            except (ValueError, KeyError, TypeError):
                expect_replicas = 0
        check_endpoints(v, namespace, service, expect_replicas)
        check_traffic(v, service, window, max_error_ratio)
        _affected_finish(v, app_sli, baseline, first)
        if want_dns:
            check_dns(v, window)
        return v


    def main(argv=None):
        ap = argparse.ArgumentParser(description="measure recovery; refuse to guess")
        ap.add_argument("--correlation-id", "--fingerprint", dest="fingerprint", required=True,
                        help="the incident's correlation id (cid1-...; a pre-cid fingerprint works too)")
        ap.add_argument("--alertname", default="")
        ap.add_argument("--scope", default="",
                        help="evidence bundle: verify its scope (P9c) instead of checkout")
        # None means "not given": legacy mode fills in checkout, scope mode leaves
        # them unset (endpoints-full runs only if --service is named).
        ap.add_argument("--namespace", default=None)
        ap.add_argument("--deployment", default=None)
        ap.add_argument("--service", default=None)
        ap.add_argument("--selector", default=None)
        ap.add_argument("--settle", type=int, default=60,
                        help="seconds between the two restart-count samples")
        ap.add_argument("--window", default="2m", help="Prometheus rate window")
        ap.add_argument("--max-error-ratio", type=float, default=None,
                        help="legacy mode only (default 0.0); scope mode uses the SLI ceiling")
        ap.add_argument("--dns", action="store_true", help="also verify cluster DNS (F04)")
        ap.add_argument("--timeout", type=int, default=0,
                        help="keep re-verifying until recovered or this many seconds elapse")
        ap.add_argument("--baseline", default="",
                        help="evidence bundle holding the pre-break `sli_baseline` (default: the "
                             "--scope bundle; legacy mode measures the affected SLI only if given)")
        ap.add_argument("--out", default="")
        a = ap.parse_args(argv)

        scope = load_scope(a.scope) if a.scope else None
        if scope is None:
            a.namespace = a.namespace or "checkout"
            a.deployment = a.deployment or "checkout"
            a.service = a.service or "checkout"
            a.selector = a.selector or "app=checkout"
            a.max_error_ratio = 0.0 if a.max_error_ratio is None else a.max_error_ratio
        sli, sli_err = load_sli() if scope is not None else (None, None)

        # The affected service (item 17): which SLI, and the baseline the bundle holds.
        bpath = a.baseline or a.scope
        if bpath:
            bdoc = json.load(open(bpath))
            bscope = bdoc.get("scope") if isinstance(bdoc.get("scope"), dict) else {}
            cfg, cfg_err = load_app_slis()
            app_sel = ({"kind": "error", "app": None, "reason": cfg_err} if cfg is None else
                       select_app_sli(cfg, bdoc.get("app"), bscope.get("namespaces") or []))
            baseline_doc = bdoc.get("sli_baseline")
        else:
            app_sel = {"kind": "fallback", "app": None,
                       "reason": "legacy checkout mode without a --baseline bundle: absolute "
                                 "thresholds only, no pre-break comparison"}
            baseline_doc = None

        if observe.identity_label() == "none":
            # No agent identity: query nothing (there is no admin fallback to use instead).
            v = Verdict()
            v.add("agent-identity", False,
                  f"no agent identity (not in the agent's pod, and no agent kubeconfig at "
                  f"{observe.AGENT_KC}); refusing to verify with any other credential")
            v.sli_info = {"kind": app_sel["kind"], "app": app_sel.get("app"),
                          "reason": "not measured: no agent identity"}
        else:
            deadline = time.time() + a.timeout
            while True:
                if scope is not None:
                    v = verify_scope(a.fingerprint, a.alertname, scope, a.settle, sli, sli_err,
                                     a.service, a.namespace, a.dns, a.window,
                                     app_sli=app_sel, baseline=baseline_doc)
                else:
                    v = verify(a.fingerprint, a.alertname, a.namespace, a.deployment, a.service,
                               a.selector, a.settle, a.window, a.max_error_ratio, a.dns,
                               app_sli=app_sel, baseline=baseline_doc)
                if v.recovered or time.time() >= deadline:
                    break
                print(f"  · not recovered yet ({sum(1 for c in v.checks if not c['ok'])} check(s) "
