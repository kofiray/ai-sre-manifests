        f"{os.environ.get('MANIFESTS_REPO_NAME','ai-sre-manifests')}.git")
    PROJECT = os.environ.get("GOOGLE_CLOUD_PROJECT") or (
        open(os.path.join(ROOT, ".project")).read().strip()
        if os.path.exists(os.path.join(ROOT, ".project")) else "")

    # The harness's answer key, in every form it appears in. The original F-forms
    # (P4/P8) and the widened P9c forms (docs/p9c-plan.md):
    #   [C02]  (M18)  break-K07:  heal-02  chaos/<anything>  p9b  p9b-k03-alert
    #   "P9b scenario W09"  "Chaos injection F02."
    # Order matters: the longer forms come first so a shorter one cannot eat half
    # of them and leave the rest behind.
    SCENARIO_TAG = re.compile(
        r"\bP9[abc]\s+scenarios?\s+[A-Z]\d\d\b:?\s*"
        r"|\[[A-Z]\d\d\]\s*|\([A-Z]\d\d\)\s*"
        r"|\b(?:break|heal)-[A-Z]?\d\d\b:?\s*"
        r"|\bchaos/\S+"
        r"|\bChaos injection [A-Z]?\d\d\.?\s*"
        r"|\bp9[abc][-/]\S*"
        r"|\bp9[abc]\b", re.IGNORECASE)
    # A bare scenario ID ("K03 rule: ...", "exclude OOMKilled R12"). Removed only from
    # git subjects/diffs and ServiceNow strings, where the harness writes them; doing
    # it everywhere would eat real tokens in logs and metrics. Case-sensitive on
    # purpose: `v11` in "Grafana v11.4.0" is a version, not an ID.
    SCENARIO_ID = re.compile(r"\b[A-Z]\d\d\b")


    def _tidy(s):
        s = re.sub(r"\(\s*[,;]?\s*\)", "", s)          # "()" left behind
        s = re.sub(r"\s*,(?:\s*,)+", ",", s)             # "I06, M02, K07" -> ","
        s = re.sub(r"([:;(])\s*,\s*", r"\1 ", s)
        s = re.sub(r"\s*[,;]\s*\)", ")", s)
        s = re.sub(r"[ \t]{2,}", " ", s)
        s = re.sub(r"\s+([,;:.)])", r"\1", s)
        s = re.sub(r"^[\s,;:]+", "", s)
        return s.strip() if "\n" not in s else s


    def strip_ids(s):
        """Remove scenario-ID tokens from a harness-written string."""
        if not isinstance(s, str):
            return s
        out = SCENARIO_ID.sub("", SCENARIO_TAG.sub("", s))
        return out if out == s else _tidy(out)


    def redact(obj):
        """Remove the harness's ground-truth markers, wherever they appear."""
        if isinstance(obj, dict):
            return {k: redact(v) for k, v in obj.items() if k != "scenario"}
        if isinstance(obj, list):
            return [redact(v) for v in obj]
        if isinstance(obj, str):
            return SCENARIO_TAG.sub("", obj)
        return obj


    def redact_ids(obj):
        """redact() plus scenario-ID removal: for git and ServiceNow text."""
        if isinstance(obj, dict):
            return {k: redact_ids(v) for k, v in obj.items() if k != "scenario"}
        if isinstance(obj, list):
            return [redact_ids(v) for v in obj]
        if isinstance(obj, str):
            if "\n" in obj:      # a diff: line by line, keep the layout
                return "\n".join(SCENARIO_ID.sub("", SCENARIO_TAG.sub("", l)) for l in obj.split("\n"))
            return strip_ids(obj)
        return obj


    def kubectl(args, check=False):
        """A kubectl-shaped READ, answered over REST by kube.py as the agent."""
        rc, out, err = kube.kubectl(["--request-timeout=30s"] + list(args), kubeconfig=_kubeconfig())
        if check and rc != 0:
            raise SystemExit(f"evidence: get {' '.join(args)}: {err.strip()}")
        return out


    def kjson(args):
        try:
            return json.loads(kubectl(args) or "{}")
        except Exception:
            return {}


    def sm(name):
        """A secret value, in-process (gcp_auth: WIF in the pod, the operator's gcloud on
        the workstation). "" if unreadable."""
        try:
            return (gcp_auth.secret(name, PROJECT) or "").strip()
        except Exception:
            return ""


    # ----------------------------------------------------------------- sources ---
    _MON = ESTATE.get("monitoring") or {}
    MON_NS = os.environ.get("MONITORING_NAMESPACE", _MON.get("namespace", "monitoring"))
    PROM_SVCS = (os.environ["PROM_SERVICES"].split(",") if os.environ.get("PROM_SERVICES")
                 else _MON.get("prometheus") or ["kps-prometheus:9090", "prometheus-operated:9090"])
    AM_SVCS = (os.environ["AM_SERVICES"].split(",") if os.environ.get("AM_SERVICES")
               else _MON.get("alertmanager") or ["kps-alertmanager:9093", "alertmanager-operated:9093"])
    ARGO_NS = os.environ.get("ARGOCD_NAMESPACE", ESTATE.get("argocd_namespace", "argocd"))
    _GIT = ESTATE.get("git") or {}
    GIT_WINDOW_MIN = int(os.environ.get("AGENT_GIT_WINDOW", _GIT.get("window_minutes", 90)))
    GIT_MAX = int(_GIT.get("max_commits", 8))
    GIT_DIFFS = int(_GIT.get("diff_commits", 3))
    DIFF_LINES = int(_GIT.get("diff_max_lines", 60))
    EXCLUDED = list(_GIT.get("excluded_paths") or
                    ["apps/ml/observability/prometheus/files/scenario-rules.yaml"])
    _LIVE = ESTATE.get("liveness") or {}
    LOOKBACK_S = int(_LIVE.get("lookback_minutes", 30)) * 60
    STEP_S = int(_LIVE.get("step_seconds", 30))
    _CAPS = ESTATE.get("caps") or {}
    CAP_WORKLOADS = int(_CAPS.get("workloads", 12))
    CAP_LOG_PODS = int(_CAPS.get("log_pods", 6))
    CAP_METRICS = int(_CAPS.get("expr_metrics", 8))
    CAP_SERIES = int(_CAPS.get("series_per_query", 20))
    CHECKOUT_NS = "checkout"
    NOISY_LABELS = {"endpoint", "instance", "job", "service", "uid", "prometheus"}


    def _proxy(svcs, path):
        """HTTP GET to a Service in `monitoring`, through the API server. Candidates
        are tried in order so a chart rename degrades to the next name rather than
        silently disabling a whole evidence source."""
        last = ""
        for svc in svcs:
            name, _, port = svc.strip().partition(":")
            raw = f"/api/v1/namespaces/{MON_NS}/services/http:{name}:{port or '80'}/proxy{path}"
            st, out, err = kube.get(raw, kubeconfig=_kubeconfig(), accept="*/*")
            if st == 200 and out.strip():
                return out.strip(), None
            last = f"{name}: {(err or 'empty response').strip()[:120]}"
        return None, last


    def prom_query(q):
        """Through the API server's service proxy — a GET, never `kubectl exec`
        (exec is `create` on pods/exec, a write the agent's role does not grant)."""
        out, err = _proxy(PROM_SVCS, "/api/v1/query?query=" + urllib.parse.quote(q, safe=""))
        if out is None:
            return []
        try:
            return json.loads(out)["data"]["result"]
        except Exception:
            return []


    def prom_range(q, start, end, step):
        """query_range through the same proxy. None when Prometheus is unreadable,
        [] when it answered with no series (the expression was never true)."""
        path = ("/api/v1/query_range?query=" + urllib.parse.quote(q, safe="")
                + f"&start={int(start)}&end={int(end)}&step={int(step)}s")
        out, err = _proxy(PROM_SVCS, path)
        if out is None:
            return None
        try:
            return json.loads(out)["data"]["result"]
        except Exception:
            return None


    def alertmanager_alert(key):
        """The firing alert for the incident's correlation ID: the NEWEST active alert
        whose labels hash to that cid1 (several pods can fire under one incident). A
        pre-cid incident's key is a raw Alertmanager fingerprint, matched as before."""
        out, err = _proxy(AM_SVCS, "/api/v2/alerts")
        if out is None:
            return None
        try:
            return _cid.newest(json.loads(out), key)
        except Exception:
            return None


    # What the agent may see of the incident. NOT short_description or description:
    # both carry the scenario's [ID] and its author-written summary.
    SNOW_FIELDS = ("number", "state", "opened_at", "correlation_id")


    _SNOW = []   # one OAuth client per process: its token is cached between calls


    def _snow():
        """The shared OAuth client (snow_client: bearer only, no Basic path). None when no
        instance is configured at all; a SnowConfigError (a refusal, not a None) when an
        instance is set but OAuth is not, so a misconfiguration can't pass as "no incident"."""
        if not _SNOW:
            if not sm("sre-agent-snow-instance-url"):
                return None
            _SNOW.append(snow_client.from_secrets(sm, timeout=30))
        return _SNOW[0]


    def snow_incident(correlation_id=None, number=None):
        snow = _snow()
        if snow is None:
            return None
        # By correlation ID, several incidents can carry it (a recurrence after close, a
        # Duplicate the bridge closed): the oldest ACTIVE non-duplicate is the one being
        # worked, the same rule the trigger uses. Extra fields are read only to pick it;
        # snow_view() still shows the agent four fields.
        q = (f"correlation_id={correlation_id}^ORDERBYsys_created_on" if correlation_id
             else f"number={number}")
        fields = list(SNOW_FIELDS) + ["sys_id", "active", "close_code", "sys_created_on",
                                      "reopen_count"]
        path = (f"/api/now/table/incident?sysparm_query={urllib.parse.quote(q, safe='=^')}"
                f"&sysparm_fields={','.join(fields)}&sysparm_limit=20")
        try:
            res = snow.call("GET", path).get("result") or []
            live = _cid.canonical([x for x in res if str(x.get("active")) == "true"])
            return (live or res or [None])[0]
        except Exception as e:
            print(f"evidence: ServiceNow read failed: {type(e).__name__}: {str(e)[:160]}",
                  file=sys.stderr)
            return None


    def snow_view(inc):
        """The incident as the agent may see it: the four fields, IDs stripped."""
        if not inc:
            return None
        return redact_ids({k: inc.get(k) for k in SNOW_FIELDS if k in inc})


    # ------------------------------------------------ a recurrence (occurrence n > 1) ---
    # Found live on 16 Nov (h11, INC0010141, occurrence 4): the incident item gave only
    # `opened_at`, the FIRST occurrence's open time (09:15). The model compared the git
    # history with that, concluded every commit came after the incident started, and read
    # the agent's own T1 restart for occurrence 3 (merged ~11:20) and that rollout's normal
    # readiness-probe failures as a new problem. So for occurrence n > 1:
    #   - "the start" is THIS occurrence's: the later of ServiceNow `reopened_time` and the
    #     firing alert's startsAt; the git window, the liveness range, the log and event
    #     windows are anchored on it, and E01 says "occurrence n, started <t>; previous
    #     occurrence resolved at <t'>" (opened_at is kept, renamed first_opened_at);
    #   - the agent's OWN earlier remediations for this incident (from its runner
    #     checkpoints, runner/<sys_id>[-r<k>].json: PR number and merge sha) are LABELLED
    #     wherever they show: the commit, the ReplicaSet its restart annotation rolled out,
    #     that rollout's pods and events, the Deployment whose template still carries it.
    #     They stay visible; a label only says whose change it was.
    #   - the bundle gets a top-level `recurrence` record (not evidence) that diagnose.py
    #     states outside the untrusted block, built from numbers, shas and times only.
    # The first occurrence (reopen_count 0 or missing) takes none of these paths: its
    # bundle is what it always was. The ServiceNow journals (work_notes/comments) are
    # never read here, so the agent's previous diagnosis note cannot prime the model.
    AGENT_RESTART_KEY = "sre-agent/restartedAt"
    EARLIER_MAX = 4          # earlier occurrences looked up (older ones are outside the windows)
    _ISO = re.compile(r"^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$")
    _FETCHED = []


    def _trigger():
        """scripts/trigger/trigger.py, for its reopen_count rule, its checkpoint keys and its
        GCS read (imported only for a recurrence; it reads nothing at import)."""
        p = os.path.join(ROOT, "scripts", "trigger")
        if p not in sys.path:
            sys.path.insert(0, p)
        import trigger
        return trigger


    def occurrence_of(inc):
        """1 for a first occurrence (reopen_count 0, missing or empty), n + 1 after n reopens."""
        if not inc or inc.get("reopen_count") in (None, "", "0", 0):
            return 1
        return _trigger().reopen_count_of(inc) + 1


    def snow_reopen_times(inc):
        """(reopened_time, resolved_at) as unix seconds or None, from one read of the
        incident with display_value=all. The raw `value` (UTC) is used when present, else
        the display value."""
        snow = _snow()
        if snow is None or not (inc or {}).get("sys_id"):
            return None, None
        try:
            res = snow.call("GET", f"/api/now/table/incident/{inc['sys_id']}?sysparm_display_value=all"
                                   "&sysparm_fields=reopened_time,resolved_at").get("result") or {}
        except Exception as e:
            print(f"evidence: ServiceNow reopen-time read failed: {type(e).__name__}: {str(e)[:160]}",
                  file=sys.stderr)
            return None, None

        def ts(field):
            v = res.get(field)
            for c in ([v.get("value"), v.get("display_value")] if isinstance(v, dict) else [v]):
                t = parse_ts(str(c or ""))
                if t:
                    return t
            return None
        return ts("reopened_time"), ts("resolved_at")


    def runner_state(key):
        """The agent's own runner checkpoint runner/<key>.json, or None (unreadable or absent)."""
        try:
            return _trigger().gcs_read(key, prefix="runner")
        except Exception as e:  # noqa: BLE001
            print(f"evidence: runner checkpoint {key} unreadable: {type(e).__name__}", file=sys.stderr)
            return None


    def commit_restart_value(sha):
        """The `sre-agent/restartedAt` value a commit set (the T1 restart shape), or None."""
        if not re.fullmatch(r"[0-9a-f]{7,40}", str(sha or "")):
            return None
        if not _FETCHED:                 # one fetch per process, not one per remediation
            if ensure_clone():
                return None
            _FETCHED.append(True)
        out = _git(["show", "--format=", "--unified=0", sha, "--"]).stdout
        m = re.search(r'^\+\s*' + re.escape(AGENT_RESTART_KEY) + r':\s*"([^"]+)"', out, re.M)
        return m.group(1) if m else None


    def _hist_at(st, stage):
        """When the runner state entered `stage` (unix seconds), or None."""
        for h in reversed((st or {}).get("history") or []):
            if isinstance(h, dict) and h.get("stage") == stage:
                return parse_ts(str(h.get("at") or ""))
        return None


    def earlier_remediations(inc, n, cid):
        """The agent's own records of occurrences max(1, n-EARLIER_MAX)..n-1 of this incident.
        Returns (remediations, previous occurrence's close time or None). A remediation is
        {"occurrence", "pr", "sha", "merged_at", "restart"} for a PR the agent's runner opened
        for this correlation id and saw merged; nothing else counts."""
        T = _trigger()
        out, prev_closed = [], None
        for k in range(max(1, n - EARLIER_MAX), n):
            st = runner_state(T.state_key(inc["sys_id"], k - 1))
            if not isinstance(st, dict) or st.get("correlation_id") != cid:
                continue
            if k == n - 1:
                prev_closed = _hist_at(st, "closed")
            pr, sha = st.get("pr"), str(st.get("sha") or "").lower()
            pr = int(pr) if isinstance(pr, (int, str)) and str(pr).isdigit() else None
            if not (pr and pr > 0) or not re.fullmatch(r"[0-9a-f]{7,40}", sha):
                continue
            out.append({"occurrence": k, "pr": pr, "sha": sha, "merged_at": _hist_at(st, "merged"),
                        "restart": commit_restart_value(sha)})
        return out, prev_closed


    def remediation_label(r):
        if r.get("incident"):            # another incident's (sibling_remediations)
            return (f"the agent's remediation for {r['incident']} (PR #{r['pr']}, merged "
                    f"{iso(r['merged_at'])}, stage {r['stage']})")
        return f"the agent's earlier remediation for occurrence {r['occurrence']} (PR #{r['pr']})"


    def commit_remediation(c, rems):
        """The earlier agent remediation a git-commit item is, or None: the merge sha the
        runner recorded, or GitHub's squash subject suffix "(#<pr>)"."""
        sha = str(c.get("sha") or "").lower()
        for r in rems:
            if sha and (r["sha"].startswith(sha) or sha.startswith(r["sha"])):
                return r
            if re.search(rf"\(#{r['pr']}\)\s*$", str(c.get("subject") or "")):
                return r
        return None


    def recurrence_view(inc, n, start, prev_resolved):
        """The incident item for occurrence n > 1."""
        prev = iso(prev_resolved) if prev_resolved else "unknown"
        return redact_ids({
            "number": inc.get("number"), "state": inc.get("state"),
            "correlation_id": inc.get("correlation_id"),
            "occurrence": n, "occurrence_started_at": iso(start),
            "previous_occurrence_resolved_at": iso(prev_resolved) if prev_resolved else None,
            "first_opened_at": inc.get("opened_at"),
            "summary": f"occurrence {n}, started {iso(start)}; previous occurrence resolved at {prev}"})


    def recurrence_record(n, start, source, prev_resolved, rems):
        """bundle["recurrence"]: numbers, shas and times only (diagnose.py states it as trusted
        text, so nothing free-form may enter it)."""
        def t(x):
            return iso(x) if x else None
        return {"occurrence": n, "reopen_count": n - 1, "started_at": iso(start), "started_from": source,
                "previous_resolved_at": t(prev_resolved),
                "agent_remediations": [
                    {"occurrence": r["occurrence"], "pr": r["pr"], "commit": r["sha"][:12],
                     "merged_at": t(r["merged_at"]),
                     "restart_annotation": r["restart"] if r["restart"] and _ISO.match(r["restart"]) else None}
                    for r in rems]}


    def remediation_rollouts(ns_list, rems):
        """{replicaset name: (namespace, remediation)} for ReplicaSets whose pod template carries
        a restart annotation value an earlier agent remediation set."""
        by_value = {r["restart"]: r for r in rems if r.get("restart")}
        out = {}
        if not by_value:
            return out
        for ns in ns_list:
            for rs in kjson(["-n", ns, "get", "replicaset", "-o", "json"]).get("items") or []:
                ann = ((((rs.get("spec") or {}).get("template") or {}).get("metadata") or {})
                       .get("annotations") or {})
                r = by_value.get(ann.get(AGENT_RESTART_KEY))
                if r:
                    out[rs["metadata"]["name"]] = (ns, r, rs["metadata"].get("creationTimestamp"))
        return out


    def _event_ts(line):
        return parse_ts((line or "").split(" ", 1)[0])


    # ------------------------------ the agent's own fixes for OTHER incidents (16 Nov) ---
    # Found live on 16 Nov ~12:46: one fault (the F01 wedge on checkout) fired two alerts,
    # so the bridge had two incidents with different correlation ids (INC0010140 and
    # INC0010141). The agent fixed INC0010140 (restart PR #692, applied, closed), then
    # diagnosed INC0010141, whose evidence now showed #692's rollout and its new pods'
    # normal readiness-probe failures. The labels above cover only THIS incident's earlier
    # occurrences, so that rollout was unlabelled and the model diagnosed a probe
    # misconfiguration. So every collection also looks for the agent's remediations of
    # OTHER incidents that merged in the evidence window (GIT_WINDOW_MIN before this
    # occurrence's start, up to now) and touch the scope (a path under its git paths, one
    # of its Argo CD apps, or a restart annotation one of its ReplicaSets carries). They
    # are labelled like the earlier occurrences' ("the agent's remediation for INC… (PR
    # #n, merged t, stage s)") wherever they show, stay visible, and are listed, typed, in
    # bundle["agent_actions"] for the trusted part of the prompt (diagnose.py).
    #
    # Where they come from: the runner checkpoints (runner/<sys_id>[-r<k>].json: incident,
    # correlation id, PR, merge sha, stage, history), read one key at a time. The agent's
    # IAM binding cannot LIST the bucket (terraform/main.tf: object access under trigger/
    # and runner/ only, by condition), so the candidate keys come from ServiceNow: the
    # incidents with a correlation id updated within the window. A checkpoint counts only
    # if its own sys_id, number and correlation id are that incident's. Branch names are
    # never used. When nothing is found, nothing in the bundle changes.
    SIBLING_MAX = 15                 # incidents looked up per collection (newest first)
    ROLLOUT_GRACE_S = 600            # a sibling rollout's pod events this long after it started
    _INC_NUM = re.compile(r"^INC\d{4,10}$")
    RUNNER_STAGES = ("diagnosed", "proposed", "waiting-human", "merged", "applied", "escalated",
                     "closed", "abandoned", "needs-human", "gave-up")


    def sibling_incidents(inc, since, now):
        """Other incidents (number, sys_id, correlation_id, reopen_count) with a correlation
        id, updated since `since`, newest first. [] when ServiceNow is not configured or the
        read fails (the bundle is then what it was before this lookup existed)."""
        try:
            snow = _snow()
        except Exception as e:  # noqa: BLE001
            print(f"evidence: sibling lookup skipped: {type(e).__name__}", file=sys.stderr)
            return []
        if snow is None:
            return []
        mins = int(max(0, now - since) // 60) + 5
        me = (inc or {}).get("sys_id")
        q = (f"correlation_idISNOTEMPTY^sys_updated_onRELATIVEGE@minute@ago@{mins}"
             + (f"^sys_id!={me}" if me else "") + "^ORDERBYDESCsys_updated_on")
        path = (f"/api/now/table/incident?sysparm_query={urllib.parse.quote(q, safe='=^')}"
                f"&sysparm_fields=number,sys_id,correlation_id,reopen_count&sysparm_limit={SIBLING_MAX}")
        try:
            res = snow.call("GET", path).get("result") or []
        except Exception as e:  # noqa: BLE001
            print(f"evidence: sibling incident read failed: {type(e).__name__}: {str(e)[:160]}",
                  file=sys.stderr)
            return []
        return [x for x in res if isinstance(x, dict) and x.get("sys_id") and x.get("sys_id") != me
                and _INC_NUM.match(str(x.get("number") or "")) and x.get("correlation_id")][:SIBLING_MAX]


    def _under(p, roots):
        p = str(p or "").strip("/")
        return any(p == r or p.startswith(r + "/") for r in (str(x).strip("/") for x in roots) if r)


    def sibling_remediations(inc, sc, since, now):
        """The agent's remediations of OTHER incidents merged in [since, now] whose checkpoint
        says they touch this scope by path or app; candidates that touch it only through a
        restart annotation are returned with `touch` False and kept only if one of the scope's
        ReplicaSets carries that annotation (see collect)."""
        T, out = None, []
        for s in sibling_incidents(inc, since, now):
            T = T or _trigger()
            m = T.reopen_count_of(s)
            for k in range(max(0, m - EARLIER_MAX), m + 1):
                st = runner_state(T.state_key(s["sys_id"], k))
                if not isinstance(st, dict) or st.get("sys_id") != s["sys_id"] \
                        or st.get("incident") != s["number"] or st.get("correlation_id") != s["correlation_id"]:
                    continue
                pr, sha = st.get("pr"), str(st.get("sha") or "").lower()
                pr = int(pr) if isinstance(pr, (int, str)) and str(pr).isdigit() else None
                merged = _hist_at(st, "merged")
                if not (pr and pr > 0) or not re.fullmatch(r"[0-9a-f]{7,40}", sha) \
                        or not merged or not (since <= merged <= now + 60):
                    continue
                plan = st.get("plan") if isinstance(st.get("plan"), dict) else {}
                paths = [str(p) for p in (st.get("paths") or plan.get("paths") or []) if p]
                apps = [str(a) for a in (st.get("apps") or plan.get("apps") or []) if a]
                stage = st.get("stage") if st.get("stage") in RUNNER_STAGES else "unknown"
                out.append({"incident": s["number"], "occurrence": k + 1, "pr": pr, "sha": sha,
                            "merged_at": merged, "stage": stage,
                            "closed_at": _hist_at(st, "closed") if stage == "closed" else None,
                            "restart": commit_restart_value(sha),
                            "touch": any(_under(p, sc.get("git_paths") or []) for p in paths)
                            or bool(set(apps) & set(sc.get("apps") or []))})
        return out


    def agent_actions_record(sibs, since):
        """bundle["agent_actions"]: numbers, shas, stages and times only (stated as trusted
        text by diagnose.py). `recovery_verified` is True only for stage closed: the runner
        reaches it only after remediate.close() measured recovery and closed the incident."""
        return {"window_start": iso(since), "remediations": [
            {"incident": r["incident"], "pr": r["pr"], "commit": r["sha"][:12],
             "merged_at": iso(r["merged_at"]), "stage": r["stage"],
             "closed_at": iso(r["closed_at"]) if r.get("closed_at") else None,
             "recovery_verified": r["stage"] == "closed" and bool(r.get("closed_at"))}
            for r in sorted(sibs, key=lambda r: r["merged_at"])]}


    # ------------------------------------------------------------ the alert view ---
    def alert_ref(fingerprint):
        return f"alert-{(fingerprint or '')[:8]}"


    def alert_expr(alert):
        """The rule's expression, from the alert's generatorURL `g0.expr`, URL-decoded."""
        gu = (alert or {}).get("generatorURL") or ""
        try:
            qs = urllib.parse.parse_qs(urllib.parse.urlsplit(gu).query)
            return (qs.get("g0.expr") or [""])[0]
        except Exception:
            return ""


    def strip_promql_comments(expr):
        """`# ...` to end of line is a PromQL comment: author prose, not the symptom."""
        out = []
        for line in (expr or "").split("\n"):
            masked = re.sub(r'"(?:[^"\\]|\\.)*"', lambda m: "_" * len(m.group()), line)
            i = masked.find("#")
            out.append(line[:i].rstrip() if i >= 0 else line)
        return "\n".join(l for l in out if l.strip()).strip()


    def alert_view(alert):
        """Labels minus `scenario`, alertname replaced by alert-<fp8>; no annotations;
        startsAt; the rule expression. Nothing else from the Alertmanager object."""
        fp = alert.get("fingerprint")
        labels = {k: v for k, v in (alert.get("labels") or {}).items() if k != "scenario"}
        labels["alertname"] = alert_ref(fp)
        return {"labels": labels, "startsAt": alert.get("startsAt"),
                "state": (alert.get("status") or {}).get("state"),
                "fingerprint": fp, "expr": strip_promql_comments(alert_expr(alert))}


    def parse_ts(s):
        """RFC3339 (Go may give nanoseconds) -> unix seconds, or None."""
        if not s:
            return None
        m = re.match(r"(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d):(\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)?$",
                     s.strip())
        if not m:
            return None
        y, mo, d, h, mi, se = (int(x) for x in m.groups()[:6])
        t = calendar.timegm((y, mo, d, h, mi, se, 0, 0, 0)) + float(m.group(7) or 0)
        tz = m.group(8)
        if tz and tz != "Z":
            sign = 1 if tz[0] == "+" else -1
            hh, mm = int(tz[1:3]), int(tz[-2:])
            t -= sign * (hh * 3600 + mm * 60)
        return t


    def iso(t):
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(t))


    # ------------------------------------------------------ expression parsing ---
    _NS_RE = re.compile(r'(?<![\w])namespace\s*(=~|=)\s*"((?:[^"\\]|\\.)*)"')
    _NS_NAME = re.compile(r"^[a-z0-9]([-a-z0-9]*[a-z0-9])?$")
    _PROMQL_WORDS = {"and", "or", "unless", "by", "without", "on", "ignoring", "group_left",
                     "group_right", "bool", "offset", "inf", "nan", "start", "end"}


    def expr_namespaces(expr):
        """Namespaces named by `namespace="x"` and `namespace=~"a|b"` matchers. Regex
        alternatives that are not plain names (`.*`, `ml-.+`) are skipped: a guess at
        what a pattern matches is not a scope."""
        out = []
        for op, val in _NS_RE.findall(expr or ""):
            parts = val.split("|") if op == "=~" else [val]
            for p in parts:
                p = p.strip().strip("()")
                if _NS_NAME.match(p) and p not in out:
                    out.append(p)
        return out


    def expr_selectors(expr):
        """[(metric, selector_text)] in order of appearance, one per metric name.
        Label names inside {...}, grouping lists (by/on/without/...), durations,
        string literals, functions and keywords are not metrics."""
        s = strip_promql_comments(expr or "")
        m = re.sub(r'"(?:[^"\\]|\\.)*"', lambda x: '"' + "_" * (len(x.group()) - 2) + '"', s)
        m = re.sub(r"\b(?:by|without|on|ignoring|group_left|group_right)\s*\([^)]*\)",
                   lambda x: " " * len(x.group()), m)
        m = re.sub(r"\[[^\]]*\]", lambda x: " " * len(x.group()), m)
        braces = [(b.start(), b.end()) for b in re.finditer(r"\{[^}]*\}", m)]
        for a, b in braces:
            m = m[:a] + "{" + " " * (b - a - 2) + "}" + m[b:]
        out, seen = [], set()
        for t in re.finditer(r"(?<![\w.:])([a-zA-Z_:][\w:]*)", m):
            name, end = t.group(1), t.end()
            if name in _PROMQL_WORDS or any(a < t.start() < b for a, b in braces):
                continue
            rest = m[end:].lstrip()
            if rest.startswith("("):
                continue                     # a function call
            sel = name
            if rest.startswith("{"):
                off = end + (len(m[end:]) - len(rest))
                for a, b in braces:
                    if a == off:
                        sel = name + s[a:b]
                        break
            if name not in seen:
                seen.add(name)
                out.append((name, sel))
        return out


    def expr_metrics(expr):
        return [n for n, _ in expr_selectors(expr)]


    # ---------------------------------------------------------------- scope ---
    def argo_apps():
        return (kjson(["-n", ARGO_NS, "get", "applications.argoproj.io", "-o", "json"])
                .get("items") or [])


    def _app_paths(app):
        spec = app.get("spec") or {}
        paths = []
        for src in ([spec.get("source")] if spec.get("source") else []) + (spec.get("sources") or []):
            p = (src or {}).get("path")
            if p and p not in paths:
                paths.append(p.rstrip("/"))
        return paths


    def apps_for(namespaces, apps):
        """Argo CD apps whose destination namespace, or any of whose live resources'
        namespaces, is in `namespaces`; and their source paths."""
        in_scope, git_paths = [], []
        for a in apps:
            name = a.get("metadata", {}).get("name")
            dest = ((a.get("spec") or {}).get("destination") or {}).get("namespace")
            res_ns = {r.get("namespace") for r in ((a.get("status") or {}).get("resources") or [])}
            if dest in namespaces or (res_ns & set(namespaces)):
                in_scope.append(name)
                for p in _app_paths(a):
                    if p not in git_paths:
                        git_paths.append(p)
        return in_scope, git_paths


    def resolve_scope(alert, apps):
        """The contract's scope, from the alert view and the Argo CD Application list
        (pure: the reads happen in scope())."""
        labels = (alert or {}).get("labels") or {}
        expr = (alert or {}).get("expr") or ""
        by_name = {a.get("metadata", {}).get("name"): a for a in apps}
        ns = []

        def add_ns(n):
            if n and _NS_NAME.match(n) and n not in ns:
                ns.append(n)

        add_ns(labels.get("namespace"))
        for n in expr_namespaces(expr):
            add_ns(n)
        named = by_name.get(labels.get("app"))
        if named:
            add_ns(((named.get("spec") or {}).get("destination") or {}).get("namespace"))
        in_scope, git_paths = apps_for(ns, apps)
        return {"namespaces": ns, "apps": in_scope, "git_paths": git_paths,
                "alert_ref": alert_ref((alert or {}).get("fingerprint")),
                "expr": expr, "starts_at": (alert or {}).get("startsAt")}


    def scope(alert, apps=None):
        return resolve_scope(alert, argo_apps() if apps is None else apps)


    # ---------------------------------------------------------- k8s summaries ---
    def _cstatus(c):
        return {
            "name": c.get("name"),
            "image": c.get("image"),
            "ready": c.get("ready"),
            "restartCount": c.get("restartCount"),
            "state": list((c.get("state") or {}).keys()),
            "waiting_reason": ((c.get("state") or {}).get("waiting") or {}).get("reason"),
            "last_terminated": {
                k: v for k, v in (((c.get("lastState") or {}).get("terminated")) or {}).items()
                if k in ("reason", "exitCode", "finishedAt")},
        }


    def pod_summary(pods):
        out = []
        for p in pods.get("items", []):
            st = p.get("status", {})
            cs = st.get("containerStatuses") or []
            ics = st.get("initContainerStatuses") or []
            e = {
                "pod": p["metadata"]["name"],
                "node": p.get("spec", {}).get("nodeName"),
                "phase": st.get("phase"),
                "ready": all(c.get("ready") for c in cs) if cs else False,
                "created": p["metadata"].get("creationTimestamp"),
                "containers": [_cstatus(c) for c in cs],
            }
            if ics:
                e["init_containers"] = [_cstatus(c) for c in ics]
            reason = st.get("reason")
            if reason:
                e["reason"] = reason
            cond = [{"type": c.get("type"), "reason": c.get("reason"),
                     "message": (c.get("message") or "")[:200]}
                    for c in st.get("conditions") or []
                    if c.get("status") != "True" and (c.get("reason") or c.get("message"))]
            if cond:
                e["conditions"] = cond
            out.append(e)
        return out


    _SECRETISH = re.compile(r"pass|secret|token|key|credential|auth", re.I)


    def _containers(spec):
        out = []
        for c in spec.get("containers", []) or []:
            env = {}
            for e in (c.get("env") or [])[:30]:
                if "value" in e:
                    v = e.get("value")
                    env[e["name"]] = ("<redacted>" if _SECRETISH.search(e["name"]) and v
                                      else (v[:200] if isinstance(v, str) else v))
                elif e.get("valueFrom"):
                    vf = e["valueFrom"]
                    ref = vf.get("secretKeyRef") or vf.get("configMapKeyRef") or {}
                    env[e["name"]] = (f"<from {next(iter(vf))} {ref.get('name')}/{ref.get('key')}>"
                                      if ref else f"<from {next(iter(vf))}>")
            out.append({"name": c["name"], "image": c.get("image"), "env": env,
                        "resources": c.get("resources", {}),
                        "readinessProbe": c.get("readinessProbe"),
                        "livenessProbe": c.get("livenessProbe")})
        return out


    def rollout_state(kind, obj):
        sp, st = obj.get("spec") or {}, obj.get("status") or {}
        tspec = ((sp.get("template") or {}).get("spec")) or {}
        d = {"spec_replicas": sp.get("replicas"),
             "updated": st.get("updatedReplicas"),
             "ready": st.get("readyReplicas"),
             "available": st.get("availableReplicas"),
             "generation": obj.get("metadata", {}).get("generation"),
             "observed_generation": st.get("observedGeneration"),
             "containers": _containers(tspec)}
        if tspec.get("initContainers"):
            d["init_containers"] = [{"name": c["name"], "image": c.get("image")}
                                    for c in tspec["initContainers"]]
        if kind == "statefulset":
            d["current_revision"] = st.get("currentRevision")
            d["update_revision"] = st.get("updateRevision")
        conds = [{"type": c.get("type"), "status": c.get("status"), "reason": c.get("reason"),
                  "message": (c.get("message") or "")[:200]}
                 for c in st.get("conditions") or []]
        if conds:
            d["conditions"] = conds
        return d


    def _unhealthy_workload(d):
        want = d.get("spec_replicas")
        if want is None:
            want = 1
        return not (want == (d.get("ready") or 0) == (d.get("updated") or 0)) or \
            d.get("generation") != d.get("observed_generation")


    def _pod_needs_logs(p, since):
        if not p["ready"] and p.get("phase") != "Succeeded":
            return True
        for c in p["containers"] + p.get("init_containers", []):
            if c.get("waiting_reason"):
                return True
            fin = parse_ts((c.get("last_terminated") or {}).get("finishedAt"))
            if fin and fin >= since:
                return True
        return False


    def _failing_container(p):
        for c in p.get("init_containers", []):
            if not c.get("ready") and "terminated" not in c.get("state", []) or c.get("waiting_reason"):
                return c["name"]
        for c in p["containers"]:
            if not c.get("ready") or c.get("waiting_reason"):
                return c["name"]
        for c in p["containers"]:
            if c.get("restartCount"):
                return c["name"]
        return p["containers"][0]["name"] if p["containers"] else None


    def event_lines(text, with_kind=True):
        """`<lastTimestamp> <type> [<kind>/]<name> <reason>: <message>` per event, the
        shape the kubectl jsonpath used to print. A non-JSON answer (an offline fake that
        returns lines) is passed through line by line."""
        try:
            items = json.loads(text or "{}").get("items") or []
        except ValueError:
            return [l for l in (text or "").strip().splitlines() if l.strip()]
        out = []
        for e in items:
            io = e.get("involvedObject") or {}
            who = (f"{io.get('kind') or ''}/{io.get('name') or ''}" if with_kind
                   else f"{io.get('name') or ''}")
            out.append(f"{e.get('lastTimestamp') or ''} {e.get('type') or ''} {who} "
                       f"{e.get('reason') or ''}: {e.get('message') or ''}")
        return [l for l in out if l.strip()]


    def pod_logs(namespace, pod, container):
        """PLAIN FIRST (L-P2-003), --previous only as a fallback."""
        cur = kubectl(["-n", namespace, "logs", pod, "-c", container, "--tail=25"])
        entry = {"pod": pod, "container": container, "source": "current",
                 "log": cur.strip().splitlines()[-25:]}
        if not cur.strip():
            prev = kubectl(["-n", namespace, "logs", pod, "-c", container, "--previous", "--tail=25"])
            entry = {"pod": pod, "container": container, "source": "previous (current was empty)",
                     "log": prev.strip().splitlines()[-25:]}
        return entry


    def argo_view(app):
        """Sync/health and the resources that are not Healthy/Synced. Not
        operationState.operation (initiatedBy says who, which is not a symptom)."""
        st = app.get("status") or {}
        op = st.get("operationState") or {}
        bad = [{"kind": r.get("kind"), "namespace": r.get("namespace"), "name": r.get("name"),
                "status": r.get("status"), "health": (r.get("health") or {}).get("status"),
                "message": ((r.get("health") or {}).get("message") or "")[:200] or None}
               for r in st.get("resources") or []
               if r.get("status") not in (None, "Synced")
               or (r.get("health") or {}).get("status") not in (None, "Healthy")]
        return {"app": app.get("metadata", {}).get("name"),
                "sync": (st.get("sync") or {}).get("status"),
                "revision": ((st.get("sync") or {}).get("revision") or "")[:12] or None,
                "health": (st.get("health") or {}).get("status"),
                "conditions": [{"type": c.get("type"), "message": (c.get("message") or "")[:300]}
                               for c in st.get("conditions") or []],
                "operation": {"phase": op.get("phase"), "message": (op.get("message") or "")[:300],
                              "startedAt": op.get("startedAt"), "finishedAt": op.get("finishedAt")}
                if op else None,
                "unhealthy_resources": bad[:15],
                "unhealthy_count": len(bad)}


    def _drop_keys(o, keys):
        """A CiliumNetworkPolicy carries a free-text `description`: author prose, so out."""
        if isinstance(o, dict):
            return {k: _drop_keys(v, keys) for k, v in o.items() if k not in keys}
        if isinstance(o, list):
            return [_drop_keys(v, keys) for v in o]
        return o


    def _trim_metric(m):
        return {k: v for k, v in (m or {}).items() if k not in NOISY_LABELS}


    # --------------------------------------------------------------------- git ---
    def _git(args):
        return subprocess.run(["git"] + args, cwd=WORK, capture_output=True, text=True)


    def ensure_clone():
        if not os.path.isdir(os.path.join(WORK, ".git")):
            os.makedirs(os.path.dirname(WORK), exist_ok=True)
            r = subprocess.run(["git", "clone", "--quiet", REPO_URL, WORK],
                               capture_output=True, text=True)
            if r.returncode != 0:
                return "could not clone the manifests repo for history: " + r.stderr.strip()[:200]
        _git(["fetch", "--quiet", "origin"])
        return None


    def _excluded(path):
        return any(path == e or path.startswith(e.rstrip("/") + "/") for e in EXCLUDED)


    def git_commits(paths, until, window_min=None, ref="origin/main"):
        """Commits that LANDED on main (first parent: a squash or a merge, as main saw
        it) in the window before `until`, touching `paths`, newest first. The rules
        file is excluded from the pathspec, the file lists and the diffs; a commit that
        only touched excluded files is not shown at all."""
        window_min = GIT_WINDOW_MIN if window_min is None else window_min
        err = ensure_clone()
        if err:
            return None, err
        since = until - window_min * 60
        spec = (list(paths) or ["."]) + [f":(exclude){e}" for e in EXCLUDED]
        out = _git(["log", ref, "--first-parent", f"-{GIT_MAX * 4}",
                    f"--since=@{int(since)}", f"--until=@{int(until) + 1}",
                    "--pretty=%H%x1f%ct%x1f%an%x1f%s", "--"] + spec).stdout
        commits = []
        for line in out.strip().splitlines():
            parts = line.split("\x1f")
            if len(parts) != 4:
                continue
            sha, ct, author, subject = parts
            if not (since <= int(ct) <= until):
                continue
            has_parent = _git(["rev-parse", "--verify", "--quiet", f"{sha}^1"]).returncode == 0
            base = [f"{sha}^1", sha] if has_parent else [sha]
            cmd = ["diff", "--name-only"] + base if has_parent else ["show", "--name-only", "--pretty=", sha]
            files = [f for f in _git(cmd).stdout.split() if not _excluded(f)]
            if not files:
                continue
            commits.append({"sha": sha[:12], "date": iso(int(ct)), "author": author,
                            "files": files, "subject": subject, "diff": None, "_full": sha,
                            "_base": base})
            if len(commits) >= GIT_MAX:
                break
        for c in commits[:GIT_DIFFS]:
            pspec = ["--"] + c["files"]
            cmd = (["diff", "--unified=2"] + c["_base"] + pspec if len(c["_base"]) == 2
                   else ["show", "--pretty=", "--unified=2", c["_full"]] + pspec)
            lines = _git(cmd).stdout.splitlines()
            more = len(lines) - DIFF_LINES
            c["diff"] = "\n".join(lines[:DIFF_LINES] + ([f"... ({more} more lines)"] if more > 0 else []))
        for c in commits:
            c.pop("_full", None)
            c.pop("_base", None)
        return commits, None


    # ---------------------------------------------------------------- assembly ---
    def collect(namespace=None, app=None, fingerprint=None, incident=None, now=None):
        B, n = [], [0]
        now = now or time.time()

        def add(source, title, data, ids=False):
            n[0] += 1
            B.append({"id": f"E{n[0]:02d}", "source": source, "title": title,
                      "data": redact_ids(data) if ids else redact(data)})

        # -- ServiceNow: what we were asked to look at (four fields only)
        inc = snow_incident(correlation_id=fingerprint, number=incident)
        occ = occurrence_of(inc)

        # -- the alert itself: the symptom, not the author's explanation
        al = alertmanager_alert(fingerprint) if fingerprint else None
        view = alert_view(al) if al else None

        # -- a recurrence: THIS occurrence's start, and the agent's own earlier fixes
        rec, rems, rollouts = None, [], {}
        if inc and occ > 1:
            reopened, resolved = snow_reopen_times(inc)
            alert_start = parse_ts((view or {}).get("startsAt"))
            cands = [(t, src) for t, src in ((reopened, "reopened_time"), (alert_start, "alert startsAt"))
                     if t and t <= now + 60]
            occ_start, occ_src = max(cands) if cands else (now, "collection time")
            rems, prev_closed = earlier_remediations(inc, occ, inc.get("correlation_id") or fingerprint)
            prev_resolved = resolved if resolved and resolved <= occ_start else prev_closed
            add("servicenow", f"the incident under investigation (occurrence {occ}, started "
                              f"{iso(occ_start)}; previous occurrence resolved at "
                              f"{iso(prev_resolved) if prev_resolved else 'unknown'})",
                recurrence_view(inc, occ, occ_start, prev_resolved), ids=True)
            rec = recurrence_record(occ, occ_start, occ_src, prev_resolved, rems)
        elif inc:
            add("servicenow", "the incident under investigation", snow_view(inc), ids=True)
        if view:
            add("alertmanager", "the firing alert", view)

        # -- scope
        apps = argo_apps()
        sc = resolve_scope(view or {"fingerprint": fingerprint,
                                    "labels": {"app": app} if app else {}}, apps)
        if namespace and namespace not in sc["namespaces"]:
            sc["namespaces"].insert(0, namespace)
        if not sc["namespaces"]:
            sc["namespaces"] = [CHECKOUT_NS]
        sc["apps"], sc["git_paths"] = apps_for(sc["namespaces"], apps)
        by_name = {a.get("metadata", {}).get("name"): a for a in apps}
        ns_list = sc["namespaces"]
        checkout = CHECKOUT_NS in ns_list
        app = app or ((view or {}).get("labels") or {}).get("app") or (
            "checkout" if checkout else None)
        starts = parse_ts((view or {}).get("startsAt")) or now
        if rec:
            starts = parse_ts(rec["started_at"])        # this occurrence's start, not the first's
        # -- the agent's own remediations of OTHER incidents on this scope, in the window
        since_w = starts - GIT_WINDOW_MIN * 60
        sibs = sibling_remediations(inc, sc, since_w, now)
        if rec or sibs:
            rollouts = remediation_rollouts(ns_list, rems + sibs)
        sibs = [r for r in sibs if r["touch"] or any(x is r for _, x, _ in rollouts.values())]
        allrems = rems + sibs

        def rollout_of(name):
            """The earlier agent remediation whose rollout created this pod/ReplicaSet, or None."""
            for rs, (_, r, _) in rollouts.items():
                if name == rs or name.startswith(rs + "-"):
                    return r
            return None

        # -- liveness: the alert's own expression over [startsAt - 30m, now]
        if view and view.get("expr"):
            start = starts - LOOKBACK_S
            res = prom_range(view["expr"], start, now, STEP_S)
            merged = {}
            for s in res or []:
                for ts, v in s.get("values") or []:
                    try:
                        if ts not in merged or float(v) > float(merged[ts]):
                            merged[ts] = v
                    except ValueError:
                        merged.setdefault(ts, v)
            samples = [[int(ts), merged[ts]] for ts in sorted(merged)]
            add("prometheus", "the alert expression over time (a sample = the condition held)", {
                "kind": "alert-expression-range", "query": view["expr"],
                "start": iso(start), "end": iso(now), "step_seconds": STEP_S,
                "readable": res is not None, "series": len(res or []),
                "first_sample_at": iso(samples[0][0]) if samples else None,
                "last_sample_at": iso(samples[-1][0]) if samples else None,
                "samples": samples})

        # -- pods, per scope namespace (incl. init containers)
        summaries = {}
        for ns in ns_list:
            summaries[ns] = pod_summary(kjson(["-n", ns, "get", "pods", "-o", "json"]) or {"items": []})
            shown_pods = summaries[ns][:40]
            if rollouts:
                shown_pods = [dict(p, agent_remediation=f"created by the rollout of {remediation_label(r)}")
                              if (r := rollout_of(p["pod"])) else p for p in shown_pods]
            add("kubernetes", f"pods in namespace {ns}", shown_pods)

        # -- rollout state. Checkout keeps its two named Deployments first (the F01 vs
        #    F03 discriminator, L-P2-002); then every Deployment/StatefulSet in scope,
        #    unhealthy first, capped.
        workloads = []
        for ns in ns_list:
            for kind in ("deployment", "statefulset"):
