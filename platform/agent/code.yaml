            print(f"diagnose: {d['failure_class']} / {d.get('disposition')}"
                  f"{' ' + imp.get('commit', '') if d.get('disposition') == 'revert' else ''}"
                  f" (confidence {d['confidence']}, {len(m['citations_valid'])} valid citations, "
                  f"{len(m['citations_invalid'])} invalid"
                  f"{', contract errors: ' + '; '.join(m['contract_errors']) if m['contract_errors'] else ''}"
                  f"{', INJECTION-LIKE TEXT in ' + ','.join(m['injection']['evidence_ids']) + ' (' + ','.join(m['injection']['kinds']) + ')' if m['injection']['count'] else ''}"
                  f"{', ' + str(m['redactions']['count']) + ' redacted (' + ','.join(m['redactions']['kinds']) + ')' if m['redactions']['count'] else ''}"
                  f", region {m['region']}) -> {a.out}")
        else:
            print(text)
        return 0


