# sre-bridge — Alertmanager -> ServiceNow, deduplicated by alert fingerprint.
# SPEC §2: this is where the correlation-ID spine starts.
#
# NOT in the mesh, deliberately: this pod's job is to reach an address on the
# public internet (the ServiceNow instance) and to be reached by Alertmanager.
# Sidecar injection would put both of those through an egress path that F05 and
# `make mesh-check` deliberately break, and an incident bridge that stops working
# during a mesh scenario is worse than no bridge at all.
#
# `platform/` is the T3 path (SPEC §4): human review, agent draft-only.
apiVersion: v1
kind: Namespace
metadata:
  name: sre-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-bridge
  namespace: sre-system
  labels: { app: sre-bridge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sre-bridge }
  template:
    metadata:
      labels: { app: sre-bridge }
    spec:
      # The bridge must be able to report the failure of the thing it would
      # otherwise use to report it.
      #
      # F04 takes cluster DNS down. The bridge's job at that moment is to open a
      # ServiceNow incident saying so — and with `dnsPolicy: ClusterFirst` it
      # cannot, because resolving the ServiceNow hostname goes through the
      # CoreDNS that just died. Observed live during the first full E2E: the
      # webhook arrived, and the handler failed with
      # `URLError: [Errno -3] Try again` twice, eight minutes apart. The incident
      # was finally created only after the outage was repaired — which is the one
      # moment it is no longer useful. Same family as L-P2-011 (GitOps cannot fix
      # DNS, because ArgoCD is itself a DNS client): a component in the recovery
      # path must not depend on the component that failed.
      #
      # `dnsPolicy: Default` — the node's resolver — is NOT available here: that
      # is the GCE metadata server at 169.254.169.254, which the metadata-server
      # gate deliberately blocks for every namespace outside kube-system
      # (SPEC §5, non-negotiable). So the bridge is given its own resolvers.
      # This grants it nothing new: it already has internet egress, because
      # reaching ServiceNow is its entire purpose. It resolves external names
      # without CoreDNS and does not resolve in-cluster names at all, which it
      # never needed to — it dials exactly one host, and Alertmanager dials it.
      # In a client engagement these become the client's own resolvers.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - { name: timeout, value: "2" }
          - { name: attempts, value: "3" }
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["python3", "/app/bridge.py"]
          ports:
            - { name: http, containerPort: 8080 }
            # healthz/stats only, never the webhook. Separate so the network
            # policy can let the kubelet probe it without letting the node (or
            # any host-network pod) reach the webhook port.
            - { name: health, containerPort: 8081 }
          env:
            # Inbound auth (PLAN-hardening item 2). The bridge refuses to start
            # without this file; Alertmanager sends the same value as a bearer
            # token. Created out of band by scripts/bridge/install-secret.sh.
            - { name: BRIDGE_AUTH_TOKEN_FILE, value: /etc/sre-bridge/auth/token }
            - { name: BRIDGE_HEALTH_PORT, value: "8081" }
            # The SNOW credentials are NOT in git. The Secret is created out of
            # band from GCP Secret Manager by `scripts/bridge/install-secret.sh`,
            # using the OPERATOR's identity: the nodes' service account holds
            # only logWriter+metricWriter (SPEC §5, asserted by the P1 gate), so
            # nothing in this cluster can read Secret Manager on its own, and
            # widening that to give a webhook receiver cloud credentials would be
            # a bad trade. Recorded as a deviation: the SPEC's end state is an
            # ESO secret *reference* here, which needs workload-identity
            # federation this estate does not yet have.
            - name: SNOW_INSTANCE
              valueFrom: { secretKeyRef: { name: sre-snow, key: instance } }
            # OAuth, not Basic (PLAN-hardening item 3). Password grant: the
            # instance issued a token with this client at setup (2026-11-12);
            # client_credentials needs an instance property only an admin can set.
            # The user/password below are sent ONLY to /oauth_token.do, never to
            # the Table API. Without the OAuth keys the bridge refuses to start.
            - { name: SNOW_OAUTH_GRANT, value: password }
            - name: SNOW_OAUTH_CLIENT_ID
              valueFrom: { secretKeyRef: { name: sre-snow, key: oauth_client_id } }
            - name: SNOW_OAUTH_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: sre-snow, key: oauth_client_secret } }
            - name: SNOW_USER
              valueFrom: { secretKeyRef: { name: sre-snow, key: username } }
            - name: SNOW_PASS
              valueFrom: { secretKeyRef: { name: sre-snow, key: password } }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: auth, mountPath: /etc/sre-bridge/auth, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: app
          configMap: { name: sre-bridge-app }
        # Not optional: no token, no bridge (it would refuse to start anyway).
        - name: auth
          secret:
            secretName: sre-bridge-auth
            defaultMode: 0400
            items: [{ key: token, path: token }]
---
apiVersion: v1
kind: Service
metadata:
  name: sre-bridge
  namespace: sre-system
  labels: { app: sre-bridge }
spec:
  # PINNED, and the pin is load-bearing.
  #
  # Alertmanager delivers to this Service. If it addresses it by DNS name, then
  # the alert that says "cluster DNS is down" cannot be delivered — the
  # notification path fails with the thing it is trying to report, and F04's
  # detection quietly depends on the fault not really biting. Observed live:
  # during a DNS outage Alertmanager raised AlertmanagerFailedToSendAlerts and
  # the bridge received nothing at all.
  #
  # A ClusterIP is routed by Cilium's datapath with no resolver involved, so
  # pinning it takes DNS out of the alert path entirely. 10.96.0.60 sits in the
  # STATIC band of the 10.96.0.0/12 service range (the first 4096 addresses),
  # which Kubernetes reserves for explicit assignment and does not hand out
  # dynamically, so this cannot collide with an allocated address on a fresh
  # cluster. ClusterIP is immutable, so changing this on a live estate means
  # deleting the Service and letting ArgoCD recreate it.
  clusterIP: 10.96.0.60
  selector: { app: sre-bridge }
  ports:
    - { name: http, port: 8080, targetPort: http }
