# sre-bridge — Alertmanager -> ServiceNow, deduplicated by alert fingerprint.
# SPEC §2: this is where the correlation-ID spine starts.
#
# NOT in the mesh, deliberately: this pod's job is to reach an address on the
# public internet (the ServiceNow instance) and to be reached by Alertmanager.
# Sidecar injection would put both of those through an egress path that F05 and
# `make mesh-check` deliberately break, and an incident bridge that stops working
# during a mesh scenario is worse than no bridge at all.
#
# `platform/` is the T3 path (SPEC §4): human review, agent draft-only.
apiVersion: v1
kind: Namespace
metadata:
  name: sre-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-bridge
  namespace: sre-system
  labels: { app: sre-bridge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sre-bridge }
  template:
    metadata:
      labels: { app: sre-bridge }
    spec:
      # The bridge must be able to report the failure of the thing it would
      # otherwise use to report it.
      #
      # F04 takes cluster DNS down. The bridge's job at that moment is to open a
      # ServiceNow incident saying so — and with `dnsPolicy: ClusterFirst` it
      # cannot, because resolving the ServiceNow hostname goes through the
      # CoreDNS that just died. Observed live during the first full E2E: the
      # webhook arrived, and the handler failed with
      # `URLError: [Errno -3] Try again` twice, eight minutes apart. The incident
      # was finally created only after the outage was repaired — which is the one
      # moment it is no longer useful. Same family as L-P2-011 (GitOps cannot fix
      # DNS, because ArgoCD is itself a DNS client): a component in the recovery
      # path must not depend on the component that failed.
      #
      # `dnsPolicy: Default` — the node's resolver — is NOT available here: that
      # is the GCE metadata server at 169.254.169.254, which the metadata-server
      # gate deliberately blocks for every namespace outside kube-system
      # (SPEC §5, non-negotiable). So the bridge is given its own resolvers.
      # This grants it nothing new: it already has internet egress, because
      # reaching ServiceNow is its entire purpose. It resolves external names
      # without CoreDNS and does not resolve in-cluster names at all, which it
      # never needed to — it dials exactly one host, and Alertmanager dials it.
      # In a client engagement these become the client's own resolvers.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
          - { name: timeout, value: "2" }
          - { name: attempts, value: "3" }
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["python3", "/app/bridge.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # The SNOW credentials are NOT in git. The Secret is created out of
            # band from GCP Secret Manager by `scripts/bridge/install-secret.sh`,
            # using the OPERATOR's identity: the nodes' service account holds
            # only logWriter+metricWriter (SPEC §5, asserted by the P1 gate), so
            # nothing in this cluster can read Secret Manager on its own, and
            # widening that to give a webhook receiver cloud credentials would be
            # a bad trade. Recorded as a deviation: the SPEC's end state is an
            # ESO secret *reference* here, which needs workload-identity
            # federation this estate does not yet have.
            - name: SNOW_INSTANCE
              valueFrom: { secretKeyRef: { name: sre-snow, key: instance } }
            - name: SNOW_USER
              valueFrom: { secretKeyRef: { name: sre-snow, key: username } }
            - name: SNOW_PASS
              valueFrom: { secretKeyRef: { name: sre-snow, key: password } }
          volumeMounts:
            - { name: app, mountPath: /app }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: app
          configMap: { name: sre-bridge-app }
---
apiVersion: v1
kind: Service
metadata:
  name: sre-bridge
  namespace: sre-system
  labels: { app: sre-bridge }
spec:
  selector: { app: sre-bridge }
  ports:
    - { name: http, port: 8080, targetPort: http }
