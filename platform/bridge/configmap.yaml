# The bridge's source, delivered as a ConfigMap on the stock python:3.12-alpine
# image — same reason as the patient workload: no private registry exists on this
# estate and the nodes cannot authenticate to one (SPEC §5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-bridge-app
  namespace: sre-system
data:
  bridge.py: |
    #!/usr/bin/env python3
    """sre-bridge — Alertmanager webhook -> ServiceNow incident, deduplicated.

    SPEC §2: the correlation-ID spine starts here. Alertmanager's per-alert
    `fingerprint` is written to the incident's `correlation_id`, and everything
    downstream (Slack thread, PR, commit, recovery metrics) hangs off that same
    value. One alert identity -> one incident, forever.

    DEDUP IS THE WHOLE JOB, so it is done against ServiceNow itself rather than
    against anything this process remembers. A bridge that dedups from an in-memory
    set is correct exactly until it restarts, and it restarts during precisely the
    incidents it exists to report. Every notification therefore asks SNOW "is there
    already an incident whose correlation_id is this fingerprint?" and only creates
    one when the answer is no.

    Repeat notifications, re-fires after a resolve (the flap case the P3 gate tests),
    and Alertmanager's own webhook retries all land on an existing incident and
    become WORK NOTES. The incident count does not move.

    Stdlib only, delivered as a ConfigMap on the stock python:3.12-alpine image —
    the estate has no private registry and the nodes' service account holds only
    logWriter+metricWriter (SPEC §5, asserted by the P1 gate).

    Env:
      SNOW_INSTANCE  https://devXXXXXX.service-now.com
      SNOW_USER      dedicated integration user (NOT admin)
      SNOW_PASS      its password
      BRIDGE_PORT    default 8080
      DRY_RUN        "1" -> log what it would send, create nothing
    """
    import base64
    import json
    import os
    import sys
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    INSTANCE = os.environ.get("SNOW_INSTANCE", "").rstrip("/")
    USER = os.environ.get("SNOW_USER", "")
    PASS = os.environ.get("SNOW_PASS", "")
    PORT = int(os.environ.get("BRIDGE_PORT", "8080"))
    DRY_RUN = os.environ.get("DRY_RUN", "") == "1"

    STATS = {"received": 0, "created": 0, "deduped": 0, "notes": 0,
             "notes_dropped": 0, "resolved_without_incident": 0, "errors": 0}
    _stats_lock = threading.Lock()

    # One lock per fingerprint. Alertmanager retries and re-sends concurrently, and
    # "check then create" without this is a race that produces exactly the duplicate
    # incidents the whole component exists to prevent.
    _fp_locks = {}
    _fp_locks_guard = threading.Lock()


    def fp_lock(fp):
        with _fp_locks_guard:
            return _fp_locks.setdefault(fp, threading.Lock())


    def log(msg, **kw):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "msg": msg}
        rec.update(kw)
        print(json.dumps(rec), flush=True)


    def bump(k, n=1):
        with _stats_lock:
            STATS[k] = STATS.get(k, 0) + n


    # ------------------------------------------------------------ ServiceNow ----
    def snow(method, path, body=None):
        url = f"{INSTANCE}{path}"
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("Authorization", "Basic " +
                       base64.b64encode(f"{USER}:{PASS}".encode()).decode())
        req.add_header("Accept", "application/json")
        if data:
            req.add_header("Content-Type", "application/json")
        try:
            r = urllib.request.urlopen(req, timeout=30)
        except urllib.error.HTTPError as e:
            # SAY WHY. This used to propagate as a bare "HTTP Error 403: Forbidden",
            # and the reason was in the response BODY the whole time — ServiceNow
            # sends a JSON `error.detail` explaining itself, and discarding it cost
            # a long diagnosis of a fault the instance had already named:
            #   "ACL Exception Update Failed due to security constraints"
            # (a PATCH against a CLOSED incident, which is read-only). An opaque
            # status code is not an error report.
            try:
                detail = json.loads(e.read().decode()).get("error", {})
            except Exception:
                detail = {}
            log("ServiceNow refused the request", status=e.code, method=method, path=path[:120],
                reason=detail.get("message"), detail=detail.get("detail"))
            raise
        with r:
            ct = r.headers.get("Content-Type", "")
            raw = r.read().decode()
            if "json" not in ct:
                # A hibernating PDI answers 200 text/html to everything (L-P0-008).
                # Treat that as the failure it is instead of letting json.loads
                # produce a parse error three frames away from the cause.
                raise RuntimeError(f"SNOW returned {ct!r}, not JSON — instance hibernating or a login redirect")
            return json.loads(raw) if raw else {}


    def find_incident(fp):
        """The incident this fingerprint should land on — the OPEN one, if there is one.

        This took the first row of an unordered `correlation_id={fp}` query. That is
        fine while a fingerprint has exactly one incident, and wrong the moment it
        has two — which happens as soon as a closed incident forces a new one to be
        opened for a recurrence. The unordered query could then keep returning the
        CLOSED incident forever, and every alert would open yet another incident: an
        incident storm, caused by a lookup that was never told which one it wanted.

        So: prefer an ACTIVE incident, newest first, and only fall back to the
        closed history when there is no open incident at all. The caller decides
        what to do with a closed one; this function's job is to not hand back a
        stale record when a live one exists.
        """
        for q in (f"correlation_id={fp}^active=true^ORDERBYDESCsys_created_on",
                  f"correlation_id={fp}^ORDERBYDESCsys_created_on"):
            res = snow("GET", f"/api/now/table/incident?sysparm_query={urllib.parse.quote(q)}"
                              "&sysparm_limit=1&sysparm_fields=sys_id,number,state,active"
                       ).get("result") or []
            if res:
                return res[0]
        return None


    def create_incident(fp, alert):
        lb, an = alert.get("labels", {}), alert.get("annotations", {})
        body = {
            "correlation_id": fp,
            "short_description": f"[{lb.get('scenario','-')}] {an.get('summary') or lb.get('alertname','alert')}",
            "description": (
                f"{an.get('description','').strip()}\n\n"
                f"alertname: {lb.get('alertname','')}\n"
                f"scenario : {lb.get('scenario','')}\n"
                f"severity : {lb.get('severity','')}\n"
                f"namespace: {lb.get('namespace','')}\n"
                f"pod      : {lb.get('pod','')}\n"
                f"fingerprint (correlation id): {fp}\n"
                f"started  : {alert.get('startsAt','')}\n"
                f"source   : {alert.get('generatorURL','')}\n"
            ),
            "category": "inquiry",
            "impact": "2", "urgency": "2",
        }
        if DRY_RUN:
            log("DRY_RUN create", fingerprint=fp, body=body)
            return {"number": "DRY-RUN", "sys_id": "dry-run"}
        return snow("POST", "/api/now/table/incident", body).get("result", {})


    # The integration user can write `comments` but NOT `work_notes`: a PATCH
    # carrying work_notes returns 200 and stores nothing at all, with no error and no
    # indication which field was refused (L-P2-012). `work_notes` is the correct field
    # for an internal audit trail, and getting write access to it is a ServiceNow-side
    # role change on the human list; until then the trail goes to `comments`, which is
    # verified to persist rather than assumed to.
    NOTE_FIELD = os.environ.get("SNOW_NOTE_FIELD", "comments")


    def add_note(sys_id, text):
        if DRY_RUN:
            log("DRY_RUN note", sys_id=sys_id, field=NOTE_FIELD, text=text)
            return
        snow("PATCH", f"/api/now/table/incident/{sys_id}", {NOTE_FIELD: text})
        # Read it back. Every silent failure this build has hit looked exactly like
        # this one: a 200 with nothing behind it. A note that did not land is worse
        # than no note, because the incident then looks like it was never updated.
        try:
            got = snow("GET", f"/api/now/table/incident/{sys_id}"
                              f"?sysparm_display_value=true&sysparm_fields={NOTE_FIELD}")
            body = str((got.get("result") or {}).get(NOTE_FIELD) or "")
            if text[:40] not in body:
                bump("notes_dropped")
                log("NOTE DID NOT PERSIST — ServiceNow accepted the write and stored "
                    "nothing (field ACL?)", sys_id=sys_id, field=NOTE_FIELD)
                return False
        except Exception as e:
            log("could not verify the note landed", sys_id=sys_id,
                error=f"{type(e).__name__}: {e}")
        return True


    def handle_alert(alert):
        fp = alert.get("fingerprint")
        if not fp:
            bump("errors")
            log("alert with no fingerprint — cannot deduplicate, refusing", alert=alert)
            return
        status = alert.get("status", "firing")
        name = alert.get("labels", {}).get("alertname", "?")

        with fp_lock(fp):
            existing = find_incident(fp)
            if existing:
                state = str(existing.get("state") or "")
                # A RECURRENCE IS NOT A DUPLICATE.
                #
                # An alert identity that already has an incident normally just gets a
                # note — that is the dedup invariant the P3 gate protects, and it is
                # unchanged for any incident that is still open. But if the incident
                # was RESOLVED and the same fault fires again, adding a note to a
                # resolved record leaves ServiceNow asserting "resolved" while the
                # estate is broken. The incident queue would be lying, in exactly the
                # way this product exists to stop.
                #
                # So a firing alert on a resolved incident REOPENS it. This also
                # keeps `resolved_at` honest: it is re-stamped when the incident is
                # resolved again, so "recovery was measured before the close" is
                # measured against THIS occurrence rather than against the previous
                # one's close, which is several hours in the past and would make the
                # ordering check fail for a run that did everything right.
                if status == "firing" and state == "6":
                    snow("PATCH", f"/api/now/table/incident/{existing['sys_id']}",
                         {"state": "2"})
                    back = str((snow("GET", f"/api/now/table/incident/{existing['sys_id']}"
                                            "?sysparm_fields=state").get("result")
                                or {}).get("state") or "")
                    reopened = back == "2"
                    add_note(existing["sys_id"],
                             f"Alertmanager: {name} is FIRING again (fingerprint {fp}). "
                             f"This incident was resolved and the same fault has recurred, so it "
                             f"is REOPENED rather than duplicated."
                             + ("" if reopened else " NOTE: the reopen was refused by ServiceNow — "
                                                    "the record still reads as resolved."))
                    bump("reopened" if reopened else "reopen_refused")
                    log("reopened a resolved incident on recurrence", fingerprint=fp,
                        incident=existing.get("number"), alert=name, reopened=reopened,
                        state=back)
                    return
                if status == "firing" and state == "7":
                    # A CLOSED incident is not reopened — ServiceNow treats closure as
                    # final, and forcing one back open rewrites history. The correct
                    # ITIL response to a recurrence after closure is a NEW incident,
                    # carrying the same correlation id so the spine still joins up.
                    inc = create_incident(fp, alert)
                    bump("created"); bump("recurrence_after_close")
                    log("recurrence after closure — opened a NEW incident rather than "
                        "reopening a closed one", fingerprint=fp,
                        previous=existing.get("number"), incident=inc.get("number"), alert=name)
                    return
                note = (f"Alertmanager: {name} is now {status.upper()} "
                        f"(fingerprint {fp}). No new incident: this alert identity "
                        f"already has one.")
                add_note(existing["sys_id"], note)
                bump("deduped"); bump("notes")
                log("deduplicated onto existing incident", fingerprint=fp,
                    incident=existing.get("number"), alert=name, status=status)
                return
            if status != "firing":
                # Nothing to update and nothing to open: a resolve for an alert that
                # never produced an incident is not an error, but it is worth seeing.
                bump("resolved_without_incident")
                log("resolved alert with no incident — nothing to do",
                    fingerprint=fp, alert=name)
                return
            inc = create_incident(fp, alert)
            bump("created")
            log("incident created", fingerprint=fp, incident=inc.get("number"),
                alert=name, sys_id=inc.get("sys_id"))


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                self._send(200, {"ok": True, "dry_run": DRY_RUN})
            elif self.path.startswith("/stats"):
                with _stats_lock:
                    self._send(200, dict(STATS))
            else:
                self._send(404, {"error": "not found"})

        def do_POST(self):
            if not self.path.startswith("/alertmanager"):
                self._send(404, {"error": "not found"})
                return
            try:
                n = int(self.headers.get("Content-Length") or 0)
                payload = json.loads(self.rfile.read(n) or b"{}")
            except Exception as e:
                bump("errors")
                self._send(400, {"error": f"bad payload: {e}"})
                return

            alerts = payload.get("alerts") or []
            bump("received", len(alerts))
            log("webhook received", alerts=len(alerts),
                group=payload.get("groupKey", "")[:120], status=payload.get("status"))
            failed = 0
            for a in alerts:
                try:
                    handle_alert(a)
                except Exception as e:
                    failed += 1
                    bump("errors")
                    log("handler error", error=f"{type(e).__name__}: {e}",
                        alert=a.get("labels", {}).get("alertname"))
            # Non-2xx makes Alertmanager retry, which is what we want when SNOW was
            # unreachable — the dedup lookup makes that retry safe.
            if failed:
                self._send(500, {"handled": len(alerts) - failed, "failed": failed})
            else:
                self._send(200, {"handled": len(alerts)})

        def log_message(self, *a):
            pass


    def main():
        missing = [k for k, v in (("SNOW_INSTANCE", INSTANCE), ("SNOW_USER", USER),
                                  ("SNOW_PASS", PASS)) if not v]
        if missing and not DRY_RUN:
            print(f"sre-bridge: missing env {missing}", file=sys.stderr)
            return 2
        log("sre-bridge starting", instance=INSTANCE, port=PORT, dry_run=DRY_RUN)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
