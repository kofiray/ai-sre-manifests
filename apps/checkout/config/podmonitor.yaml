# Scrape the Istio sidecars. Without this there is no `istio_requests_total` in
# Prometheus at all, so F05 — the one fault that is invisible at pod level and
# only exists as a mesh signal — could not be alerted on. The sidecar publishes
# merged Envoy+agent metrics on port 15020 at /stats/prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecars
  namespace: checkout
  labels: { app: checkout }
spec:
  selector:
    matchExpressions:
      - { key: security.istio.io/tlsMode, operator: Exists }
  podMetricsEndpoints:
    - targetPort: 15020
      path: /stats/prometheus
      interval: 15s
