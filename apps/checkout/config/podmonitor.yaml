# Scrape the Istio sidecars. Without this there is no `istio_requests_total` in
# Prometheus at all, so F05 — the one fault that is invisible at pod level and
# only exists as a mesh signal — could not be alerted on. The sidecar publishes
# merged Envoy+agent metrics on 15020, but 15020 is NOT a DECLARED container
# port — the injected sidecar declares only 15090 (`http-envoy-prom`). The
# operator matches targets against declared ports, so a PodMonitor aimed at
# 15020 is accepted, generates no targets, and silently produces no scrape pool
# at all: no error, no metrics, nothing to notice (L-P2-004). Use the declared
# port by NAME.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecars
  namespace: checkout
  labels: { app: checkout }
spec:
  selector:
    matchExpressions:
      - { key: security.istio.io/tlsMode, operator: Exists }
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
