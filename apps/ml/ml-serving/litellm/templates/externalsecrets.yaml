# ExternalSecrets for LiteLLM
# Main LiteLLM secrets (API keys, master key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.litellm }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        LITELLM_MASTER_KEY: "{{ "{{" }} .masterkey {{ "}}" }}"
        OPENAI_API_KEY: "{{ "{{" }} .openaikey {{ "}}" }}"
        ANTHROPIC_API_KEY: "{{ "{{" }} .anthropickey {{ "}}" }}"
        DATABASE_URL: "postgresql://litellm:{{ "{{" }} .dbpassword {{ "}}" }}@litellm-postgresql:5432/litellm"
        REDIS_PASSWORD: "{{ "{{" }} .redispassword {{ "}}" }}"
  data:
    - secretKey: masterkey
      remoteRef:
        key: sre-agent-ml-litellm
        property: master_key
    - secretKey: openaikey
      remoteRef:
        key: sre-agent-ml-litellm
        property: openai_api_key
    - secretKey: anthropickey
      remoteRef:
        key: sre-agent-ml-litellm
        property: anthropic_api_key
    - secretKey: dbpassword
      remoteRef:
        key: sre-agent-ml-litellm
        property: db_password
    - secretKey: redispassword
      remoteRef:
        key: sre-agent-ml-litellm
        property: redis_password
---
# Database credentials for PostgreSQL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.database }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-litellm
        property: db_password
---
# Redis credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-redis-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: cache
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.redis }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-litellm
        property: redis_password
