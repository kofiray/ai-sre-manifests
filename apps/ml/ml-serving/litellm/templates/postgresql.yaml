# PostgreSQL StatefulSet for LiteLLM
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-postgresql
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  serviceName: litellm-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-postgresql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - litellm
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - litellm
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgresql.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: litellm-postgresql
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm-postgresql
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: litellm-postgresql
{{- end }}
