# HTTPRoute for LiteLLM API Gateway
{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-api
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  parentRefs:
    {{- range .Values.gatewayAPI.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    - "llm.{{ .Values.platform.domain }}"
    - "ai.{{ .Values.platform.domain }}"
  rules:
    # Main API routes
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: litellm
          port: {{ .Values.litellm.service.port }}
    # Health and info routes
    - matches:
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /model
        - path:
            type: PathPrefix
            value: /key
      backendRefs:
        - name: litellm
          port: {{ .Values.litellm.service.port }}
    # Default route
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: {{ .Values.litellm.service.port }}
{{- end }}
