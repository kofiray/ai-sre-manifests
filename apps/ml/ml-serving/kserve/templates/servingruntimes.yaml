# ClusterServingRuntimes for KServe
# These define the default runtimes available for inference

# SKLearn ServingRuntime
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-sklearnserver
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: runtime
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  annotations:
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: sklearn
      version: "1"
      autoSelect: true
  protocolVersions:
    - v1
    - v2
  containers:
    - name: kserve-container
      image: {{ .Values.kserve.servingRuntimes.sklearn.image }}
      args:
        - --model_name={{ "{{" }}.Name{{ "}}" }}
        - --model_dir=/mnt/models
        - --http_port=8080
      resources:
        {{- toYaml .Values.kserve.servingRuntimes.sklearn.resources | nindent 8 }}
---
