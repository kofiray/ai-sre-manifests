# ServiceMonitor for KServe
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kserve-controller
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: controller
    {{- range $key, $value := .Values.monitoring.serviceMonitor.labels }}
    {{ $key }}: {{ $value }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  namespaceSelector:
    matchNames:
      - kserve
  selector:
    matchLabels:
      app.kubernetes.io/name: kserve
      app.kubernetes.io/component: controller
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
---
# PodMonitor for InferenceServices
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kserve-inferenceservices
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: inference
    {{- range $key, $value := .Values.monitoring.serviceMonitor.labels }}
    {{ $key }}: {{ $value }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  # InferenceServices live in ml-platform and, for the P9b fixture fx-iris, in
  # ml-fixtures. The label has the service's name as its value, so match on the key
  # (matchLabels with "" only matched an empty value: no targets).
  namespaceSelector:
    matchNames:
      - {{ .Values.platform.namespace }}
      - ml-fixtures
  selector:
    matchExpressions:
      - { key: serving.kserve.io/inferenceservice, operator: Exists }
  podMetricsEndpoints:
    - port: user-port
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
{{- end }}
