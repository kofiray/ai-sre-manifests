# ExternalSecret for KServe S3/MinIO credentials
{{- if .Values.storage.s3.enabled }}
# One copy per namespace that needs it: the controller's (kserve) and the one where
# InferenceServices run (platform.namespace), whose kserve-sa references it. The
# source created it only in `kserve`, so kserve-sa pointed at nothing.
{{- range $ns := list "kserve" .Values.platform.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kserve-s3-credentials
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: storage
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ $.Values.storage.s3.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ "{{" }} .accesskey {{ "}}" }}"
        AWS_SECRET_ACCESS_KEY: "{{ "{{" }} .secretkey {{ "}}" }}"
        S3_ENDPOINT: "{{ $.Values.storage.s3.endpoint }}"
        S3_BUCKET: "{{ $.Values.storage.s3.bucket }}"
        S3_USE_HTTPS: "0"
        S3_VERIFY_SSL: "0"
        S3_REGION: "us-east-1"
  data:
    - secretKey: accesskey
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretkey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
{{- end }}
---
# ServiceAccount for model storage access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-sa
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: storage
  annotations:
    argocd.argoproj.io/sync-wave: "10"
secrets:
  - name: {{ .Values.storage.s3.secretName }}
{{- end }}
