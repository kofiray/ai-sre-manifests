# KServe Certificate Issuer
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: kserve
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: webhook
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  selfSigned: {}
---
# KServe Webhook Server Certificate
# Creates the TLS secret used by the KServe controller webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kserve-webhook-server-cert
  namespace: kserve
  labels:
    app.kubernetes.io/name: kserve
    app.kubernetes.io/component: webhook
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  secretName: kserve-webhook-server-cert
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days
  subject:
    organizations:
      - kserve
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - kserve-webhook-server-service
    - kserve-webhook-server-service.kserve
    - kserve-webhook-server-service.kserve.svc
    - kserve-webhook-server-service.kserve.svc.cluster.local
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
