# Policy: Require Non-Root User
# Ensures containers don't run as root
{{- if .Values.platform.policies.requireNonRoot.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-user
  annotations:
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must be configured to run as non-root users.
      This policy ensures runAsNonRoot is set to true.
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: policy
spec:
  validationFailureAction: {{ .Values.platform.policies.requireNonRoot.failureAction }}
  background: true
  rules:
    - name: check-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          {{- range .Values.platform.policies.requireNonRoot.excludeNamespaces }}
          - resources:
              namespaces:
                - {{ . | quote }}
          {{- end }}
      validate:
        message: "Containers must run as non-root user. Set spec.securityContext.runAsNonRoot to true."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
{{- end }}
