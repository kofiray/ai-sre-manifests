# Internal CA Certificate
# Created using the self-signed issuer, then used as CA for all platform certs
{{- if .Values.platform.internalCA.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.platform.internalCA.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: ca-certificate
spec:
  isCA: true
  commonName: {{ .Values.platform.internalCA.commonName }}
  duration: {{ .Values.platform.internalCA.duration }}
  renewBefore: {{ .Values.platform.internalCA.renewBefore }}
  secretName: {{ .Values.platform.internalCA.name }}-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.platform.selfSignedIssuer.name }}
    kind: ClusterIssuer
    group: cert-manager.io
  subject:
    organizations:
      - {{ .Values.platform.internalCA.organization }}
{{- end }}
