# cert-manager Configuration
# Wave: 2 (Early Security Foundation)
# Dependencies: Cilium (networking)
#
# Purpose: Automate TLS certificate lifecycle management
# Features: Self-signed bootstrap, internal CA, Gateway API integration

cert-manager:
  # Install CRDs
  crds:
    enabled: true
    keep: true

  # Global settings
  global:
    leaderElection:
      namespace: cert-manager

  # Replica count for HA
  replicaCount: 1

  # ACME DNS-01 against Cloud DNS, over Workload Identity Federation (no key): the
  # controller's projected token + the credential config in ConfigMap cert-manager-wif.
  # The GSA holds dns.admin on zone ai-sre-live-kofiray-net ONLY.
  volumes:
    - name: wif-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: "//iam.googleapis.com/projects/1025503444695/locations/global/workloadIdentityPools/ai-sre-live-talos/providers/talos"
    - name: wif-config
      configMap:
        name: cert-manager-wif
  volumeMounts:
    - name: wif-token
      mountPath: /var/run/secrets/wif
      readOnly: true
    - name: wif-config
      mountPath: /etc/gcp-wif
      readOnly: true
  extraEnv:
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /etc/gcp-wif/credential-config.json

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Webhook configuration
  webhook:
    replicaCount: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # CA injector
  cainjector:
    replicaCount: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # Gateway API support. The source used the feature gate
  # ExperimentalGatewayAPISupport, which cert-manager retired in 1.15 in favour of
  # this config field (this chart is 1.17). The CRDs arrive in wave 2.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true

  # Prometheus metrics
  prometheus:
    enabled: true
    # On for P9b: I03 alerts on certmanager_certificate_ready_status.
    servicemonitor:
      enabled: true
      # Keep cert-manager's own `namespace` label (the Certificate's namespace), not
      # namespace="cert-manager" with the real one moved to exported_namespace (I03
      # filters on namespace="gateway-system"; P9b batch 1).
      honorLabels: true

  # Pod disruption budget
  podDisruptionBudget:
    enabled: false

  # Security context
  securityContext:
    runAsNonRoot: true

  # Node selector for control plane
  nodeSelector: {}

  # Tolerations
  tolerations: []

# Platform-specific configurations
platform:
  # Namespace
  namespace: cert-manager

  # Create namespace
  createNamespace: true

  # Domain for certificates
  domain: ai-sre-live.kofiray.net

  # Self-signed issuer for bootstrapping
  selfSignedIssuer:
    enabled: true
    name: selfsigned-issuer

  # Internal CA for cluster certificates
  internalCA:
    enabled: true
    name: ml-platform-ca
    issuerName: ca-issuer
    # CA certificate validity
    duration: 87600h  # 10 years
    renewBefore: 8760h  # 1 year
    # Organization info
    organization: ML Platform
    commonName: ML Platform Internal CA

  # Wildcard certificate for platform services
  wildcardCert:
    enabled: true
    name: ml-platform-tls
    namespace: gateway-system
    # Publicly trusted via Let's Encrypt DNS-01 (was the internal CA, so browsers
    # never trusted it). STAGING by default: Let's Encrypt allows only 5 identical
    # certificates a week, and the P9a gate alone boots twice, each a fresh cluster.
    # Switch to letsencrypt-prod for a demo boot.
    issuer: letsencrypt-staging
    # Certificate validity
    duration: 2160h  # 90 days
    renewBefore: 360h  # 15 days
    # DNS names covered
    dnsNames:
      - "*.ai-sre-live.kofiray.net"
      - "ai-sre-live.kofiray.net"

  # Let's Encrypt issuers (DNS-01 on this build's own zone). No contact email: the
  # tree is public, and Let's Encrypt no longer requires one.
  acme:
    enabled: true
    project: docker-1210
    hostedZoneName: ai-sre-live-kofiray-net
