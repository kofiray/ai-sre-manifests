# The ONE secret store for the ML estate: GCP Secret Manager, reached through
# Workload Identity Federation. No key file exists anywhere.
#
# How it authenticates: ESO asks the API server for a short-lived token for its own
# ServiceAccount (audience = the WIF provider), and exchanges it at Google STS. The
# Talos API server signs those tokens under a public issuer (scripts/wif/), so Google
# can verify them. The federated principal is
#   principal://iam.googleapis.com/projects/<num>/locations/global/workloadIdentityPools/<pool>/subject/system:serviceaccount:external-secrets:external-secrets
# and it holds secretAccessor on each `sre-agent-ml-*` secret individually, never
# project-wide (the project's Secret Manager also holds other builds' secrets).
# Grants: scripts/p9a/ml-secrets.sh.
#
# Replaces the source's two Kubernetes-provider stores, which read a `shared-secrets`
# namespace nothing created, with no RBAC to read it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.platform.store.name }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.platform.store.projectID | quote }}
      auth:
        workloadIdentityFederation:
          audience: {{ .Values.platform.store.audience | quote }}
          serviceAccountRef:
            name: external-secrets
            namespace: {{ .Release.Namespace }}
            audiences:
              - {{ .Values.platform.store.audience | quote }}
