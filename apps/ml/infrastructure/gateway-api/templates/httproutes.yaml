# HTTPRoutes for Platform Services
# Each route directs traffic from the Gateway to backend services

{{- range $name, $route := .Values.routes }}
{{- if $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-route
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/component: httproute
    app.kubernetes.io/part-of: {{ $name }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Release.Namespace }}
  hostnames:
    - {{ $route.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $route.backendRef.name }}
          namespace: {{ $route.backendRef.namespace }}
          port: {{ $route.backendRef.port }}
{{- end }}
{{- end }}
