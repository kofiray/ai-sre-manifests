# ReferenceGrants for Cross-Namespace Routing
# Allows the Gateway in gateway-api namespace to reference
# services in other namespaces

{{- range .Values.referenceGrants.namespaces }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-{{ . }}
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/component: referencegrant
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $.Release.Namespace }}
  to:
    - group: ""
      kind: Service
{{- end }}
