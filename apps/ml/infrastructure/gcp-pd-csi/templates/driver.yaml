# GCE PD CSI driver — rendered from upstream
#   kustomize build github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver//deploy/kubernetes/overlays/stable-master?ref=v1.27.5
# then changed in exactly these ways (and no others):
#   * Windows DaemonSet + its ServiceAccount/RBAC removed (no Windows nodes)
#   * the `cloud-sa` key Secret mount removed from the controller's two GCP-calling
#     containers; replaced by a projected ServiceAccount token (audience = this
#     build's WIF provider) + the credential config in ConfigMap gce-pd-csi-wif.
#     No key exists. Identity: scripts/wif/ml-workloads.sh.
#   * --enable-data-cache removed (needs local SSDs; e2-standard-8 has none)
#   * node hostPath /etc/udev: Directory -> DirectoryOrCreate (Talos may not have it)
# The source tree shipped only StorageClasses and said "deploy the driver separately".
