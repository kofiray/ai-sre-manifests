# HTTPRoute for Harbor Registry
{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  parentRefs:
    {{- range .Values.gatewayAPI.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    - "harbor.{{ .Values.platform.domain }}"
    - "registry.{{ .Values.platform.domain }}"
  rules:
    # Harbor core API and UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor
          port: 80
{{- end }}
