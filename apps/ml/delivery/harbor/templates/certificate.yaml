# Certificate for Harbor TLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: tls
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  secretName: harbor-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "harbor.{{ .Values.platform.domain }}"
    - "registry.{{ .Values.platform.domain }}"
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
