# ExternalSecrets for Harbor credentials
---
# Admin Password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin-credentials
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: admin
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.admin }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        HARBOR_ADMIN_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-harbor
        property: admin_password
---
# S3 Credentials (MinIO)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3-credentials
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: storage
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: harbor-s3-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ "{{" }} .accessKey {{ "}}" }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ "{{" }} .secretKey {{ "}}" }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretKey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
---
# Core Secret Key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-core-credentials
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: core
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.core }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        secret: "{{ "{{" }} .secret {{ "}}" }}"
        secretKey: "{{ "{{" }} .secretKey {{ "}}" }}"
        CSRF_KEY: "{{ "{{" }} .csrfKey {{ "}}" }}"
        JOBSERVICE_SECRET: "{{ "{{" }} .jobserviceSecret {{ "}}" }}"
        REGISTRY_HTTP_SECRET: "{{ "{{" }} .registryHttpSecret {{ "}}" }}"
  data:
    - secretKey: secret
      remoteRef:
        key: sre-agent-ml-harbor
        property: core_secret
    - secretKey: secretKey
      remoteRef:
        key: sre-agent-ml-harbor
        property: secret_key
    - secretKey: csrfKey
      remoteRef:
        key: sre-agent-ml-harbor
        property: csrf_key
    - secretKey: jobserviceSecret
      remoteRef:
        key: sre-agent-ml-harbor
        property: jobservice_secret
    - secretKey: registryHttpSecret
      remoteRef:
        key: sre-agent-ml-harbor
        property: core_secret
---
# Registry basic-auth between core and registry (the chart default was a literal).
# htpasswd is a sprig function, available in ESO templates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: harbor-registry-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REGISTRY_PASSWD: "{{ "{{" }} .registryPassword {{ "}}" }}"
        REGISTRY_HTPASSWD: "{{ "{{" }} htpasswd \"harbor_registry_user\" .registryPassword {{ "}}" }}"
  data:
    - secretKey: registryPassword
      remoteRef:
        key: sre-agent-ml-harbor
        property: registry_password
---
# Harbor's database password (CNPG managed role `harbor`); the chart reads key `password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: harbor-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-pg-harbor
        property: password

