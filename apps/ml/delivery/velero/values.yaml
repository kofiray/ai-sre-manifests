# Velero Configuration for ML Platform
# Sync Wave: 14 (after Argo Rollouts)

# Custom platform settings
platform:
  namespace: ml-platform
  domain: ai-sre-live.invalid

# Secrets configuration
secrets:
  s3Credentials: velero-s3-credentials

# Official Velero Helm chart configuration
velero:
  # Image configuration
  image:
    repository: velero/velero
    tag: v1.17.1
    pullPolicy: IfNotPresent

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Init containers to install plugins
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.2   # matches Velero 1.17 (plugin README matrix); the source's v1.11 was two minors behind
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # Enable node-agent for file-level backups
  deployNodeAgent: true
  nodeAgent:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Backup storage location (MinIO)
  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero-backups
        default: true
        accessMode: ReadWrite
        credential:
          name: velero-s3-credentials
          key: cloud
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: http://minio.minio.svc.cluster.local:80
          publicUrl: http://minio.minio.svc.cluster.local:80

    # Volume snapshot location (optional, for CSI snapshots)
    volumeSnapshotLocation: []

    # Features flags
    # CSI snapshots OFF: they need the snapshot CRDs and a VolumeSnapshotClass, which
    # this estate does not install. Backups use the node agent (file-system) path.
    features: ""

    # Default backup TTL
    defaultBackupTTL: 720h  # 30 days

    # Restore resource operation timeout
    # (The source's value here was malformed YAML-in-a-string; Velero's default is used.)

  # Schedules for automated backups
  schedules:
    # Hourly backup of critical namespaces
    ml-platform-hourly:
      disabled: false
      schedule: "0 * * * *"  # Every hour
      useOwnerReferencesInBackup: false
      template:
        ttl: "168h"  # 7 days retention
        storageLocation: default
        includedNamespaces:
          - ml-platform
        includedResources:
          - configmaps
          - secrets
          - persistentvolumeclaims
          - persistentvolumes
        excludedResources:
          - events
        snapshotMoveData: false
        snapshotVolumes: false

    # Daily backup of all ML namespaces
    ml-platform-daily:
      disabled: false
      schedule: "0 2 * * *"  # 2 AM daily
      useOwnerReferencesInBackup: false
      template:
        ttl: "720h"  # 30 days retention
        storageLocation: default
        includedNamespaces:
          - ml-platform
          - monitoring
          - argocd
        excludedResources:
          - events
        snapshotMoveData: false
        snapshotVolumes: true

    # Weekly full backup
    ml-platform-weekly:
      disabled: false
      schedule: "0 3 * * 0"  # 3 AM Sunday
      useOwnerReferencesInBackup: false
      template:
        ttl: "2160h"  # 90 days retention
        storageLocation: default
        includedNamespaces:
          - "*"
        excludedNamespaces:
          - kube-system
          - kube-public
          - kube-node-lease
        excludedResources:
          - events
        snapshotMoveData: false
        snapshotVolumes: true

  # Service account
  serviceAccount:
    server:
      create: true
      name: velero
      annotations: {}

  # RBAC
  rbac:
    create: true
    clusterAdministrator: true
    clusterAdministratorName: cluster-admin

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus
      namespace: monitoring
