# ExternalSecret for Velero S3 credentials (MinIO)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.s3Credentials }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # AWS credentials format required by Velero
        cloud: |
          [default]
          aws_access_key_id={{ "{{" }} .accessKey {{ "}}" }}
          aws_secret_access_key={{ "{{" }} .secretKey {{ "}}" }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretKey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
