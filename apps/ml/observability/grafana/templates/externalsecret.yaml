# ExternalSecret for Grafana admin credentials
{{- if .Values.platform.adminSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.adminSecret.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: sre-agent-ml-grafana
        property: admin_user
    - secretKey: {{ .Values.platform.adminSecret.secretKey }}
      remoteRef:
        key: sre-agent-ml-grafana
        property: admin_password
{{- end }}
