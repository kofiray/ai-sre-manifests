# Promtail values for ML Platform
# Helm chart: grafana/promtail v6.16.6

# Upstream Promtail chart values
promtail:
  # Run as DaemonSet to collect logs from all nodes
  daemonSet:
    enabled: true

  # Resources
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Loki endpoint configuration - only override the client URL
  config:
    clients:
      - url: http://loki-gateway.observability.svc.cluster.local:80/loki/api/v1/push
    snippets:
      pipelineStages:
        - cri: {}      # the chart's default; setting pipelineStages replaces it
        # Count Postgres password failures per user, as a metric (D02): the only
        # signal that tells "MLflow has the wrong password" apart from "MLflow can't
        # reach the host" (C02). CNPG logs JSON, so the quotes arrive escaped.
        # Gives promtail_custom_pg_auth_failed_total{namespace, pod, user, ...}.
        - match:
            selector: '{namespace="postgresql"}'
            stages:
              - regex:
                  expression: 'password authentication failed for user \\?"(?P<user>[^"\\]+)'
              - labels:
                  user:
              - metrics:
                  pg_auth_failed_total:
                    type: Counter
                    description: "Postgres password authentication failures, by user"
                    source: user
                    config:
                      action: inc

  # Service monitor for Prometheus
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

  # Tolerations to run on all nodes including control plane
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

# Platform-specific configuration
platform:
  namespace: observability
  createNamespace: false
