# ExternalSecret for Loki MinIO credentials
{{- if .Values.platform.minioSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.minioSecret.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.minioSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secret-key
      remoteRef:
        key: sre-agent-ml-minio
        property: password
{{- end }}
