# Loki values for ML Platform
# Helm chart: grafana/loki v6.23.0

# Upstream Loki chart values
loki:
  # Override namespace to prevent chart from creating its own
  namespaceOverride: observability

  # Deployment mode: SingleBinary, SimpleScalable, or Distributed
  deploymentMode: SingleBinary

  # Loki configuration
  loki:
    # Auth disabled for internal use
    auth_enabled: false

    # Common config
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki

    # Schema config
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Storage config for MinIO
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: http://ml-platform-hl.minio.svc.cluster.local:9000
        region: us-east-1
        secretAccessKey: ${MINIO_SECRET_KEY}
        accessKeyId: ${MINIO_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true

    # Ingester config
    ingester:
      chunk_encoding: snappy
      chunk_idle_period: 30m
      chunk_target_size: 1572864
      max_chunk_age: 2h

    # Limits
    limits_config:
      retention_period: 720h  # 30 days
      max_query_series: 10000
      max_query_parallelism: 32
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB

    # Query frontend
    query_scheduler:
      max_outstanding_requests_per_tenant: 4096

    # Compactor
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3

  # Global pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # Global container security context
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false

  # Single binary config
  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    persistence:
      enabled: true
      size: 10Gi

    # Enable environment variable expansion in config
    extraArgs:
      - -config.expand-env=true

    extraEnv:
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: loki-minio-credentials
            key: secret-key

  # Backend components (disabled in SingleBinary mode)
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Gateway - nginx proxy, doesn't serve Prometheus metrics
  gateway:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # Exclude gateway from ServiceMonitor (nginx doesn't serve /metrics)
    service:
      labels:
        prometheus.io/service-monitor: "false"

  # Monitoring
  monitoring:
    dashboards:
      enabled: false  # Using separate Grafana
    rules:
      enabled: true
      alerting: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

  # Test disabled
  test:
    enabled: false

  # Minio chunk cache disabled (using MinIO for storage)
  chunksCache:
    enabled: false

  # Results cache disabled
  resultsCache:
    enabled: false

# Platform-specific configuration
platform:
  namespace: observability
  createNamespace: false

  # MinIO credentials secret
  minioSecret:
    enabled: true
    name: loki-minio-credentials
