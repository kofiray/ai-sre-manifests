# Prometheus (kube-prometheus-stack) values for ML Platform
# Helm chart: prometheus-community/kube-prometheus-stack v68.0.0

# Upstream kube-prometheus-stack chart values
kube-prometheus-stack:
  # This stack REPLACES the build's own kube-prometheus-stack on ESTATE=ml-platform
  # (SPEC-AMENDMENT-1 §C2), so it takes the same names and namespace: `kps-*` in
  # `monitoring`. The agent's evidence collector, the bridge path and the gates all
  # look there, and none of them needs to know which estate it is on.
  fullnameOverride: kps

  # CRDs come one wave EARLIER from the `prometheus-crds` app. Here, every app in
  # waves 3–5 that ships a ServiceMonitor would wait on this one, and the operator
  # can start before its own CRDs are established and silently skip the Prometheus
  # controller (L-P2-009).
  crds:
    enabled: false

  # Global settings
  # (commonLabels `app.kubernetes.io/part-of` removed: the chart sets that key itself,
  # so every object had it twice — unparseable YAML.)

  # Prometheus Operator
  prometheusOperator:
    enabled: true
    # The admission webhook's cert Jobs race the CNI policy on a fresh estate, and
    # the operator then blocks forever on the missing `kps-admission` secret
    # (L-P1-012). Rules are checked at load time and by the gates instead.
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Config reloader resources (required by Kyverno policies)
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          cpu: 100m
          memory: 100Mi

  # Prometheus
  prometheus:
    enabled: true
    prometheusSpec:
      # Replica count
      replicas: 1

      # Security context for Prometheus to access volumes
      # Prometheus runs as 'nobody' (UID 65534) by default
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true

      # Resource limits
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi

      # Retention
      retention: 15d
      retentionSize: 45GB

      # Storage (GCP pd-standard via CSI driver)
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi

      # Service/Pod monitor discovery
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # External labels
      externalLabels:
        cluster: ml-platform
        environment: test

      # Enable remote write for long-term storage (optional)
      # remoteWrite:
      #   - url: http://thanos-receive:19291/api/v1/receive

      # Scrape interval
      scrapeInterval: 30s
      evaluationInterval: 30s

    # Service configuration
    service:
      type: ClusterIP

    # Ingress disabled (using Gateway API)
    ingress:
      enabled: false

  # Alertmanager
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

      # The bridge's inbound bearer token (PLAN-hardening item 2), from the
      # `sre-bridge-webhook` Secret written by scripts/bridge/install-secret.sh.
      # Optional so Alertmanager can start before the Secret exists; until it
      # does, deliveries fail and are retried, never sent unauthenticated.
      volumes:
        - name: sre-bridge-webhook
          secret:
            secretName: sre-bridge-webhook
            optional: true
      volumeMounts:
        - name: sre-bridge-webhook
          mountPath: /etc/alertmanager/sre-bridge
          readOnly: true

    # Alertmanager configuration
    config:
      global:
        resolve_timeout: 5m
        # SMTP settings (configure via ExternalSecret)
        # smtp_smarthost: 'smtp.example.com:587'
        # smtp_from: 'alertmanager@example.com'

      # ROUTING (PLAN-hardening item 20), the same shape as the minimal estate.
      # It used to forward ONLY `scenario`-labelled alerts, which is a test
      # bench, not production. First match wins (continue: false):
      #   1. failure-library scenarios -> bridge, exactly as before;
      #   2. the DENYLIST -> null: alerts that fire by design (Watchdog,
      #      InfoInhibitor, EstatePipelineHeartbeat). Bridged, each would open
      #      one incident and append a note every 4 h forever;
      #   3. the ALLOWLIST -> bridge: severity critical or warning from the
      #      estate's own namespaces (the tenants the failure library targets,
      #      plus sre-system and argocd);
      #   4. everything else -> null (the default): info/none severity,
      #      kube-system, monitoring, and any namespace not listed.
      # (The source's three receivers had no *_configs at all, so nothing was
      # ever delivered anywhere.) gates/h20-routing.sh tests this tree with
      # `amtool config routes test`.
      route:
        receiver: 'null'
        group_by: ['alertname', 'namespace']
        group_wait: 10s
        group_interval: 1m
        # The bridge dedups on its correlation ID, so a repeat becomes a work
        # note on the existing incident, never a second incident.
        repeat_interval: 4h
        routes:
          - receiver: 'sre-bridge'
            matchers: ['scenario=~".+"']
            continue: false
          - receiver: 'null'
            matchers: ['alertname=~"Watchdog|InfoInhibitor|EstatePipelineHeartbeat"']
            continue: false
          - receiver: 'sre-bridge'
            matchers:
              - 'severity=~"critical|warning"'
              - 'namespace=~"airflow|argocd|cert-manager|checkout|datahub|elasticsearch|etcd|external-dns|external-secrets|feast|gce-pd-csi-driver|harbor|kafka|kserve|kyverno|litellm|milvus|minio|ml-fixtures|ml-platform|observability|postgresql|ray|redis|sre-system|velero"'
            continue: false
      receivers:
        - name: 'null'
        - name: 'sre-bridge'
          webhook_configs:
            # By the bridge Service's PINNED ClusterIP, not its name: an alert
            # saying "cluster DNS is down" must not need cluster DNS to arrive.
            - url: 'http://10.96.0.60:8080/alertmanager'
              send_resolved: true
              max_alerts: 0
              # Bearer token from a mounted file, never inline (item 2).
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/alertmanager/sre-bridge/token
      inhibit_rules:
        - source_match:
            severity: critical
          target_match:
            severity: warning
          equal:
            - alertname
            - namespace
        # Item 20: while a failure-library scenario alert fires in a namespace,
        # the generic alerts there (no `scenario` label) are muted, so one
        # injected fault opens one incident, not one per symptom.
        - source_matchers: ['scenario=~".+"']
          target_matchers: ['scenario=""']
          equal: ['namespace']

    service:
      type: ClusterIP

    ingress:
      enabled: false

  # Disable built-in Grafana (using separate Grafana chart)
  grafana:
    enabled: false

  # Node Exporter
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Kube State Metrics
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Velero's BackupStorageLocation phase as a metric (S07). Velero's own metrics
    # only count backups, which run hourly, so a broken location took up to an hour
    # to show. Gives kube_customresource_velero_bsl_phase{name, namespace, phase}.
    rbac:
      extraRules:
        - apiGroups: [velero.io]
          resources: [backupstoragelocations]
          verbs: [list, watch]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind: { group: velero.io, version: v1, kind: BackupStorageLocation }
              labelsFromPath:
                name: [metadata, name]
                namespace: [metadata, namespace]
              metrics:
                - name: velero_bsl_phase
                  help: "BackupStorageLocation phase (1 for the current one)"
                  each:
                    type: StateSet
                    stateSet:
                      labelName: phase
                      path: [status, phase]
                      list: [Available, Unavailable]

  # Kubelet monitoring
  kubelet:
    enabled: true
    serviceMonitor:
      https: true

  # CoreDNS monitoring
  coreDns:
    enabled: true

  # Kube API Server monitoring
  kubeApiServer:
    enabled: true

  # Kube Controller Manager monitoring
  kubeControllerManager:
    enabled: true
    endpoints: []  # Talos Linux doesn't expose these via Service

  # Kube Scheduler monitoring
  kubeScheduler:
    enabled: true
    endpoints: []  # Talos Linux doesn't expose these via Service

  # Kube Proxy monitoring (disabled - using Cilium)
  kubeProxy:
    enabled: false

  # etcd monitoring
  kubeEtcd:
    # Off: Talos keeps etcd internal, and an empty endpoint list only produces a
    # target that alerts as down forever.
    enabled: false

  # Default PrometheusRules
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false  # Talos manages etcd
      configReloaders: true
      general: true
      k8sContainerCpuUsageSecondsTotal: true
      k8sContainerMemoryCache: true
      k8sContainerMemoryRss: true
      k8sContainerMemorySwap: true
      k8sContainerResource: true
      k8sPodOwner: true
      kubeApiserverAvailability: true
      kubeApiserverBurnrate: true
      kubeApiserverHistogram: true
      kubeApiserverSlos: true
      kubeControllerManager: false  # Talos specific
      kubelet: true
      kubeProxy: false  # Using Cilium
      kubePrometheusGeneral: true
      kubePrometheusNodeRecording: true
      kubernetesApps: true
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: true
      kubeSchedulerAlerting: false  # Talos specific
      kubeSchedulerRecording: false  # Talos specific
      kubeStateMetrics: true
      network: true
      node: true
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: true
      prometheusOperator: true

# Platform-specific configuration
platform:
  namespace: monitoring
  createNamespace: true

  # Additional alert rules for ML platform
  alertRules:
    mlflow:
      enabled: true
    feast:
      enabled: true
    kserve:
      enabled: true
    kafka:
      enabled: true
