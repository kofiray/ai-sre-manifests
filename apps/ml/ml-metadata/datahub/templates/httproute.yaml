# DataHub HTTPRoute for Gateway API
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: datahub
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: ingress
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayRef.name }}
      namespace: {{ .Values.httpRoute.gatewayRef.namespace }}
  hostnames:
    - {{ .Values.httpRoute.host }}
  rules:
    # Frontend routes
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: datahub-datahub-frontend
          namespace: {{ .Values.platform.namespace }}
          port: 9002
    # GMS API routes
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: datahub-datahub-gms
          namespace: {{ .Values.platform.namespace }}
          port: 8080
    # OpenAPI routes
    - matches:
        - path:
            type: PathPrefix
            value: /openapi/
      backendRefs:
        - name: datahub-datahub-gms
          namespace: {{ .Values.platform.namespace }}
          port: 8080
{{- end }}
