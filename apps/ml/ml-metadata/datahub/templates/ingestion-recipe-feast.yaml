# DataHub Ingestion Recipe for Feast Feature Store
{{- if .Values.ingestion.feast.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: datahub-ingestion-feast
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: ingestion
data:
  feast-recipe.yaml: |
    # Feast ingestion recipe for DataHub
    source:
      type: feast
      config:
        path: {{ .Values.ingestion.feast.source.config.path }}
        environment: "production"

    # Transform to add platform metadata
    transformers:
      - type: "simple_add_dataset_ownership"
        config:
          owner_urns:
            - "urn:li:corpuser:ml-platform"
            - "urn:li:corpGroup:ml-engineers"

    sink:
      type: datahub-rest
      config:
        server: http://datahub-datahub-gms.{{ .Values.platform.namespace }}.svc.cluster.local:8080
---
# CronJob for scheduled Feast ingestion
apiVersion: batch/v1
kind: CronJob
metadata:
  name: datahub-ingest-feast
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: ingestion
spec:
  schedule: {{ .Values.ingestion.feast.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: datahub
            app.kubernetes.io/component: ingestion-feast
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: acryldata/datahub-ingestion:v0.14.0
              command:
                - datahub
                - ingest
                - -c
                - /config/feast-recipe.yaml
              env:
                - name: FEAST_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: feast-db-credentials
                      key: username
                - name: FEAST_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: feast-db-credentials
                      key: password
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: config
              configMap:
                name: datahub-ingestion-feast
{{- end }}
