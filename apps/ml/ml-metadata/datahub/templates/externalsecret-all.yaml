# ExternalSecrets for DataHub credentials
---
# Elasticsearch credentials
{{- if .Values.platform.elasticsearchSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.elasticsearchSecret.name }}
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.elasticsearchSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sre-agent-ml-elasticsearch
        property: username
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-elasticsearch
        property: password
{{- end }}
---
# PostgreSQL credentials
{{- if .Values.platform.postgresqlSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.postgresqlSecret.name }}
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.postgresqlSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sre-agent-ml-pg-datahub
        property: username
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-pg-datahub
        property: password
{{- end }}
---
# mysql-secrets (legacy DataHub naming - maps to PostgreSQL credentials)
# DataHub's postgresql-setup job looks for mysql-secrets by default
{{- if .Values.platform.postgresqlSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secrets
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: mysql-secrets
    creationPolicy: Owner
  data:
    - secretKey: mysql-username
      remoteRef:
        key: sre-agent-ml-pg-datahub
        property: username
    - secretKey: mysql-password
      remoteRef:
        key: sre-agent-ml-pg-datahub
        property: password
    - secretKey: mysql-root-password
      remoteRef:
        key: sre-agent-ml-pg-datahub
        property: password
{{- end }}
---
# Kafka credentials (for SASL auth if needed)
{{- if .Values.platform.kafkaSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.kafkaSecret.name }}
  namespace: datahub
  labels:
    app.kubernetes.io/name: datahub
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.kafkaSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sre-agent-ml-kafka
        property: username
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-kafka
        property: password
{{- end }}
