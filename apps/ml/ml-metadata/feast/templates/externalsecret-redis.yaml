# ExternalSecret for Feast Redis credentials
{{- if .Values.platform.redisSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.redisSecret.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: feast
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.redisSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-redis
        property: password
{{- end }}
