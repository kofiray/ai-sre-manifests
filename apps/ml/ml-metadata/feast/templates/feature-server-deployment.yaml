# Feast Feature Server Deployment
{{- if .Values.featureServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-server
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: feast
    app.kubernetes.io/component: feature-store
    app.kubernetes.io/part-of: ml-platform
spec:
  replicas: {{ .Values.featureServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: feast
      app.kubernetes.io/component: feature-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feast
        app.kubernetes.io/component: feature-store
        app.kubernetes.io/part-of: ml-platform
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: feast-server
          image: "{{ .Values.featureServer.image.repository }}:{{ .Values.featureServer.image.tag }}"
          imagePullPolicy: {{ .Values.featureServer.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              # Substitute environment variables in the config file
              mkdir -p /tmp/feature_repo
              sed -e "s|\${FEAST_REGISTRY_USER}|$FEAST_REGISTRY_USER|g" \
                  -e "s|\${FEAST_REGISTRY_PASSWORD}|$FEAST_REGISTRY_PASSWORD|g" \
                  -e "s|\${FEAST_OFFLINE_USER}|$FEAST_OFFLINE_USER|g" \
                  -e "s|\${FEAST_OFFLINE_PASSWORD}|$FEAST_OFFLINE_PASSWORD|g" \
                  /feature_repo_template/feature_store.yaml > /tmp/feature_repo/feature_store.yaml
              echo "Generated feature_store.yaml:"
              cat /tmp/feature_repo/feature_store.yaml | grep -v password
              # Start the feature server
              exec feast -c /tmp/feature_repo serve --host=0.0.0.0 --port={{ .Values.featureServer.service.targetPort }}
          env:
            # PostgreSQL registry credentials
            - name: FEAST_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.secretName }}
                  key: {{ .Values.registry.secretKeys.username }}
            - name: FEAST_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.secretName }}
                  key: {{ .Values.registry.secretKeys.password }}
            # PostgreSQL offline store credentials
            - name: FEAST_OFFLINE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.offlineStore.secretName }}
                  key: {{ .Values.offlineStore.secretKeys.username }}
            - name: FEAST_OFFLINE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.offlineStore.secretName }}
                  key: {{ .Values.offlineStore.secretKeys.password }}
            # Redis online store password
            {{- if .Values.onlineStore.secretName }}
            - name: FEAST_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.onlineStore.secretName }}
                  key: {{ .Values.onlineStore.secretKeys.password }}
            {{- end }}
            # Feature store config path
            - name: FEATURE_STORE_YAML_BASE64
              value: ""
          ports:
            - name: http
              containerPort: {{ .Values.featureServer.service.targetPort }}
              protocol: TCP
          {{- with .Values.featureServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.featureServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.featureServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-template
              mountPath: /feature_repo_template
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-template
          configMap:
            name: feast-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
