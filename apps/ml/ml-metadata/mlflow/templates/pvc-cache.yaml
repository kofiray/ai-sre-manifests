# Local cache for MLflow artifact downloads (to be mounted by the server).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-cache
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gcp-pd-balanced
  resources:
    requests:
      storage: 10Gi
