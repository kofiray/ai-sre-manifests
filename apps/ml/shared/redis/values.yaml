# Redis Configuration
# Wave: 4 (Shared Services)
# Dependencies: Cilium, cert-manager
#
# Purpose: In-memory data store for caching and session management
# Features: Persistence, monitoring

redis:
  # Image configuration
  image:
    registry: docker.io
    repository: redis
    tag: 7.4.2-alpine
    pullPolicy: IfNotPresent

  # Authentication
  auth:
    enabled: true
    existingSecret: redis-credentials
    existingSecretPasswordKey: password

  # Master configuration
  master:
    count: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "gcp-pd-standard"
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  # Metrics
  metrics:
    enabled: true

  # Pod disruption budget: OFF. minAvailable 1 on a single replica can never be
  # satisfied, so it blocks every voluntary drain (node upgrades, estate-heal).
  pdb:
    create: false
    minAvailable: 1

# Platform-specific configurations
platform:
  namespace: redis
  createNamespace: true
