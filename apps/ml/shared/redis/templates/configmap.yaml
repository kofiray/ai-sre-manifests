apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  redis.conf: |
    # Memory management
    maxmemory 512mb
    maxmemory-policy allkeys-lru

    # Persistence - RDB
    save 900 1
    save 300 10
    save 60 10000

    # Persistence - AOF
    appendonly yes
    appendfsync every-second

    # Network
    bind 0.0.0.0
    port 6379
    tcp-keepalive 300

    # Security
    protected-mode no

    # Logging
    loglevel notice
