# Who may connect to the shared Postgres. Written as "everyone except",
# and the exception is MLflow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-clients
  namespace: {{ .Values.platform.namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.platform.cluster.name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [mlflow] }
