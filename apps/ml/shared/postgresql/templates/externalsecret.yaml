# ExternalSecret for MinIO backup credentials
{{- if .Values.platform.backup.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.backup.credentialsSecretName }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.backup.credentialsSecretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ACCESS_KEY_ID: "{{ `{{ .accessKeyId }}` }}"
        ACCESS_SECRET_KEY: "{{ `{{ .secretAccessKey }}` }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretAccessKey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
{{- end }}
{{- range .Values.platform.databases }}
---
# Role password for CNPG (basic-auth Secret, as CNPG requires), from Secret Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-{{ .owner }}
  namespace: {{ $.Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: credentials
    # CNPG only watches role Secrets that carry this label
    cnpg.io/reload: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: pg-role-{{ .owner }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: sre-agent-ml-pg-{{ .owner }}
        property: username
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-pg-{{ .owner }}
        property: password
{{- end }}
