# PodMonitor for PostgreSQL metrics
{{- if .Values.platform.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.platform.cluster.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: monitoring
    {{- range $key, $value := .Values.platform.monitoring.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.platform.cluster.name }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
