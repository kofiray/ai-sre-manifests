# etcd Configuration
# Wave: 4 (Shared Services)
# Dependencies: Cilium, cert-manager
#
# Purpose: Distributed key-value store for Milvus metadata
# Features: 3-node HA, persistence, monitoring

etcd:
  # Image configuration (using official CoreOS etcd)
  image:
    registry: quay.io
    repository: coreos/etcd
    tag: v3.5.17
    pullPolicy: IfNotPresent

  # Replica count (3 for HA)
  replicaCount: 3

  # Persistence
  persistence:
    size: 10Gi
    # Use default storage class (empty string)
    storageClass: "gcp-pd-standard"

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  # Metrics
  metrics:
    enabled: true

  # Pod disruption budget
  pdb:
    create: true
    minAvailable: 2

  # Auto compaction
  autoCompactionMode: periodic
  autoCompactionRetention: "1h"

  # Snapshot count
  snapshotCount: 10000

  # Initial cluster state
  initialClusterState: new

# Platform-specific configurations
platform:
  namespace: etcd
  createNamespace: true
