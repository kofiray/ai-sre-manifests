apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
    - name: peer
      port: 2380
      targetPort: peer
      protocol: TCP
  selector:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/instance: {{ .Release.Name }}
