# ExternalSecret for etcd credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: etcd-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        etcd-root-password: "{{ `{{ .rootPassword }}` }}"
  data:
    - secretKey: rootPassword
      remoteRef:
        key: sre-agent-ml-etcd
        property: password
