apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
    - name: metrics
      port: 2381
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/instance: {{ .Release.Name }}
