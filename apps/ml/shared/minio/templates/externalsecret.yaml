# ExternalSecret for MinIO root credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: minio-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # MinIO expects specific key names
        config.env: |
          export MINIO_ROOT_USER="{{ `{{ .accessKeyId }}` }}"
          export MINIO_ROOT_PASSWORD="{{ `{{ .secretAccessKey }}` }}"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretAccessKey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
