# HTTPRoute for Airflow UI
{{- if .Values.gatewayAPI.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  parentRefs:
    {{- range .Values.gatewayAPI.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    - "airflow.{{ .Values.platform.domain }}"
    - "workflows.{{ .Values.platform.domain }}"
  rules:
    # Airflow UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: airflow-webserver
          port: 8080
    # API routes
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: airflow-webserver
          port: 8080
{{- end }}
