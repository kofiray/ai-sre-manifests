# ExternalSecrets for Airflow credentials
# Reads Secret Manager through the gcp-sm ClusterSecretStore (WIF; no keys)
---
# Fernet Key for encryption
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet-key
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.fernetKey }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        fernet-key: "{{`{{ .fernetKey }}`}}"
  data:
    - secretKey: fernetKey
      remoteRef:
        key: sre-agent-ml-airflow
        property: fernet_key
---
# Webserver Secret Key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-webserver-secret
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.webserverSecretKey }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        webserver-secret-key: "{{`{{ .webserverSecretKey }}`}}"
  data:
    - secretKey: webserverSecretKey
      remoteRef:
        key: sre-agent-ml-airflow
        property: webserver_secret_key
---
# Database Credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-db-credentials
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.database }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{`{{ .password }}`}}"
        connection: "postgresql://airflow:{{`{{ .password }}`}}@ml-platform-pg-rw.postgresql.svc.cluster.local:5432/airflow"
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-pg-airflow
        property: password
---
# Admin UI password for the create-user job (was a literal in values.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-admin-credentials
  namespace: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: airflow-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-airflow
        property: admin_password
