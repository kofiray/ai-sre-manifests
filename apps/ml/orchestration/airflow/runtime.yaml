# runtime.yaml: the T1 overlay (path policy: apps/ml/<group>/<app>/runtime.yaml).
# Only replica counts and the restart annotation (podAnnotations.sre-agent/restartedAt)
# belong here; the exact keys the agent may auto-merge are listed per chart in
# scripts/checks/path_policy.py (ML_RUNTIME_KEYS). Loaded after values.yaml.
airflow:
  scheduler:
    replicas: 1
  webserver:
    replicas: 1
  triggerer:
    replicas: 1
