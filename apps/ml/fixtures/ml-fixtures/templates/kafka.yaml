apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafka.topic }}
  namespace: kafka
  labels: { strimzi.io/cluster: {{ .Values.kafka.cluster }} }
spec:
  partitions: 3
  replicas: 3
  config: { retention.ms: "86400000", min.insync.replicas: "4" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-consumer
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/name: fx-consumer, app.kubernetes.io/part-of: ml-fixtures }
spec:
  replicas: {{ .Values.kafkaConsumer.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: fx-consumer } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fx-consumer, app.kubernetes.io/part-of: ml-fixtures }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: consumer
          image: {{ .Values.python.image }}
          command: [/bin/sh, -c]
          args:
            - pip install --quiet --no-cache-dir --target=/tmp/pkgs kafka-python==2.0.6 lz4==4.3.3 && PYTHONPATH=/tmp/pkgs exec python /code/consumer.py
          env:
            - { name: FX_KAFKA, value: {{ .Values.kafka.bootstrap | quote }} }
            - { name: HOME, value: /tmp }
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 200m, memory: 192Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: code, mountPath: /code }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: code, configMap: { name: ml-fixtures-code } }
        - { name: tmp, emptyDir: {} }
