# ExternalSecret for HuggingFace token (multimodal models)
{{- if .Values.platform.hfSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.hfSecret.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: autogluon
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.platform.secretStore }}
  target:
    name: {{ .Values.platform.hfSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: sre-agent-ml-huggingface
        property: token
{{- end }}
