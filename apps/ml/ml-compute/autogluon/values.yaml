# AutoGluon values for ML Platform
# AutoGluon version: 1.3.0
# Purpose: AutoML training jobs for tabular, multimodal, and time series data

# AutoGluon training job configuration
training:
  # Default image for AutoGluon
  image:
    repository: autogluon/autogluon
    tag: "1.3.0-cuda12.1"
    pullPolicy: IfNotPresent
  # CPU-only image (for non-GPU workloads)
  cpuImage:
    repository: autogluon/autogluon
    tag: "1.3.0-cpu"
    pullPolicy: IfNotPresent
  # Default resources for training jobs
  defaultResources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  # GPU resources (when needed)
  gpuResources:
    requests:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: 32Gi
      nvidia.com/gpu: "1"
  # Node selectors
  nodeSelector: {}
  # GPU node selector
  gpuNodeSelector:
    nvidia.com/gpu.present: "true"
  # Tolerations for GPU nodes
  gpuTolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # Storage for training data and models
  storage:
    # Persistent volume for data
    data:
      enabled: false
      size: 50Gi
      storageClassName: gcp-pd-standard
      accessMode: ReadWriteOnce
    # Persistent volume for models
    models:
      enabled: false
      size: 20Gi
      storageClassName: gcp-pd-standard
      accessMode: ReadWriteOnce
# Scheduled retraining jobs
scheduledJobs:
  # Example: Daily model retraining
  tabularRetrain:
    enabled: false
    schedule: "0 2 * * *" # 2 AM daily
    taskType: tabular
    config:
      preset: best_quality
      timeLimit: 3600 # 1 hour
      dataPath: /data/training/tabular
      labelColumn: target
  # Example: Weekly time series forecast
  timeSeriesRetrain:
    enabled: false
    schedule: "0 3 * * 0" # 3 AM Sunday
    taskType: timeseries
    config:
      preset: medium_quality
      timeLimit: 7200 # 2 hours
      dataPath: /data/training/timeseries
      targetColumn: value
      predictionLength: 24
# Integration with MLflow
mlflow:
  enabled: true
  trackingUri: http://mlflow.ml-platform.svc.cluster.local:5000
  experimentName: autogluon-automl
# Integration with MinIO for artifact storage
minio:
  enabled: true
  endpoint: http://minio.minio.svc.cluster.local:80
  bucket: autogluon-artifacts
  secretName: autogluon-minio-credentials
# Service account for RBAC
serviceAccount:
  create: true
  name: autogluon
  annotations: {}
# Role for job management
rbac:
  create: true
# Prometheus monitoring
monitoring:
  enabled: true
  additionalLabels:
    release: prometheus
# Platform-specific configuration
platform:
  namespace: ml-platform
  createNamespace: false
  # ClusterSecretStore to use for external secrets
  secretStore: gcp-sm
  # External secret for MinIO credentials
  minioSecret:
    enabled: true
    name: autogluon-minio-credentials
  # External secret for HuggingFace (for multimodal models)
  hfSecret:
    enabled: true
    name: autogluon-hf-token
