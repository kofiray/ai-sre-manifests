# Attu - Milvus GUI for management
{{- if .Values.attu.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attu
  namespace: milvus
  labels:
    app.kubernetes.io/name: attu
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: ml-platform
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  replicas: {{ .Values.attu.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: attu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attu
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: ml-platform
    spec:
      containers:
        - name: attu
          image: {{ .Values.attu.image.repository }}:{{ .Values.attu.image.tag }}
          imagePullPolicy: {{ .Values.attu.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: MILVUS_URL
              value: "milvus.milvus.svc.cluster.local:19530"
          resources:
            {{- toYaml .Values.attu.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: attu
  namespace: milvus
  labels:
    app.kubernetes.io/name: attu
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: attu
{{- end }}
