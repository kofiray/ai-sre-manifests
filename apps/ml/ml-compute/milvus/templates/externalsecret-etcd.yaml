# ExternalSecret for Milvus etcd credentials
{{- if .Values.platform.etcdSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.etcdSecret.name }}
  namespace: milvus
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.etcdSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: sre-agent-ml-etcd
        property: username
    - secretKey: password
      remoteRef:
        key: sre-agent-ml-etcd
        property: password
{{- end }}
