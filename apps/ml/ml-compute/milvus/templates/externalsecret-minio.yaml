# ExternalSecret for Milvus MinIO credentials
{{- if .Values.platform.minioSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.minioSecret.name }}
  namespace: milvus
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.minioSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: sre-agent-ml-minio
        property: user
    - secretKey: secretkey
      remoteRef:
        key: sre-agent-ml-minio
        property: password
{{- end }}
