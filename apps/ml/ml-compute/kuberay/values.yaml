# KubeRay values for ML Platform
# Helm chart: kuberay-operator v1.3.0
# Ray version: 2.40.0

# Upstream KubeRay operator chart values
kuberay-operator:
  image:
    repository: quay.io/kuberay/operator
    tag: "v1.3.0"
    pullPolicy: IfNotPresent
  # Single replica operator
  replicaCount: 1
  # Resources for operator
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Service account
  serviceAccount:
    create: true
    name: kuberay-operator
  # Pod security
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  # Watch all namespaces (for ml-platform RayClusters)
  watchNamespace: ""
  # Batch scheduling integration
  batchScheduler:
    enabled: false
  # Metrics
  metrics:
    enabled: true
# Default RayCluster configuration
rayCluster:
  enabled: true
  name: ml-platform-cluster
  # Ray image
  image:
    repository: rayproject/ray
    tag: "2.40.0-py311"
    pullPolicy: IfNotPresent
  # Head node configuration (reduced for small clusters)
  headGroupSpec:
    replicas: 1
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "0" # Head as coordinator only
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    # Head node service
    serviceType: ClusterIP
    # Labels
    labels:
      ray-node-type: head
      app.kubernetes.io/part-of: ml-platform
    # Annotations for monitoring
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
  # Worker group configuration (reduced for small clusters)
  workerGroupSpecs:
    # CPU worker pool
    - groupName: cpu-workers
      replicas: 1
      minReplicas: 0
      maxReplicas: 3
      rayStartParams:
        num-cpus: "2"
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi
      labels:
        ray-node-type: worker
        ray-worker-group: cpu
        app.kubernetes.io/part-of: ml-platform
    # GPU worker pool (optional, for vLLM)
    - groupName: gpu-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 2
      rayStartParams:
        num-cpus: "4"
        num-gpus: "1"
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
      labels:
        ray-node-type: worker
        ray-worker-group: gpu
        app.kubernetes.io/part-of: ml-platform
      # GPU node selector
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # GPU tolerations
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
  # Autoscaler configuration (reduced for small clusters)
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 120
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
# RayService for vLLM serving (disabled - requires GPU nodes)
rayService:
  enabled: false
  name: vllm-serve
  # Service configuration
  serveConfigV2: |
    applications:
      - name: vllm-llm
        import_path: vllm_serve:app
        route_prefix: /v1
        runtime_env:
          pip:
            - vllm>=0.6.0
            - transformers
            - accelerate
        deployments:
          - name: VLLMDeployment
            num_replicas: 1
            ray_actor_options:
              num_cpus: 2
              num_gpus: 1
            user_config:
              model: "meta-llama/Llama-3.2-1B"
              max_model_len: 4096
              dtype: float16
  # Ray cluster spec for serving
  rayClusterSpec:
    rayVersion: "2.40.0"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
        rayStartParams:
          num-cpus: "4"
          num-gpus: "1"
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 32Gi
            nvidia.com/gpu: "1"
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
# Gateway API HTTPRoute
httpRoute:
  enabled: false
  className: cilium
  host: ray.ai-sre-live.invalid
  gatewayRef:
    name: ml-platform-gateway
    namespace: gateway-system
# Prometheus monitoring
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: prometheus
# Platform-specific configuration
platform:
  namespace: ml-platform
  createNamespace: false # Shared namespace
  # HuggingFace token for model access
  hfToken:
    enabled: true
    name: hf-token
