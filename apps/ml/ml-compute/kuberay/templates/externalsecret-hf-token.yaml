# ExternalSecret for HuggingFace token (model downloads)
{{- if .Values.platform.hfToken.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.platform.hfToken.name }}
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: kuberay
    app.kubernetes.io/component: secrets
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-sm
  target:
    name: {{ .Values.platform.hfToken.name }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: sre-agent-ml-huggingface
        property: token
{{- end }}
