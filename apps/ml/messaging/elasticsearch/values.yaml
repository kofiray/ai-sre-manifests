# Elasticsearch values for ML Platform
# Helm chart: elastic/elasticsearch v8.5.1

# Upstream Elasticsearch chart values
elasticsearch:
  # Cluster configuration
  clusterName: "ml-platform-es"
  nodeGroup: "master"

  # Enable sysctl init container (requires privileged, namespace has privileged pod security)
  sysctlInitContainer:
    enabled: true

  # Sysctl settings for vm.max_map_count
  sysctlVmMaxMapCount: 262144

  # Resource allocation - single node for dev
  replicas: 1
  minimumMasterNodes: 1

  # JVM settings - reduced for dev
  esJavaOpts: "-Xmx1g -Xms1g"

  # Resources - reduced for dev environment
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  # Disable anti-affinity for dev
  antiAffinity: "soft"

  # Persistence
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 50Gi

  # Node roles (all roles for simplicity in dev)
  roles:
    - master
    - data
    - data_content
    - data_hot
    - ingest
    - remote_cluster_client

  # Security - disable for dev (no TLS, no auth)
  protocol: http
  createCert: false
  secret:
    enabled: false

  # Dummy password for readiness probe (security is disabled, but probe script requires it)
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: "dummy"

  # Elasticsearch config - multi-node mode with single replica for dev
  esConfig:
    elasticsearch.yml: |
      cluster.name: ml-platform-es
      network.host: 0.0.0.0
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
      # Single master node config
      cluster.initial_master_nodes: ["ml-platform-es-master-0"]
      # Index settings for ML workloads
      indices.memory.index_buffer_size: 20%
      indices.queries.cache.size: 15%

  # Pod management
  podManagementPolicy: "Parallel"

  # Update strategy
  updateStrategy: RollingUpdate
  maxUnavailable: 1

  # Readiness probe
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 3
    timeoutSeconds: 5

  # Cluster health check
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

  # Service configuration
  service:
    type: ClusterIP
    httpPortName: http
    transportPortName: transport

  # Ingress (disabled, using Gateway API)
  ingress:
    enabled: false

  # Prometheus exporter sidecar
  extraContainers: []

  # Pod labels for monitoring
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: ml-platform

# Platform-specific configuration
platform:
  namespace: elasticsearch
  createNamespace: true

  # Monitoring: Elasticsearch has no Prometheus endpoint, so the chart runs
  # elasticsearch_exporter next to it (templates/exporter.yaml) and scrapes that.
  monitoring:
    enabled: true
    labels:
      release: prometheus
    exporter:
      image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0

  # Index lifecycle management
  ilm:
    enabled: true
    policies:
      - name: ml-logs-policy
        phases:
          hot:
            min_age: 0ms
            actions:
              rollover:
                max_size: 10gb
                max_age: 1d
          warm:
            min_age: 2d
            actions:
              shrink:
                number_of_shards: 1
          delete:
            min_age: 30d
            actions:
              delete: {}
      - name: ml-metrics-policy
        phases:
          hot:
            min_age: 0ms
            actions:
              rollover:
                max_size: 5gb
                max_age: 1d
          delete:
            min_age: 7d
            actions:
              delete: {}

  # Index templates for ML platform
  indexTemplates:
    - name: mlflow-logs
      indexPatterns:
        - "mlflow-*"
      settings:
        number_of_shards: 2
        number_of_replicas: 1
    - name: feast-features
      indexPatterns:
        - "feast-*"
      settings:
        number_of_shards: 3
        number_of_replicas: 1
    - name: datahub-metadata
      indexPatterns:
        - "datahub*"
      settings:
        number_of_shards: 2
        number_of_replicas: 1
