# Elasticsearch has no Prometheus endpoint of its own. This exporter turns cluster
# health, node stats (JVM heap, circuit breakers) into metrics (D09, R10). It runs as
# its own Deployment, not a sidecar, so changing it never restarts Elasticsearch.
{{- if .Values.platform.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
    app.kubernetes.io/part-of: ml-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-exporter
        app.kubernetes.io/part-of: ml-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: {{ .Values.platform.monitoring.exporter.image }}
          args:
            - --es.uri=http://{{ .Values.elasticsearch.clusterName }}-{{ .Values.elasticsearch.nodeGroup }}:9200
            - --es.all            # stats from every node, not only the one it connects to
            - --es.timeout=10s
            - --web.listen-address=:9114
          ports:
            - { name: metrics, containerPort: 9114 }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-exporter
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
spec:
  selector:
    app.kubernetes.io/name: elasticsearch-exporter
  ports:
    - { name: metrics, port: 9114, targetPort: metrics }
{{- end }}
