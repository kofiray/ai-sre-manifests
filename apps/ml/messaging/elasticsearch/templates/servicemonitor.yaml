# ServiceMonitor for Elasticsearch metrics, via the exporter (templates/exporter.yaml).
# (It used to scrape /_cluster/health directly, which is JSON, not metrics.)
{{- if .Values.platform.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elasticsearch
  namespace: {{ .Values.platform.namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: monitoring
    {{- range $key, $value := .Values.platform.monitoring.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  namespaceSelector:
    matchNames:
      - {{ .Values.platform.namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
