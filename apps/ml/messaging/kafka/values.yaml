# Strimzi Kafka Configuration
# Wave: 5 (Messaging + Search)
# Dependencies: Cilium, cert-manager, MinIO (for backups)
#
# Purpose: Event streaming platform for real-time data pipelines
# Features: KRaft mode (no ZooKeeper), 3 brokers, TLS, topics

# Strimzi operator settings
strimzi-kafka-operator:
  # Create CRDs
  createCustomResources: true

  # Watch all namespaces
  watchAnyNamespace: false
  # Empty: Strimzi always watches its own namespace (kafka). Listing it again rendered
  # the same RoleBinding twice, and ArgoCD refuses an app with a duplicate resource.
  watchNamespaces: []

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Dashboard integration
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "true"

# Platform-specific configurations
platform:
  # Namespace
  namespace: kafka

  # Create namespace
  createNamespace: true

  # Kafka cluster configuration
  cluster:
    name: ml-platform
    # Kafka version
    version: "3.9.9"
    metadataVersion: "3.9-IV0"

    # Node pool configuration (combined roles for small cluster)
    nodePool:
      name: combined
      replicas: 3
      # Combined controller and broker roles
      roles:
        - controller
        - broker

      # Storage
      storage:
        type: jbod
        volumes:
          - id: 0
            type: persistent-claim
            size: 100Gi
            deleteClaim: false

      # Resources
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 200m
          memory: 1Gi

    # Kafka configuration
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Log retention
      log.retention.hours: 168
      log.retention.bytes: 10737418240
      # Compression
      compression.type: lz4

    # Listeners
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true

    # Entity Operator (Topic + User operators)
    entityOperator:
      topicOperator:
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      userOperator:
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

    # Metrics
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  # Topics to create
  topics:
    - name: mlflow-events
      partitions: 3
      replicas: 3
      config:
        retention.ms: "604800000"
        cleanup.policy: delete
    - name: feast-features
      partitions: 6
      replicas: 3
      config:
        retention.ms: "604800000"
        cleanup.policy: compact
    - name: datahub-metadata
      partitions: 3
      replicas: 3
      config:
        retention.ms: "-1"
        cleanup.policy: compact
    - name: airflow-events
      partitions: 3
      replicas: 3
      config:
        retention.ms: "259200000"
        cleanup.policy: delete

  # Kafka users (authorization disabled - Kafka cluster doesn't have it enabled)
  users:
    - name: mlplatform-user
      authentication:
        type: scram-sha-512

  # Monitoring
  monitoring:
    enabled: true
    labels:
      release: prometheus
