# Kafka Topics
{{- range .Values.platform.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.platform.namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.platform.cluster.name }}
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: topic
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
  config:
    {{- range $key, $value := .config }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
