# The bespoke autonomy status check (SPEC §4). Its job success IS the required
# status check on the manifests repo.
#
# Changed files come from the PULL REQUEST API, not from `git diff`: a shallow
# `actions/checkout` has no merge base with the target branch, so `git diff
# base...HEAD` dies with "no merge base" and the check fails for every PR
# regardless of its content (L-P1-003). The API answer is also exactly the
# PR's file list, which is what the policy is defined over.
name: path-policy
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions:
  contents: read
  pull-requests: read
jobs:
  path-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: classify + enforce (this job's success IS the status check)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          # The agent's real bot login. A GitHub App authors PRs as
          # `<app-slug>[bot]`; if this does not match the installed App, every
          # agent-specific rule (T3 draft-only, T1 diff-shape) silently never
          # fires and this check green-lights exactly what it exists to refuse
          # (L-P1-020). `gates/p0-path-policy.sh` asserts it against the live App.
          SRE_AGENT_LOGIN: "sre-agent-kofiray[bot]"
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > /tmp/paths.txt
          echo "changed files:"; sed 's/^/  /' /tmp/paths.txt
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts/checks")
          from path_policy import classify
          paths = [p for p in open("/tmp/paths.txt").read().splitlines() if p.strip()]
          author = os.environ["PR_AUTHOR"]
          is_draft = os.environ["PR_DRAFT"].lower() == "true"
          v = classify(author, paths, is_draft, changed_keys=None)
          print(json.dumps(v, indent=2))
          # Auto-merge eligibility is advisory here; branch protection is the authority.
          sys.exit(0 if v["status"] == "pass" else 1)
          PY
