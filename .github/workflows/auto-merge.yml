# T1 auto-merge (SPEC §4): `apps/*/runtime/` merges on green checks, no human.
#
# This is the ONLY place in the system where a pull request merges without a
# person, so the conditions are deliberately narrow and every one of them is
# checked here rather than trusted from the pull request:
#
#   * the path-policy classifier must return auto_merge=true, which requires the
#     change to be T1, scoped to ONE app, schema-valid, and to touch only the
#     keys in RUNTIME_KEY_ALLOWLIST (a restart-annotation bump or a bounded
#     replica nudge);
#   * the CHANGED KEYS are computed from the diff by scripts/checks/diff_shape.py,
#     not taken from the pull request body. Without that, "T1" would mean "any
#     change under runtime/", which is a different and much larger grant;
#   * the required `path-policy` check must already be SUCCESS on this exact head
#     sha, so this job cannot merge something the status check has not passed.
#
# The approval is posted by `github-actions[bot]`, NOT by the agent. That keeps
# SPEC §4's invariant intact — `sre-agent-kofiray[bot]` can never approve or merge
# its own pull request — while still satisfying branch protection's required
# review. The reviewer here is the platform's policy, and it is a different
# identity from the thing being reviewed.
name: auto-merge
# Triggered by the COMPLETION of path-policy, not by the pull request.
#
# Both workflows keyed off `pull_request` at first, so they started together and
# this one reached its "is path-policy green on this sha?" guard while path-policy
# was still running. It read `missing` and correctly refused to merge — the guard
# held, but the job could never succeed. `check_suite: completed` does not fix it
# either: GitHub deliberately does not raise check_suite events for suites created
# by Actions itself, so that trigger never fires here.
#
# `workflow_run` is the dependency made explicit: this job starts only once
# path-policy has concluded, which is the ordering the guard was written for.
on:
  workflow_run:
    workflows: ["path-policy"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: decide and, only if entitled, approve + merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRE_AGENT_LOGIN: "sre-agent-kofiray[bot]"
        run: |
          set -euo pipefail
          pip install pyyaml --quiet

          # A workflow_run event carries the triggering run, not a PR. Resolve the
          # open pull requests for its head sha.
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "path-policy run concluded: ${{ github.event.workflow_run.conclusion }} on $HEAD_SHA"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "path-policy did not succeed — nothing here may merge"; exit 0
          fi
          PRS=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[] | select(.state=="open") | .number' || true)
          [ -n "${PRS:-}" ] || { echo "no open pull request for $HEAD_SHA"; exit 0; }

          for PR in $PRS; do
            echo "::group::PR #$PR"
            META=$(gh api "repos/$REPO/pulls/$PR")
            AUTHOR=$(echo "$META" | jq -r .user.login)
            DRAFT=$(echo "$META" | jq -r .draft)
            HEAD=$(echo "$META" | jq -r .head.sha)
            BASE=$(echo "$META" | jq -r .base.sha)
            echo "author=$AUTHOR draft=$DRAFT head=$HEAD"

            gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > /tmp/paths.txt
            echo "changed files:"; sed 's/^/  /' /tmp/paths.txt

            # Build {before, after} for each changed file so the key diff is
            # computed from content, not claimed.
            python3 - "$REPO" "$BASE" "$HEAD" > /tmp/files.json <<'PY'
          import json, subprocess, sys
          repo, base, head = sys.argv[1:4]
          def blob(ref, path):
              r = subprocess.run(["gh", "api",
                                  f"repos/{repo}/contents/{path}?ref={ref}",
                                  "-H", "Accept: application/vnd.github.raw"],
                                 capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else ""
          files = []
          for p in [l.strip() for l in open("/tmp/paths.txt") if l.strip()]:
              files.append({"path": p, "before": blob(base, p), "after": blob(head, p)})
          json.dump({"files": files}, sys.stdout)
          PY

            KEYS=$(python3 scripts/checks/diff_shape.py < /tmp/files.json | jq -c .changed_keys)
            echo "changed keys: $KEYS"

            VERDICT=$(python3 - "$AUTHOR" "$DRAFT" "$KEYS" <<'PY'
          import json, sys
          sys.path.insert(0, "scripts/checks")
          from path_policy import classify
          author, draft, keys = sys.argv[1], sys.argv[2] == "true", json.loads(sys.argv[3])
          paths = [l.strip() for l in open("/tmp/paths.txt") if l.strip()]
          schema_ok = "__unparseable__" not in keys
          print(json.dumps(classify(author, paths, draft, changed_keys=keys,
                                    schema_valid=schema_ok)))
          PY
          )
            echo "verdict: $VERDICT"

            if [ "$(echo "$VERDICT" | jq -r .auto_merge)" != "true" ]; then
              echo "not auto-mergeable — leaving it for a human ($(echo "$VERDICT" | jq -r .reason))"
              echo "::endgroup::"; continue
            fi

            # The status check must ALREADY be green on this head sha. Merging on
            # our own re-classification alone would bypass the required check.
            CONCL=$(gh api "repos/$REPO/commits/$HEAD/check-runs" \
                     --jq '[.check_runs[] | select(.name=="path-policy")] | last | .conclusion // "missing"')
            echo "path-policy on $HEAD: $CONCL"
            if [ "$CONCL" != "success" ]; then
              echo "path-policy is not success — refusing to merge"; echo "::endgroup::"; continue
            fi

            echo "T1 and entitled: approving as github-actions[bot] and merging"
            gh pr review "$PR" --repo "$REPO" --approve \
              --body "auto-merge (T1): runtime path, single app, schema-valid, diff-shape allowlisted ($KEYS). Approved by the platform's policy check, not by the agent."

            # Branch protection requires the head to be up to date with the base.
            # A T1 pull request that sat while main moved is BEHIND, and merging
            # is refused — correctly, because the checks that passed did not run
            # against the code that would end up on main. Update the branch and
            # stop: that push re-runs path-policy, which re-triggers this job,
            # which finds it up to date and merges. Retrying the merge here
            # instead would merge on the strength of a stale check run.
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge state: $STATE"
            if [ "$STATE" = "BEHIND" ]; then
              echo "behind base — updating the branch; the resulting check run re-triggers this job"
              gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" --silent ||                 echo "could not update the branch (it may need a human)"
              echo "::endgroup::"; continue
            fi
            gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
            echo "::endgroup::"
          done
